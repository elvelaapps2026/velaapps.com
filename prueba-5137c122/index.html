rifiquen a Dios en el día de la visitación, estimándoos por las buenas obras.","50.4.5":"Andad en sabiduría para con los extraños, redimiendo el tiempo.","50.4.6":"Sea vuestra palabra siempre con gracia, sazonada con sal; para que sepáis cómo os conviene responder a cada uno.","55.2.7":"Mostrándote en todo por ejemplo de buenas obras; en doctrina haciendo ver integridad, gravedad,","55.2.8":"Palabra sana, e irreprensible; que el adversario se avergüence, no teniendo mal ninguno que decir de vosotros.","39.7.1":"No juzguéis, para que no seáis juzgados.","39.7.2":"Porque con el juicio con que juzgáis, seréis juzgados; y con la medida con que medís, os volverán a medir.","39.7.3":"Y ¿por qué miras la mota que está en el ojo de tu hermano, y no echas de ver la viga que está en tu ojo?","39.7.4":"O ¿cómo dirás a tu hermano: Espera, echaré de tu ojo la mota, y he aquí la viga en tu ojo?","39.7.5":"¡Hipócrita! echa primero la viga de tu ojo, y entonces mirarás en echar la mota del ojo de tu hermano.","44.14.10":"Mas tú ¿por qué juzgas a tu hermano? o tú también, ¿por qué menosprecias a tu hermano? porque todos hemos de estar ante el tribunal de Cristo.","44.14.11":"Porque escrito está: Vivo yo, dice el Señor, que a mí se doblará toda rodilla, y toda lengua confesará a Dios.","44.14.12":"De manera que, cada uno de nosotros dará a Dios razón de sí.","44.14.13":"Así que, no juzguemos más los unos de los otros: antes bien juzgad de no poner tropiezo o escándalo al hermano.","44.2.1":"Por lo cual eres inexcusable, oh hombre, cualquiera que juzgas: porque en lo que juzgas a otro, te condenas a ti mismo; porque lo mismo haces, tú que juzgas.","58.4.11":"Hermanos, no murmuréis los unos de los otros. El que murmura del hermano, y juzga a su hermano, este tal murmura de la ley, y juzga a la ley; pero si tú juzgas a la ley, no eres guardador de la ley, sino juez.","58.4.12":"Uno es el dador de la ley, que puede salvar y perder: ¿quién eres tú que juzgas a otro?","42.8.7":"Y como perseverasen preguntándole, se enderezó, y les dijo: El que de vosotros esté sin pecado, arroje contra ella la piedra el primero.","39.23.27":"¡Ay de vosotros, escribas y Fariseos, hipócritas! porque sois semejantes a sepulcros blanqueados, que de fuera, a la verdad, se muestran hermosos, mas de dentro están llenos de huesos de muertos y de toda suciedad.","39.23.28":"Así también vosotros de fuera, a la verdad, os mostráis justos a los hombres; mas de dentro, llenos estáis de hipocresía e iniquidad.","39.6.1":"Mirad que no hagáis vuestra justicia delante de los hombres, para ser vistos de ellos: de otra manera no tendréis merced de vuestro Padre que está en los cielos.","39.6.2":"Cuando pues haces limosna, no hagas tocar trompeta delante de ti, como hacen los hipócritas en las sinagogas y en las plazas, para ser estimados de los hombres: de cierto os digo, que ya tienen su recompensa.","39.6.3":"Mas cuando tú haces limosna, no sepa tu izquierda lo que hace tu derecha;","39.6.4":"Para que sea tu limosna en secreto: y tu Padre que ve en secreto, él te recompensará en público.","58.1.26":"Si alguno piensa ser religioso entre vosotros, y no refrena su lengua, sino engañando su corazón, la religión del tal es vana.","44.12.9":"El amor sea sin fingimiento: aborreciendo lo malo, llegándoos a lo bueno;","59.1.6":"En lo cual vosotros os alegráis, estando al presente un poco de tiempo afligidos en diversas tentaciones, si es necesario,","59.1.7":"Para que la prueba de vuestra fe, mucho más preciosa que el oro, el cual perece, bien que sea probado con fuego, sea hallada en alabanza, gloria y honra, cuando Jesucristo sea manifestado:","17.23.10":"Mas él conoció mi camino: probaráme, y saldré como oro.","22.48.10":"He aquí te he purificado, y no como a plata; hete escogido en horno de aflicción.","37.13.9":"Y meteré en el fuego la tercera parte, y los fundiré como se funde la plata, y los probaré como se prueba el oro. El invocará mi nombre, y yo le oiré, y diré: Pueblo mío; y él dirá: Jehová es mi Dios.","1.20.8":"Acordarte has del día del reposo, para santificarlo:","1.20.9":"Seis días trabajarás, y harás toda tu obra;","1.20.10":"Mas el séptimo día será reposo para Jehová tu Dios: no hagas en él obra alguna, tú, ni tu hijo, ni tu hija, ni tu siervo, ni tu criada ni tu bestia, ni tu extranjero que está dentro de tus puertas:","40.2.27":"También les dijo: El sábado por causa del hombre es hecho; no el hombre por causa del sábado.","40.6.31":"Y él les dijo: Venid vosotros aparte al lugar desierto, y reposad un poco. Porque eran muchos los que iban y venían, que ni aun tenían lugar de comer.","57.4.9":"Por tanto, queda un reposo para el pueblo de Dios.","57.4.10":"Porque el que ha entrado en su reposo, también él ha reposado de sus obras, como Dios de las suyas.","18.46.10":"Estad quietos, y conoced que yo soy Dios: ensalzado he de ser entre las gentes, ensalzado seré en la tierra.","22.30.15":"Porque así dijo el Señor Jehová, el Santo de Israel: En descanso y en reposo seréis salvos; en quietud y en confianza será vuestra fortaleza. Y no quisisteis,","59.5.2":"Apacentad la grey de Dios que está entre vosotros, teniendo cuidado de ella, no por fuerza, sino voluntariamente; no por ganancia deshonesta, sino de un ánimo pronto;","59.5.3":"Y no como teniendo señorío sobre las heredades del Señor, sino siendo dechados de la grey.","59.5.4":"Y cuando aparezca el Príncipe de los pastores, vosotros recibiréis la corona incorruptible de gloria.","43.20.28":"Por tanto mirad por vosotros, y por todo el rebaño en que el Espíritu Santo os ha puesto por obispos, para apacentar la iglesia del Señor, la cual ganó por su sangre.","23.3.15":"Y os daré pastores según mi corazón, que os apacienten de ciencia y de inteligencia.","53.4.13":"Entre tanto que voy, ocúpate en leer, en exhortar, en enseñar.","53.4.14":"No descuides el don que está en ti, que te es dado por profecía con la imposición de las manos del presbiterio.","53.4.15":"Medita estas cosas; ocúpate en ellas; para que tu aprovechamiento sea manifiesto a todos.","53.4.16":"Ten cuidado de ti mismo y de la doctrina; persiste en ello; pues haciendo esto, a ti mismo salvarás y a los que te oigan.","45.15.58":"Así que, hermanos míos amados, estad firmes y constantes, creciendo en la obra del Señor siempre, sabiendo que vuestro trabajo en el Señor no es vano.","45.10.31":"Si pues coméis, o bebéis, o hacéis otra cosa, haced lo todo a gloria de Dios.","53.4.8":"Porque el ejercicio corporal para poco es provechoso; mas la piedad para todo aprovecha, pues tiene promesa de esta vida presente, y de la venidera.","19.17.22":"El corazón alegre produce buena disposición: mas el espíritu triste seca los huesos.","19.3.7":"No seas sabio en tu opinión: teme a Jehová, y apártate del mal;","19.3.8":"Porque será medicina a tu ombligo, y tuétano a tus huesos.","19.9.10":"El temor de Jehová es el principio de la sabiduría; y la ciencia de los santos es inteligencia.","19.2.6":"Porque Jehová da la sabiduría, y de su boca viene el conocimiento y la inteligencia.","19.3.13":"Bienaventurado el hombre que halla la sabiduría, y que obtiene la inteligencia:","19.3.14":"Porque su mercadería es mejor que la mercadería de la plata, y sus frutos más que el oro fino.","19.4.7":"Sabiduría ante todo: adquiere sabiduría: y ante toda tu posesión adquiere inteligencia.","58.3.17":"Mas la sabiduría que es de lo alto, primeramente es pura, después pacífica, modesta, benigna, llena de misericordia y de buenos frutos, no juzgadora, no fingida.","20.7.12":"Porque escudo es la ciencia, y escudo es el dinero: mas la sabiduría excede en que da vida a sus poseedores.","18.90.12":"Enséñanos de tal modo a contar nuestros días, que traigamos al corazón sabiduría.","19.12.22":"Los labios mentirosos son abominación a Jehová: mas los obradores de verdad su contentamiento.","48.4.25":"Por lo cual, dejada la mentira, hablad verdad cada uno con su prójimo; porque somos miembros los unos de los otros.","50.3.9":"No mintáis los unos a los otros, habiéndoos despojado del viejo hombre con sus hechos,","37.8.16":"Estas son las cosas que habéis de hacer: Hablad verdad cada cual con su prójimo; juzgad en vuestras puertas verdad y juicio de paz:","19.11.3":"La integridad de los rectos los encaminará: mas destruirá a los pecadores la perversidad de ellos.","19.10.9":"El que camina en integridad, anda confiado: mas el que pervierte sus caminos, será quebrantado.","19.18.21":"La muerte y la vida están en poder de la lengua; y el que la ama comerá de sus frutos.","58.3.5":"Así también, la lengua es un miembro pequeño, y se gloría de grandes cosas. He aquí, un pequeño fuego ¡cuán grande bosque enciende!","58.3.6":"Y la lengua es un fuego, un mundo de maldad. Así la lengua está puesta entre nuestros miembros, la cual contamina todo el cuerpo, e inflama la rueda de la creación, y es inflamada del infierno.","58.3.7":"Porque toda naturaleza de bestias, y de aves, y de serpientes, y de seres de la mar, se doma y es domada de la naturaleza humana:","58.3.8":"Pero ningún hombre puede domar la lengua, que es un mal que no puede ser refrenado; llena de veneno mortal.","58.3.9":"Con ella bendecimos al Dios y Padre, y con ella maldecimos a los hombres, los cuales son hechos a la semejanza de Dios.","58.3.10":"De una misma boca proceden bendición y maldición. Hermanos míos, no conviene que estas cosas sean así hechas.","48.4.29":"Ninguna palabra torpe salga de vuestra boca, sino la que sea buena para edificación, para que dé gracia a los oyentes.","19.16.24":"Panal de miel son los dichos suaves: suavidad al alma y medicina a los huesos.","19.21.23":"El que guarda su boca y su lengua, su alma guarda de angustias.","39.12.36":"Mas yo os digo, que toda palabra ociosa que hablen los hombres, de ella darán cuenta en el día del juicio.","39.12.37":"Porque por tus palabras serás justificado, y por tus palabras serás condenado.","18.141.3":"Pon, oh Jehová, guarda a mi boca: guarda la puerta de mis labios.","19.26.20":"Sin leña se apaga el fuego: y donde no hay chismoso, cesa la contienda.","19.16.28":"El hombre perverso levanta contienda; y el chismoso aparta los mejores amigos.","19.11.13":"El que anda en chismes, descubre el secreto: mas el de espíritu fiel encubre la cosa.","19.20.19":"El que descubre el secreto, en chismes anda: no te entrometas, pues, con el que lisonjea con sus labios.","1.20.16":"No hablarás contra tu prójimo falso testimonio.","2.19.16":"No andarás chismeando en tus pueblos. No te pondrás contra la sangre de tu prójimo: Yo Jehová.","19.25.28":"Como ciudad derribada y sin muro, es el hombre cuyo espíritu no tiene rienda.","45.9.25":"Y todo aquel que lucha, de todo se abstiene: y ellos, a la verdad, para recibir una corona corruptible; mas nosotros, incorruptible.","45.9.26":"Así que, yo de esta manera corro, no como a cosa incierta; de esta manera peleo, no como quien hiere el aire:","45.9.27":"Antes hiero mi cuerpo, y lo pongo en servidumbre; no sea que, habiendo predicado a otros, yo mismo venga a ser reprobado.","45.16.13":"Velad, estad firmes en la fe; portaos varonilmente, y esforzaos.","19.28.1":"Huye el impío sin que nadie lo persiga: mas el justo está confiado como un leoncillo.","43.4.29":"Y ahora, Señor, mira sus amenazas, y da a tus siervos que con toda confianza hablen tu palabra;","41.6.36":"Sed pues misericordiosos, como también vuestro Padre es misericordioso.","50.3.12":"Vestíos pues, como escogidos de Dios, santos y amados, de entrañas de misericordia, de benignidad, de humildad, de mansedumbre, de tolerancia;","19.3.3":"Misericordia y verdad no te desamparen; átalas a tu cuello, escríbelas en la tabla de tu corazón:","19.3.4":"Y hallarás gracia y buena opinión en los ojos de Dios y de los hombres.","19.21.21":"El que sigue la justicia y la misericordia, hallará la vida, la justicia, y la honra.","47.6.10":"Así que, entre tanto que tenemos tiempo, hagamos bien a todos, y mayormente a los domésticos de la fe.","29.5.24":"Antes corra el juicio como las aguas, y la justicia como impetuoso arroyo.","19.21.3":"Hacer justicia y juicio es a Jehová más agradable que sacrificio.","19.31.8":"Abre tu boca por el mudo, en el juicio de todos los hijos de muerte.","19.31.9":"Abre tu boca, juzga justicia, y el derecho del pobre y del menesteroso.","18.89.14":"Justicia y juicio son el asiento de tu trono: misericordia y verdad van delante de tu rostro.","39.23.23":"¡Ay de vosotros, escribas y Fariseos, hipócritas! porque diezmáis la menta y el eneldo y el comino, y dejasteis lo que es lo más grave de la ley, es a saber, el juicio y la misericordia y la fe: esto era menester hacer, y no dejar lo otro.","49.4.12":"Sé estar humillado, y sé tener abundancia: en todo y por todo estoy enseñado, así para hartura como para hambre, así para tener abundancia como para padecer necesidad.","49.4.13":"Todo lo puedo en Cristo que me fortalece.","53.6.6":"Pero grande granjería es la piedad con contentamiento.","53.6.7":"Porque nada hemos traído a este mundo, y sin duda nada podremos sacar.","53.6.8":"Así que, teniendo sustento y con qué cubrirnos, seamos contentos con esto.","19.15.16":"Mejor es lo poco con el temor de Jehová, que el gran tesoro donde hay turbación.","20.5.10":"El que ama el dinero, no se hartará de dinero; y el que ama el mucho tener, no sacará fruto. También esto es vanidad.","18.23.1":"Jehová es mi pastor; nada me faltará.","19.20.7":"El justo que camina en su integridad, bienaventurados serán sus hijos después de él.","18.15.1":"Jehová, ¿quién habitará en tu tabernáculo? ¿quién residirá en el monte de tu santidad?","18.15.2":"El que anda en integridad, y obra justicia, y habla verdad en su corazón.","18.25.21":"Integridad y rectitud me guarden; porque en ti he esperado.","19.28.6":"Mejor es el pobre que camina en su integridad, que el de perversos caminos, y rico.","19.31.10":"Mujer fuerte, ¿quién la hallará? porque su estima sobrepuja largamente a la de piedras preciosas.","19.31.11":"El corazón de su marido está en ella confiado, y no tendrá necesidad de despojo.","19.31.12":"Le dará ella bien y no mal, todos los días de su vida.","19.31.13":"Buscó lana y lino, y con voluntad labró de sus manos.","19.31.14":"Fué como navío de mercader: trae su pan de lejos.","19.31.15":"Se levantó aun de noche, y dió comida a su familia, y ración a sus criadas.","19.31.16":"Consideró la heredad, y la compró; y plantó viña del fruto de sus manos.","19.31.17":"Ciñó sus lomos de fortaleza, y esforzó sus brazos.","19.31.18":"Gustó que era buena su granjería: su candela no se apagó de noche.","19.31.19":"Aplicó sus manos al huso, y sus manos tomaron la rueca.","19.31.20":"Alargó su mano al pobre, y extendió sus manos al menesteroso.","19.31.21":"No tendrá temor de la nieve por su familia, porque toda su familia está vestida de ropas dobles.","19.31.22":"Ella se hizo tapices; de lino fino y púrpura es su vestido.","19.31.23":"Conocido es su marido en las puertas, cuando se sienta con los ancianos de la tierra.","19.31.24":"Hizo telas, y vendió; y dió cintas al mercader.","19.31.25":"Fortaleza y honor son su vestidura; y en el día postrero reirá.","19.31.26":"Abrió su boca con sabiduría: y la ley de clemencia está en su lengua.","19.31.27":"Considera los caminos de su casa, y no come el pan de balde.","19.31.28":"Se levantaron sus hijos, y la llamaron bienaventurada; y su marido también la alabó.","19.31.29":"Muchas mujeres hicieron el bien; mas tú las sobrepujaste a todas.","19.31.30":"Engañosa es la gracia, y vana la hermosura: la mujer que teme a Jehová, ésa será alabada.","19.31.31":"Dadle el fruto de sus manos, y alábenla en las puertas sus hechos.","59.3.3":"El adorno de las cuales no sea exterior con encrespamiento del cabello, y atavío de oro, ni en compostura de ropas;","59.3.4":"Sino el hombre del corazón que está encubierto, en incorruptible ornato de espíritu agradable y pacífico, lo cual es de grande estima delante de Dios.","7.3.11":"Ahora pues, no temas, hija mía: yo haré contigo lo que tú digas, pues que toda la puerta de mi pueblo sabe que eres mujer virtuosa.","41.1.45":"Y bienaventurada la que creyó, porque se cumplirán las cosas que le fueron dichas de parte del Señor.","55.2.3":"Las viejas, asimismo, se distingan en un porte santo; no calumniadoras, no dadas a mucho vino, maestras de honestidad:","55.2.4":"Que enseñen a las mujeres jóvenes a ser prudentes, a que amen a sus maridos, a que amen a sus hijos,","55.2.5":"A ser templadas, castas, que tengan cuidado de la casa, buenas, sujetas a sus maridos; porque la palabra de Dios no sea blasfemada.","45.16.14":"Todas vuestras cosas sean hechas con caridad.","10.2.2":"Yo voy el camino de toda la tierra: esfuérzate, y sé varón.","10.2.3":"Guarda la ordenanza de Jehová tu Dios, andando en sus caminos, y observando sus estatutos y mandamientos, y sus derechos y sus testimonios, de la manera que está escrito en la ley de Moisés, para que seas dichoso en todo lo que hagas, y en todo aquello a que te tornes;","18.112.1":"Bienaventurado el hombre que teme a Jehová, y en sus mandamientos se deleita en gran manera.","20.9.10":"Todo lo que te venga a la mano para hacer, hazlo según tus fuerzas; porque en el sepulcro, adonde tú vas, no hay obra, ni industria, ni ciencia, ni sabiduría.","19.14.23":"En toda labor hay fruto: mas la palabra de los labios solamente empobrece.","19.12.11":"El que labra su tierra, se hartará de pan: mas el que sigue los vagabundos es falto de entendimiento.","19.13.4":"Desea, y nada alcanza el alma del perezoso: mas el alma de los diligentes será engordada.","19.22.29":"¿Has visto hombre solícito en su obra? delante de los reyes estará; no estará delante de los de baja suerte.","52.3.10":"Porque aun estando con vosotros, os denunciábamos esto: Que si alguno no quiere trabajar, tampoco coma.","51.4.11":"Y que procuréis tener quietud, y hacer vuestros negocios, y obréis de vuestras manos de la manera que os hemos mandado;","51.4.12":"A fin de que andéis honestamente para con los extraños, y no necesitéis de nada.","0.2.15":"Tomó, pues, Jehová Dios al hombre, y le puso en el huerto de Edén, para que lo labrara y lo guardase.","19.22.7":"El rico se enseñoreará de los pobres; y el que toma prestado, siervo es del que empresta.","18.37.21":"El impío toma prestado, y no paga; mas el justo tiene misericordia, y da.","19.21.5":"Los pensamientos del solícito ciertamente van a abundancia; mas todo presuroso, indefectiblemente a pobreza.","19.13.11":"Disminuiránse las riquezas de vanidad: pero multiplicará el que allega con su mano.","41.14.28":"Porque ¿cuál de vosotros, queriendo edificar una torre, no cuenta primero sentado los gastos, si tiene lo que necesita para acabarla?","53.6.10":"Porque el amor del dinero es la raíz de todos los males: el cual codiciando algunos, se descaminaron de la fe, y fueron traspasados de muchos dolores.","49.4.19":"Mi Dios, pues, suplirá todo lo que os falta conforme a sus riquezas en gloria en Cristo Jesús.","18.37.25":"Mozo fuí, y he envejecido, y no he visto justo desamparado, ni su simiente que mendigue pan.","18.34.10":"Los leoncillos necesitaron, y tuvieron hambre; pero los que buscan a Jehová, no tendrán falta de ningún bien.","41.12.24":"Considerad los cuervos, que ni siembran, ni siegan; que ni tienen cillero, ni alfolí; y Dios los alimenta. ¿Cuánto de más estima sois vosotros que las aves?","46.9.8":"Y poderoso es Dios para hacer que abunde en vosotros toda gracia; a fin de que, teniendo siempre en todas las cosas todo lo que basta, abundéis para toda buena obra:","0.22.14":"Y llamó Abraham el nombre de aquel lugar, Jehová proveerá. Por tanto se dice hoy: En el monte de Jehová será provisto.","19.16.3":"Encomienda a Jehová tus obras, y tus pensamientos serán afirmados.","19.15.22":"Los pensamientos son frustrados donde no hay consejo; mas en la multitud de consejeros se afirman.","41.14.29":"Porque después que haya puesto el fundamento, y no pueda acabarla, todos los que lo vean, no comiencen a hacer burla de él,","41.14.30":"Diciendo: Este hombre comenzó a edificar, y no pudo acabar.","58.4.13":"Ea ahora, los que decís: Hoy y mañana iremos a tal ciudad, y estaremos allá un año, y compraremos mercadería, y ganaremos:","58.4.14":"Y no sabéis lo que será mañana. Porque ¿qué es vuestra vida? Ciertamente es un vapor que se aparece por un poco de tiempo, y luego se desvanece.","58.4.15":"En lugar de lo cual deberíais decir: Si el Señor quiere, y si vivimos, haremos esto o aquello.","19.27.23":"Considera atentamente el aspecto de tus ovejas; pon tu corazón a tus rebaños:","19.27.24":"Porque las riquezas no son para siempre; ¿y será la corona para perpetuas generaciones?","4.8.18":"Antes acuérdate de Jehová tu Dios: porque él te da el poder para hacer las riquezas, a fin de confirmar su pacto que juró a tus padres, como en este día.","19.6.6":"Ve a la hormiga, oh perezoso, mira sus caminos, y sé sabio;","19.6.7":"La cual no teniendo capitán, ni gobernador, ni señor,","19.6.8":"Prepara en el verano su comida y allega en el tiempo de la siega su mantenimiento.","19.6.9":"Perezoso, ¿hasta cuándo has de dormir? ¿cuándo te levantarás de tu sueño?","19.6.10":"Un poco de sueño, un poco de dormitar, y cruzar por un poco las manos para reposo:","19.6.11":"Así vendrá tu necesidad como caminante, y tu pobreza como hombre de escudo.","19.10.4":"La mano negligente hace pobre: mas la mano de los diligentes enriquece.","19.20.13":"No ames el sueño, porque no te empobrezcas; abre tus ojos, y te hartarás de pan.","19.19.15":"La pereza hace caer en sueño; y el alma negligente hambreará.","19.26.14":"Las puertas se revuelven en sus quicios: así el perezoso en su cama.","19.26.15":"Esconde el perezoso su mano en el seno; se cansa de tornarla a su boca.","52.3.11":"Porque oímos que andan algunos entre vosotros fuera de orden, no trabajando en nada, sino ocupados en curiosear.","52.3.12":"Y a los tales requerimos y rogamos por nuestro Señor Jesucristo, que, trabajando con reposo, coman su pan.","18.1.1":"Bienaventurado el varón que no anduvo en consejo de malos, ni estuvo en camino de pecadores, ni en silla de escarnecedores se ha sentado;","18.1.2":"Antes en la ley de Jehová está su delicia, y en su ley medita de día y de noche.","18.1.3":"Y será como el árbol plantado junto a arroyos de aguas, que da su fruto en su tiempo, y su hoja no cae; y todo lo que hace, prosperará.","23.17.7":"Bendito el varón que se fía en Jehová, y cuya confianza es Jehová.","23.17.8":"Porque él será como el árbol plantado junto a las aguas, que junto a la corriente echará sus raices, y no verá cuando venga el calor, sino que su hoja estará verde; y en el año de sequía no se fatigará, ni dejará de hacer fruto.","39.16.26":"Porque ¿de qué aprovecha al hombre, si granjea todo el mundo, y pierde su alma? O ¿qué recompensa dará el hombre por su alma?","53.6.9":"Porque los que quieren enriquecerse, caen en tentación y lazo, y en muchas codicias locas y dañosas, que hunden a los hombres en perdición y muerte.","19.28.25":"El altivo de ánimo suscita contiendas: mas el que en Jehová confía, medrará.","50.3.5":"Amortiguad, pues, vuestros miembros que están sobre la tierra: fornicación, inmundicia, molicie, mala concupiscencia, y avaricia, que es idolatría:","34.3.17":"Aunque la higuera no florecerá, ni en las vides habrá frutos; mentirá la obra de la oliva, y los labrados no darán mantenimiento, y las ovejas serán quitadas de la majada, y no habrá vacas en los corrales;","34.3.18":"Con todo, yo me alegraré en Jehová, y me gozaré en el Dios de mi salud.","44.13.1":"Toda alma se someta a las potestades superiores; porque no hay potestad sino de Dios; y las que son, de Dios son ordenadas.","44.13.2":"Así que, el que se opone a la potestad, a la ordenación de Dios resiste: y los que resisten, ellos mismos ganan condenación para sí.","44.13.3":"Porque los magistrados no son para temor al que bien hace, sino al malo. ¿Quieres pues no temer la potestad? haz lo bueno, y tendrás alabanza de ella;","44.13.4":"Porque es ministro de Dios para tu bien. Mas si haces lo malo, teme: porque no en vano lleva el cuchillo; porque es ministro de Dios, vengador para castigo al que hace lo malo.","44.13.5":"Por lo cual es necesario que le estéis sujetos, no solamente por la ira, mas aun por la conciencia.","44.13.6":"Porque por esto pagáis también los tributos; porque son ministros de Dios que sirven a esto mismo.","44.13.7":"Pagad a todos lo que debéis: al que tributo, tributo; al que pecho, pecho; al que temor, temor; al que honra, honra.","53.2.1":"Amonesto pues, ante todas cosas, que se hagan rogativas, oraciones, peticiones, hacimientos de gracias, por todos los hombres;","53.2.2":"Por los reyes y por todos los que están en eminencia, para que vivamos quieta y reposadamente en toda piedad y honestidad.","59.2.13":"Sed pues sujetos a toda ordenación humana por respeto a Dios: ya sea al rey, como a superior;","59.2.14":"Ya a los gobernadores, como de él enviados para venganza de los malhechores, y para loor de los que hacen bien.","59.2.15":"Porque esta es la voluntad de Dios; que haciendo bien, hagáis callar la ignorancia de los hombres vanos:","59.2.16":"Como libres, y no como teniendo la libertad por cobertura de malicia, sino como siervos de Dios.","59.2.17":"Honrad a todos. Amad la fraternidad. Temed a Dios. Honrad al rey.","55.3.1":"Amonéstales que se sujeten a los príncipes y potestades, que obedezcan, que estén prontos a toda buena obra.","19.21.1":"Como los repartimientos de las aguas, así está el corazón del rey en la mano de Jehová: a todo lo que quiere lo inclina.","18.33.12":"Bienaventurada la gente de que Jehová es su Dios; el pueblo a quien escogió por heredad para sí.","19.14.34":"La justicia engrandece la nación: mas el pecado es afrenta de las naciones.","19.29.2":"Cuando los justos dominan, el pueblo se alegra: mas cuando domina el impío, el pueblo gime.","23.29.7":"Y procurad la paz de la ciudad a la cual os hice traspasar, y rogad por ella a Jehová; porque en su paz tendréis vosotros paz.","18.91.1":"El que habita al abrigo del Altísimo, morará bajo la sombra del Omnipotente.","18.91.2":"Diré yo a Jehová: Esperanza mía, y castillo mío; mi Dios, en él confiaré.","18.91.3":"Y él te librará del lazo del cazador: de la peste destruidora.","18.91.4":"Con sus plumas te cubrirá, y debajo de sus alas estarás seguro: escudo y adarga es su verdad.","18.91.5":"No tendrás temor de espanto nocturno, ni de saeta que vuele de día;","18.91.6":"Ni de pestilencia que ande en oscuridad, ni de mortandad que en medio del día destruya.","18.91.7":"Caerán a tu lado mil, y diez mil a tu diestra: mas a ti no llegará.","18.91.8":"Ciertamente con tus ojos mirarás, y verás la recompensa de los impíos.","18.91.9":"Porque tú has puesto a Jehová, que es mi esperanza, al Altísimo por tu habitación,","18.91.10":"No te sobrevendrá mal, ni plaga tocará tu morada.","18.91.13":"Sobre el león y el basilisco pisarás; hollarás al cachorro del león y al dragón.","18.91.14":"Por cuanto en mí ha puesto su voluntad, yo también lo libraré: lo pondré en alto, por cuanto ha conocido mi nombre.","18.91.15":"Me invocará, y yo le responderé: con él estaré yo en la angustia: lo libraré, y le glorificaré.","18.91.16":"Lo saciaré de larga vida, y le mostraré mi salud.","18.121.1":"Alzaré mis ojos a los montes, de donde vendrá mi socorro.","18.121.2":"Mi socorro viene de Jehová, que hizo los cielos y la tierra.","18.121.3":"No dará tu pie al resbaladero; ni se dormirá el que te guarda.","18.121.4":"He aquí, no se adormecerá ni dormirá el que guarda a Israel.","18.121.5":"Jehová es tu guardador: Jehová es tu sombra a tu mano derecha.","18.121.6":"El sol no te fatigará de día, ni la luna de noche.","18.121.7":"Jehová te guardará de todo mal: él guardará tu alma.","18.121.8":"Jehová guardará tu salida y tu entrada, desde ahora y para siempre.","19.18.10":"Torre fuerte es el nombre de Jehová: a él correrá el justo, y será levantado.","52.3.3":"Mas fiel es el Señor, que os confirmará y guardará del mal.","22.54.17":"Toda herramienta que sea fabricada contra ti, no prosperará; y tú condenarás toda lengua que se levante contra ti en juicio. Esta es la heredad de los siervos de Jehová, y su justicia de por mí, dijo Jehová.","0.28.15":"Y he aquí, yo soy contigo, y te guardaré por donde quiera que vayas, y te volveré a esta tierra; porque no te dejaré hasta tanto que haya hecho lo que te he dicho.","18.139.9":"Si toma las alas del alba, y habita en el extremo de la mar,","18.139.10":"Aun allí me guiará tu mano, y me asirá tu diestra.","19.3.23":"Entonces andarás por tu camino confiadamente, y tu pie no tropezará.","19.3.24":"Cuando te acuestes, no tendrás temor; antes te acostarás, y tu sueño será suave.","18.3.5":"Yo me acosté, y dormí, y desperté; porque Jehová me sostuvo.","18.63.6":"Cuando me acordaré de ti en mi lecho, cuando meditaré de ti en las velas de la noche.","18.5.3":"Oh Jehová, de mañana oirás mi voz; de mañana me presentaré a ti, y esperaré.","18.143.8":"Hazme oir por la mañana tu misericordia, porque en ti he confiado: hazme saber el camino por donde ande, porque a ti he alzado mi alma.","18.90.14":"Sácianos presto de tu misericordia: y cantaremos y nos alegraremos todos nuestros días.","22.50.4":"El Señor Jehová me dió lengua de sabios, para saber hablar en sazón palabra al cansado; despertará de mañana, me despertará de mañana oído, para que oiga como los sabios.","40.1.35":"Y levantándose muy de mañana, aun muy de noche, salió y se fué a un lugar desierto, y allí oraba.","18.20.4":"Déte conforme a tu corazón, y cumpla todo tu consejo.","18.139.16":"Mi embrión vieron tus ojos, y en tu libro estaban escritas todas aquellas cosas que fueron luego formadas, sin faltar una de ellas.","19.9.11":"Porque por mí se aumentarán tus días, y años de vida se te añadirán.","7.1.16":"Y Ruth respondió: No me ruegues que te deje, y me aparte de ti: porque donde quiera que tú vayas, iré yo; y donde quiera que vivas, viviré. Tu pueblo será mi pueblo, y tu Dios mi Dios.","7.1.17":"Donde tú mueras, moriré yo, y allí seré sepultada: así me haga Jehová, y así me dé, que sólo la muerte hará separación entre mí y ti.","18.139.15":"No fué encubierto de ti mi cuerpo, bien que en oculto fuí formado, y compaginado en lo más bajo de la tierra.","8.1.27":"Por este niño oraba, y Jehová me dió lo que le pedí.","8.1.28":"Yo pues le vuelvo también a Jehová: todos los días que viva, será de Jehová. Y adoró allí a Jehová.","18.22.9":"Pero tú eres el que me sacó del vientre, el que me haces esperar desde que estaba a los pechos de mi madre.","18.22.10":"Sobre ti fuí echado desde la matriz: desde el vientre de mi madre, tú eres mi Dios.","22.44.2":"Así dice Jehová, Hacedor tuyo, y el que te formó desde el vientre, el cual te ayudará: No temas, siervo mío Jacob, y tú, Jeshurun, a quien yo escogí.","22.43.18":"No os acordéis de las cosas pasadas, ni traigáis a memoria las cosas antiguas.","22.43.19":"He aquí que yo hago cosa nueva: presto saldrá a luz: ¿no la sabréis? Otra vez pondré camino en el desierto, y ríos en la soledad.","18.37.5":"Encomienda a Jehová tu camino, y espera en él; y él hará.","18.65.11":"Tú coronas el año de tus bienes; y tus nubes destilan grosura.","41.2.8":"Y había pastores en la misma tierra, que velaban y guardaban las vigilias de la noche sobre su ganado.","41.2.9":"Y he aquí el ángel del Señor vino sobre ellos, y la claridad de Dios los cercó de resplandor; y tuvieron gran temor.","41.2.12":"Y esto os será por señal: hallaréis al niño envuelto en pañales, echado en un pesebre.","41.2.13":"Y repentinamente fué con el ángel una multitud de los ejércitos celestiales, que alababan a Dios, y decían:","41.2.14":"Gloria en las alturas a Dios, y en la tierra paz, buena voluntad para con los hombres.","39.2.1":"Y como fué nacido Jesús en Bethlehem de Judea en días del rey Herodes, he aquí unos magos vinieron del oriente a Jerusalem,","39.2.2":"Diciendo: ¿Dónde está el Rey de los Judíos, que ha nacido? porque su estrella hemos visto en el oriente, y venimos a adorarle.","39.2.10":"Y vista la estrella, se regocijaron con muy grande gozo.","39.2.11":"Y entrando en la casa, vieron al niño con su madre María, y postrándose, le adoraron; y abriendo sus tesoros, le ofrecieron dones, oro e incienso y mirra.","42.12.12":"El siguiente día, mucha gente que había venido a la fiesta, como oyeron que Jesús venía a Jerusalem,","42.12.13":"Tomaron ramos de palmas, y salieron a recibirle, y clamaban: ¡Hosanna, Bendito el que viene en el nombre del Señor, el Rey de Israel!","41.22.42":"Diciendo: Padre, si quieres, pasa este vaso de mí; pero no se haga mi voluntad, sino la tuya.","22.53.3":"Despreciado y desechado entre los hombres, varón de dolores, experimentado en quebranto: y como que escondimos de él el rostro, fué menospreciado, y no lo estimamos.","22.53.4":"Ciertamente llevó él nuestras enfermedades, y sufrió nuestros dolores; y nosotros le tuvimos por azotado, por herido de Dios y abatido.","22.53.7":"Angustiado él, y afligido, no abrió su boca: como cordero fué llevado al matadero; y como oveja delante de sus trasquiladores, enmudeció, y no abrió su boca.","42.19.28":"Después de esto, sabiendo Jesús que todas las cosas eran ya cumplidas, para que la Escritura se cumpliese, dijo: Sed tengo.","42.19.29":"Y estaba allí un vaso lleno de vinagre: entonces ellos hinchieron una esponja de vinagre, y rodeada a un hisopo, se la llegaron a la boca.","41.23.46":"Entonces Jesús, clamando a gran voz, dijo: Padre, en tus manos encomiendo mi espíritu. Y habiendo dicho esto, espiró.","39.28.7":"E id presto, decid a sus discípulos que ha resucitado de los muertos: y he aquí va delante de vosotros a Galilea; allí le veréis; he aquí, os lo he dicho.","44.12.17":"No paguéis a nadie mal por mal; procurad lo bueno delante de todos los hombres.","18.37.3":"Espera en Jehová, y haz bien; vivirás en la tierra, y en verdad serás alimentado.","18.37.6":"Y exhibirá tu justicia como la luz, y tus derechos como el medio día.","0.50.20":"Vosotros pensasteis mal sobre mí, mas Dios lo encaminó a bien, para hacer lo que vemos hoy, para mantener en vida a mucho pueblo.","59.2.19":"Porque esto es agradable, si alguno a causa de la conciencia delante de Dios, sufre molestias padeciendo injustamente.","59.2.20":"Porque ¿qué gloria es, si pecando vosotros sois abofeteados, y lo sufrís? mas si haciendo bien sois afligidos, y lo sufrís, esto ciertamente es agradable delante de Dios.","59.2.21":"Porque para esto sois llamados; pues que también Cristo padeció por nosotros, dejándonos ejemplo, para que vosotros sigáis sus pisadas:","59.2.22":"El cual no hizo pecado; ni fué hallado engaño en su boca:","59.2.23":"Quien cuando le maldecían, no retornaba maldición; cuando padecía, no amenazaba, sino remitía la causa al que juzga justamente:","18.9.9":"Y será Jehová refugio al pobre, refugio para el tiempo de angustia.","42.15.18":"Si el mundo os aborrece, sabed que a mí me aborreció antes que a vosotros.","42.15.19":"Si fuerais del mundo, el mundo amaría lo suyo; mas porque no sois del mundo, antes yo os elegí del mundo, por eso os aborrece el mundo.","42.15.20":"Acordaos de la palabra que yo os he dicho: No es el siervo mayor que su señor. Si a mí me han perseguido, también a vosotros perseguirán: si han guardado mi palabra, también guardarán la vuestra.","54.3.12":"Y también todos los que quieren vivir píamente en Cristo Jesús, padecerán persecución.","59.4.14":"Si sois vituperados en el nombre de Cristo, sois bienaventurados; porque la gloria y el Espíritu de Dios reposan sobre vosotros. Cierto, según ellos, él es blasfemado, mas según vosotros es glorificado.","44.8.35":"¿Quién nos apartará del amor de Cristo? tribulación? o angustia? o persecución? o hambre? o desnudez? o peligro? o cuchillo?","44.8.36":"Como está escrito: Por causa de ti somos muertos todo el tiempo: somos estimados como ovejas de matadero.","43.5.41":"Y ellos partieron de delante del concilio, gozosos de que fuesen tenidos por dignos de padecer afrenta por el Nombre.","49.1.21":"Porque para mí el vivir es Cristo, y el morir es ganancia.","57.2.14":"Así que, por cuanto los hijos participaron de carne y sangre, él también participó de lo mismo, para destruir por la muerte al que tenía el imperio de la muerte, es a saber, al diablo,","57.2.15":"Y librar a los que por el temor de la muerte estaban por toda la vida sujetos a servidumbre.","44.14.8":"Que si vivimos, para el Señor vivimos; y si morimos, para el Señor morimos. Así que, o que vivamos, o que muramos, del Señor somos.","65.14.13":"Y oí una voz del cielo que me decía: Escribe: Bienaventurados los muertos que de aquí adelante mueren en el Señor. Sí, dice el Espíritu, que descansarán de sus trabajos; porque sus obras con ellos siguen.","20.3.2":"Tiempo de nacer, y tiempo de morir; tiempo de plantar, y tiempo de arrancar lo plantado;","20.3.3":"Tiempo de matar, y tiempo de curar; tiempo de destruir, y tiempo de edificar;","20.3.4":"Tiempo de llorar, y tiempo de reir; tiempo de endechar, y tiempo de bailar;","20.3.5":"Tiempo de esparcir las piedras, y tiempo de allegar las piedras; tiempo de abrazar, y tiempo de alejarse de abrazar;","20.3.6":"Tiempo de agenciar, y tiempo de perder; tiempo de guardar, y tiempo de arrojar;","20.3.7":"Tiempo de romper, y tiempo de coser; tiempo de callar, y tiempo de hablar;","20.3.8":"Tiempo de amar, y tiempo de aborrecer; tiempo de guerra, y tiempo de paz.","18.138.8":"Jehová cumplirá por mí: tu misericordia, oh Jehová, es para siempre; no dejarás la obra de tus manos.","18.57.2":"Clamaré al Dios Altísimo, al Dios que me favorece.","48.5.15":"Mirad, pues, cómo andéis avisadamente; no como necios, mas como sabios;","48.5.16":"Redimiendo el tiempo, porque los días son malos.","46.1.20":"Porque todas las promesas de Dios son en él Sí, y en él Amén, por nosotros a gloria de Dios.","18.23.5":"Aderezarás mesa delante de mí, en presencia de mis angustiadores: ungiste mi cabeza con aceite: mi copa está rebosando.","18.23.6":"Ciertamente el bien y la misericordia me seguirán todos los días de mi vida: y en la casa de Jehová moraré por largos días.","18.139.7":"¿Adónde me iré de tu espíritu? ¿y adónde huiré de tu presencia?","18.139.8":"Si sube a los cielos, allí estás tú: y si en abismo hace mi estrado, he aquí allí tú estás.","46.12.10":"Por lo cual me gozo en las flaquezas, en afrentas, en necesidades, en persecuciones, en angustias por Cristo; porque cuando soy flaco, entonces soy poderoso.","18.28.7":"Jehová es mi fortaleza y mi escudo: en él esperó mi corazón, y fuí ayudado; por lo que se gozó mi corazón, y con mi canción le alabaré.","61.5.4":"Porque todo aquello que es nacido de Dios vence al mundo: y esta es la victoria que vence al mundo, nuestra fe.","46.2.14":"Mas a Dios gracias, el cual hace que siempre triunfemos en Cristo Jesús, y manifiesta el olor de su conocimiento por nosotros en todo lugar.","4.20.4":"Que Jehová vuestro Dios anda con vosotros, para pelear por vosotros contra vuestros enemigos, para salvaros.","19.21.31":"El caballo se apareja para el día de la batalla: mas de Jehová es el salvar.","19.10.22":"La bendición de Jehová es la que enriquece, y no añade tristeza con ella.","48.1.3":"Bendito el Dios y Padre del Señor nuestro Jesucristo, el cual nos bendijo con toda bendición espiritual en lugares celestiales en Cristo:","4.28.3":"Bendito serás tú en la ciudad, y bendito tú en el campo.","4.28.4":"Bendito el fruto de tu vientre, y el fruto de tu bestia, la cría de tus vacas, y los rebaños de tus ovejas.","4.28.5":"Bendito tu canastillo y tus sobras.","4.28.6":"Bendito serás en tu entrar, y bendito en tu salir.","18.32.3":"Mientras callé, se envejecieron mis huesos en mi gemir todo el día.","18.32.4":"Porque de día y de noche se agravó sobre mí tu mano; se volvió mi verdor en sequedades de estío. (Selah.)","19.28.13":"El que encubre sus pecados, no prosperará: mas el que los confiesa y se aparta, alcanzará misericordia.","18.34.4":"Busqué a Jehová, y él me oyó, y me libró de todos mis temores.","18.34.5":"A él miraron y fueron alumbrados: y sus rostros no se avergonzaron.","18.34.6":"Este pobre clamó, y le oyó Jehová, y lo libró de todas sus angustias.","19.23.29":"¿Para quién será el ay? ¿para quién el ay? ¿para quién las rencillas? ¿para quién las quejas? ¿para quién las heridas en balde? ¿para quién lo amoratado de los ojos?","19.23.30":"Para los que se detienen mucho en el vino, para los que van buscando la mistura.","19.23.31":"No mires al vino cuando rojea, cuando resplandece su color en el vaso: se entra suavemente;","19.23.32":"Mas al fin como serpiente morderá, y como basilisco dará dolor:","19.23.33":"Tus ojos mirarán las extrañas, y tu corazón hablará perversidades.","19.23.34":"Y serás como el que yace en medio de la mar, o como el que está en la punta de un mastelero.","19.23.35":"Y dirás: Me hirieron, mas no me dolió; me azotaron, mas no lo sentí; cuando despierte, aun lo tornaré a buscar.","44.13.13":"Andemos como de día, honestamente: no en glotonerías y borracheras, no en lechos y disoluciones, no en pedencias y envidia:","44.13.14":"Mas vestíos del Señor Jesucristo, y no hagáis caso de la carne en sus deseos.","45.6.11":"Y esto erais algunos: mas ya sois lavados, mas ya sois santificados, mas ya sois justificados en el nombre del Señor Jesús, y por el Espíritu de nuestro Dios.","18.101.3":"No pondré delante de mis ojos cosa injusta: aborrezco la obra de los que se desvían: ninguno de ellos se allegará a mí.","18.119.10":"Con todo mi corazón te he buscado: no me dejes divagar de tus mandamientos.","19.28.20":"El hombre de verdad tendrá muchas bendiciones: mas el que se apresura a enriquecer, no será sin culpa.","19.4.25":"Tus ojos miren lo recto, y tus párpados en derechura delante de ti.","58.4.8":"Allegaos a Dios, y él se allegará a vosotros. Pecadores, limpiad las manos; y vosotros de doblado ánimo, purificad los corazones.","18.50.15":"E invócame en el día de la angustia: te libraré, y tú me honrarás.","19.4.14":"No entres por la vereda de los impíos, ni vayas por el camino de los malos.","19.4.15":"Desampárala, no pases por ella; apártate de ella, pasa.","19.24.16":"Porque siete veces cae el justo, y se torna a levantar; mas los impíos caerán en el mal.","32.7.8":"Tú, enemiga mía, no te huelgues de mí: porque aunque caí, he de levantarme; aunque more en tinieblas, Jehová será mi luz.","18.37.24":"Cuando caiga, no quedará postrado; porque Jehová sostiene su mano.","47.6.2":"Sobrellevad los unos las cargas de los otros; y cumplid así la ley de Cristo.","22.61.1":"El espíritu del Señor Jehová es sobre mí, porque me ungió Jehová; hame enviado a predicar buenas nuevas a los abatidos, a vendar a los quebrantados de corazón, a publicar libertad a los cautivos, y a los presos abertura de la cárcel;","22.61.2":"A promulgar año de la buena voluntad de Jehová, y día de venganza del Dios nuestro; a consolar a todos los enlutados;","42.10.10":"El ladrón no viene sino para hurtar, y matar, y destruir: yo he venido para que tengan vida, y para que la tengan en abundancia.","18.103.4":"El que rescata del hoyo tu vida, el que te corona de favores y misericordias;","18.103.5":"El que sacia de bien tu boca de modo que te rejuvenezcas como el águila.","1.14.14":"Jehová peleará por vosotros, y vosotros estaréis quedos.","8.17.45":"Entonces dijo David al Filisteo: Tú vienes a mí con espada y lanza y escudo; mas yo vengo a ti en el nombre de Jehová de los ejércitos, el Dios de los escuadrones de Israel, que tú has provocado.","26.6.22":"El Dios mío envió su ángel, el cual cerró la boca de los leones, para que no me hiciesen mal: porque delante de él se halló en mí justicia: y aun delante de ti, oh rey, yo no he hecho lo que no debiese.","65.22.20":"El que da testimonio de estas cosas, dice: Ciertamente, vengo en breve. Amén, sea así. Ven, Señor Jesús.","41.2.52":"Y Jesús crecía en sabiduría, y en edad, y en gracia para con Dios y 9.6":"Wherefore they are no more twain, but one flesh. What therefore God hath joined together, let not man put asunder.","42.19.26":"When Jesus therefore saw his mother, and the disciple standing by, whom he loved, he saith unto his mother, Woman, behold thy son!","42.19.27":"Then saith he to the disciple, Behold thy mother! And from that hour that disciple took her unto his own home.","5.24.15":"And if it seem evil unto you to serve the Lord, choose you this day whom ye will serve; whether the gods which your fathers served that were on the other side of the flood, or the gods of the Amorites, in whose land ye dwell: but as for me and my house, we will serve the Lord.","18.127.1":"Except the Lord build the house, they labour in vain that build it: except the Lord keep the city, the watchman waketh but in vain.","48.6.1":"Children, obey your parents in the Lord: for this is right.","48.6.2":"Honour thy father and mother; (which is the first commandment with promise;)","48.6.3":"That it may be well with thee, and thou mayest live long on the earth.","48.6.4":"And, ye fathers, provoke not your children to wrath: but bring them up in the nurture and admonition of the Lord.","53.5.8":"But if any provide not for his own, and specially for those of his own house, he hath denied the faith, and is worse than an infidel.","43.16.31":"And they said, Believe on the Lord Jesus Christ, and thou shalt be saved, and thy house.","18.128.3":"Thy wife shall be as a fruitful vine by the sides of thine house: thy children like olive plants round about thy table.","18.128.4":"Behold, that thus shall the man be blessed that feareth the Lord.","0.2.24":"Therefore shall a man leave his father and his mother, and shall cleave unto his wife: and they shall be one flesh.","48.5.22":"Wives, submit yourselves unto your own husbands, as unto the Lord.","48.5.23":"For the husband is the head of the wife, even as Christ is the head of the church: and he is the saviour of the body.","48.5.24":"Therefore as the church is subject unto Christ, so let the wives be to their own husbands in every thing.","48.5.25":"Husbands, love your wives, even as Christ also loved the church, and gave himself for it;","48.5.26":"That he might sanctify and cleanse it with the washing of water by the word,","48.5.27":"That he might present it to himself a glorious church, not having spot, or wrinkle, or any such thing; but that it should be holy and without blemish.","48.5.28":"So ought men to love their wives as their own bodies. He that loveth his wife loveth himself.","48.5.29":"For no man ever yet hated his own flesh; but nourisheth and cherisheth it, even as the Lord the church:","48.5.30":"For we are members of his body, of his flesh, and of his bones.","48.5.31":"For this cause shall a man leave his father and mother, and shall be joined unto his wife, and they two shall be one flesh.","48.5.32":"This is a great mystery: but I speak concerning Christ and the church.","48.5.33":"Nevertheless let every one of you in particular so love his wife even as himself; and the wife see that she reverence her husband.","57.13.4":"Marriage is honourable in all, and the bed undefiled: but whoremongers and adulterers God will judge.","19.18.22":"Whoso findeth a wife findeth a good thing, and obtaineth favour of the Lord.","20.4.9":"Two are better than one; because they have a good reward for their labour.","20.4.10":"For if they fall, the one will lift up his fellow: but woe to him that is alone when he falleth; for he hath not another to help him up.","20.4.11":"Again, if two lie together, then they have heat: but how can one be warm alone?","20.4.12":"And if one prevail against him, two shall withstand him; and a threefold cord is not quickly broken.","45.7.3":"Let the husband render unto the wife due benevolence: and likewise also the wife unto the husband.","45.7.4":"The wife hath not power of her own body, but the husband: and likewise also the husband hath not power of his own body, but the wife.","45.7.5":"Defraud ye not one the other, except it be with consent for a time, that ye may give yourselves to fasting and prayer; and come together again, that Satan tempt you not for your incontinency.","50.3.18":"Wives, submit yourselves unto your own husbands, as it is fit in the Lord.","50.3.19":"Husbands, love your wives, and be not bitter against them.","59.3.7":"Likewise, ye husbands, dwell with them according to knowledge, giving honour unto the wife, as unto the weaker vessel, and as being heirs together of the grace of life; that your prayers be not hindered.","19.22.6":"Train up a child in the way he should go: and when he is old, he will not depart from it.","4.6.6":"And these words, which I command thee this day, shall be in thine heart:","4.6.7":"And thou shalt teach them diligently unto thy children, and shalt talk of them when thou sittest in thine house, and when thou walkest by the way, and when thou liest down, and when thou risest up.","18.127.3":"Lo, children are an heritage of the Lord: and the fruit of the womb is his reward.","18.127.4":"As arrows are in the hand of a mighty man; so are children of the youth.","18.127.5":"Happy is the man that hath his quiver full of them: they shall not be ashamed, but they shall speak with the enemies in the gate.","50.3.21":"Fathers, provoke not your children to anger, lest they be discouraged.","19.29.17":"Correct thy son, and he shall give thee rest; yea, he shall give delight unto thy soul.","19.13.24":"He that spareth his rod hateth his son: but he that loveth him chasteneth him betimes.","40.10.14":"But when Jesus saw it, he was much displeased, and said unto them, Suffer the little children to come unto me, and forbid them not: for of such is the kingdom of God.","40.10.15":"Verily I say unto you, Whosoever shall not receive the kingdom of God as a little child, he shall not enter therein.","40.10.16":"And he took them up in his arms, put his hands upon them, and blessed them.","63.1.4":"I have no greater joy than to hear that my children walk in truth.","1.20.12":"Honour thy father and thy mother: that thy days may be long upon the land which the Lord thy God giveth thee.","50.3.20":"Children, obey your parents in all things: for this is well pleasing unto the Lord.","19.1.8":"My son, hear the instruction of thy father, and forsake not the law of thy mother:","19.1.9":"For they shall be an ornament of grace unto thy head, and chains about thy neck.","19.23.22":"Hearken unto thy father that begat thee, and despise not thy mother when she is old.","19.23.24":"The father of the righteous shall greatly rejoice: and he that begetteth a wise child shall have joy of him.","19.23.25":"Thy father and thy mother shall be glad, and she that bare thee shall rejoice.","2.19.3":"Ye shall fear every man his mother, and his father, and keep my sabbaths: I am the Lord your God.","19.17.17":"A friend loveth at all times, and a brother is born for adversity.","19.18.24":"A man that hath friends must shew himself friendly: and there is a friend that sticketh closer than a brother.","42.15.13":"Greater love hath no man than this, that a man lay down his life for his friends.","42.15.14":"Ye are my friends, if ye do whatsoever I command you.","42.15.15":"Henceforth I call you not servants; for the servant knoweth not what his lord doeth: but I have called you friends; for all things that I have heard of my Father I have made known unto you.","19.27.6":"Faithful are the wounds of a friend; but the kisses of an enemy are deceitful.","19.27.9":"Ointment and perfume rejoice the heart: so doth the sweetness of a man’s friend by hearty counsel.","19.27.17":"Iron sharpeneth iron; so a man sharpeneth the countenance of his friend.","19.13.20":"He that walketh with wise men shall be wise: but a companion of fools shall be destroyed.","8.18.1":"And it came to pass, when he had made an end of speaking unto Saul, that the soul of Jonathan was knit with the soul of David, and Jonathan loved him as his own soul.","39.22.37":"Jesus said unto him, Thou shalt love the Lord thy God with all thy heart, and with all thy soul, and with all thy mind.","39.22.38":"This is the first and great commandment.","39.22.39":"And the second is like unto it, Thou shalt love thy neighbour as thyself.","39.22.40":"On these two commandments hang all the law and the prophets.","45.13.4":"Charity suffereth long, and is kind; charity envieth not; charity vaunteth not itself, is not puffed up,","45.13.5":"Doth not behave itself unseemly, seeketh not her own, is not easily provoked, thinketh no evil;","45.13.6":"Rejoiceth not in iniquity, but rejoiceth in the truth;","45.13.7":"Beareth all things, believeth all things, hopeth all things, endureth all things.","42.13.34":"A new commandment I give unto you, That ye love one another; as I have loved you, that ye also love one another.","42.13.35":"By this shall all men know that ye are my disciples, if ye have love one to another.","44.13.8":"Owe no man any thing, but to love one another: for he that loveth another hath fulfilled the law.","44.13.9":"For this, Thou shalt not commit adultery, Thou shalt not kill, Thou shalt not steal, Thou shalt not bear false witness, Thou shalt not covet; and if there be any other commandment, it is briefly comprehended in this saying, namely, Thou shalt love thy neighbour as thyself.","44.13.10":"Love worketh no ill to his neighbour: therefore love is the fulfilling of the law.","61.4.7":"Beloved, let us love one another: for love is of God; and every one that loveth is born of God, and knoweth God.","61.4.8":"He that loveth not knoweth not God; for God is love.","61.4.19":"We love him, because he first loved us.","61.4.20":"If a man say, I love God, and hateth his brother, he is a liar: for he that loveth not his brother whom he hath seen, how can he love God whom he hath not seen?","61.4.21":"And this commandment have we from him, That he who loveth God love his brother also.","47.5.14":"For all the law is fulfilled in one word, even in this; Thou shalt love thy neighbour as thyself.","59.4.8":"And above all things have fervent charity among yourselves: for charity shall cover the multitude of sins.","39.6.14":"For if ye forgive men their trespasses, your heavenly Father will also forgive you:","39.6.15":"But if ye forgive not men their trespasses, neither will your Father forgive your trespasses.","39.18.21":"Then came Peter to him, and said, Lord, how oft shall my brother sin against me, and I forgive him? till seven times?","39.18.22":"Jesus saith unto him, I say not unto thee, Until seven times: but, Until seventy times seven.","48.4.32":"And be ye kind one to another, tenderhearted, forgiving one another, even as God for Christ’s sake hath forgiven you.","50.3.13":"Forbearing one another, and forgiving one another, if any man have a quarrel against any: even as Christ forgave you, so also do ye.","40.11.25":"And when ye stand praying, forgive, if ye have ought against any: that your Father also which is in heaven may forgive you your trespasses.","41.6.37":"Judge not, and ye shall not be judged: condemn not, and ye shall not be condemned: forgive, and ye shall be forgiven:","41.17.3":"Take heed to yourselves: If thy brother trespass against thee, rebuke him; and if he repent, forgive him.","41.17.4":"And if he trespass against thee seven times in a day, and seven times in a day turn again to thee, saying, I repent; thou shalt forgive him.","44.12.19":"Dearly beloved, avenge not yourselves, but rather give place unto wrath: for it is written, Vengeance is mine; I will repay, saith the Lord.","44.12.20":"Therefore if thine enemy hunger, feed him; if he thirst, give him drink: for in so doing thou shalt heap coals of fire on his head.","44.12.21":"Be not overcome of evil, but overcome evil with good.","39.5.43":"Ye have heard that it hath been said, Thou shalt love thy neighbour, and hate thine enemy.","39.5.44":"But I say unto you, Love your enemies, bless them that curse you, do good to them that hate you, and pray for them which despitefully use you, and persecute you;","39.5.45":"That ye may be the children of your Father which is in heaven: for he maketh his sun to rise on the evil and on the good, and sendeth rain on the just and on the unjust.","39.5.46":"For if ye love them which love you, what reward have ye? do not even the publicans the same?","39.5.47":"And if ye salute your brethren only, what do ye more than others? do not even the publicans so?","39.5.48":"Be ye therefore perfect, even as your Father which is in heaven is perfect.","41.6.27":"But I say unto you which hear, Love your enemies, do good to them which hate you,","41.6.28":"Bless them that curse you, and pray for them which despitefully use you.","44.12.14":"Bless them which persecute you: bless, and curse not.","19.25.21":"If thine enemy be hungry, give him bread to eat; and if he be thirsty, give him water to drink:","19.25.22":"For thou shalt heap coals of fire upon his head, and the Lord shall reward thee.","19.24.17":"Rejoice not when thine enemy falleth, and let not thine heart be glad when he stumbleth:","41.23.34":"Then said Jesus, Father, forgive them; for they know not what they do. And they parted his raiment, and cast lots.","39.5.23":"Therefore if thou bring thy gift to the altar, and there rememberest that thy brother hath ought against thee;","39.5.24":"Leave there thy gift before the altar, and go thy way; first be reconciled to thy brother, and then come and offer thy gift.","39.18.15":"Moreover if thy brother shall trespass against thee, go and tell him his fault between thee and him alone: if he shall hear thee, thou hast gained thy brother.","44.12.18":"If it be possible, as much as lieth in you, live peaceably with all men.","19.15.1":"A soft answer turneth away wrath: but grievous words stir up anger.","19.15.18":"A wrathful man stirreth up strife: but he that is slow to anger appeaseth strife.","58.4.1":"From whence come wars and fightings among you? come they not hence, even of your lusts that war in your members?","58.4.2":"Ye lust, and have not: ye kill, and desire to have, and cannot obtain: ye fight and war, yet ye have not, because ye ask not.","57.12.14":"Follow peace with all men, and holiness, without which no man shall see the Lord:","48.4.26":"Be ye angry, and sin not: let not the sun go down upon your wrath:","46.5.18":"And all things are of God, who hath reconciled us to himself by Jesus Christ, and hath given to us the ministry of reconciliation;","18.133.1":"Behold, how good and how pleasant it is for brethren to dwell together in unity!","42.17.21":"That they all may be one; as thou, Father, art in me, and I in thee, that they also may be one in us: that the world may believe that thou hast sent me.","48.4.1":"I therefore, the prisoner of the Lord, beseech you that ye walk worthy of the vocation wherewith ye are called,","48.4.2":"With all lowliness and meekness, with longsuffering, forbearing one another in love;","48.4.3":"Endeavouring to keep the unity of the Spirit in the bond of peace.","45.1.10":"Now I beseech you, brethren, by the name of our Lord Jesus Christ, that ye all speak the same thing, and that there be no divisions among you; but that ye be perfectly joined together in the same mind and in the same judgment.","49.2.1":"If there be therefore any consolation in Christ, if any comfort of love, if any fellowship of the Spirit, if any bowels and mercies,","49.2.2":"Fulfil ye my joy, that ye be likeminded, having the same love, being of one accord, of one mind.","50.3.14":"And above all these things put on charity, which is the bond of perfectness.","43.2.44":"And all that believed were together, and had all things common;","43.2.45":"And sold their possessions and goods, and parted them to all men, as every man had need.","43.2.46":"And they, continuing daily with one accord in the temple, and breaking bread from house to house, did eat their meat with gladness and singleness of heart,","43.2.47":"Praising God, and having favour with all the people. And the Lord added to the church daily such as should be saved.","58.1.27":"Pure religion and undefiled before God and the Father is this, To visit the fatherless and widows in their affliction, and to keep himself unspotted from the world.","18.68.5":"A father of the fatherless, and a judge of the widows, is God in his holy habitation.","18.146.9":"The Lord preserveth the strangers; he relieveth the fatherless and widow: but the way of the wicked he turneth upside down.","4.10.18":"He doth execute the judgment of the fatherless and widow, and loveth the stranger, in giving him food and raiment.","22.1.17":"Learn to do well; seek judgment, relieve the oppressed, judge the fatherless, plead for the widow.","42.14.18":"I will not leave you comfortless: I will come to you.","1.22.22":"Ye shall not afflict any widow, or fatherless child.","22.46.4":"And even to your old age I am he; and even to hoar hairs will I carry you: I have made, and I will bear; even I will carry, and will deliver you.","18.92.14":"They shall still bring forth fruit in old age; they shall be fat and flourishing;","18.71.9":"Cast me not off in the time of old age; forsake me not when my strength faileth.","18.71.18":"Now also when I am old and grayheaded, O God, forsake me not; until I have shewed thy strength unto this generation, and thy power to every one that is to come.","19.16.31":"The hoary head is a crown of glory, if it be found in the way of righteousness.","2.19.32":"Thou shalt rise up before the hoary head, and honour the face of the old man, and fear thy God: I am the Lord.","17.12.12":"With the ancient is wisdom; and in length of days understanding.","46.4.16":"For which cause we faint not; but though our outward man perish, yet the inward man is renewed day by day.","53.4.12":"Let no man despise thy youth; but be thou an example of the believers, in word, in conversation, in charity, in spirit, in faith, in purity.","20.12.1":"Remember now thy Creator in the days of thy youth, while the evil days come not, nor the years draw nigh, when thou shalt say, I have no pleasure in them;","18.119.9":"Wherewithal shall a young man cleanse his way? by taking heed thereto according to thy word.","54.2.22":"Flee also youthful lusts: but follow righteousness, faith, charity, peace, with them that call on the Lord out of a pure heart.","19.20.29":"The glory of young men is their strength: and the beauty of old men is the gray head.","24.3.27":"It is good for a man that he bear the yoke in his youth.","23.1.7":"But the Lord said unto me, Say not, I am a child: for thou shalt go to all that I shall send thee, and whatsoever I command thee thou shalt speak.","20.11.9":"Rejoice, O young man, in thy youth; and let thy heart cheer thee in the days of thy youth, and walk in the ways of thine heart, and in the sight of thine eyes: but know thou, that for all these things God will bring thee into judgment.","45.7.7":"For I would that all men were even as I myself. But every man hath his proper gift of God, one after this manner, and another after that.","45.7.8":"I say therefore to the unmarried and widows, It is good for them if they abide even as I.","45.7.32":"But I would have you without carefulness. He that is unmarried careth for the things that belong to the Lord, how he may please the Lord:","45.7.33":"But he that is married careth for the things that are of the world, how he may please his wife.","45.7.34":"There is difference also between a wife and a virgin. The unmarried woman careth for the things of the Lord, that she may be holy both in body and in spirit: but she that is married careth for the things of the world, how she may please her husband.","45.7.35":"And this I speak for your own profit; not that I may cast a snare upon you, but for that which is comely, and that ye may attend upon the Lord without distraction.","39.19.12":"For there are some eunuchs, which were so born from their mother’s womb: and there are some eunuchs, which were made eunuchs of men: and there be eunuchs, which have made themselves eunuchs for the kingdom of heaven’s sake. He that is able to receive it, let him receive it.","22.54.5":"For thy Maker is thine husband; the Lord of hosts is his name; and thy Redeemer the Holy One of Israel; The God of the whole earth shall he be called.","18.68.6":"God setteth the solitary in families: he bringeth out those which are bound with chains: but the rebellious dwell in a dry land.","49.4.11":"Not that I speak in respect of want: for I have learned, in whatsoever state I am, therewith to be content.","45.6.18":"Flee fornication. Every sin that a man doeth is without the body; but he that committeth fornication sinneth against his own body.","45.6.19":"What? know ye not that your body is the temple of the Holy Ghost which is in you, which ye have of God, and ye are not your own?","45.6.20":"For ye are bought with a price: therefore glorify God in your body, and in your spirit, which are God’s.","51.4.3":"For this is the will of God, even your sanctification, that ye should abstain from fornication:","51.4.4":"That every one of you should know how to possess his vessel in sanctification and honour;","51.4.5":"Not in the lust of concupiscence, even as the Gentiles which know not God:","39.5.27":"Ye have heard that it was said by them of old time, Thou shalt not commit adultery:","39.5.28":"But I say unto you, That whosoever looketh on a woman to lust after her hath committed adultery with her already in his heart.","17.31.1":"I made a covenant with mine eyes; why then should I think upon a maid?","19.5.18":"Let thy fountain be blessed: and rejoice with the wife of thy youth.","19.5.19":"Let her be as the loving hind and pleasant roe; let her breasts satisfy thee at all times; and be thou ravished always with her love.","38.2.16":"For the Lord, the God of Israel, saith that he hateth putting away: for one covereth violence with his garment, saith the Lord of hosts: therefore take heed to your spirit, that ye deal not treacherously.","39.19.3":"The Pharisees also came unto him, tempting him, and saying unto him, Is it lawful for a man to put away his wife for every cause?","39.19.7":"They say unto him, Why did Moses then command to give a writing of divorcement, and to put her away?","39.19.8":"He saith unto them, Moses because of the hardness of your hearts suffered you to put away your wives: but from the beginning it was not so.","39.19.9":"And I say unto you, Whosoever shall put away his wife, except it be for fornication, and shall marry another, committeth adultery: and whoso marrieth her which is put away doth commit adultery.","40.10.9":"What therefore God hath joined together, let not man put asunder.","39.5.31":"It hath been said, Whosoever shall put away his wife, let him give her a writing of divorcement:","39.5.32":"But I say unto you, That whosoever shall put away his wife, saving for the cause of fornication, causeth her to commit adultery: and whosoever shall marry her that is divorced committeth adultery.","45.7.10":"And unto the married I command, yet not I, but the Lord, Let not the wife depart from her husband:","45.7.11":"But and if she depart, let her remain unmarried, or be reconciled to her husband: and let not the husband put away his wife.","21.8.6":"Set me as a seal upon thine heart, as a seal upon thine arm: for love is strong as death; jealousy is cruel as the grave: the coals thereof are coals of fire, which hath a most vehement flame.","21.8.7":"Many waters cannot quench love, neither can the floods drown it: if a man would give all the substance of his house for love, it would utterly be contemned.","21.2.16":"My beloved is mine, and I am his: he feedeth among the lilies.","45.13.8":"Charity never faileth: but whether there be prophecies, they shall fail; whether there be tongues, they shall cease; whether there be knowledge, it shall vanish away.","20.9.9":"Live joyfully with the wife whom thou lovest all the days of the life of thy vanity, which he hath given thee under the sun, all the days of thy vanity: for that is thy portion in this life, and in thy labour which thou takest under the sun.","61.4.18":"There is no fear in love; but perfect love casteth out fear: because fear hath torment. He that feareth is not made perfect in love.","49.4.6":"Be careful for nothing; but in every thing by prayer and supplication with thanksgiving let your requests be made known unto God.","49.4.7":"And the peace of God, which passeth all understanding, shall keep your hearts and minds through Christ Jesus.","59.5.7":"Casting all your care upon him; for he careth for you.","39.6.25":"Therefore I say unto you, Take no thought for your life, what ye shall eat, or what ye shall drink; nor yet for your body, what ye shall put on. Is not the life more than meat, and the body than raiment?","39.6.26":"Behold the fowls of the air: for they sow not, neither do they reap, nor gather into barns; yet your heavenly Father feedeth them. Are ye not much better than they?","39.6.27":"Which of you by taking thought can add one cubit unto his stature?","39.6.28":"And why take ye thought for raiment? Consider the lilies of the field, how they grow; they toil not, neither do they spin:","39.6.29":"And yet I say unto you, That even Solomon in all his glory was not arrayed like one of these.","39.6.30":"Wherefore, if God so clothe the grass of the field, which to day is, and to morrow is cast into the oven, shall he not much more clothe you, O ye of little faith?","39.6.31":"Therefore take no thought, saying, What shall we eat? or, What shall we drink? or, Wherewithal shall we be clothed?","39.6.32":"(For after all these things do the Gentiles seek:) for your heavenly Father knoweth that ye have need of all these things.","39.6.33":"But seek ye first the kingdom of God, and his righteousness; and all these things shall be added unto you.","39.6.34":"Take therefore no thought for the morrow: for the morrow shall take thought for the things of itself. Sufficient unto the day is the evil thereof.","18.55.22":"Cast thy burden upon the Lord, and he shall sustain thee: he shall never suffer the righteous to be moved.","42.14.27":"Peace I leave with you, my peace I give unto you: not as the world giveth, give I unto you. Let not your heart be troubled, neither let it be afraid.","22.41.10":"Fear thou not; for I am with thee: be not dismayed; for I am thy God: I will strengthen thee; yea, I will help thee; yea, I will uphold thee with the right hand of my righteousness.","18.94.19":"In the multitude of my thoughts within me thy comforts delight my soul.","19.12.25":"Heaviness in the heart of man maketh it stoop: but a good word maketh it glad.","5.1.9":"Have not I commanded thee? Be strong and of a good courage; be not afraid, neither be thou dismayed: for the Lord thy God is with thee whithersoever thou goest.","18.27.1":"The Lord is my light and my salvation; whom shall I fear? the Lord is the strength of my life; of whom shall I be afraid?","18.23.4":"Yea, though I walk through the valley of the shadow of death, I will fear no evil: for thou art with me; thy rod and thy staff they comfort me.","54.1.7":"For God hath not given us the spirit of fear; but of power, and of love, and of a sound mind.","18.56.3":"What time I am afraid, I will trust in thee.","18.56.4":"In God I will praise his word, in God I have put my trust; I will not fear what flesh can do unto me.","22.43.1":"But now thus saith the Lord that created thee, O Jacob, and he that formed thee, O Israel, Fear not: for I have redeemed thee, I have called thee by thy name; thou art mine.","22.43.2":"When thou passest through the waters, I will be with thee; and through the rivers, they shall not overflow thee: when thou walkest through the fire, thou shalt not be burned; neither shall the flame kindle upon thee.","18.46.1":"God is our refuge and strength, a very present help in trouble.","18.46.2":"Therefore will not we fear, though the earth be removed, and though the mountains be carried into the midst of the sea;","18.46.3":"Though the waters thereof roar and be troubled, though the mountains shake with the swelling thereof. Selah.","4.31.6":"Be strong and of a good courage, fear not, nor be afraid of them: for the Lord thy God, he it is that doth go with thee; he will not fail thee, nor forsake thee.","18.34.18":"The Lord is nigh unto them that are of a broken heart; and saveth such as be of a contrite spirit.","18.42.11":"Why art thou cast down, O my soul? and why art thou disquieted within me? hope thou in God: for I shall yet praise him, who is the health of my countenance, and my God.","18.147.3":"He healeth the broken in heart, and bindeth up their wounds.","39.11.28":"Come unto me, all ye that labour and are heavy laden, and I will give you rest.","39.11.29":"Take my yoke upon you, and learn of me; for I am meek and lowly in heart: and ye shall find rest unto your souls.","39.11.30":"For my yoke is easy, and my burden is light.","18.30.5":"For his anger endureth but a moment; in his favour is life: weeping may endure for a night, but joy cometh in the morning.","22.61.3":"To appoint unto them that mourn in Zion, to give unto them beauty for ashes, the oil of joy for mourning, the garment of praise for the spirit of heaviness; that they might be called trees of righteousness, the planting of the Lord, that he might be glorified.","18.40.1":"I waited patiently for the Lord; and he inclined unto me, and heard my cry.","18.40.2":"He brought me up also out of an horrible pit, out of the miry clay, and set my feet upon a rock, and established my goings.","18.40.3":"And he hath put a new song in my mouth, even praise unto our God: many shall see it, and fear, and shall trust in the Lord.","46.4.8":"We are troubled on every side, yet not distressed; we are perplexed, but not in despair;","46.4.9":"Persecuted, but not forsaken; cast down, but not destroyed;","42.16.33":"These things I have spoken unto you, that in me ye might have peace. In the world ye shall have tribulation: but be of good cheer; I have overcome the world.","4.31.8":"And the Lord, he it is that doth go before thee; he will be with thee, he will not fail thee, neither forsake thee: fear not, neither be dismayed.","57.13.5":"Let your conversation be without covetousness; and be content with such things as ye have: for he hath said, I will never leave thee, nor forsake thee.","39.28.20":"Teaching them to observe all things whatsoever I have commanded you: and, lo, I am with you alway, even unto the end of the world. Amen.","18.27.10":"When my father and my mother forsake me, then the Lord will take me up.","18.25.16":"Turn thee unto me, and have mercy upon me; for I am desolate and afflicted.","46.1.3":"Blessed be God, even the Father of our Lord Jesus Christ, the Father of mercies, and the God of all comfort;","46.1.4":"Who comforteth us in all our tribulation, that we may be able to comfort them which are in any trouble, by the comfort wherewith we ourselves are comforted of God.","39.5.4":"Blessed are they that mourn: for they shall be comforted.","22.66.13":"As one whom his mother comforteth, so will I comfort you; and ye shall be comforted in Jerusalem.","22.40.1":"Comfort ye, comfort ye my people, saith your God.","18.119.50":"This is my comfort in my affliction: for thy word hath quickened me.","42.14.16":"And I will pray the Father, and he shall give you another Comforter, that he may abide with you for ever;","42.14.17":"Even the Spirit of truth; whom the world cannot receive, because it seeth him not, neither knoweth him: but ye know him; for he dwelleth with you, and shall be in you.","42.11.25":"Jesus said unto her, I am the resurrection, and the life: he that believeth in me, though he were dead, yet shall he live:","42.11.26":"And whosoever liveth and believeth in me shall never die. Believest thou this?","51.4.13":"But I would not have you to be ignorant, brethren, concerning them which are asleep, that ye sorrow not, even as others which have no hope.","51.4.14":"For if we believe that Jesus died and rose again, even so them also which sleep in Jesus will God bring with him.","65.21.4":"And God shall wipe away all tears from their eyes; and there shall be no more death, neither sorrow, nor crying, neither shall there be any more pain: for the former things are passed away.","42.14.1":"Let not your heart be troubled: ye believe in God, believe also in me.","42.14.2":"In my Father’s house are many mansions: if it were not so, I would have told you. I go to prepare a place for you.","42.14.3":"And if I go and prepare a place for you, I will come again, and receive you unto myself; that where I am, there ye may be also.","18.116.15":"Precious in the sight of the Lord is the death of his saints.","46.5.8":"We are confident, I say, and willing rather to be absent from the body, and to be present with the Lord.","48.4.27":"Neither give place to the devil.","58.1.19":"Wherefore, my beloved brethren, let every man be swift to hear, slow to speak, slow to wrath:","58.1.20":"For the wrath of man worketh not the righteousness of God.","19.29.11":"A fool uttereth all his mind: but a wise man keepeth it in till afterwards.","19.16.32":"He that is slow to anger is better than the mighty; and he that ruleth his spirit than he that taketh a city.","20.7.9":"Be not hasty in thy spirit to be angry: for anger resteth in the bosom of fools.","50.3.8":"But now ye also put off all these; anger, wrath, malice, blasphemy, filthy communication out of your mouth.","48.4.31":"Let all bitterness, and wrath, and anger, and clamour, and evil speaking, be put away from you, with all malice:","44.8.1":"There is therefore now no condemnation to them which are in Christ Jesus, who walk not after the flesh, but after the Spirit.","61.1.9":"If we confess our sins, he is faithful and just to forgive us our sins, and to cleanse us from all unrighteousness.","18.103.12":"As far as the east is from the west, so far hath he removed our transgressions from us.","22.1.18":"Come now, and let us reason together, saith the Lord: though your sins be as scarlet, they shall be as white as snow; though they be red like crimson, they shall be as wool.","18.32.5":"I acknowledged my sin unto thee, and mine iniquity have I not hid. I said, I will confess my transgressions unto the Lord; and thou forgavest the iniquity of my sin. Selah.","32.7.18":"Who is a God like unto thee, that pardoneth iniquity, and passeth by the transgression of the remnant of his heritage? he retaineth not his anger for ever, because he delighteth in mercy.","32.7.19":"He will turn again, he will have compassion upon us; he will subdue our iniquities; and thou wilt cast all their sins into the depths of the sea.","57.10.22":"Let us draw near with a true heart in full assurance of faith, having our hearts sprinkled from an evil conscience, and our bodies washed with pure water.","46.5.17":"Therefore if any man be in Christ, he is a new creature: old things are passed away; behold, all things are become new.","22.40.29":"He giveth power to the faint; and to them that have no might he increaseth strength.","22.40.30":"Even the youths shall faint and be weary, and the young men shall utterly fall:","22.40.31":"But they that wait upon the Lord shall renew their strength; they shall mount up with wings as eagles; they shall run, and not be weary; and they shall walk, and not faint.","47.6.9":"And let us not be weary in well doing: for in due season we shall reap, if we faint not.","18.23.2":"He maketh me to lie down in green pastures: he leadeth me beside the still waters.","18.23.3":"He restoreth my soul: he leadeth me in the paths of righteousness for his name’s sake.","1.33.14":"And he said, My presence shall go with thee, and I will give thee rest.","23.31.25":
