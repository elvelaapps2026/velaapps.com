"For I have satiated the weary soul, and I have replenished every sorrowful soul.","46.12.9":"And he said unto me, My grace is sufficient for thee: for my strength is made perfect in weakness. Most gladly therefore will I rather glory in my infirmities, that the power of Christ may rest upon me.","18.127.2":"It is vain for you to rise up early, to sit up late, to eat the bread of sorrows: for so he giveth his beloved sleep.","18.42.5":"Why art thou cast down, O my soul? and why art thou disquieted in me? hope thou in God: for I shall yet praise him for the help of his countenance.","46.4.17":"For our light affliction, which is but for a moment, worketh for us a far more exceeding and eternal weight of glory;","46.4.18":"While we look not at the things which are seen, but at the things which are not seen: for the things which are seen are temporal; but the things which are not seen are eternal.","49.1.6":"Being confident of this very thing, that he which hath begun a good work in you will perform it until the day of Jesus Christ:","18.73.26":"My flesh and my heart faileth: but God is the strength of my heart, and my portion for ever.","22.26.3":"Thou wilt keep him in perfect peace, whose mind is stayed on thee: because he trusteth in thee.","44.5.1":"Therefore being justified by faith, we have peace with God through our Lord Jesus Christ:","50.3.15":"And let the peace of God rule in your hearts, to the which also ye are called in one body; and be ye thankful.","18.4.8":"I will both lay me down in peace, and sleep: for thou, Lord, only makest me dwell in safety.","18.29.11":"The Lord will give strength unto his people; the Lord will bless his people with peace.","3.6.24":"The Lord bless thee, and keep thee:","3.6.25":"The Lord make his face shine upon thee, and be gracious unto thee:","3.6.26":"The Lord lift up his countenance upon thee, and give thee peace.","15.8.10":"Then he said unto them, Go your way, eat the fat, and drink the sweet, and send portions unto them for whom nothing is prepared: for this day is holy unto our Lord: neither be ye sorry; for the joy of the Lord is your strength.","49.4.4":"Rejoice in the Lord alway: and again I say, Rejoice.","18.16.11":"Thou wilt shew me the path of life: in thy presence is fulness of joy; at thy right hand there are pleasures for evermore.","42.15.11":"These things have I spoken unto you, that my joy might remain in you, and that your joy might be full.","44.15.13":"Now the God of hope fill you with all joy and peace in believing, that ye may abound in hope, through the power of the Holy Ghost.","18.118.24":"This is the day which the Lord hath made; we will rejoice and be glad in it.","18.30.11":"Thou hast turned for me my mourning into dancing: thou hast put off my sackcloth, and girded me with gladness;","58.1.2":"My brethren, count it all joy when ye fall into divers temptations;","58.1.3":"Knowing this, that the trying of your faith worketh patience.","51.5.16":"Rejoice evermore.","51.5.17":"Pray without ceasing.","51.5.18":"In every thing give thanks: for this is the will of God in Christ Jesus concerning you.","23.29.11":"For I know the thoughts that I think toward you, saith the Lord, thoughts of peace, and not of evil, to give you an expected end.","24.3.22":"It is of the Lord’s mercies that we are not consumed, because his compassions fail not.","24.3.23":"They are new every morning: great is thy faithfulness.","24.3.24":"The Lord is my portion, saith my soul; therefore will I hope in him.","44.8.28":"And we know that all things work together for good to them that love God, to them who are the called according to his purpose.","57.6.19":"Which hope we have as an anchor of the soul, both sure and stedfast, and which entereth into that within the veil;","44.5.3":"And not only so, but we glory in tribulations also: knowing that tribulation worketh patience;","44.5.4":"And patience, experience; and experience, hope:","44.5.5":"And hope maketh not ashamed; because the love of God is shed abroad in our hearts by the Holy Ghost which is given unto us.","59.1.3":"Blessed be the God and Father of our Lord Jesus Christ, which according to his abundant mercy hath begotten us again unto a lively hope by the resurrection of Jesus Christ from the dead,","18.139.13":"For thou hast possessed my reins: thou hast covered me in my mother’s womb.","18.139.14":"I will praise thee; for I am fearfully and wonderfully made: marvellous are thy works; and that my soul knoweth right well.","0.1.27":"So God created man in his own image, in the image of God created he him; male and female created he them.","48.2.10":"For we are his workmanship, created in Christ Jesus unto good works, which God hath before ordained that we should walk in them.","59.2.9":"But ye are a chosen generation, a royal priesthood, an holy nation, a peculiar people; that ye should shew forth the praises of him who hath called you out of darkness into his marvellous light:","42.1.12":"But as many as received him, to them gave he power to become the sons of God, even to them that believe on his name:","23.1.5":"Before I formed thee in the belly I knew thee; and before thou camest forth out of the womb I sanctified thee, and I ordained thee a prophet unto the nations.","44.8.37":"Nay, in all these things we are more than conquerors through him that loved us.","47.2.20":"I am crucified with Christ: nevertheless I live; yet not I, but Christ liveth in me: and the life which I now live in the flesh I live by the faith of the Son of God, who loved me, and gave himself for me.","19.14.30":"A sound heart is the life of the flesh: but envy the rottenness of the bones.","58.3.14":"But if ye have bitter envying and strife in your hearts, glory not, and lie not against the truth.","58.3.15":"This wisdom descendeth not from above, but is earthly, sensual, devilish.","58.3.16":"For where envying and strife is, there is confusion and every evil work.","47.5.26":"Let us not be desirous of vain glory, provoking one another, envying one another.","1.20.17":"Thou shalt not covet thy neighbour’s house, thou shalt not covet thy neighbour’s wife, nor his manservant, nor his maidservant, nor his ox, nor his ass, nor any thing that is thy neighbour’s.","18.37.1":"Fret not thyself because of evildoers, neither be thou envious against the workers of iniquity.","18.37.2":"For they shall soon be cut down like the grass, and wither as the green herb.","19.23.17":"Let not thine heart envy sinners: but be thou in the fear of the Lord all the day long.","45.10.13":"There hath no temptation taken you but such as is common to man: but God is faithful, who will not suffer you to be tempted above that ye are able; but will with the temptation also make a way to escape, that ye may be able to bear it.","58.1.12":"Blessed is the man that endureth temptation: for when he is tried, he shall receive the crown of life, which the Lord hath promised to them that love him.","58.1.13":"Let no man say when he is tempted, I am tempted of God: for God cannot be tempted with evil, neither tempteth he any man:","58.1.14":"But every man is tempted, when he is drawn away of his own lust, and enticed.","58.1.15":"Then when lust hath conceived, it bringeth forth sin: and sin, when it is finished, bringeth forth death.","39.26.41":"Watch and pray, that ye enter not into temptation: the spirit indeed is willing, but the flesh is weak.","57.2.18":"For in that he himself hath suffered being tempted, he is able to succour them that are tempted.","57.4.15":"For we have not an high priest which cannot be touched with the feeling of our infirmities; but was in all points tempted like as we are, yet without sin.","57.4.16":"Let us therefore come boldly unto the throne of grace, that we may obtain mercy, and find grace to help in time of need.","58.4.7":"Submit yourselves therefore to God. Resist the devil, and he will flee from you.","18.119.11":"Thy word have I hid in mine heart, that I might not sin against thee.","39.6.13":"And lead us not into temptation, but deliver us from evil: For thine is the kingdom, and the power, and the glory, for ever. Amen.","42.8.36":"If the Son therefore shall make you free, ye shall be free indeed.","45.6.12":"All things are lawful unto me, but all things are not expedient: all things are lawful for me, but I will not be brought under the power of any.","44.6.12":"Let not sin therefore reign in your mortal body, that ye should obey it in the lusts thereof.","44.6.13":"Neither yield ye your members as instruments of unrighteousness unto sin: but yield yourselves unto God, as those that are alive from the dead, and your members as instruments of righteousness unto God.","44.6.14":"For sin shall not have dominion over you: for ye are not under the law, but under grace.","47.5.1":"Stand fast therefore in the liberty wherewith Christ hath made us free, and be not entangled again with the yoke of bondage.","19.20.1":"Wine is a mocker, strong drink is raging: and whosoever is deceived thereby is not wise.","48.5.18":"And be not drunk with wine, wherein is excess; but be filled with the Spirit;","60.2.19":"While they promise them liberty, they themselves are the servants of corruption: for of whom a man is overcome, of the same is he brought in bondage.","55.2.11":"For the grace of God that bringeth salvation hath appeared to all men,","55.2.12":"Teaching us that, denying ungodliness and worldly lusts, we should live soberly, righteously, and godly, in this present world;","19.16.18":"Pride goeth before destruction, and an haughty spirit before a fall.","58.4.6":"But he giveth more grace. Wherefore he saith, God resisteth the proud, but giveth grace unto the humble.","59.5.5":"Likewise, ye younger, submit yourselves unto the elder. Yea, all of you be subject one to another, and be clothed with humility: for God resisteth the proud, and giveth grace to the humble.","59.5.6":"Humble yourselves therefore under the mighty hand of God, that he may exalt you in due time:","49.2.3":"Let nothing be done through strife or vainglory; but in lowliness of mind let each esteem other better than themselves.","49.2.4":"Look not every man on his own things, but every man also on the things of others.","49.2.5":"Let this mind be in you, which was also in Christ Jesus:","49.2.6":"Who, being in the form of God, thought it not robbery to be equal with God:","49.2.7":"But made himself of no reputation, and took upon him the form of a servant, and was made in the likeness of men:","49.2.8":"And being found in fashion as a man, he humbled himself, and became obedient unto death, even the death of the cross.","32.6.8":"He hath shewed thee, O man, what is good; and what doth the Lord require of thee, but to do justly, and to love mercy, and to walk humbly with thy God?","19.11.2":"When pride cometh, then cometh shame: but with the lowly is wisdom.","39.23.12":"And whosoever shall exalt himself shall be abased; and he that shall humble himself shall be exalted.","41.14.11":"For whosoever exalteth himself shall be abased; and he that humbleth himself shall be exalted.","44.8.18":"For I reckon that the sufferings of this present time are not worthy to be compared with the glory which shall be revealed in us.","58.1.4":"But let patience have her perfect work, that ye may be perfect and entire, wanting nothing.","59.4.12":"Beloved, think it not strange concerning the fiery trial which is to try you, as though some strange thing happened unto you:","59.4.13":"But rejoice, inasmuch as ye are partakers of Christ’s sufferings; that, when his glory shall be revealed, ye may be glad also with exceeding joy.","18.34.19":"Many are the afflictions of the righteous: but the Lord delivereth him out of them all.","59.5.10":"But the God of all grace, who hath called us unto his eternal glory by Christ Jesus, after that ye have suffered a while, make you perfect, stablish, strengthen, settle you.","23.17.14":"Heal me, O Lord, and I shall be healed; save me, and I shall be saved: for thou art my praise.","58.5.14":"Is any sick among you? let him call for the elders of the church; and let them pray over him, anointing him with oil in the name of the Lord:","58.5.15":"And the prayer of faith shall save the sick, and the Lord shall raise him up; and if he have committed sins, they shall be forgiven him.","58.5.16":"Confess your faults one to another, and pray one for another, that ye may be healed. The effectual fervent prayer of a righteous man availeth much.","18.103.2":"Bless the Lord, O my soul, and forget not all his benefits:","18.103.3":"Who forgiveth all thine iniquities; who healeth all thy diseases;","22.53.5":"But he was wounded for our transgressions, he was bruised for our iniquities: the chastisement of our peace was upon him; and with his stripes we are healed.","1.15.26":"And said, If thou wilt diligently hearken to the voice of the Lord thy God, and wilt do that which is right in his sight, and wilt give ear to his commandments, and keep all his statutes, I will put none of these diseases upon thee, which I have brought upon the Egyptians: for I am the Lord that healeth thee.","18.41.3":"The Lord will strengthen him upon the bed of languishing: thou wilt make all his bed in his sickness.","39.8.16":"When the even was come, they brought unto him many that were possessed with devils: and he cast out the spirits with his word, and healed all that were sick:","39.8.17":"That it might be fulfilled which was spoken by Esaias the prophet, saying, Himself took our infirmities, and bare our sicknesses.","63.1.2":"Beloved, I wish above all things that thou mayest prosper and be in health, even as thy soul prospereth.","40.9.23":"Jesus said unto him, If thou canst believe, all things are possible to him that believeth.","40.9.24":"And straightway the father of the child cried out, and said with tears, Lord, I believe; help thou mine unbelief.","58.1.5":"If any of you lack wisdom, let him ask of God, that giveth to all men liberally, and upbraideth not; and it shall be given him.","58.1.6":"But let him ask in faith, nothing wavering. For he that wavereth is like a wave of the sea driven with the wind and tossed.","42.20.27":"Then saith he to Thomas, Reach hither thy finger, and behold my hands; and reach hither thy hand, and thrust it into my side: and be not faithless, but believing.","42.20.28":"And Thomas answered and said unto him, My Lord and my God.","42.20.29":"Jesus saith unto him, Thomas, because thou hast seen me, thou hast believed: blessed are they that have not seen, and yet have believed.","39.14.31":"And immediately Jesus stretched forth his hand, and caught him, and said unto him, O thou of little faith, wherefore didst thou doubt?","57.11.6":"But without faith it is impossible to please him: for he that cometh to God must believe that he is, and that he is a rewarder of them that diligently seek him.","19.3.5":"Trust in the Lord with all thine heart; and lean not unto thine own understanding.","19.3.6":"In all thy ways acknowledge him, and he shall direct thy paths.","18.32.8":"I will instruct thee and teach thee in the way which thou shalt go: I will guide thee with mine eye.","18.119.105":"Thy word is a lamp unto my feet, and a light unto my path.","22.30.21":"And thine ears shall hear a word behind thee, saying, This is the way, walk ye in it, when ye turn to the right hand, and when ye turn to the left.","19.16.9":"A man’s heart deviseth his way: but the Lord directeth his steps.","19.11.14":"Where no counsel is, the people fall: but in the multitude of counsellors there is safety.","23.33.3":"Call unto me, and I will answer thee, and shew thee great and mighty things, which thou knowest not.","18.37.23":"The steps of a good man are ordered by the Lord: and he delighteth in his way.","18.27.14":"Wait on the Lord: be of good courage, and he shall strengthen thine heart: wait, I say, on the Lord.","24.3.25":"The Lord is good unto them that wait for him, to the soul that seeketh him.","24.3.26":"It is good that a man should both hope and quietly wait for the salvation of the Lord.","58.5.7":"Be patient therefore, brethren, unto the coming of the Lord. Behold, the husbandman waiteth for the precious fruit of the earth, and hath long patience for it, until he receive the early and latter rain.","58.5.8":"Be ye also patient; stablish your hearts: for the coming of the Lord draweth nigh.","44.12.12":"Rejoicing in hope; patient in tribulation; continuing instant in prayer;","18.37.7":"Rest in the Lord, and wait patiently for him: fret not thyself because of him who prospereth in his way, because of the man who bringeth wicked devices to pass.","20.3.1":"To every thing there is a season, and a time to every purpose under the heaven:","34.2.3":"For the vision is yet for an appointed time, but at the end it shall speak, and not lie: though it tarry, wait for it; because it will surely come, it will not tarry.","49.4.8":"Finally, brethren, whatsoever things are true, whatsoever things are honest, whatsoever things are just, whatsoever things are pure, whatsoever things are lovely, whatsoever things are of good report; if there be any virtue, and if there be any praise, think on these things.","44.12.2":"And be not conformed to this world: but be ye transformed by the renewing of your mind, that ye may prove what is that good, and acceptable, and perfect, will of God.","46.10.5":"Casting down imaginations, and every high thing that exalteth itself against the knowledge of God, and bringing into captivity every thought to the obedience of Christ;","50.3.2":"Set your affection on things above, not on things on the earth.","19.4.23":"Keep thy heart with all diligence; for out of it are the issues of life.","18.19.14":"Let the words of my mouth, and the meditation of my heart, be acceptable in thy sight, O Lord, my strength, and my redeemer.","18.51.10":"Create in me a clean heart, O God; and renew a right spirit within me.","23.17.9":"The heart is deceitful above all things, and desperately wicked: who can know it?","23.17.10":"I the Lord search the heart, I try the reins, even to give every man according to his ways, and according to the fruit of his doings.","25.36.26":"A new heart also will I give you, and a new spirit will I put within you: and I will take away the stony heart out of your flesh, and I will give you an heart of flesh.","39.5.8":"Blessed are the pure in heart: for they shall see God.","8.16.7":"But the Lord said unto Samuel, Look not on his countenance, or on the height of his stature; because I have refused him: for the Lord seeth not as man seeth; for man looketh on the outward appearance, but the Lord looketh on the heart.","18.37.4":"Delight thyself also in the Lord; and he shall give thee the desires of thine heart.","39.15.18":"But those things which proceed out of the mouth come forth from the heart; and they defile the man.","39.15.19":"For out of the heart proceed evil thoughts, murders, adulteries, fornications, thefts, false witness, blasphemies:","18.139.23":"Search me, O God, and know my heart: try me, and know my thoughts:","18.139.24":"And see if there be any wicked way in me, and lead me in the way everlasting.","28.2.25":"And I will restore to you the years that the locust hath eaten, the cankerworm, and the caterpiller, and the palmerworm, my great army which I sent among you.","23.30.17":"For I will restore health unto thee, and I will heal thee of thy wounds, saith the Lord; because they called thee an Outcast, saying, This is Zion, whom no man seeketh after.","18.51.12":"Restore unto me the joy of thy salvation; and uphold me with thy free spirit.","42.21.15":"So when they had dined, Jesus saith to Simon Peter, Simon, son of Jonas, lovest thou me more than these? He saith unto him, Yea, Lord; thou knowest that I love thee. He saith unto him, Feed my lambs.","42.21.16":"He saith to him again the second time, Simon, son of Jonas, lovest thou me? He saith unto him, Yea, Lord; thou knowest that I love thee. He saith unto him, Feed my sheep.","42.21.17":"He saith unto him the third time, Simon, son of Jonas, lovest thou me? Peter was grieved because he said unto him the third time, Lovest thou me? And he said unto him, Lord, thou knowest all things; thou knowest that I love thee. Jesus saith unto him, Feed my sheep.","42.3.16":"For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life.","44.3.23":"For all have sinned, and come short of the glory of God;","44.6.23":"For the wages of sin is death; but the gift of God is eternal life through Jesus Christ our Lord.","44.5.8":"But God commendeth his love toward us, in that, while we were yet sinners, Christ died for us.","44.10.9":"That if thou shalt confess with thy mouth the Lord Jesus, and shalt believe in thine heart that God hath raised him from the dead, thou shalt be saved.","44.10.10":"For with the heart man believeth unto righteousness; and with the mouth confession is made unto salvation.","48.2.8":"For by grace are ye saved through faith; and that not of yourselves: it is the gift of God:","48.2.9":"Not of works, lest any man should boast.","43.4.12":"Neither is there salvation in any other: for there is none other name under heaven given among men, whereby we must be saved.","42.14.6":"Jesus saith unto him, I am the way, the truth, and the life: no man cometh unto the Father, but by me.","55.3.5":"Not by works of righteousness which we have done, but according to his mercy he saved us, by the washing of regeneration, and renewing of the Holy Ghost;","61.5.11":"And this is the record, that God hath given to us eternal life, and this life is in his Son.","61.5.12":"He that hath the Son hath life; and he that hath not the Son of God hath not life.","61.5.13":"These things have I written unto you that believe on the name of the Son of God; that ye may know that ye have eternal life, and that ye may believe on the name of the Son of God.","44.8.38":"For I am persuaded, that neither death, nor life, nor angels, nor principalities, nor powers, nor things present, nor things to come,","44.8.39":"Nor height, nor depth, nor any other creature, shall be able to separate us from the love of God, which is in Christ Jesus our Lord.","61.4.9":"In this was manifested the love of God toward us, because that God sent his only begotten Son into the world, that we might live through him.","61.4.10":"Herein is love, not that we loved God, but that he loved us, and sent his Son to be the propitiation for our sins.","61.3.1":"Behold, what manner of love the Father hath bestowed upon us, that we should be called the sons of God: therefore the world knoweth us not, because it knew him not.","23.31.3":"The Lord hath appeared of old unto me, saying, Yea, I have loved thee with an everlasting love: therefore with lovingkindness have I drawn thee.","35.3.17":"The Lord thy God in the midst of thee is mighty; he will save, he will rejoice over thee with joy; he will rest in his love, he will joy over thee with singing.","48.3.17":"That Christ may dwell in your hearts by faith; that ye, being rooted and grounded in love,","48.3.18":"May be able to comprehend with all saints what is the breadth, and length, and depth, and height;","48.3.19":"And to know the love of Christ, which passeth knowledge, that ye might be filled with all the fulness of God.","18.103.10":"He hath not dealt with us after our sins; nor rewarded us according to our iniquities.","18.103.11":"For as the heaven is high above the earth, so great is his mercy toward them that fear him.","22.43.25":"I, even I, am he that blotteth out thy transgressions for mine own sake, and will not remember thy sins.","48.1.7":"In whom we have redemption through his blood, the forgiveness of sins, according to the riches of his grace;","43.3.19":"Repent ye therefore, and be converted, that your sins may be blotted out, when the times of refreshing shall come from the presence of the Lord;","18.32.1":"Blessed is he whose transgression is forgiven, whose sin is covered.","18.32.2":"Blessed is the man unto whom the Lord imputeth not iniquity, and in whose spirit there is no guile.","50.1.13":"Who hath delivered us from the power of darkness, and hath translated us into the kingdom of his dear Son:","50.1.14":"In whom we have redemption through his blood, even the forgiveness of sins:","44.3.24":"Being justified freely by his grace through the redemption that is in Christ Jesus:","42.1.16":"And of his fulness have all we received, and grace for grace.","42.1.17":"For the law was given by Moses, but grace and truth came by Jesus Christ.","44.5.20":"Moreover the law entered, that the offence might abound. But where sin abounded, grace did much more abound:","54.1.9":"Who hath saved us, and called us with an holy calling, not according to our works, but according to his own purpose and grace, which was given us in Christ Jesus before the world began,","13.7.14":"If my people, which are called by my name, shall humble themselves, and pray, and seek my face, and turn from their wicked ways; then will I hear from heaven, and will forgive their sin, and will heal their land.","41.15.7":"I say unto you, that likewise joy shall be in heaven over one sinner that repenteth, more than over ninety and nine just persons, which need no repentance.","22.55.7":"Let the wicked forsake his way, and the unrighteous man his thoughts: and let him return unto the Lord, and he will have mercy upon him; and to our God, for he will abundantly pardon.","18.51.11":"Cast me not away from thy presence; and take not thy holy spirit from me.","46.7.10":"For godly sorrow worketh repentance to salvation not to be repented of: but the sorrow of the world worketh death.","43.2.38":"Then Peter said unto them, Repent, and be baptized every one of you in the name of Jesus Christ for the remission of sins, and ye shall receive the gift of the Holy Ghost.","41.15.18":"I will arise and go to my father, and will say unto him, Father, I have sinned against heaven, and before thee,","41.15.19":"And am no more worthy to be called thy son: make me as one of thy hired servants.","41.15.20":"And he arose, and came to his father. But when he was yet a great way off, his father saw him, and had compassion, and ran, and fell on his neck, and kissed him.","41.15.21":"And the son said unto him, Father, I have sinned against heaven, and in thy sight, and am no more worthy to be called thy son.","41.15.22":"But the father said to his servants, Bring forth the best robe, and put it on him; and put a ring on his hand, and shoes on his feet:","41.15.23":"And bring hither the fatted calf, and kill it; and let us eat, and be merry:","41.15.24":"For this my son was dead, and is alive again; he was lost, and is found. And they began to be merry.","42.3.3":"Jesus answered and said unto him, Verily, verily, I say unto thee, Except a man be born again, he cannot see the kingdom of God.","42.3.4":"Nicodemus saith unto him, How can a man be born when he is old? can he enter the second time into his mother’s womb, and be born?","42.3.5":"Jesus answered, Verily, verily, I say unto thee, Except a man be born of water and of the Spirit, he cannot enter into the kingdom of God.","42.3.6":"That which is born of the flesh is flesh; and that which is born of the Spirit is spirit.","42.3.7":"Marvel not that I said unto thee, Ye must be born again.","42.1.13":"Which were born, not of blood, nor of the will of the flesh, nor of the will of man, but of God.","59.1.23":"Being born again, not of corruptible seed, but of incorruptible, by the word of God, which liveth and abideth for ever.","44.6.4":"Therefore we are buried with him by baptism into death: that like as Christ was raised up from the dead by the glory of the Father, even so we also should walk in newness of life.","42.10.28":"And I give unto them eternal life; and they shall never perish, neither shall any man pluck them out of my hand.","42.10.29":"My Father, which gave them me, is greater than all; and no man is able to pluck them out of my Father’s hand.","42.5.24":"Verily, verily, I say unto you, He that heareth my word, and believeth on him that sent me, hath everlasting life, and shall not come into condemnation; but is passed from death unto life.","48.1.13":"In whom ye also trusted, after that ye heard the word of truth, the gospel of your salvation: in whom also after that ye believed, ye were sealed with that holy Spirit of promise,","48.1.14":"Which is the earnest of our inheritance until the redemption of the purchased possession, unto the praise of his glory.","64.1.24":"Now unto him that is able to keep you from falling, and to present you faultless before the presence of his glory with exceeding joy,","22.59.2":"But your iniquities have separated between you and your God, and your sins have hid his face from you, that he will not hear.","61.1.8":"If we say that we have no sin, we deceive ourselves, and the truth is not in us.","58.4.17":"Therefore to him that knoweth to do good, and doeth it not, to him it is sin.","47.6.7":"Be not deceived; God is not mocked: for whatsoever a man soweth, that shall he also reap.","47.6.8":"For he that soweth to his flesh shall of the flesh reap corruption; but he that soweth to the Spirit shall of the Spirit reap life everlasting.","18.51.1":"Have mercy upon me, O God, according to thy lovingkindness: according unto the multitude of thy tender mercies blot out my transgressions.","18.51.2":"Wash me throughly from mine iniquity, and cleanse me from my sin.","18.51.3":"For I acknowledge my transgressions: and my sin is ever before me.","18.51.4":"Against thee, thee only, have I sinned, and done this evil in thy sight: that thou mightest be justified when thou speakest, and be clear when thou judgest.","42.8.32":"And ye shall know the truth, and the truth shall make you free.","47.5.13":"For, brethren, ye have been called unto liberty; only use not liberty for an occasion to the flesh, but by love serve one another.","46.3.17":"Now the Lord is that Spirit: and where the Spirit of the Lord is, there is liberty.","44.8.2":"For the law of the Spirit of life in Christ Jesus hath made me free from the law of sin and death.","41.4.18":"The Spirit of the Lord is upon me, because he hath anointed me to preach the gospel to the poor; he hath sent me to heal the brokenhearted, to preach deliverance to the captives, and recovering of sight to the blind, to set at liberty them that are bruised,","42.10.27":"My sheep hear my voice, and I know them, and they follow me:","65.21.1":"And I saw a new heaven and a new earth: for the first heaven and the first earth were passed away; and there was no more sea.","65.21.2":"And I John saw the holy city, new Jerusalem, coming down from God out of heaven, prepared as a bride adorned for her husband.","65.21.3":"And I heard a great voice out of heaven saying, Behold, the tabernacle of God is with men, and he will dwell with them, and they shall be his people, and God himself shall be with them, and be their God.","45.2.9":"But as it is written, Eye hath not seen, nor ear heard, neither have entered into the heart of man, the things which God hath prepared for them that love him.","49.3.20":"For our conversation is in heaven; from whence also we look for the Saviour, the Lord Jesus Christ:","49.3.21":"Who shall change our vile body, that it may be fashioned like unto his glorious body, according to the working whereby he is able even to subdue all things unto himself.","46.5.1":"For we know that if our earthly house of this tabernacle were dissolved, we have a building of God, an house not made with hands, eternal in the heavens.","4.7.9":"Know therefore that the Lord thy God, he is God, the faithful God, which keepeth covenant and mercy with them that love him and keep his commandments to a thousand generations;","54.2.13":"If we believe not, yet he abideth faithful: he cannot deny himself.","45.1.9":"God is faithful, by whom ye were called unto the fellowship of his Son Jesus Christ our Lord.","57.10.23":"Let us hold fast the profession of our faith without wavering; (for he is faithful that promised;)","51.5.24":"Faithful is he that calleth you, who also will do it.","3.23.19":"God is not a man, that he should lie; neither the son of man, that he should repent: hath he said, and shall he not do it? or hath he spoken, and shall he not make it good?","18.36.5":"Thy mercy, O Lord, is in the heavens; and thy faithfulness reacheth unto the clouds.","18.89.1":"I will sing of the mercies of the Lord for ever: with my mouth will I make known thy faithfulness to all generations.","23.32.17":"Ah Lord God! behold, thou hast made the heaven and the earth by thy great power and stretched out arm, and there is nothing too hard for thee:","41.1.37":"For with God nothing shall be impossible.","39.19.26":"But Jesus beheld them, and said unto them, With men this is impossible; but with God all things are possible.","48.3.20":"Now unto him that is able to do exceeding abundantly above all that we ask or think, according to the power that worketh in us,","18.147.5":"Great is our Lord, and of great power: his understanding is infinite.","22.40.28":"Hast thou not known? hast thou not heard, that the everlasting God, the Lord, the Creator of the ends of the earth, fainteth not, neither is weary? there is no searching of his understanding.","18.145.3":"Great is the Lord, and greatly to be praised; and his greatness is unsearchable.","44.11.33":"O the depth of the riches both of the wisdom and knowledge of God! how unsearchable are his judgments, and his ways past finding out!","19.19.21":"There are many devices in a man’s heart; nevertheless the counsel of the Lord, that shall stand.","22.55.8":"For my thoughts are not your thoughts, neither are your ways my ways, saith the Lord.","22.55.9":"For as the heavens are higher than the earth, so are my ways higher than your ways, and my thoughts than your thoughts.","22.46.10":"Declaring the end from the beginning, and from ancient times the things that are not yet done, saying, My counsel shall stand, and I will do all my pleasure:","26.2.21":"And he changeth the times and the seasons: he removeth kings, and setteth up kings: he giveth wisdom unto the wise, and knowledge to them that know understanding:","18.115.3":"But our God is in the heavens: he hath done whatsoever he hath pleased.","48.1.11":"In whom also we have obtained an inheritance, being predestinated according to the purpose of him who worketh all things after the counsel of his own will:","42.14.26":"But the Comforter, which is the Holy Ghost, whom the Father will send in my name, he shall teach you all things, and bring all things to your remembrance, whatsoever I have said unto you.","42.16.13":"Howbeit when he, the Spirit of truth, is come, he will guide you into all truth: for he shall not speak of himself; but whatsoever he shall hear, that shall he speak: and he will shew you things to come.","43.1.8":"But ye shall receive power, after that the Holy Ghost is come upon you: and ye shall be witnesses unto me both in Jerusalem, and in all Judea, and in Samaria, and unto the uttermost part of the earth.","44.8.26":"Likewise the Spirit also helpeth our infirmities: for we know not what we should pray for as we ought: but the Spirit itself maketh intercession for us with groanings which cannot be uttered.","47.5.22":"But the fruit of the Spirit is love, joy, peace, longsuffering, gentleness, goodness, faith,","47.5.23":"Meekness, temperance: against such there is no law.","43.1.11":"Which also said, Ye men of Galilee, why stand ye gazing up into heaven? this same Jesus, which is taken up from you into heaven, shall so come in like manner as ye have seen him go into heaven.","51.4.16":"For the Lord himself shall descend from heaven with a shout, with the voice of the archangel, and with the trump of God: and the dead in Christ shall rise first:","51.4.17":"Then we which are alive and remain shall be caught up together with them in the clouds, to meet the Lord in the air: and so shall we ever be with the Lord.","39.24.36":"But of that day and hour knoweth no man, no, not the angels of heaven, but my Father only.","39.24.44":"Therefore be ye also ready: for in such an hour as ye think not the Son of man cometh.","55.2.13":"Looking for that blessed hope, and the glorious appearing of the great God and our Saviour Jesus Christ;","60.3.9":"The Lord is not slack concerning his promise, as some men count slackness; but is longsuffering to us-ward, not willing that any should perish, but that all should come to repentance.","60.3.10":"But the day of the Lord will come as a thief in the night; in the which the heavens shall pass away with a great noise, and the elements shall melt with fervent heat, the earth also and the works that are therein shall be burned up.","65.1.7":"Behold, he cometh with clouds; and every eye shall see him, and they also which pierced him: and all kindreds of the earth shall wail because of him. Even so, Amen.","65.22.12":"And, behold, I come quickly; and my reward is with me, to give every man according as his work shall be.","0.1.1":"In the beginning God created the heaven and the earth.","18.19.1":"The heavens declare the glory of God; and the firmament sheweth his handywork.","18.24.1":"The earth is the Lord’s, and the fulness thereof; the world, and they that dwell therein.","42.1.3":"All things were made by him; and without him was not any thing made that was made.","50.1.16":"For by him were all things created, that are in heaven, and that are in earth, visible and invisible, whether they be thrones, or dominions, or principalities, or powers: all things were created by him, and for him:","44.1.20":"For the invisible things of him from the creation of the world are clearly seen, being understood by the things that are made, even his eternal power and Godhead; so that they are without excuse:","57.11.3":"Through faith we understand that the worlds were framed by the word of God, so that things which are seen were not made of things which do appear.","22.40.26":"Lift up your eyes on high, and behold who hath created these things, that bringeth out their host by number: he calleth them all by names by the greatness of his might, for that he is strong in power; not one faileth.","18.91.11":"For he shall give his angels charge over thee, to keep thee in all thy ways.","18.91.12":"They shall bear thee up in their hands, lest thou dash thy foot against a stone.","18.34.7":"The angel of the Lord encampeth round about them that fear him, and delivereth them.","57.1.14":"Are they not all ministering spirits, sent forth to minister for them who shall be heirs of salvation?","57.13.2":"Be not forgetful to entertain strangers: for thereby some have entertained angels unawares.","39.18.10":"Take heed that ye despise not one of these little ones; for I say unto you, That in heaven their angels do always behold the face of my Father which is in heaven.","41.15.10":"Likewise, I say unto you, there is joy in the presence of the angels of God over one sinner that repenteth.","1.23.20":"Behold, I send an Angel before thee, to keep thee in the way, and to bring thee into the place which I have prepared.","42.1.1":"In the beginning was the Word, and the Word was with God, and the Word was God.","42.1.14":"And the Word was made flesh, and dwelt among us, (and we beheld his glory, the glory as of the only begotten of the Father,) full of grace and truth.","39.16.15":"He saith unto them, But whom say ye that I am?","39.16.16":"And Simon Peter answered and said, Thou art the Christ, the Son of the living God.","42.10.30":"I and my Father are one.","50.1.15":"Who is the image of the invisible God, the firstborn of every creature:","50.1.17":"And he is before all things, and by him all things consist.","49.2.9":"Wherefore God also hath highly exalted him, and given him a name which is above every name:","49.2.10":"That at the name of Jesus every knee should bow, of things in heaven, and things in earth, and things under the earth;","49.2.11":"And that every tongue should confess that Jesus Christ is Lord, to the glory of God the Father.","57.1.3":"Who being the brightness of his glory, and the express image of his person, and upholding all things by the word of his power, when he had by himself purged our sins, sat down on the right hand of the Majesty on high;","22.9.6":"For unto us a child is born, unto us a son is given: and the government shall be upon his shoulder: and his name shall be called Wonderful, Counsellor, The mighty God, The everlasting Father, The Prince of Peace.","42.6.35":"And Jesus said unto them, I am the bread of life: he that cometh to me shall never hunger; and he that believeth on me shall never thirst.","42.8.12":"Then spake Jesus again unto them, saying, I am the light of the world: he that followeth me shall not walk in darkness, but shall have the light of life.","42.10.9":"I am the door: by me if any man enter in, he shall be saved, and shall go in and out, and find pasture.","42.10.11":"I am the good shepherd: the good shepherd giveth his life for the sheep.","42.15.5":"I am the vine, ye are the branches: He that abideth in me, and I in him, the same bringeth forth much fruit: for without me ye can do nothing.","42.8.58":"Jesus said unto them, Verily, verily, I say unto you, Before Abraham was, I am.","22.7.14":"Therefore the Lord himself shall give you a sign; Behold, a virgin shall conceive, and bear a son, and shall call his name Immanuel.","32.5.2":"But thou, Beth–lehem Ephratah, though thou be little among the thousands of Judah, yet out of thee shall he come forth unto me that is to be ruler in Israel; whose goings forth have been from of old, from everlasting.","39.1.21":"And she shall bring forth a son, and thou shalt call his name JESUS: for he shall save his people from their sins.","39.1.22":"Now all this was done, that it might be fulfilled which was spoken of the Lord by the prophet, saying,","39.1.23":"Behold, a virgin shall be with child, and shall bring forth a son, and they shall call his name Emmanuel, which being interpreted is, God with us.","41.2.7":"And she brought forth her firstborn son, and wrapped him in swaddling clothes, and laid him in a manger; because there was no room for them in the inn.","41.2.10":"And the angel said unto them, Fear not: for, behold, I bring you good tidings of great joy, which shall be to all people.","41.2.11":"For unto you is born this day in the city of David a Saviour, which is Christ the Lord.","47.4.4":"But when the fulness of the time was come, God sent forth his Son, made of a woman, made under the law,","47.4.5":"To redeem them that were under the law, that we might receive the adoption of sons.","22.53.6":"All we like sheep have gone astray; we have turned every one to his own way; and the Lord hath laid on him the iniquity of us all.","59.2.24":"Who his own self bare our sins in his own body on the tree, that we, being dead to sins, should live unto righteousness: by whose stripes ye were healed.","46.5.21":"For he hath made him to be sin for us, who knew no sin; that we might be made the righteousness of God in him.","40.10.45":"For even the Son of man came not to be ministered unto, but to minister, and to give his life a ransom for many.","45.15.3":"For I delivered unto you first of all that which I also received, how that Christ died for our sins according to the scriptures;","42.19.30":"When Jesus therefore had received the vinegar, he said, It is finished: and he bowed his head, and gave up the ghost.","39.28.5":"And the angel answered and said unto the women, Fear not ye: for I know that ye seek Jesus, which was crucified.","39.28.6":"He is not here: for he is risen, as he said. Come, see the place where the Lord lay.","41.24.5":"And as they were afraid, and bowed down their faces to the earth, they said unto them, Why seek ye the living among the dead?","41.24.6":"He is not here, but is risen: remember how he spake unto you when he was yet in Galilee,","45.15.4":"And that he was buried, and that he rose again the third day according to the scriptures:","45.15.20":"But now is Christ risen from the dead, and become the firstfruits of them that slept.","45.15.21":"For since by man came death, by man came also the resurrection of the dead.","45.15.22":"For as in Adam all die, even so in Christ shall all be made alive.","45.15.55":"O death, where is thy sting? O grave, where is thy victory?","45.15.56":"The sting of death is sin; and the strength of sin is the law.","45.15.57":"But thanks be to God, which giveth us the victory through our Lord Jesus Christ.","44.6.9":"Knowing that Christ being raised from the dead dieth no more; death hath no more dominion over him.","39.5.3":"Blessed are the poor in spirit: for theirs is the kingdom of heaven.","39.5.5":"Blessed are the meek: for they shall inherit the earth.","39.5.6":"Blessed are they which do hunger and thirst after righteousness: for they shall be filled.","39.5.7":"Blessed are the merciful: for they shall obtain mercy.","39.5.9":"Blessed are the peacemakers: for they shall be called the children of God.","39.5.10":"Blessed are they which are persecuted for righteousness’ sake: for theirs is the kingdom of heaven.","39.5.11":"Blessed are ye, when men shall revile you, and persecute you, and shall say all manner of evil against you falsely, for my sake.","39.5.12":"Rejoice, and be exceeding glad: for great is your reward in heaven: for so persecuted they the prophets which were before you.","41.6.20":"And he lifted up his eyes on his disciples, and said, Blessed be ye poor: for yours is the kingdom of God.","41.6.21":"Blessed are ye that hunger now: for ye shall be filled. Blessed are ye that weep now: for ye shall laugh.","41.6.22":"Blessed are ye, when men shall hate you, and when they shall separate you from their company, and shall reproach you, and cast out your name as evil, for the Son of man’s sake.","41.6.23":"Rejoice ye in that day, and leap for joy: for, behold, your reward is great in heaven: for in the like manner did their fathers unto the prophets.","39.5.13":"Ye are the salt of the earth: but if the salt have lost his savour, wherewith shall it be salted? it is thenceforth good for nothing, but to be cast out, and to be trodden under foot of men.","39.5.14":"Ye are the light of the world. A city that is set on an hill cannot be hid.","39.5.15":"Neither do men light a candle, and put it under a bushel, but on a candlestick; and it giveth light unto all that are in the house.","39.5.16":"Let your light so shine before men, that they may see your good works, and glorify your Father which is in heaven.","39.6.19":"Lay not up for yourselves treasures upon earth, where moth and rust doth corrupt, and where thieves break through and steal:","39.6.20":"But lay up for yourselves treasures in heaven, where neither moth nor rust doth corrupt, and where thieves do not break through nor steal:","39.6.21":"For where your treasure is, there will your heart be also.","39.7.7":"Ask, and it shall be given you; seek, and ye shall find; knock, and it shall be opened unto you:","39.7.8":"For every one that asketh receiveth; and he that seeketh findeth; and to him that knocketh it shall be opened.","39.7.12":"Therefore all things whatsoever ye would that men should do to you, do ye even so to them: for this is the law and the prophets.","39.7.24":"Therefore whosoever heareth these sayings of mine, and doeth them, I will liken him unto a wise man, which built his house upon a rock:","39.7.25":"And the rain descended, and the floods came, and the winds blew, and beat upon that house; and it fell not: for it was founded upon a rock.","41.15.11":"And he said, A certain man had two sons:","41.15.12":"And the younger of them said to his father, Father, give me the portion of goods that falleth to me. And he divided unto them his living.","41.15.13":"And not many days after the younger son gathered all together, and took his journey into a far country, and there wasted his substance with riotous living.","41.15.14":"And when he had spent all, there arose a mighty famine in that land; and he began to be in want.","41.15.15":"And he went and joined himself to a citizen of that country; and he sent him into his fields to feed swine.","41.15.16":"And he would fain have filled his belly with the husks that the swine did eat: and no man gave unto him.","41.15.17":"And when he came to himself, he said, How many hired servants of my father’s have bread enough and to spare, and I perish with hunger!","41.10.30":"And Jesus answering said, A certain man went down from Jerusalem to Jericho, and fell among thieves, which stripped him of his raiment, and wounded him, and departed, leaving him half dead.","41.10.31":"And by chance there came down a certain priest that way: and when he saw him, he passed by on the other side.","41.10.32":"And likewise a Levite, when he was at the place, came and looked on him, and passed by on the other side.","41.10.33":"But a certain Samaritan, as he journeyed, came where he was: and when he saw him, he had compassion on him,","41.10.34":"And went to him, and bound up his wounds, pouring in oil and wine, and set him on his own beast, and brought him to an inn, and took care of him.","41.10.35":"And on the morrow when he departed, he took out two pence, and gave them to the host, and said unto him, Take care of him; and whatsoever thou spendest more, when I come again, I will repay thee.","41.10.36":"Which now of these three, thinkest thou, was neighbour unto him that fell among the thieves?","41.10.37":"And he said, He that shewed mercy on him. Then said Jesus unto him, Go, and do thou likewise.","39.13.3":"And he spake many things unto them in parables, saying, Behold, a sower went forth to sow;","39.13.4":"And when he sowed, some seeds fell by the way side, and the fowls came and devoured them up:","39.13.5":"Some fell upon stony places, where they had not much earth: and forthwith they sprung up, because they had no deepness of earth:","39.13.6":"And when the sun was up, they were scorched; and because they had no root, they withered away.","39.13.7":"And some fell among thorns; and the thorns sprung up, and choked them:","39.13.8":"But other fell into good ground, and brought forth fruit, some an hundredfold, some sixtyfold, some thirtyfold.","41.15.4":"What man of you, having an hundred sheep, if he lose one of them, doth not leave the ninety and nine in the wilderness, and go after that which is lost, until he find it?","41.15.5":"And when he hath found it, he layeth it on his shoulders, rejoicing.","41.15.6":"And when he cometh home, he calleth together his friends and neighbours, saying unto them, Rejoice with me; for I have found my sheep which was lost.","39.13.31":"Another parable put he forth unto them, saying, The kingdom of heaven is like to a grain of mustard seed, which a man took, and sowed in his field:","39.13.32":"Which indeed is the least of all seeds: but when it is grown, it is the greatest among herbs, and becometh a tree, so that the birds of the air come and lodge in the branches thereof.","39.13.44":"Again, the kingdom of heaven is like unto treasure hid in a field; the which when a man hath found, he hideth, and for joy thereof goeth and selleth all that he hath, and buyeth that field.","39.13.45":"Again, the kingdom of heaven is like unto a merchant man, seeking goodly pearls:","39.13.46":"Who, when he had found one pearl of great price, went and sold all that he had, and bought it.","42.2.7":"Jesus saith unto them, Fill the waterpots with water. And they filled them up to the brim.","42.2.8":"And he saith unto them, Draw out now, and bear unto the governor of the feast. And they bare it.","42.2.9":"When the ruler of the feast had tasted the water that was made wine, and knew not whence it was: (but the servants which drew the water knew;) the governor of the feast called the bridegroom,","42.2.10":"And saith unto him, Every man at the beginning doth set forth good wine; and when men have well drunk, then that which is worse: but thou hast kept the good wine until now.","42.2.11":"This beginning of miracles did Jesus in Cana of Galilee, and manifested forth his glory; and his disciples believed on him.","40.4.39":"And he arose, and rebuked the wind, and said unto the sea, Peace, be still. And the wind ceased, and there was a great calm.","40.4.40":"And he said unto them, Why are ye so fearful? how is it that ye have no faith?","40.4.41":"And they feared exceedingly, and said one to another, What manner of man is this, that even the wind and the sea obey him?","42.6.11":"And Jesus took the loaves; and when he had given thanks, he distributed to the disciples, and the disciples to them that were set down; and likewise of the fishes as much as they would.","42.6.12":"When they were filled, he said unto his disciples, Gather up the fragments that remain, that nothing be lost.","42.6.13":"Therefore they gathered them together, and filled twelve baskets with the fragments of the five barley loaves, which remained over and above unto them that had eaten.","39.14.25":"And in the fourth watch of the night Jesus went unto them, walking on the sea.","39.14.26":"And when the disciples saw him walking on the sea, they were troubled, saying, It is a spirit; and they cried out for fear.","39.14.27":"But straightway Jesus spake unto them, saying, Be of good cheer; it is I; be not afraid.","41.5.12":"And it came to pass, when he was in a certain city, behold a man full of leprosy: who seeing Jesus fell on his face, and besought him, saying, Lord, if thou wilt, thou canst make me clean.","41.5.13":"And he put forth his hand, and touched him, saying, I will: be thou clean. And immediately the leprosy departed from him.","40.10.51":"And Jesus answered and said unto him, What wilt thou that I should do unto thee? The blind man said unto him, Lord, that I might receive my sight.","40.10.52":"And Jesus said unto him, Go thy way; thy faith hath made thee whole. And immediately he received his sight, and followed Jesus in the way.","42.11.43":"And when he thus had spoken, he cried with a loud voice, Lazarus, come forth.","42.11.44":"And he that was dead came forth, bound hand and foot with graveclothes: and his face was bound about with a napkin. Jesus saith unto them, Loose him, and let him go.","42.20.30":"And many other signs truly did Jesus in the presence of his disciples, which are not written in this book:","42.20.31":"But these are written, that ye might believe that Jesus is the Christ, the Son of God; and that believing ye might have life through his name.","39.19.14":"But Jesus said, Suffer little children, and forbid them not, to come unto me: for of such is the kingdom of heaven.","39.18.3":"And said, Verily I say unto you, Except ye be converted, and become as little children, ye shall not enter into the kingdom of heaven.","39.18.4":"Whosoever therefore shall humble himself as this little child, the same is greatest in the kingdom of heaven.","39.18.6":"But whoso shall offend one of these little ones which believe in me, it were better for him that a millstone were hanged about his neck, and that he were drowned in the depth of the sea.","39.21.16":"And said unto him, Hearest thou what these say? And Jesus saith unto them, Yea; have ye never read, Out of the mouth of babes and sucklings thou hast perfected praise?","39.6.5":"And when thou prayest, thou shalt not be as the hypocrites are: for they love to pray standing in the synagogues and in the corners of the streets, that they may be seen of men. Verily I say unto you, They have their reward.","39.6.6":"But thou, when thou prayest, enter into thy closet, and when thou hast shut thy door, pray to thy Father which is in secret; and thy Father which seeth in secret shall reward thee openly.","39.6.7":"But when ye pray, use not vain repetitions, as the heathen do: for they think that they shall be heard for their much speaking.","39.6.8":"Be not ye therefore like unto them: for your Father knoweth what things ye have need of, before ye ask him.","39.7.9":"Or what man is there of you, whom if his son ask bread, will he give him a stone?","39.7.10":"Or if he ask a fish, will he give him a serpent?","39.7.11":"If ye then, being evil, know how to give good gifts unto your children, how much more shall your Father which is in heaven give good things to them that ask him?","40.11.24":"Therefore I say unto you, What things soever ye desire, when ye pray, believe that ye receive them, and ye shall have them.","42.14.13":"And whatsoever ye shall ask in my name, that will I do, that the Father may be glorified in the Son.","42.14.14":"If ye shall ask any thing in my name, I will do it.","42.16.24":"Hitherto have ye asked nothing in my name: ask, and ye shall receive, that your joy may be full.","39.18.19":"Again I say unto you, That if two of you shall agree on earth as touching any thing that they shall ask, it shall be done for them of my Father which is in heaven.","39.18.20":"For where two or three are gathered together in my name, there am I in the midst of them.","41.18.1":"And he spake a parable unto them to this end, that men ought always to pray, and not to faint;","39.6.24":"No man can serve two masters: for either he will hate the one, and love the other; or else he will hold to the one, and despise the other. Ye cannot serve God and mammon.","41.12.15":"And he said unto them, Take heed, and beware of covetousness: for a man’s life consisteth not in the abundance of the things which he possesseth.","40.10.25":"It is easier for a camel to go through the eye of a needle, than for a rich man to enter into the kingdom of God.","41.16.10":"He that is faithful in that which is least is faithful also in much: and he that is unjust in the least is unjust also in much.","41.16.11":"If therefore ye have not been faithful in the unrighteous mammon, who will commit to your trust the true riches?","39.22.21":"They say unto him, Cesar’s. Then saith he unto them, Render therefore unto Cesar the things which are Cesar’s; and unto God the things that are God’s.","40.12.41":"And Jesus sat over against the treasury, and beheld how the people cast money into the treasury: and many that were rich cast in much.","40.12.42":"And there came a certain poor widow, and she threw in two mites, which make a farthing.","40.12.43":"And he called unto him his disciples, and saith unto them, Verily I say unto you, That this poor widow hath cast more in, than all they which have cast into the treasury:","40.12.44":"For all they did cast in of their abundance; but she of her want did cast in all that she had, even all her living.","39.25.35":"For I was an hungred, and ye gave me meat: I was thirsty, and ye gave me drink: I was a stranger, and ye took me in:","39.25.36":"Naked, and ye clothed me: I was sick, and ye visited me: I was in prison, and ye came unto me.","39.25.37":"Then shall the righteous answer him, saying, Lord, when saw we thee an hungred, and fed thee? or thirsty, and gave thee drink?","39.25.38":"When saw we thee a stranger, and took thee in? or naked, and clothed thee?","39.25.39":"Or when saw we thee sick, or in prison, and came unto thee?","39.25.40":"And the King shall answer and say unto them, Verily I say unto you, Inasmuch as ye have done it unto one of the least of these my brethren, ye have done it unto me.","41.14.13":"But when thou makest a feast, call the poor, the maimed, the lame, the blind:","41.14.14":"And thou shalt be blessed; for they cannot recompense thee: for thou shalt be recompensed at the resurrection of the just.","39.11.5":"The blind receive their sight, and the lame walk, the lepers are cleansed, and the deaf hear, the dead are raised up, and the poor have the gospel preached to them.","61.5.14":"And this is the confidence that we have in him, that, if we ask any thing according to his will, he heareth us:","61.5.15":"And if we know that he hear us, whatsoever we ask, we know that we have the petitions that we desired of him.","18.145.18":"The Lord is nigh unto all them that call upon him, to all that call upon him in truth.","39.6.9":"After this manner therefore pray ye: Our Father which art in heaven, Hallowed be thy name.","39.6.10":"Thy kingdom come. Thy will be done in earth, as it is in heaven.","39.6.11":"Give us this day our daily bread.","39.6.12":"And forgive us our debts, as we forgive our debtors.","41.11.2":"And he said unto them, When ye pray, say, Our Father which art in heaven, Hallowed be thy name. Thy kingdom come. Thy will be done, as in heaven, so in earth.","41.11.3":"Give us day by day our daily bread.","41.11.4":"And forgive us our sins; for we also forgive every one that is indebted to us. And lead us not into temptation; but deliver us from evil.","57.11.1":"Now faith is the substance of things hoped for, the evidence of things not seen.","44.10.17":"So then faith cometh by hearing, and hearing by the word of God.","39.17.20":"And Jesus said unto them, Because of your unbelief: for verily I say unto you, If ye have faith as a grain of mustard seed, ye shall say unto this mountain, Remove hence to yonder place; and it shall remove; and nothing shall be impossible unto you.","40.11.22":"And Jesus answering saith unto them, Have faith in God.","40.11.23":"For verily I say unto you, That whosoever shall say unto this mountain, Be thou removed, and be thou cast into the sea; and shall not doubt in his heart, but shall believe that those things which he saith shall come to pass; he shall have whatsoever he saith.","46.5.7":"(For we walk by faith, not by sight:)","58.2.17":"Even so faith, if it hath not works, is dead, being alone.","54.3.16":"All scripture is given by inspiration of God, and is profitable for doctrine, for reproof, for correction, for instruction in righteousness:","54.3.17":"That the man of God may be perfect, throughly furnished unto all good works.","57.4.12":"For the word of God is quick, and powerful, and sharper than any twoedged sword, piercing even to the dividing asunder of soul and spirit, and of the joints and marrow, and is a discerner of the thoughts and intents of the heart.","5.1.8":"This book of the law shall not depart out of thy mouth; but thou shalt meditate therein day and night, that thou mayest observe to do according to all that is written therein: for then thou shalt make thy way prosperous, and then thou shalt have good success.","22.40.8":"The grass withereth, the flower fadeth: but the word of our God shall stand for ever.","39.4.4":"But he answered and said, It is written, Man shall not live by bread alone, but by every word that proceedeth out of the mouth of God.","44.15.4":"For whatsoever things were written aforetime were written for our learning, that we through patience and comfort of the scriptures might have hope.","42.17.17":"Sanctify them through thy truth: thy word is truth.","18.100.1":"Make a joyful noise unto the Lord, all ye lands.","18.100.2":"Serve the Lord with gladness: come before his presence with singing.","18.100.3":"Know ye that the Lord he is God: it is he that hath made us, and not we ourselves; we are his people, and the sheep of his pasture.","18.100.4":"Enter into his gates with thanksgiving, and into his courts with praise: be thankful unto him, and bless his name.","18.100.5":"For the Lord is good; his mercy is everlasting; and his truth endureth to all generations.","18.150.6":"Let every thing that hath breath praise the Lord. Praise ye the Lord.","42.4.23":"But the hour cometh, and now is, when the true worshippers shall worship the Father in spirit and in truth: for the Father seeketh such to worship him.","42.4.24":"God is a Spirit: and they that worship him must worship him in spirit and in truth.","18.95.6":"O come, let us worship and bow down: let us kneel before the Lord our maker.","18.34.1":"I will bless the Lord at all times: his praise shall continually be in my mouth.","18.103.1":"Bless the Lord, O my soul: and all that is within me, bless his holy name.","57.13.15":"By him therefore let us offer the sacrifice of praise to God continually, that is, the fruit of our lips giving thanks to his name.","50.3.16":"Let the word of Christ dwell in you richly in all wisdom; teaching and admonishing one another in psalms and hymns and spiritual songs, singing with grace in your hearts to the Lord.","44.12.1":"I beseech you therefore, brethren, by the mercies of God, that ye present your bodies a living sacrifice, holy, acceptable unto God, which is your reasonable service.","18.107.1":"O give thanks unto the Lord, for he is good: for his mercy endureth for ever.","18.136.1":"O give thanks unto the Lord; for he is good: for his mercy endureth for ever.","50.3.17":"And whatsoever ye do in word or deed, do all in the name of the Lord Jesus, giving thanks to God and the Father by him.","48.5.20":"Giving thanks always for all things unto God and the Father in the name of our Lord Jesus Christ;","50.2.7":"Rooted and built up in him, and stablished in the faith, as ye have been taught, abounding therein with thanksgiving.","42.14.15":"If ye love me, keep my commandments.","42.14.21":"He that hath my commandments, and keepeth them, he it is that loveth me: and he that loveth me shall be loved of my Father, and I will love him, and will manifest myself to him.","58.1.22":"But be ye doers of the word, and not hearers only, deceiving your own selves.","8.15.22":"And Samuel said, Hath the Lord as great delight in burnt offerings and sacrifices, as in obeying the voice of the Lord? Behold, to obey is better than sacrifice, and to hearken than the fat of rams.","41.11.28":"But he said, Yea rather, blessed are they that hear the word of God, and keep it.","61.5.3":"For this is the love of God, that we keep his commandments: and his commandments are not grievous.","4.28.1":"And it shall come to pass, if thou shalt hearken diligently unto the voice of the Lord thy God, to observe and to do all his commandments which I command thee this day, that the Lord thy God will set thee on high above all nations of the earth:","4.28.2":"And all these blessings shall come on thee, and overtake thee, if thou shalt hearken unto the voice of the Lord thy God.","43.5.29":"Then Peter and the other apostles answered and said, We ought to obey God rather than men.","39.28.19":"Go ye therefore, and teach all nations, baptizing them in the name of the Father, and of the Son, and of the Holy Ghost:","39.3.16":"And Jesus, when he was baptized, went up straightway out of the water: and, lo, the heavens were opened unto him, and he saw the Spirit of God descending like a dove, and lighting upon him:","39.3.17":"And lo a voice from heaven, saying, This is my beloved Son, in whom I am well pleased.","43.8.36":"And as they went on their way, they came unto a certain water: and the eunuch said, See, here is water; what doth hinder me to be baptized?","43.8.37":"And Philip said, If thou believest with all thine heart, thou mayest. And he answered and said, I believe that Jesus Christ is the Son of God.","43.8.38":"And he commanded the chariot to stand still: and they went down both into the water, both Philip and the eunuch; and he baptized him.","44.6.3":"Know ye not, that so many of us as were baptized into Jesus Christ were baptized into his death?","50.2.12":"Buried with him in baptism, wherein also ye are risen with him through the faith of the operation of God, who hath raised him from the dead.","47.3.27":"For as many of you as have been baptized into Christ have put on Christ.","40.16.16":"He that believeth and is baptized shall be saved; but he that believeth not shall be damned.","41.22.19":"And he took bread, and gave thanks, and brake it, and gave unto them, saying, This is my body which is given for you: this do in remembrance of me.","41.22.20":"Likewise also the cup after supper, saying, This cup is the new testament in my blood, which is shed for you.","39.26.26":"And as they were eating, Jesus took bread, and blessed it, and brake it, and gave it to the disciples, and said, Take, eat; this is my body.","39.26.27":"And he took the cup, and gave thanks, and gave it to them, saying, Drink ye all of it;","39.26.28":"For this is my blood of the new testament, which is shed for many for the remission of sins.","45.11.23":"For I have received of the Lord that which also I delivered unto you, That the Lord Jesus the same night in which he was betrayed took bread:","45.11.24":"And when he had given thanks, he brake it, and said, Take, eat: this is my body, which is broken for you: this do in remembrance of me.","45.11.25":"After the same manner also he took the cup, when he had supped, saying, This cup is the new testament in my blood: this do ye, as oft as ye drink it, in remembrance of me.","45.11.26":"For as often as ye eat this bread, and drink this cup, ye do shew the Lord’s death till he come.","45.10.16":"The cup of blessing which we bless, is it not the communion of the blood of Christ? The bread which we break, is it not the communion of the body of Christ?","39.6.16":"Moreover when ye fast, be not, as the hypocrites, of a sad countenance: for they disfigure their faces, that they may appear unto men to fast. Verily I say unto you, They have their reward.","39.6.17":"But thou, when thou fastest, anoint thine head, and wash thy face;","39.6.18":"That thou appear not unto men to fast, but unto thy Father which is in secret: and thy Father, which seeth in secret, shall reward thee openly.","22.58.6":"Is not this the fast that I have chosen? to loose the bands of wickedness, to undo the heavy burdens, and to let the oppressed go free, and that ye break every yoke?","22.58.7":"Is it not to deal thy bread to the hungry, and that thou bring the poor that are cast out to thy house? when thou seest the naked, that thou cover him; and that thou hide not thyself from thine own flesh?","28.2.12":"Therefore also now, saith the Lord, turn ye even to me with all your heart, and with fasting, and with weeping, and with mourning:","39.4.2":"And when he had fasted forty days and forty nights, he was afterward an hungred.","14.8.23":"So we fasted and besought our God for this: and he was intreated of us.","43.13.2":"As they ministered to the Lord, and fasted, the Holy Ghost said, Separate me Barnabas and Saul for the work whereunto I have called them.","43.13.3":"And when they had fasted and prayed, and laid their hands on them, they sent them away.","38.3.10":"Bring ye all the tithes into the storehouse, that there may be meat in mine house, and prove me now herewith, saith the Lord of hosts, if I will not open you the windows of heaven, and pour you out a blessing, that there shall not be room enough to receive it.","19.3.9":"Honour the Lord with thy substance, and with the firstfruits of all thine increase:","19.3.10":"So shall thy barns be filled with plenty, and thy presses shall burst out with new wine.","46.9.6":"But this I say, He which soweth sparingly shall reap also sparingly; and he which soweth bountifully shall reap also bountifully.","46.9.7":"Every man according as he purposeth in his heart, so let him give; not grudgingly, or of necessity: for God loveth a cheerful giver.","41.6.38":"Give, and it shall be given unto you; good measure, pressed down, and shaken together, and running over, shall men give into your bosom. For with the same measure that ye mete withal it shall be measured to you again.","2.27.30":"And all the tithe of the land, whether of the seed of the land, or of the fruit of the tree, is the Lord’s: it is holy unto the Lord.","45.16.2":"Upon the first day of the week let every one of you lay by him in store, as God hath prospered him, that there be no gatherings when I come.","43.20.35":"I have shewed you all things, how that so labouring ye ought to support the weak, and to remember the words of the Lord Jesus, how he said, It is more blessed to give than to receive.","40.16.15":"And he said unto them, Go ye into all the world, and preach the gospel to every creature.","44.1.16":"For I am not ashamed of the gospel of Christ: for it is the power of God unto salvation to every one that believeth; to the Jew first, and also to the Greek.","44.10.14":"How then shall they call on him in whom they have not believed? and how shall they believe in him of whom they have not heard? and how shall they hear without a preacher?","44.10.15":"And how shall they preach, except they be sent? as it is written, How beautiful are the feet of them that preach the gospel of peace, and bring glad tidings of good things!","59.3.15":"But sanctify the Lord God in your hearts: and be ready always to give an answer to every man that asketh you a reason of the hope that is in you with meekness and fear:","54.4.2":"Preach the word; be instant in season, out of season; reprove, rebuke, exhort with all longsuffering and doctrine.","39.20.26":"But it shall not be so among you: but whosoever will be great among you, let him be your minister;","39.20.27":"And whosoever will be chief among you, let him be your servant:","39.20.28":"Even as the Son of man came not to be ministered unto, but to minister, and to give his life a ransom for many.","42.13.14":"If I then, your Lord and Master, have washed your feet; ye also ought to wash one another’s feet.","42.13.15":"For I have given you an example, that ye should do as I have done to you.","59.4.10":"As every man hath received the gift, even so minister the same one to another, as good stewards of the manifold grace of God.","50.3.23":"And whatsoever ye do, do it heartily, as to the Lord, and not unto men;","50.3.24":"Knowing that of the Lord ye shall receive the reward of the inheritance: for ye serve the Lord Christ.","57.6.10":"For God is not unrighteous to forget your work and labour of love, which ye have shewed toward his name, in that ye have ministered to the saints, and do minister.","57.10.24":"And let us consider one another to provoke unto love and to good works:","57.10.25":"Not forsaking the assembling of ourselves together, as the manner of some is; but exhorting one another: and so much the more, as ye see the day approaching.","43.2.42":"And they continued stedfastly in the apostles’ doctrine and fellowship, and in breaking of bread, and in prayers.","39.16.18":"And I say also unto thee, That thou art Peter, and upon this rock I will build my church; and the gates of hell shall not prevail against it.","45.12.12":"For as the body is one, and hath many members, and all the members of that one body, being many, are one body: so also is Christ.","45.12.27":"Now ye are the body of Christ, and members in particular.","48.4.11":"And he gave some, apostles; and some, prophets; and some, evangelists; and some, pastors and teachers;","48.4.12":"For the perfecting of the saints, for the work of the ministry, for the edifying of the body of Christ:","50.1.18":"And he is the head of the body, the church: who is the beginning, the firstborn from the dead; that in all things he might have the preeminence.","45.12.4":"Now there are diversities of gifts, but the same Spirit.","45.12.5":"And there are differences of administrations, but the same Lord.","45.12.6":"And there are diversities of operations, but it is the same God which worketh all in all.","45.12.7":"But the manifestation of the Spirit is given to every man to profit withal.","45.12.8":"For to one is given by the Spirit the word of wisdom; to another the word of knowledge by the same Spirit;","45.12.9":"To another faith by the same Spirit; to another the gifts of healing by the same Spirit;","45.12.10":"To another the working of miracles; to another prophecy; to another discerning of spirits; to another divers kinds of tongues; to another the interpretation of tongues:","45.12.11":"But all these worketh that one and the selfsame Spirit, dividing to every man severally as he will.","44.12.6":"Having then gifts differing according to the grace that is given to us, whether prophecy, let us prophesy according to the proportion of faith;","44.12.7":"Or ministry, let us wait on our ministering: or he that teacheth, on teaching;","44.12.8":"Or he that exhorteth, on exhortation: he that giveth, let him do it with simplicity; he that ruleth, with diligence; he that sheweth mercy, with cheerfulness.","59.4.11":"If any man speak, let him speak as the oracles of God; if any man minister, let him do it as of the ability which God giveth: that God in all things may be glorified through Jesus Christ, to whom be praise and dominion for ever and ever. Amen.","54.1.6":"Wherefore I put thee in remembrance that thou stir up the gift of God, which is in thee by the putting on of my hands.","42.15.8":"Herein is my Father glorified, that ye bear much fruit; so shall ye be my disciples.","39.7.16":"Ye shall know them by their fruits. Do men gather grapes of thorns, or figs of thistles?","39.7.17":"Even so every good tree bringeth forth good fruit; but a corrupt tree bringeth forth evil fruit.","39.7.18":"A good tree cannot bring forth evil fruit, neither can a corrupt tree bring forth good fruit.","39.7.19":"Every tree that bringeth not forth good fruit is hewn down, and cast into the fire.","39.7.20":"Wherefore by their fruits ye shall know them.","50.1.10":"That ye might walk worthy of the Lord unto all pleasing, being fruitful in every good work, and increasing in the knowledge of God;","49.1.11":"Being filled with the fruits of righteousness, which are by Jesus Christ, unto the glory and praise of God.","59.1.15":"But as he which hath called you is holy, so be ye holy in all manner of conversation;","59.1.16":"Because it is written, Be ye holy; for I am holy.","46.7.1":"Having therefore these promises, dearly beloved, let us cleanse ourselves from all filthiness of the flesh and spirit, perfecting holiness in the fear of God.","51.4.7":"For God hath not called us unto uncleanness, but unto holiness.","2.20.7":"Sanctify yourselves therefore, and be ye holy: for I am the Lord your God.","48.1.4":"According as he hath chosen us in him before the foundation of the world, that we should be holy and without blame before him in love:","60.3.18":"But grow in grace, and in the knowledge of our Lord and Saviour Jesus Christ. To him be glory both now and for ever. Amen.","59.2.2":"As newborn babes, desire the sincere milk of the word, that ye may grow thereby:","50.2.6":"As ye have therefore received Christ Jesus the Lord, so walk ye in him:","49.3.13":"Brethren, I count not myself to have apprehended: but this one thing I do, forgetting those things which are behind, and reaching forth unto those things which are before,","49.3.14":"I press toward the mark for the prize of the high calling of God in Christ Jesus.","57.5.13":"For every one that useth milk is unskilful in the word of righteousness: for he is a babe.","57.5.14":"But strong meat belongeth to them that are of full age, even those who by reason of use have their senses exercised to discern both good and evil.","48.4.15":"But speaking the truth in love, may grow up into him in all things, which is the head, even Christ:","60.1.5":"And beside this, giving all diligence, add to your faith virtue; and to virtue knowledge;","60.1.6":"And to knowledge temperance; and to temperance patience; and to patience godliness;","60.1.7":"And to godliness brotherly kindness; and to brotherly kindness charity.","60.1.8":"For if these things be in you, and abound, they make you that ye shall neither be barren nor unfruitful in the knowledge of our Lord Jesus Christ.","48.6.10":"Fi
