smen of Abraham and his nephew Lot were fighting over land. Abraham, the elder, gave way and let Lot choose first. Peace sometimes costs giving way.","h":"Take the first step today toward resolving a conflict.","q":[["Why did the herdsmen of Abraham and Lot fight?","Over livestock and land","Over money","Over a woman","Over religion"],["Who chose the land first?","Lot","Abraham","Sarah","Isaac"],["What will the peacemakers be called?","Children of God","Kings","Wise men","Prophets"]]},{"t":"Serving others","w":"serve","r":"Dorcas was known in Joppa for her good works and the clothes she sewed for widows. When she died, everyone wept, showing what she had made. Serving leaves a mark.","h":"Do something practical today for someone who needs it.","q":[["What was Dorcas known for?","Her good works and the clothes she sewed","Preaching","Being a queen","Singing"],["Which apostle prayed for Dorcas so she came back to life?","Peter","Paul","John","James"],["According to Galatians 5:13, how should we use our freedom?","To serve one another in love","To do whatever we want","To rest","To be in charge"]]}]},{"u":"Purpose","l":[{"t":"Created with purpose","w":"workmanship","r":"You are not an accident. God formed you with care and prepared good works for you to walk in. Your life has a purpose that goes beyond you.","h":"Ask God today what He created you for and write down what comes to mind.","q":[["According to Ephesians 2:10, what were we created in Christ for?","Good works","To be rich","To rest","To be famous"],["According to Psalm 139:14, how were we made?","Fearfully and wonderfully","By chance","Quickly","Carelessly"],["According to Jeremiah 1:5, when did God know Jeremiah?","Before forming him in the womb","At birth","As a young man","As an old man"]]},{"t":"Your gifts","w":"gifts","r":"Moses said he couldn't speak well and Gideon said he was the least in his family. God isn't looking for the most capable, but for those who are available.","h":"Offer God one of your abilities today, however small it seems.","q":[["What excuse did Moses give for not going to Egypt?","That he couldn't speak well","That he was sick","That he was rich","That he was afraid of water"],["Who helped Moses speak?","His brother Aaron","Joshua","Jethro","Caleb"],["What did Gideon say about himself?","That he was the least in his family","That he was a king","That he was very strong","That he was a priest"]]},{"t":"Waiting on God","w":"eagles","r":"Joseph waited thirteen years between slavery and the palace. Abraham waited twenty-five years for his son. Waiting on God isn't wasting time: it's preparation.","h":"If you're waiting for something, thank God today for what you're learning.","q":[["According to Isaiah 40:31, those who wait on the Lord shall mount up with wings as…","Eagles","Doves","Angels","Hawks"],["About how many years did Abraham wait for the promised son?","Twenty-five","Two","One hundred","Five"],["According to Ecclesiastes 3:1, what does everything have?","Its season","A price","An owner","A sad ending"]]},{"t":"Shine where you are","w":"shine","r":"Daniel, Joseph and Esther served God in governments that didn't know Him. They didn't need to be in a temple to shine: they did it where God placed them.","h":"Show Jesus today at your job, school or home through your attitude.","q":[["In which empire did Daniel serve?","Babylon","Egypt","Rome","Greece"],["In which country did Joseph govern?","Egypt","Persia","Assyria","Israel"],["Of which kingdom was Esther queen?","Persia","Egypt","Babylon","Moab"]]},{"t":"Finishing well","w":"course","r":"At the end of his life, in prison and about to die, Paul could say he had finished his race. It doesn't matter how you started: what matters is finishing faithful.","h":"Write how you'd like to be remembered and take one step toward it today.","q":[["What did Paul say he had kept?","The faith","His money","His letters","His house"],["What did Paul expect to receive, according to 2 Timothy 4:8?","The crown of righteousness","A house","His freedom","Riches"],["According to Philippians 3:14, toward what does Paul press on?","Toward the mark","Toward Rome","Backward","Toward the sea"]]}]}],"cams":[{"n":"Foundations of faith","d":"First steps and the basics of the faith"},{"n":"The life of Jesus","d":"From Bethlehem to the empty tomb"},{"n":"Wisdom for life","d":"Family, money, emotions and purpose"}],"jg":{"pj":[["Adam","🍎","The first man",["I was formed from the dust of the ground.","I gave names to the animals.","I lived in the Garden of Eden.","I am the first man."]],["Noah","🚢","Built the ark",["I lived more than 900 years.","God warned me about something that would come from the sky.","I had three sons: Shem, Ham and Japheth.","I built an ark and brought animals in two by two."]],["Abraham","⭐","The father of faith",["I left Ur without knowing where I was going.","God promised me descendants like the stars.","I had a son at 100 years old.","My wife was Sarah and my son was Isaac."]],["Jacob","🪜","Dreamed of a ladder",["I took my older brother's blessing.","I worked many years to marry Rachel.","I wrestled with an angel and my name was changed to Israel.","I dreamed of a ladder that reached heaven."]],["Joseph","🧥","The coat of many colors",["I interpreted dreams.","I was unjustly imprisoned in Egypt.","My brothers sold me as a slave.","My father gave me a coat of many colors."]],["Moses","🌊","Parted the Red Sea",["I was raised in Pharaoh's palace.","God spoke to me from a burning bush.","I received the Ten Commandments.","I stretched out my staff and the Red Sea parted."]],["Joshua","🎺","The walls of Jericho",["I was Moses' assistant.","I was one of the twelve spies and came back with faith.","I led Israel into the promised land.","The walls of Jericho fell after we marched around it seven days."]],["Deborah","🌴","Judge and prophetess",["I was a prophetess in Israel.","I judged the people under a palm tree.","I went with Barak into battle.","I am the woman judge in the book of Judges."]],["Gideon","🏺","Won with 300 men",["An angel called me while I was threshing wheat in hiding.","I asked for signs with a fleece of wool.","God reduced my army to 300 men.","We won with trumpets and jars with torches."]],["Samson","💪","Supernatural strength",["I was a Nazirite from my mother's womb.","I killed a lion with my bare hands.","Delilah discovered my secret.","My strength was tied to my long hair."]],["Ruth","🌾","Loyal to her mother-in-law",["I was a Moabite, a foreigner in Israel.","I was widowed very young.","I gathered grain in the field of Boaz.","I told my mother-in-law: “your God will be my God.”"]],["Samuel","👂","Heard God as a child",["My mother Hannah prayed hard to have me.","I grew up in the temple with Eli the priest.","As a boy I said: “Speak, for your servant hears.”","I anointed Saul and David as kings."]],["David","🪨","Defeated Goliath",["I was the youngest of my brothers.","I played the harp for King Saul.","I wrote many of the Psalms.","I defeated a giant with a sling."]],["Solomon","👑","The wisest king",["My father was King David.","I asked God for wisdom instead of riches.","I built the first temple in Jerusalem.","I wrote most of the Proverbs."]],["Elijah","🔥","Fire from heaven",["Ravens brought me food.","I challenged the prophets of Baal on Mount Carmel.","God sent fire from heaven when I prayed.","I went up to heaven in a chariot of fire."]],["Jonah","🐋","Inside a great fish",["God sent me to preach to Nineveh.","I ran away on a ship to Tarshish.","They threw me into the sea during a storm.","I spent three days inside a great fish."]],["Daniel","🦁","The lions' den",["I was taken captive to Babylon as a young man.","I refused to eat the king's food.","I interpreted the dreams of kings.","God shut the mouths of the lions."]],["Esther","💎","A brave queen",["My cousin Mordecai raised me.","I was chosen queen of Persia.","I fasted before going to the king without being called.","I saved my people from Haman's plan."]],["Job","🙏","Patience in trials",["I was a rich and righteous man from the land of Uz.","I lost my wealth and my children in a single day.","My friends said I had sinned.","I am an example of patience in suffering."]],["Mary","🌟","The mother of Jesus",["I lived in Nazareth.","The angel Gabriel visited me.","I was engaged to Joseph.","I am the mother of Jesus."]],["John the Baptist","🏞️","Baptized Jesus",["My mother's name was Elizabeth.","I lived in the wilderness.","I ate locusts and wild honey.","I baptized Jesus in the Jordan River."]],["Peter","🎣","Fisherman and apostle",["I was a fisherman in Galilee.","I walked on water for a moment.","I denied Jesus three times.","I preached the sermon at Pentecost."]],["Zacchaeus","🌳","Climbed a tree",["I was the chief tax collector.","I was rich, but nobody liked me.","I was short.","I climbed a sycamore tree to see Jesus."]],["Lazarus","🌅","Raised by Jesus",["I lived in Bethany.","My sisters were Martha and Mary.","I was dead for four days.","Jesus called me: “Lazarus, come forth.”"]],["Thomas","✋","Wanted to see to believe",["I was one of the twelve disciples.","I was also called Didymus.","I was not there the first time the risen Jesus appeared.","I said I wouldn't believe until I touched His wounds."]],["Nicodemus","🌙","Visited Jesus at night",["I was a Pharisee and a teacher of Israel.","I went to see Jesus at night.","Jesus told me one must be born again.","I helped bury the body of Jesus."]],["Paul","✉️","Wrote many letters",["I used to persecute Christians.","I met Jesus on the road to Damascus.","I went on several missionary journeys.","I wrote many letters of the New Testament."]]],"vf":[["Jesus was born in Bethlehem.",1],["Jonah spent three days inside a lion.",0],["David defeated Goliath with a sling.",1],["Moses built the ark.",0],["Noah built the ark.",1],["Zacchaeus climbed a tree to see Jesus.",1],["Jesus turned wine into water.",0],["Jesus' first miracle was at a wedding in Cana.",1],["Daniel was thrown into a fiery furnace.",0],["Daniel's friends were thrown into a fiery furnace.",1],["The Protestant Bible has 66 books.",1],["The New Testament has 39 books.",0],["The Old Testament has 39 books.",1],["Paul was called Saul before his conversion.",1],["Jesus had 10 disciples.",0],["Jesus chose 12 disciples.",1],["Goliath was an Israelite.",0],["Goliath was a Philistine.",1],["Esther was queen of Egypt.",0],["Ruth was a Moabite.",1],["Abraham was the first king of Israel.",0],["Saul was the first king of Israel.",1],["Solomon defeated Goliath.",0],["Solomon built the first temple in Jerusalem.",1],["Lazarus was the brother of Martha and Mary.",1],["Thomas denied Jesus three times.",0],["Peter denied Jesus three times.",1],["Psalms is the book with the most chapters in the Bible.",1],["Revelation is the first book of the Bible.",0],["Jesus rose on the third day.",1],["Elijah was swallowed by a great fish.",0],["Elijah went up to heaven in a chariot of fire.",1],["Joseph was sold by his brothers.",1],["John the Baptist baptized Jesus in the Jordan River.",1],["Jesus was baptized in the Red Sea.",0],["Moses received the Ten Commandments on Mount Sinai.",1],["God gave five commandments on Mount Sinai.",0],["Gideon won with only 300 men.",1],["Nicodemus visited Jesus at noon.",0],["The Holy Spirit came down at Pentecost.",1],["Adam and Eve lived in the Garden of Gethsemane.",0],["Jesus wept before raising Lazarus.",1],["Samson lost his strength when his hair was cut.",1],["Peter was a carpenter before following Jesus.",0],["Matthew was a tax collector.",1],["Noah's ark carried animals two by two.",1],["Moses entered the promised land.",0],["Joshua led Israel into the promised land.",1]]},"lect":[{"t":"Noah and the great flood","r":"Genesis 6–9","x":["In the days of Noah, the earth was full of violence and evil. But Noah was a righteous man who walked with God, and God gave him a strange task: build a huge wooden ark, even though there was no sign of rain.","Noah obeyed. For years he worked alongside his three sons, Shem, Ham and Japheth. When the ark was ready, his family went in along with pairs of every kind of animal. Then God shut the door.","It rained forty days and forty nights, and the water covered even the mountains. After many months, Noah sent out a dove, which came back with an olive leaf in its beak: the earth was beginning to dry.","When he came out of the ark, Noah built an altar to give thanks. God set a rainbow in the clouds as a sign of His promise: never again would He destroy the earth with a flood."],"q":[["What was Noah like, according to the story?","A righteous man who walked with God","A very rich king","A famous fisherman","A prophet who ran from God"],["How many days and nights did it rain?","Forty","Seven","Three","One hundred"],["What did the dove bring in its beak?","An olive leaf","An ear of wheat","A flower","A stone"],["What does the rainbow mean in this story?","God's promise never again to destroy the earth with a flood","That it was going to rain again","That Noah was king","The end of the year"]]},{"t":"Joseph, from slave to governor","r":"Genesis 37–45","x":["Joseph was Jacob's favorite son, and his father gave him a coat of many colors. His brothers were so jealous that they sold him as a slave to traders going to Egypt.","In Egypt, Joseph worked honestly, but he was falsely accused and ended up in prison. Even there, God was with him. Joseph interpreted the dreams of two prisoners and, later on, Pharaoh's dreams too: seven years of plenty were coming, then seven years of famine.","Pharaoh was so impressed that he made Joseph governor of Egypt. Joseph stored up food during the good years, and when the famine came, people from everywhere came to buy grain, including his own brothers.","They did not recognize him. Joseph could have taken revenge, but he wept, told them who he was and forgave them: “Ye thought evil against me; but God meant it unto good.”"],"q":[["Why did Joseph's brothers sell him?","Out of jealousy","Because he stole","Because their father asked them to","Because of a debt"],["What did Pharaoh's dreams announce?","Seven years of plenty and seven of famine","A war","The arrival of a king","A flood"],["What did Joseph do when he saw his brothers?","He forgave them","He put them in jail","He sold them as slaves","He ignored them"],["What does this story teach?","God can turn evil into good","That you should take revenge","That dreams don't matter","That money is everything"]]},{"t":"Moses and the Red Sea","r":"Exodus 14","x":["After ten plagues, Pharaoh finally let the Israelites go. But he soon changed his mind and set out to chase them with his chariots.","The people were trapped: the Red Sea in front and the Egyptian army behind. Many were afraid and complained to Moses. He answered them: “Fear ye not, stand still, and see the salvation of the Lord.”","God told Moses to stretch out his staff over the sea. A strong wind blew all night and the waters parted, forming a wall on each side. The Israelites crossed on dry ground.","When the Egyptians tried to follow them, the waters returned to their place. That day the people saw God's power, believed in Him and sang a song of victory."],"q":[["What did Pharaoh do after letting the people go?","He changed his mind and chased them","He gave them gold","He moved to another country","He built them a bridge"],["What did Moses tell the frightened people?","Not to fear and to see the salvation of the Lord","To run to the mountains","To surrender","To go back to Egypt"],["How did the sea open?","A strong wind blew all night","The sun dried it up","They built a boat","There was an earthquake"],["How did the people react at the end?","They believed in God and sang for joy","They went back to Egypt","They complained again","They split up"]]},{"t":"David and Goliath","r":"1 Samuel 17","x":["The Philistines and the Israelites faced each other in the Valley of Elah. Every day a giant named Goliath challenged Israel's army, and no one dared to fight him.","David, the youngest son of Jesse, came to bring food to his brothers. When he heard Goliath mocking God, he offered to fight. King Saul lent him his armor, but David couldn't even walk in it.","David took only his staff, his sling and five smooth stones from the brook. He told the giant: “Thou comest to me with a sword, and with a spear… but I come to thee in the name of the Lord.”","With a single stone, David brought Goliath down. The young shepherd had learned to trust God while caring for sheep, when God rescued him from the lion and the bear."],"q":[["Why did David want to fight?","Because Goliath was mocking God","Because he wanted to be rich","Because Saul forced him","Because he hated the Philistines"],["Why didn't he use the king's armor?","He couldn't walk in it","It was ugly","It was broken","It was stolen"],["How many stones did he take from the brook?","Five","One","Three","Twelve"],["Where did David learn to trust God?","Caring for sheep, when he was rescued from the lion and the bear","At the king's school","In the temple in Jerusalem","In Egypt"]]},{"t":"Daniel in the lions' den","r":"Daniel 6","x":["Daniel was so wise and honest that King Darius planned to set him over the whole kingdom. Other officials, full of envy, looked for something to accuse him of, but they found nothing wrong in him.","So they convinced the king to sign a law: for thirty days no one could pray to any god, only to the king. Whoever disobeyed would be thrown into the lions' den.","Daniel knew about it, but he went home, opened his windows toward Jerusalem and prayed three times a day, as always. He was accused, and the king, very sad, had to throw him into the den.","The next morning, the king ran to the den and called his name. Daniel answered: “My God hath sent his angel, and hath shut the lions' mouths.” The king rejoiced and ordered everyone to respect Daniel's God."],"q":[["Why did the officials want to accuse Daniel?","Out of envy","Because he stole from the king","Because he lied","Because he was a rich foreigner"],["What did the new law forbid?","Praying to any god other than the king","Eating meat","Going out at night","Traveling to Jerusalem"],["What did Daniel do when he learned about the law?","He kept praying three times a day","He stopped praying","He fled the city","He prayed in secret once"],["How did the king feel at the end?","He rejoiced","He was angry with Daniel","He wept with sadness","He left the kingdom"]]},{"t":"Esther, the brave queen","r":"Esther 3–8","x":["Esther was a young Jewish orphan, raised by her cousin Mordecai. Because of her beauty she was chosen queen of Persia, though she told no one which people she came from.","A powerful man named Haman hated Mordecai and convinced the king to sign an order to destroy all the Jews. Mordecai asked Esther to speak to the king: “Who knoweth whether thou art come to the kingdom for such a time as this?”","But there was a problem: anyone who went before the king without being called could die. Esther asked her people to fast three days with her and said: “If I perish, I perish.”","The king received her with his golden scepter. At a banquet, Esther revealed Haman's plan, and the king saved the Jews. To this day they celebrate that victory at the feast of Purim."],"q":[["Who raised Esther?","Her cousin Mordecai","The king of Persia","Her mother","A priest"],["What did Haman want to do?","Destroy all the Jews","Become king of Persia","Marry Esther","Build a temple"],["Why was it dangerous to go before the king?","Anyone who came without being called could die","The king was sick","He was very far away","It was nighttime"],["What did Esther do before going to the king?","She fasted three days with her people","She ran away from the palace","She wrote a letter","She hid"]]},{"t":"Jonah and the great fish","r":"Jonah 1–3","x":["God asked Jonah to go to Nineveh, a great city that was an enemy of Israel, to warn them to repent. But Jonah didn't want to, and he boarded a ship going the opposite way, toward Tarshish.","At sea a storm broke out so strong that the sailors thought they would die. Jonah confessed he was running from God and told them to throw him into the water. As soon as they did, the sea became calm.","God prepared a great fish that swallowed Jonah. For three days and three nights Jonah prayed from inside the fish, and God commanded the fish to spit him out on dry land.","This time Jonah obeyed. He preached in Nineveh, and the whole city, from the king to the least of them, repented. God had mercy on them."],"q":[["To which city did God send Jonah?","Nineveh","Tarshish","Jerusalem","Babylon"],["What happened when they threw Jonah into the sea?","The sea became calm","The storm got worse","The ship sank","They reached Nineveh"],["What did Jonah do inside the fish?","He prayed to God","He slept the whole time","He called the sailors for help","He wrote a letter"],["What did the people of Nineveh do when they heard him?","They repented","They threw him out of the city","They mocked him","They put him in jail"]]},{"t":"Elijah and fire from heaven","r":"1 Kings 18","x":["In the days of King Ahab, the people of Israel worshiped the false god Baal. The prophet Elijah challenged them on Mount Carmel: him alone against 450 prophets of Baal.","Each side would prepare an altar with a sacrifice, but no fire. The god who answered by fire would be the true God. The prophets of Baal shouted and danced all day, but no one answered.","Elijah rebuilt the altar of the Lord with twelve stones and had water poured on it three times, until the trench around it was full. Then he prayed a simple prayer so the people would know that the Lord was God.","Instantly fire fell from heaven and consumed the sacrifice, the wood, the stones and even the water. The people fell on their faces and cried out: “The Lord, he is the God!”"],"q":[["How many prophets of Baal was Elijah against?","450","12","40","1000"],["What happened when the prophets of Baal prayed?","No one answered","Fire fell","It started to rain","The altar fell over"],["Why did Elijah soak the altar with water?","To show that the fire came from God","To clean it","Because it was hot","By mistake"],["What did the people cry out at the end?","The Lord, he is the God!","Baal is great!","Long live the king!","Let it rain!"]]},{"t":"Peter walks on water","r":"Matthew 14:22-33","x":["After feeding five thousand people, Jesus sent His disciples across the sea in a boat while He went up the mountain to pray.","Before dawn, the wind was against them and the waves were beating on the boat. Then they saw someone walking on the water and cried out in fear, thinking it was a ghost. Jesus told them: “Be of good cheer; it is I; be not afraid.”","Peter said to Him: “Lord, if it be thou, bid me come unto thee on the water.” Jesus said: “Come.” Peter got out of the boat and walked on the water toward Jesus.","But when he saw the strong wind, he was afraid and began to sink. He cried out: “Lord, save me!” Jesus stretched out His hand and said: “O thou of little faith, wherefore didst thou doubt?” When they got into the boat, the wind stopped."],"q":[["What did the disciples think when they saw Jesus on the water?","That He was a ghost","That He was an angel","That He was Moses","That He was a fish"],["What did Peter ask Jesus?","To tell him to come to Him","To calm the wind","To get into the boat","To do a miracle"],["Why did Peter begin to sink?","He was afraid when he saw the wind","He was very tired","The waves pushed him","He slipped"],["What does this story teach?","To keep our eyes on Jesus in the middle of storms","Never to get into boats","That Peter knew how to swim","That the sea is dangerous"]]},{"t":"Lazarus, come forth!","r":"John 11","x":["Lazarus lived in Bethany with his sisters Martha and Mary, and they were dear friends of Jesus. One day Lazarus became very sick, and his sisters sent word to Jesus.","Jesus waited two days before going. When He arrived, Lazarus had been in the tomb four days. Martha said to Him: “Lord, if thou hadst been here, my brother had not died.” Jesus answered: “I am the resurrection, and the life.”","When He saw Mary and everyone weeping, Jesus wept too. Then He went to the tomb, a cave covered with a stone, and asked them to take it away.","Jesus prayed to the Father and cried with a loud voice: “Lazarus, come forth!” And the man who had died came out, still wrapped in grave clothes. Many who saw this believed in Jesus."],"q":[["What were the names of Lazarus' sisters?","Martha and Mary","Esther and Ruth","Sarah and Rebekah","Hannah and Elizabeth"],["How many days had Lazarus been in the tomb?","Four","One","Seven","Three"],["What did Jesus do when He saw everyone weeping?","He wept too","He left","He scolded them","He laughed"],["What did Jesus say about Himself to Martha?","I am the resurrection and the life","I am the bread of life","I am the light of the world","I am the door"]]}]};

function bookIdx(q){
  q=norm(q).replace(/ /g,'');
  let m=q.match(/^([123])?(.*)$/); let num=m[1]||'', base=m[2];
  if(ABBR[base]) base=ABBR[base];
  for(let i=0;i<NNAMES.length;i++){
    const n=NNAMES[i].replace(/ /g,'');
    const nm=n.match(/^([123])?(.*)$/);
    if((nm[1]||'')===num && nm[2].startsWith(base) && base.length>=2) return i%SN.length;
  }
  return -1;
}
function parseRef(r){
  const m=String(r).trim().match(/^(.+?)\s+(\d+)(?::(\d+)(?:-(\d+))?)?$/);
  if(!m) return null;
  const b=bookIdx(m[1]); if(b<0) return null;
  const c=+m[2]; if(!nV(b,c)) return null;
  const v1=m[3]?+m[3]:null, v2=m[4]?+m[4]:v1;
  return {b,c,v1,v2};
}
function keyRef(p){ return SN[p.b]+' '+p.c+(p.v1?':'+p.v1+(p.v2&&p.v2!==p.v1?'-'+p.v2:''):''); }
function refLabel(p){ return (LANG==='en'&&p.b===18&&p.c?'Psalm':NAMES[p.b])+' '+p.c+(p.v1?':'+p.v1+(p.v2&&p.v2!==p.v1?'-'+p.v2:''):''); }
function verses(p){
  const out=[], n=nV(p.b,p.c);
  const a=p.v1||1, z=Math.min(p.v2||n,n);
  for(let v=a; v<=z; v++){ const t=getV(p.b,p.c,v); if(t) out.push([v,t]); }
  return out;
}
function plain(p){ return verses(p).map(x=>x[1]).join(' '); }

const STOP=new Set(('the and of to in what does say says about for with from that this is are was were how where when who which bible verse verses god jesus want need tell show me my i you your on at by it be do an or as not '+'que qué de del la las el los un una unos unas y o a en por para con sin sobre dice dicen habla hablan biblia versiculo versiculos cita citas texto textos donde cual cuales como cuando me mi mis te tu tus se lo le les es son esta estoy estar ser hay algo acerca respecto tema temas quiero busco necesito dame ensename sobre al su sus yo nos muy mas pero porque si no ya tengo tiene hacer dios').split(' ').map(norm));
function tokens(q){ return norm(q).split(' ').filter(t=>t.length>=3 && !STOP.has(t)); }
const stem=t=>t.length>5?t.slice(0,t.length-2):t;
TEMAS.forEach(t=>{ t.id=slug(t.t); t.nt=norm(t.t); t.words=(norm(t.t)+' '+norm(t.k)+' '+norm(t.c)).split(' '); t.refs=t.r.split(';').map(s=>s.trim()).filter(Boolean); });

function searchTopics(q){
  const nq=norm(q), toks=tokens(q); if(!toks.length && !nq) return [];
  const wantsJesus=/\bjesus|cristo|christ\b/.test(nq);
  const res=[];
  for(const t of TEMAS){
    let s=0;
    for(const tk of toks){
      if(tk==='jesus'||tk==='cristo'||tk==='jesucristo'||tk==='christ'){ continue; }
      const st=stem(tk);
      if(t.nt.split(' ').some(w=>w.startsWith(st))) s+=5;
      else if(t.words.some(w=>w.length>=3 && (w.startsWith(st)||st.startsWith(w)&&w.length>=4))) s+=3;
    }
    if(s>0 && wantsJesus && t.c==='Jesús') s+=2;
    if(s===0 && wantsJesus && toks.every(x=>['jesus','cristo','jesucristo','christ'].includes(x)) && t.c==='Jesús') s=1;
    if(nq.length>3 && t.nt===nq) s+=10;
    if(s>0 && toks[0] && t.nt.startsWith(stem(toks[0]))) s+=2;
    if(s>0) res.push([s,t]);
  }
  return res.sort((a,b)=>b[0]-a[0]).slice(0,8).map(x=>x[1]);
}
function buildNorm(){ if(NORMV) return; NORMV=[]; NAMES.map((_,b)=>BOOKS[b]).forEach((bk,b)=>bk.forEach((ch,c)=>ch.forEach((v,i)=>{ if(v) NORMV.push([b,c+1,i+1,' '+norm(v)]); }))); }
function searchText(q){
  const toks=tokens(q).filter(t=>!['jesus'].includes(t)||tokens(q).length===1);
  if(!toks.length) return {toks:[],hits:[]};
  buildNorm();
  const hits=[];
  for(const [b,c,v,n] of NORMV){
    if(toks.every(t=>n.includes(' '+t))) { hits.push(SN[b]+' '+c+':'+v); if(hits.length>=150) break; }
  }
  return {toks,hits};
}

}

function runSearch(q){
  lastQuery=q; store.set('q',q);
  const res=$('#res'), extra=$('#home-extra');
  if(!q.trim()){ res.innerHTML=''; extra.style.display=''; return; }
  extra.style.display='none';
  // ¿es una cita?
  const p=parseRef(q);
  if(p){
    const r=keyRef(p);
    const one = p.v1 ? card(r) : '';
    res.innerHTML = (one?'<h2 class="sec">'+L('Cita','Reference')+'</h2>'+one:'') + `<a class="btn pri" style="width:100%;margin-top:6px" href="#lee-${p.b}-${p.c}-${p.v1||1}">${ICON.book.replace('<svg','<svg width="18" height="18"')} ${L('Leer','Read')} ${esc(NAMES[p.b])} ${p.c} ${L('completo','')}</a>`;
    return;
  }
  const tps=searchTopics(q);
  let html='';
  if(tps.length){
    const best=tps[0];
    html+=`<h2 class="sec">${L('Tema','Topic')}: ${esc(best.t)}</h2><p class="intro">${esc(best.d)}</p>`;
    html+=best.refs.slice(0,4).map(r=>card(r)).join('');
    html+=`<a class="btn pri" style="width:100%" href="#t-${best.id}">${L(`Ver los ${best.refs.length} pasajes de «${esc(best.t)}»`,`See all ${best.refs.length} passages on “${esc(best.t)}”`)}</a>`;
    if(tps.length>1) html+=`<h2 class="sec">${L('Temas relacionados','Related topics')}</h2><div class="tlist">${tps.slice(1).map(trow).join('')}</div>`;
  }
  const hasToks=tokens(q).length>0;
  const textPart=()=>{ const {toks,hits}=searchText(q); let h='';
    if(hits.length){ h+=`<h2 class="sec">${L('En el texto de la Biblia','In the text of the Bible')}</h2><p class="count">${hits.length>=150?L('Más de 150','More than 150'):hits.length} ${L('versículo','verse')}${hits.length===1?'':'s'} ${L('con','with')} «${esc(toks.join(' '))}»${hits.length>30?L(' · se muestran 30',' · showing 30'):''}</p>`; h+=hits.slice(0,30).map(r=>card(r,toks)).join(''); }
    if(!h && !html) h=L(`<div class="empty">No encontré nada con «${esc(q)}».<br>Prueba con otra palabra, como <b>familia</b>, <b>paz</b> o <b>perdón</b>.</div>`,`<div class="empty">I couldn't find anything for “${esc(q)}”.<br>Try another word, like <b>family</b>, <b>peace</b> or <b>forgiveness</b>.</div>`);
    return h; };
  if(ALLP && NORMV){ res.innerHTML=html+textPart(); return; }
  res.innerHTML=html+(hasToks?'<div id="txtres"><p class="count" style="margin-top:20px">'+L('Buscando en toda la Biblia…','Searching the whole Bible…')+'</p></div>':'');
  if(!hasToks){ if(!html) res.innerHTML=`<div class="empty">${L('No encontré nada con','Nothing found for')} «${esc(q)}».</div>`; return; }
  loadAll().then(()=>{ if(lastQuery!==q) return; const el=$('#txtres'); if(el) el.outerHTML=textPart()||''; })
    .catch(()=>{ const el=$('#txtres'); if(el) el.innerHTML='<p class="count">'+L('Sin conexión para buscar en toda la Biblia.','No connection to search the whole Bible.')+'</p>'; });
}

os y crecemos juntos.","h":"Escríbele hoy a un hermano de tu iglesia para animarlo.","q":[["¿En qué fiesta descendió el Espíritu Santo sobre la iglesia?","Pentecostés","Pascua","Tabernáculos","Purim"],["¿Cuántas personas se bautizaron tras el sermón de Pedro en Hechos 2?","Unas tres mil","Doce","Cien","Diez mil"],["Pablo compara a la iglesia con un…","Cuerpo","Ejército","Palacio","Barco"]]}]},{"u":"Corazón y carácter","c":"#b07a1e","l":[{"t":"Perdonar","v":"Efesios 4:32","w":"perdonándoos","r":"Perdonar no significa que lo que pasó estuvo bien. Es soltar la deuda y dejarle a Dios la justicia, porque Él nos perdonó primero.","h":"Piensa en alguien a quien te cuesta perdonar y ora por esa persona.","q":[["¿Cuántas veces dijo Jesús que hay que perdonar?","Setenta veces siete","Siete veces","Tres veces","Una vez"],["En el Padre Nuestro pedimos perdón así como…","Perdonamos a nuestros deudores","Lo merecemos","Pagamos","Prometemos cambiar"],["¿Qué hizo José con los hermanos que lo vendieron?","Los perdonó","Los encarceló","Los vendió","Los ignoró"]]},{"t":"Ansiedad","v":"1 Pedro 5:7","w":"solicitud","r":"Dios no te pide que no sientas nada, sino que le lleves lo que te preocupa. Él cuida de ti más de lo que imaginas, como cuida de las aves y de los lirios.","h":"Haz una lista de tus preocupaciones y entrégaselas a Dios una por una.","q":[["Jesús dijo que miremos a las aves y a los…","Lirios del campo","Árboles","Peces","Montes"],["Según Filipenses 4:7, ¿qué guarda nuestros corazones?","La paz de Dios","El dinero","El esfuerzo","La suerte"],["Según Mateo 6:33, ¿qué debemos buscar primero?","El reino de Dios y su justicia","Trabajo","Seguridad","Comida"]]},{"t":"Las palabras","v":"Proverbios 15:1","w":"blanda","r":"Tus palabras pueden construir o destruir. Santiago compara la lengua con un pequeño fuego. Hablar con gracia es una forma de amar.","h":"Dile hoy a alguien algo que lo anime.","q":[["Según Proverbios 18:21, ¿qué está en poder de la lengua?","La muerte y la vida","La riqueza","La fama","La sabiduría"],["Santiago compara la lengua con un pequeño…","Fuego","Pájaro","Río","Árbol"],["Según Efesios 4:29, nuestras palabras deben servir para…","Edificar","Ganar discusiones","Impresionar","Criticar"]]},{"t":"Humildad","v":"Santiago 4:6","w":"humildes","r":"Jesús, siendo Dios, lavó los pies de sus discípulos. En su reino, la verdadera grandeza es servir a otros.","h":"Haz hoy un favor sin que nadie se entere.","q":[["¿Qué hizo Jesús en la última cena para enseñar humildad?","Lavó los pies de sus discípulos","Les dio dinero","Les cantó","Les regaló túnicas"],["Según Proverbios 16:18, antes del quebrantamiento viene la…","Soberbia","Tristeza","Pobreza","Lluvia"],["Jesús dijo que el que quiera ser grande sea…","Servidor de los demás","El líder","El más rico","El más sabio"]]},{"t":"El fruto del Espíritu","v":"Gálatas 5:22","w":"paz","r":"El fruto no se fabrica a la fuerza: crece cuando permanecemos unidos a Jesús, como la rama a la vid. Dato curioso: la Reina-Valera 1909 traduce «amor» como «caridad».","h":"¿Qué fruto necesitas más hoy? Pídeselo a Dios.","q":[["¿Cuál de estos es fruto del Espíritu?","Paz","Fama","Riqueza","Fuerza física"],["Jesús dijo: Yo soy la vid, vosotros los…","Pámpanos","Frutos","Labradores","Árboles"],["¿Cuántas cualidades del fruto del Espíritu menciona Gálatas 5:22-23?","Nueve","Siete","Doce","Tres"]]}]},{"u":"La misión","c":"#2f7f86","l":[{"t":"El Espíritu Santo","v":"Hechos 1:8","w":"testigos","r":"Jesús no dejó solos a sus discípulos: les prometió el poder del Espíritu Santo para ser sus testigos. Ese mismo Espíritu vive hoy en cada creyente.","h":"Pide al Espíritu Santo valor para hablar de Jesús.","q":[["¿Qué apareció sobre los discípulos en Pentecostés?","Lenguas como de fuego","Una paloma","Un arcoíris","Una estrella"],["¿Quién predicó el sermón de Pentecostés?","Pedro","Pablo","Juan","Esteban"],["¿Hasta dónde dijo Jesús que serían sus testigos?","Hasta lo último de la tierra","Solo en Jerusalén","Solo en Israel","Hasta Roma"]]},{"t":"Pablo","v":"Filipenses 1:21","w":"ganancia","r":"Saulo perseguía a los cristianos hasta que Jesús lo encontró camino a Damasco. Se convirtió en Pablo, el gran misionero. Nadie está demasiado lejos para Dios.","h":"Ora por alguien que parece estar lejos de Dios.","q":[["¿Cómo se llamaba Pablo antes de su conversión?","Saulo","Simón","Silas","Bernabé"],["¿Camino a qué ciudad se encontró Pablo con Jesús?","Damasco","Roma","Atenas","Corinto"],["¿Qué le pasó a Pablo después de ver la luz del cielo?","Quedó ciego tres días","Se volvió rico","Huyó a Egipto","Perdió la voz"]]},{"t":"La gran misión","v":"Marcos 16:15","w":"evangelio","r":"Las últimas palabras de Jesús antes de subir al cielo fueron una misión: ir y hacer discípulos. Esa misión empieza con las personas cercanas a ti.","h":"Invita a alguien a leer un versículo contigo esta semana.","q":[["¿A quiénes envió Jesús a predicar el evangelio?","A toda criatura","Solo a los judíos","Solo a los pobres","Solo a los sacerdotes"],["¿Qué prometió Jesús en Mateo 28:20?","Estar con nosotros todos los días","Hacernos ricos","Que no habría problemas","Volver al día siguiente"],["Según Romanos 1:16, el evangelio es…","Poder de Dios para salvación","Una tradición","Solo para sabios","Una filosofía"]]},{"t":"Tus dones","v":"1 Pedro 4:10","w":"don","r":"Dios te dio talentos y dones no para guardarlos, sino para servir a otros. En el cuerpo de Cristo nadie sobra y todos hacen falta.","h":"Piensa en un don que tienes y en cómo usarlo esta semana para servir.","q":[["En la parábola de los talentos, ¿qué hizo el siervo malo con su talento?","Lo escondió en la tierra","Lo duplicó","Lo regaló","Lo perdió en el mar"],["Según 1 Corintios 12, los dones vienen de…","Un mismo Espíritu","Los estudios","La herencia","La suerte"],["Según 1 Pedro 4:10, ¿para qué son los dones?","Para servir a los demás","Para presumir","Para ganar dinero","Para ser famoso"]]},{"t":"Él volverá","v":"Apocalipsis 22:20","w":"breve","r":"La historia no termina en caos: Jesús volverá y hará nuevas todas las cosas. Ya no habrá llanto ni dolor. Esa esperanza nos ayuda a vivir hoy con propósito.","h":"Vive hoy como alguien que espera a Jesús: con amor y esperanza.","q":[["¿Quién sabe el día y la hora de la venida de Jesús?","Solo el Padre","Los ángeles","Los profetas","Los sacerdotes"],["Según Apocalipsis 21:4, ¿qué limpiará Dios de nuestros ojos?","Toda lágrima","El polvo","La ceguera","El sueño"],["¿Cuál es el último libro de la Biblia?","Apocalipsis","Judas","Malaquías","Hechos"]]}]},{"u":"Antes de su ministerio","c":"#3f7a5a","l":[{"t":"El anuncio a María","v":"Lucas 1:37","w":"imposible","r":"El ángel Gabriel visitó a una joven sencilla de Nazaret con una noticia imposible. María no lo entendía todo, pero respondió con fe: «He aquí la sierva del Señor».","h":"Dile a Dios «aquí estoy» en algo que te pide, aunque no lo entiendas todo.","q":[["¿Qué ángel visitó a María?","Gabriel","Miguel","Rafael","Uriel"],["¿En qué ciudad vivía María?","Nazaret","Belén","Jerusalén","Jericó"],["¿Con quién estaba comprometida María?","José","Zacarías","Juan","Simeón"]]},{"t":"Los magos de oriente","v":"Mateo 2:11","w":"adoraron","r":"Unos sabios de oriente viajaron muy lejos siguiendo una estrella. Cuando encontraron al niño, se arrodillaron y le dieron lo mejor que tenían.","h":"Dale hoy a Dios lo mejor de tu tiempo: empieza el día con Él.","q":[["¿Qué siguieron los magos para encontrar a Jesús?","Una estrella","Un ángel","Un río","Una nube"],["¿Qué regalos le dieron?","Oro, incienso y mirra","Pan, vino y aceite","Plata, ropa y joyas","Corderos y palomas"],["¿Qué rey quiso matar al niño Jesús?","Herodes","Saúl","Pilato","Nabucodonosor"]]},{"t":"Jesús a los doce años","v":"Lucas 2:52","w":"sabiduría","r":"A los doce años, Jesús se quedó en el templo escuchando y preguntando a los maestros. Sus padres lo buscaron tres días. Jesús crecía en sabiduría, en estatura y en gracia.","h":"Crece hoy en algo: aprende algo nuevo, cuida tu cuerpo o sé amable con alguien.","q":[["¿Qué edad tenía Jesús cuando se quedó en el templo?","Doce años","Siete años","Treinta años","Quince años"],["¿Cuántos días lo buscaron sus padres?","Tres","Uno","Siete","Diez"],["¿Qué hacía Jesús en el templo?","Escuchaba y preguntaba a los maestros","Vendía palomas","Dormía","Predicaba a la multitud"]]},{"t":"El bautismo","v":"Mateo 3:17","w":"amado","r":"Antes de hacer un solo milagro, Jesús escuchó la voz del Padre: «Este es mi Hijo amado». El amor de Dios no se gana con logros: es el punto de partida.","h":"Antes de cualquier cosa que hagas hoy, recuerda que eres amado por Dios.","q":[["¿Quién bautizó a Jesús?","Juan el Bautista","Pedro","Pablo","Elías"],["¿En qué río fue bautizado?","Jordán","Nilo","Éufrates","Tigris"],["¿En qué forma descendió el Espíritu Santo?","Como paloma","Como fuego","Como viento","Como nube"]]},{"t":"La tentación en el desierto","v":"Mateo 4:4","w":"pan","r":"Jesús ayunó cuarenta días y el diablo lo tentó tres veces. Cada vez respondió con la Palabra de Dios. Esa es también nuestra mejor arma.","h":"Memoriza hoy un versículo para usarlo cuando llegue la tentación.","q":[["¿Cuántos días ayunó Jesús en el desierto?","Cuarenta","Siete","Tres","Doce"],["¿Con qué respondió Jesús a cada tentación?","Con la Palabra de Dios","Con un milagro","Con silencio","Con enojo"],["¿Qué le pidió el diablo que convirtiera en pan?","Piedras","Arena","Agua","Hojas"]]}]},{"u":"Sus enseñanzas","c":"#3b5f8a","l":[{"t":"Las bienaventuranzas","v":"Mateo 5:8","w":"limpio","r":"Jesús empezó su gran sermón diciendo que los dichosos no son los fuertes ni los ricos, sino los humildes, los que lloran, los mansos y los de corazón limpio.","h":"Piensa qué bienaventuranza necesitas vivir hoy.","q":[["¿Cómo se llama el sermón donde están las bienaventuranzas?","Sermón del Monte","Sermón del Mar","Sermón del Templo","Sermón de Pentecostés"],["¿Qué verán los de limpio corazón?","A Dios","Riquezas","Ángeles","El futuro"],["Según Jesús, ¿qué recibirán los mansos?","La tierra","Un reino de oro","Mucho dinero","Una corona"]]},{"t":"Sal y luz","v":"Mateo 5:14","w":"luz","r":"Jesús dijo que sus seguidores son sal y luz: la sal da sabor y conserva; la luz muestra el camino. No se trata de esconderse, sino de brillar con buenas obras.","h":"Haz hoy una buena obra que muestre el amor de Dios.","q":[["Jesús dijo que sus seguidores son la sal de la…","Tierra","Mesa","Ciudad","Iglesia"],["¿Dónde no se pone una lámpara encendida?","Debajo de un almud (un cajón)","Sobre el candelero","En la mesa","En la ventana"],["¿Para qué deben verse nuestras buenas obras?","Para que glorifiquen al Padre","Para ser famosos","Para ganar premios","Para que nos admiren"]]},{"t":"No te preocupes por mañana","v":"Mateo 6:34","w":"mañana","r":"Jesús señaló las aves y los lirios: Dios los cuida sin que ellos se preocupen. Si cuida de ellos, cuánto más de ti. Vive un día a la vez.","h":"Hoy, cada vez que te preocupes por el futuro, di: «Dios ya está ahí».","q":[["¿Qué ejemplos de la naturaleza usó Jesús contra la preocupación?","Las aves y los lirios","Los leones y el mar","Las estrellas y la luna","Los árboles y el viento"],["Según Mateo 6:33, ¿qué hay que buscar primero?","El reino de Dios","El trabajo","El dinero","La paz"],["¿Qué rey mencionó Jesús que no se vistió como un lirio?","Salomón","David","Saúl","Herodes"]]},{"t":"La casa sobre la roca","v":"Mateo 7:24","w":"peña","r":"Jesús terminó su sermón con dos casas: una sobre la roca y otra sobre la arena. Las dos enfrentaron la tormenta. La diferencia fue poner en práctica lo que oyeron.","h":"Elige una enseñanza de Jesús y practícala hoy.","q":[["¿Qué le pasó a la casa construida sobre la arena?","Se cayó","Se mantuvo firme","Se quemó","La vendieron"],["Según Jesús, el hombre prudente es el que…","Oye sus palabras y las hace","Solo las oye","Las escribe","Las memoriza"],["¿Qué golpeó a las dos casas?","Lluvia, ríos y vientos","Un terremoto","Fuego","Ladrones"]]},{"t":"El gran mandamiento","v":"Mateo 22:37","w":"corazón","r":"Un experto en la ley le preguntó cuál era el mandamiento más importante. Jesús resumió toda la ley en dos: amar a Dios con todo y amar al prójimo como a uno mismo.","h":"Ama hoy a Dios con tu tiempo y a tu prójimo con un acto concreto.","q":[["¿Cuál es el primer y gran mandamiento según Jesús?","Amar a Dios con todo el corazón","No robar","Guardar el sábado","Honrar a los padres"],["¿Cuál es el segundo?","Amar al prójimo como a ti mismo","No mentir","Dar el diezmo","Ayunar"],["¿Con qué dijo Jesús que hay que amar a Dios?","Corazón, alma y mente","Dinero y tiempo","Palabras y canciones","Ojos y manos"]]}]},{"u":"Sus milagros","c":"#b07a1e","l":[{"t":"Agua en vino","v":"Juan 2:11","w":"señales","r":"En una boda se acabó el vino, algo muy vergonzoso para los novios. María dijo a los sirvientes: «Haced todo lo que os diga». Jesús convirtió el agua en el mejor vino.","h":"Lleva a Jesús algo que «se acabó» en tu vida y haz lo que Él te diga.","q":[["¿Dónde fue la boda?","Caná de Galilea","Jerusalén","Belén","Nazaret"],["¿Qué dijo María a los sirvientes?","Haced todo lo que os diga","Id a comprar vino","Llamad a los invitados","Esperad afuera"],["¿Cuántas tinajas de piedra había?","Seis","Doce","Tres","Siete"]]},{"t":"El paralítico y sus amigos","v":"Marcos 2:5","w":"perdonados","r":"Cuatro amigos no podían entrar por la multitud, así que abrieron el techo y bajaron a su amigo paralítico frente a Jesús. Jesús vio la fe de ellos.","h":"¿Por qué amigo puedes «abrir el techo» hoy en oración?","q":[["¿Cuántos amigos cargaban al paralítico?","Cuatro","Dos","Doce","Siete"],["¿Por dónde lo bajaron?","Por el techo","Por la ventana","Por la puerta trasera","Por un pozo"],["¿Qué le dijo Jesús primero?","Tus pecados te son perdonados","Levántate y corre","Vete a tu casa","No digas nada"]]},{"t":"Cinco panes y dos peces","v":"Juan 6:9","w":"panes","r":"Frente a miles de personas con hambre, un muchacho entregó lo poco que tenía. En manos de Jesús, eso poco alimentó a cinco mil y sobraron doce canastas.","h":"Entrégale a Dios algo «pequeño» que tienes: tiempo, un talento, una ayuda.","q":[["¿Quién tenía los panes y los peces?","Un muchacho","Pedro","Una viuda","Un fariseo"],["¿Cuántas canastas sobraron?","Doce","Cinco","Siete","Ninguna"],["¿De qué eran los panes?","Cebada","Trigo","Maíz","Centeno"]]},{"t":"El ciego Bartimeo","v":"Marcos 10:52","w":"salvado","r":"Bartimeo, un mendigo ciego, gritó: «¡Jesús, Hijo de David, ten misericordia de mí!». La gente quería callarlo, pero él gritó más fuerte, y Jesús se detuvo por él.","h":"No te quedes callado: clama a Jesús por lo que necesitas.","q":[["¿Cómo se llamaba el ciego?","Bartimeo","Lázaro","Zaqueo","Nicodemo"],["¿Qué hacía la gente cuando gritaba?","Le decían que se callara","Lo ayudaban a caminar","Le daban dinero","Lo cargaban"],["¿Qué hizo Bartimeo después de recibir la vista?","Siguió a Jesús en el camino","Se fue a su casa","Volvió a mendigar","Se escondió"]]},{"t":"La hija de Jairo","v":"Marcos 5:36","w":"cree","r":"Jairo, un líder de la sinagoga, le rogó a Jesús por su hija moribunda. En el camino le avisaron que ya había muerto. Jesús le dijo: «No temas, cree solamente», y la levantó.","h":"Ante la noticia más difícil, escucha a Jesús: «No temas, cree».","q":[["¿Quién era Jairo?","Un principal de la sinagoga","Un pescador","Un soldado romano","Un cobrador de impuestos"],["¿Qué le dijo Jesús al recibir la mala noticia?","No temas, cree solamente","Ya es tarde","Vuelve mañana","Llora con ellos"],["¿Qué edad tenía la niña?","Doce años","Cinco años","Veinte años","Un año"]]}]},{"u":"Sus parábolas","c":"#7a4f9a","l":[{"t":"El sembrador","v":"Mateo 13:23","w":"fruto","r":"Un sembrador echó semilla en cuatro tipos de suelo: el camino, las piedras, los espinos y la buena tierra. La semilla es la Palabra y el suelo es nuestro corazón.","h":"Pregúntate qué tipo de suelo es tu corazón hoy y quita una «espina».","q":[["¿Qué representa la semilla?","La Palabra de Dios","El dinero","Los hijos","El trabajo"],["¿Qué ahogó la semilla entre espinos?","Los afanes y las riquezas","Las aves","El sol","La lluvia"],["¿Qué suelo dio fruto?","La buena tierra","El camino","Las piedras","Los espinos"]]},{"t":"La oveja perdida","v":"Lucas 15:7","w":"gozo","r":"Un pastor tenía cien ovejas y perdió una. Dejó las noventa y nueve para buscarla y, al encontrarla, la cargó feliz. Así te busca Dios a ti.","h":"Si conoces a alguien alejado, búscalo hoy con un mensaje amable.","q":[["¿Cuántas ovejas tenía el pastor?","Cien","Diez","Mil","Cincuenta"],["¿Qué hizo al encontrar a la oveja?","La cargó sobre sus hombros, gozoso","La regañó","La vendió","La dejó ahí"],["¿Qué otras cosas perdidas aparecen en Lucas 15?","Una moneda y un hijo","Un anillo y una llave","Un camello y un burro","Un barco y una red"]]},{"t":"El hijo pródigo","v":"Lucas 15:24","w":"perdido","r":"El hijo menor pidió su herencia, la malgastó y terminó cuidando cerdos. Al volver arrepentido, su padre corrió a abrazarlo e hizo fiesta. El hermano mayor, en cambio, se enojó.","h":"¿Te pareces hoy más al hijo menor o al mayor? Habla con Dios de eso.","q":[["¿En qué trabajó el hijo menor al quedarse sin dinero?","Cuidando cerdos","Pescando","Construyendo casas","Vendiendo ropa"],["¿Qué hizo el padre al verlo de lejos?","Corrió y lo abrazó","Cerró la puerta","Lo esperó sentado","Mandó a un siervo"],["¿Cómo reaccionó el hermano mayor?","Se enojó y no quería entrar","Organizó la fiesta","Le dio su herencia","Lo abrazó primero"]]},{"t":"El buen samaritano","v":"Lucas 10:37","w":"mismo","r":"Un hombre fue asaltado y dejado medio muerto. Pasaron un sacerdote y un levita y siguieron de largo. Un samaritano, de un pueblo despreciado, se detuvo, lo curó y pagó su hospedaje.","h":"Detente hoy por alguien que necesite ayuda, aunque no sea «de los tuyos».","q":[["¿Quiénes pasaron de largo?","Un sacerdote y un levita","Dos soldados","Un rey y un siervo","Dos pescadores"],["¿A dónde llevó el samaritano al herido?","A un mesón","A su casa","Al templo","A Jerusalén"],["¿Qué pregunta respondió Jesús con esta parábola?","¿Quién es mi prójimo?","¿Cuándo vendrá el reino?","¿Cómo orar?","¿Quién es el mayor?"]]},{"t":"Los talentos","v":"Mateo 25:21","w":"fiel","r":"Un señor repartió talentos a tres siervos. Dos los multiplicaron; uno lo enterró por miedo. Dios no te pide tener mucho, sino ser fiel con lo que te dio.","h":"Usa hoy uno de tus talentos para bendecir a alguien.","q":[["¿Qué hizo el siervo malo con su talento?","Lo escondió en la tierra","Lo gastó","Lo duplicó","Lo regaló"],["¿Por qué lo escondió?","Por miedo","Porque lo quería regalar","Porque se le olvidó","Porque lo perdió"],["¿Qué les dijo el señor a los siervos fieles?","Bien, buen siervo y fiel","Váyanse","Denme todo","Trabajen más"]]}]},{"u":"Los últimos días","c":"#a8552c","l":[{"t":"La entrada a Jerusalén","v":"Mateo 21:9","w":"Hosanna","r":"Jesús entró a Jerusalén montado en un asno, como lo había anunciado el profeta Zacarías. La gente tendía mantos y ramas y gritaba «¡Hosanna!». Era un rey diferente: humilde y de paz.","h":"Alaba hoy a Jesús como tu Rey con una canción o una oración.","q":[["¿En qué animal entró Jesús a Jerusalén?","Un asno","Un caballo","Un camello","Un carro"],["¿Qué ponía la gente en el camino?","Mantos y ramas","Flores y oro","Piedras","Velas"],["¿Qué profeta anunció esta entrada?","Zacarías","Jonás","Elías","Daniel"]]},{"t":"El lavamiento de pies","v":"Juan 13:14","w":"pies","r":"En la última cena, Jesús tomó una toalla y lavó los pies sucios de sus discípulos, incluso los de Judas. Pedro no quería dejarse. El Maestro mostró que el amor sirve.","h":"Sirve hoy a alguien de tu casa en algo que nadie quiere hacer.","q":[["¿Qué discípulo no quería que Jesús le lavara los pies?","Pedro","Juan","Tomás","Andrés"],["¿En qué momento lavó Jesús los pies?","En la última cena","En su bautismo","En una boda","En el monte"],["¿Qué mandamiento nuevo dio Jesús esa noche?","Que se amen unos a otros","Que ayunen","Que vayan al templo","Que no coman pan"]]},{"t":"Getsemaní","v":"Lucas 22:42","w":"voluntad","r":"En el huerto de Getsemaní, Jesús oró con tanta angustia que su sudor era como gotas de sangre. Aun así se rindió al Padre: «No se haga mi voluntad, sino la tuya».","h":"Entrégale hoy a Dios una decisión difícil con esa misma oración.","q":[["¿Cómo se llamaba el huerto donde oró Jesús?","Getsemaní","Edén","Betania","Gólgota"],["¿Qué hacían los discípulos mientras Jesús oraba?","Dormían","Oraban con Él","Cantaban","Pescaban"],["¿Quién traicionó a Jesús con un beso?","Judas","Pedro","Tomás","Mateo"]]},{"t":"Consumado es","v":"Juan 19:30","w":"Consumado","r":"En la cruz, Jesús perdonó a quienes lo crucificaban, le prometió el paraíso a un ladrón arrepentido y cuidó de su madre. Su última palabra fue «Consumado es»: la deuda quedó pagada por completo.","h":"Da gracias porque tu deuda con Dios está pagada: no tienes que ganártela.","q":[["¿Qué le prometió Jesús al ladrón arrepentido?","Que estaría con Él en el paraíso","Que bajaría de la cruz","Que lo liberaría","Nada"],["¿A quién encargó Jesús el cuidado de su madre?","Al discípulo Juan","A Pedro","A Lázaro","A José de Arimatea"],["¿Qué significa «Consumado es»?","Que la obra quedó completa","Que tenía sed","Que se rendía","Que volvería pronto"]]},{"t":"La tumba sellada","v":"Mateo 27:66","w":"sepulcro","r":"José de Arimatea puso el cuerpo de Jesús en una tumba nueva cavada en la roca. Los líderes sellaron la piedra y pusieron guardias. Ningún sello podía detener lo que venía.","h":"Piensa en algo que parece «sellado» en tu vida y confíaselo a Dios.","q":[["¿Quién pidió el cuerpo de Jesús para sepultarlo?","José de Arimatea","Pedro","Pilato","Juan el Bautista"],["¿Qué pusieron para vigilar la tumba?","Guardias","Perros","Ángeles","Discípulos"],["¿Con qué estaba cerrada la tumba?","Una gran piedra","Una puerta de madera","Una reja","Nada"]]}]},{"u":"¡Vive!","c":"#2f7f86","l":[{"t":"La tumba vacía","v":"Lucas 24:6","w":"resucitado","r":"El domingo temprano, unas mujeres llevaron especias a la tumba. La piedra estaba removida y dos varones con ropas resplandecientes les preguntaron: «¿Por qué buscáis entre los muertos al que vive?».","h":"Cuéntale hoy a alguien lo que Jesús ha hecho en tu vida.","q":[["¿Qué día resucitó Jesús?","El primer día de la semana","El sábado","El viernes","El lunes"],["¿Qué llevaban las mujeres a la tumba?","Especias aromáticas","Flores","Pan","Velas"],["¿Qué les preguntaron los varones resplandecientes?","¿Por qué buscáis entre los muertos al que vive?","¿Dónde está Pedro?","¿Quién movió la piedra?","¿Tienen miedo?"]]},{"t":"Camino a Emaús","v":"Lucas 24:32","w":"ardía","r":"Dos discípulos caminaban tristes hacia Emaús. Jesús resucitado caminó con ellos, pero no lo reconocieron hasta que partió el pan. Él camina contigo aunque no lo notes.","h":"Al comer hoy, recuerda que Jesús está en tu mesa.","q":[["¿Hacia qué aldea iban los dos discípulos?","Emaús","Betania","Jericó","Nazaret"],["¿Cuándo reconocieron a Jesús?","Al partir el pan","Al ver sus heridas","Al oír su nombre","Al llegar a Jerusalén"],["¿Qué sentían mientras Jesús les explicaba las Escrituras?","Que les ardía el corazón","Miedo","Sueño","Enojo"]]},{"t":"Tomás ve y cree","v":"Juan 20:29","w":"creyeron","r":"Tomás no estaba cuando Jesús se apareció y dijo que no creería sin tocar sus heridas. Ocho días después, Jesús lo invitó a tocarlas. Tomás exclamó: «¡Señor mío, y Dios mío!».","h":"Lleva tus dudas a Jesús con honestidad: Él no te rechaza.","q":[["¿Qué dijo Tomás al ver a Jesús?","¡Señor mío, y Dios mío!","¡Es un fantasma!","¡No puede ser!","¡Perdóname!"],["¿Cuántos días después se le apareció Jesús a Tomás?","Ocho","Tres","Cuarenta","Uno"],["¿A quiénes llamó Jesús bienaventurados?","A los que no vieron y creyeron","A los que vieron","A los apóstoles","A los sacerdotes"]]},{"t":"Pedro restaurado","v":"Juan 21:17","w":"ovejas","r":"Pedro había negado a Jesús tres veces. Junto al mar, después de una pesca milagrosa, Jesús le preguntó tres veces «¿Me amas?» y le confió a sus ovejas. Jesús restaura a quien cae.","h":"Si le fallaste a Dios, vuelve hoy a Él: su respuesta es restaurarte.","q":[["¿Cuántas veces le preguntó Jesús a Pedro si lo amaba?","Tres","Una","Siete","Dos"],["¿Qué le encargó Jesús a Pedro?","Apacentar sus ovejas","Construir un templo","Volver a pescar","Escribir un libro"],["¿Dónde ocurrió esto?","Junto al mar de Galilea","En el templo","En Getsemaní","En Roma"]]},{"t":"Subió al cielo","v":"Hechos 1:11","w":"cielo","r":"Cuarenta días después de resucitar, Jesús subió al cielo frente a sus discípulos. Dos ángeles les dijeron que volvería de la misma manera. Mientras tanto, nos dejó una misión.","h":"Cumple hoy la misión: comparte un versículo con alguien.","q":[["¿Cuántos días estuvo Jesús con sus discípulos después de resucitar?","Cuarenta","Siete","Tres","Cien"],["¿Qué les dijeron los ángeles a los discípulos?","Que Jesús volverá de la misma manera","Que se fueran a casa","Que Jesús no volvería","Que esperaran en Galilea"],["¿Desde qué monte subió Jesús al cielo?","El monte de los Olivos","El monte Sinaí","El monte Carmelo","El monte Ararat"]]}]},{"u":"Familia","c":"#3f7a5a","l":[{"t":"Construir con Dios","v":"Salmos 127:1","w":"edifica","r":"Una casa puede tener buenas paredes y aun así derrumbarse por dentro. Este salmo enseña que el hogar firme se construye con Dios en el centro.","h":"Hagan hoy una oración breve en familia, aunque sea antes de comer.","q":[["¿A quién se atribuye el Salmo 127?","Salomón","David","Moisés","Asaf"],["Según el salmo, los hijos son…","Herencia de Jehová","Una carga","Un premio por obras","Responsabilidad del gobierno"],["¿Qué pasa si Jehová no edifica la casa?","En vano trabajan los que la edifican","Se vuelve rica","Se hace más grande","Nada"]]},{"t":"Esposos","v":"Efesios 5:25","w":"Cristo","r":"Pablo pone la vara muy alta: amar como Cristo amó, entregándose. En el matrimonio, el amor no es solo un sentimiento: es una decisión diaria de servir y respetar.","h":"Haz hoy algo por tu pareja o tu familia sin que te lo pidan.","q":[["¿Cómo deben amar los esposos según Efesios 5?","Como Cristo amó a la iglesia","Como a sus padres","Como a sus amigos","Cuando lo merezcan"],["Según Génesis 2:24, ¿qué serán el esposo y la esposa?","Una sola carne","Socios","Dos personas separadas","Hermanos"],["Según Eclesiastés 4:12, ¿qué no se rompe pronto?","El cordón de tres dobleces","Una cuerda nueva","Una cadena de oro","Una red"]]},{"t":"Padres e hijos","v":"Efesios 6:4","w":"provoquéis","r":"La Biblia pide a los hijos honrar a sus padres, y a los padres no provocar a sus hijos. Es un camino de dos vías: respeto de un lado y paciencia del otro.","h":"Dile hoy a tu papá, tu mamá o tu hijo algo que valoras de él.","q":[["¿Qué mandamiento trae promesa según Efesios 6:2?","Honra a tu padre y a tu madre","No matarás","No robarás","Santificarás el sábado"],["¿Qué no deben hacer los padres según Efesios 6:4?","Provocar a ira a sus hijos","Disciplinarlos","Enseñarles","Jugar con ellos"],["Según Proverbios 22:6, el niño instruido en su camino…","Aun de viejo no se apartará de él","Se irá de casa","Será rico","Será rey"]]},{"t":"Hermanos","v":"Salmos 133:1","w":"habitar","r":"Caín y Abel, Jacob y Esaú, José y sus hermanos: la Biblia no esconde los pleitos entre hermanos. Pero también muestra la belleza de la reconciliación.","h":"Busca hoy a un hermano o pariente con quien tengas distancia.","q":[["¿Quién mató a su hermano Abel?","Caín","Set","Esaú","Rubén"],["¿Qué hermanos se reconciliaron después de años de pleito?","Jacob y Esaú","Caín y Abel","Amnón y Absalón","Moisés y Aarón"],["¿Qué hizo José al final con sus hermanos?","Los perdonó y los cuidó","Los mandó a la cárcel","Se vengó","No los volvió a ver"]]},{"t":"Una fe que se hereda","v":"2 Timoteo 1:5","w":"abuela","r":"La fe de Timoteo empezó con su abuela Loida y su madre Eunice. Lo que se siembra en casa puede durar generaciones.","h":"Cuéntale a un niño o joven cómo te ha ayudado Dios.","q":[["¿Cómo se llamaba la abuela de Timoteo?","Loida","Ana","Rut","Sara"],["¿Y su madre?","Eunice","María","Elisabet","Débora"],["Según Proverbios 17:6, ¿qué es la corona de los viejos?","Los nietos","El dinero","La fama","Las canas"]]}]},{"u":"Dinero y trabajo","c":"#b07a1e","l":[{"t":"Trabajar para el Señor","v":"Colosenses 3:23","w":"ánimo","r":"Pablo escribió a trabajadores con jefes difíciles: hagan todo como para el Señor. Así, cualquier trabajo, por sencillo que sea, se vuelve adoración.","h":"Haz hoy tu trabajo con excelencia, como si Jesús fuera tu cliente.","q":[["Según Colosenses 3:23, ¿para quién debemos trabajar?","Como para el Señor","Para el jefe","Para nosotros","Para ser vistos"],["Según Proverbios 6, ¿qué animal enseña al perezoso?","La hormiga","La abeja","El león","El caballo"],["Según 2 Tesalonicenses 3:10, el que no quiere trabajar…","Tampoco coma","Que descanse","Que pida ayuda","Que ore más"]]},{"t":"Las deudas","v":"Proverbios 22:7","w":"siervo","r":"Las deudas pueden volverse cadenas. La Biblia no prohíbe todo préstamo, pero advierte del peligro y anima a no deber nada a nadie, sino amor.","h":"Revisa hoy tus gastos y anota una deuda que quieras empezar a pagar.","q":[["Según Proverbios 22:7, el que toma prestado es…","Siervo del que presta","Libre","Sabio","Rico"],["Según Romanos 13:8, ¿qué es lo único que debemos deber?","Amor","Dinero","Favores","Nada"],["Según Lucas 14:28, ¿qué hace el que quiere construir una torre?","Calcula primero los gastos","Pide prestado","Empieza sin pensar","Busca socios"]]},{"t":"Dar con alegría","v":"2 Corintios 9:7","w":"alegre","r":"Dios no necesita nuestro dinero, pero sí nuestro corazón. Dar con alegría nos libera del amor al dinero y bendice a otros.","h":"Da hoy algo con alegría: una ofrenda, una comida o tu tiempo.","q":[["¿A qué dador ama Dios?","Al alegre","Al rico","Al que da mucho","Al que da en secreto"],["¿Qué viuda dio todo lo que tenía en el templo?","La que echó dos blancas en la ofrenda","Noemí","Ana","Débora"],["Según Hechos 20:35, ¿qué es más bienaventurado?","Dar que recibir","Recibir que dar","Ahorrar","Ganar"]]},{"t":"Contentamiento","v":"Filipenses 4:11","w":"contentarme","r":"Pablo escribió desde la cárcel que había aprendido a estar contento con poco o con mucho. El contentamiento no se compra: se aprende confiando en Dios.","h":"Haz una lista de cinco cosas que ya tienes y da gracias por ellas.","q":[["¿Desde dónde escribió Pablo la carta a los Filipenses?","Desde la cárcel","Desde un barco","Desde Jerusalén","Desde su casa"],["Según 1 Timoteo 6:10, ¿qué es raíz de todos los males?","El amor al dinero","El dinero","La pobreza","El trabajo"],["Según Hebreos 13:5, ¿por qué podemos estar contentos?","Porque Dios no nos dejará","Porque seremos ricos","Porque no hay problemas","Porque trabajamos mucho"]]},{"t":"Planes y proyectos","v":"Proverbios 16:3","w":"Encomienda","r":"Hacer planes es sabio, pero la Biblia nos invita a ponerlos en manos de Dios. Él puede afirmar nuestros caminos o redirigirlos para bien.","h":"Escribe tu meta principal del mes y entrégasela a Dios en oración.","q":[["Según Proverbios 16:9, el hombre piensa su camino, pero…","Jehová endereza sus pasos","él decide todo","la suerte decide","los demás deciden"],["Según Proverbios 15:22, ¿qué hace falta para que los planes se afirmen?","Muchos consejeros","Mucho dinero","Mucha suerte","Trabajar solo"],["Según Santiago 4:15, ¿qué deberíamos decir al hacer planes?","Si el Señor quiere","Lo haré seguro","Mañana será mejor","Nadie me detiene"]]}]},{"u":"Emociones","c":"#7a4f9a","l":[{"t":"Tristeza","v":"Salmos 42:5","w":"Espera","r":"El salmista habla con su propia alma triste: «¿Por qué te abates?». No niega la tristeza, pero se recuerda esperar en Dios. Está bien sentir; no está bien cargarlo solo.","h":"Escríbele a Dios lo que sientes hoy y busca a alguien de confianza para hablar.","q":[["¿Con quién habla el salmista en el Salmo 42?","Con su propia alma","Con un rey","Con un ángel","Con su enemigo"],["¿Con qué animal compara su sed de Dios?","Un ciervo","Un león","Una paloma","Un camello"],["Según Salmos 34:18, ¿de quién está cerca Jehová?","De los quebrantados de corazón","De los ricos","De los fuertes","De los famosos"]]},{"t":"Miedo","v":"Isaías 41:10","w":"temas","r":"«No temas» aparece muchas veces en la Biblia, casi siempre con una razón: «porque yo estoy contigo». El valor no es dejar de sentir miedo, sino avanzar acompañado.","h":"Ponle nombre a tu miedo de hoy y repite Isaías 41:10 en voz alta.","q":[["¿Qué razón da Dios en Isaías 41:10 para no temer?","Que Él está con nosotros","Que no pasará nada malo","Que somos fuertes","Que es un sueño"],["Según 2 Timoteo 1:7, Dios no nos ha dado espíritu de…","Temor","Amor","Poder","Dominio propio"],["Según Salmos 56:3, ¿qué hace el salmista cuando tiene miedo?","Confía en Dios","Huye","Se esconde","Llora"]]},{"t":"Enojo","v":"Santiago 1:19","w":"tardío","r":"Santiago da una fórmula sencilla: escuchar rápido, hablar despacio, enojarse lento. El enojo no es pecado en sí, pero mal manejado lastima a quienes más queremos.","h":"Hoy, antes de responder enojado, respira y cuenta hasta diez.","q":[["Según Santiago 1:19, ¿cómo debemos ser para oír?","Prontos","Lentos","Distraídos","Callados"],["Según Efesios 4:26, ¿cuándo debe terminar el enojo?","Antes de que se ponga el sol","En una semana","Nunca","Cuando el otro pida perdón"],["Según Proverbios 15:1, ¿qué quita la ira?","La blanda respuesta","El silencio","Un regalo","Gritar más fuerte"]]},{"t":"Soledad","v":"Hebreos 13:5","w":"desampararé","r":"Elías se sintió tan solo que quiso morir bajo un enebro. Dios no lo regañó: lo alimentó, lo dejó descansar y le recordó que no estaba solo. Dios te trata con la misma ternura.","h":"Llama hoy a alguien que también pueda sentirse solo.","q":[["¿Bajo qué árbol se sentó Elías desanimado?","Un enebro","Un olivo","Una palmera","Un sicómoro"],["¿Qué hizo Dios primero con Elías?","Lo alimentó y lo dejó dormir","Lo regañó","Le dio una misión","Lo llevó al cielo"],["¿Qué promete Dios en Hebreos 13:5?","No te desampararé ni te dejaré","Te haré rico","No sufrirás","Tendrás muchos amigos"]]},{"t":"Gozo","v":"Nehemías 8:10","w":"gozo","r":"El gozo bíblico no es estar feliz todo el tiempo: es una fuerza que viene de Dios aun en tiempos difíciles. Pablo y Silas cantaron encadenados en la cárcel.","h":"Escucha o canta hoy una alabanza, aunque no tengas ganas.","q":[["Según Nehemías 8:10, el gozo de Jehová es nuestra…","Fortaleza","Recompensa","Herencia","Comida"],["¿Qué hicieron Pablo y Silas encadenados en la cárcel?","Cantaron himnos","Lloraron","Durmieron","Se quejaron"],["Según Filipenses 4:4, ¿cuándo debemos gozarnos en el Señor?","Siempre","Los domingos","Cuando todo va bien","Nunca"]]}]},{"u":"Palabras","c":"#3b5f8a","l":[{"t":"El poder de la lengua","v":"Santiago 3:5","w":"fuego","r":"Santiago compara la lengua con el timón de un barco y con una chispa que incendia un bosque. Algo tan pequeño puede dirigir o destruir mucho.","h":"Hoy evita una crítica y cámbiala por un elogio.","q":[["¿Con qué compara Santiago la lengua?","Un pequeño fuego","Una espada","Una flor","Una piedra"],["¿Qué parte de un barco menciona Santiago?","El timón","El ancla","La vela","El mástil"],["Según Proverbios 18:21, ¿qué está en poder de la lengua?","La muerte y la vida","El dinero","La salud","La fama"]]},{"t":"La verdad","v":"Efesios 4:25","w":"verdad","r":"Ananías y Safira mintieron sobre una ofrenda para parecer generosos, y les costó caro. La verdad construye confianza; la mentira la destruye poco a poco.","h":"Si le debes una verdad a alguien, dísela hoy con amor.","q":[["¿Quiénes mintieron sobre una ofrenda en Hechos 5?","Ananías y Safira","Aquila y Priscila","Pablo y Silas","Adán y Eva"],["Según Proverbios 12:22, los labios mentirosos son…","Abominación a Jehová","Inteligentes","Divertidos","Necesarios"],["Según Juan 8:32, ¿qué nos hará libres?","La verdad","El dinero","La fuerza","La suerte"]]},{"t":"El chisme","v":"Proverbios 26:20","w":"chismoso","r":"Un chisme es como leña para el fuego: alimenta los pleitos. Si nadie lo repite, se apaga solo. Cuidar la reputación de otros es una forma de amarlos.","h":"Hoy, si escuchas un chisme, no lo repitas y cambia de tema.","q":[["Según Proverbios 26:20, ¿qué pasa donde no hay chismoso?","Cesa la contienda","Hay aburrimiento","Hay paz falsa","Nadie habla"],["¿Qué hace que se apague el fuego según el proverbio?","Que no haya leña","El agua","El viento","La lluvia"],["Según Efesios 4:29, ¿qué palabras deben salir de nuestra boca?","Las que edifican","Las graciosas","Las fuertes","Ninguna"]]},{"t":"Palabras que animan","v":"Proverbios 16:24","w":"Panal","r":"José, un creyente de Chipre, era llamado Bernabé, «hijo de consolación», porque animaba a todos. Sus palabras ayudaron a que Pablo fuera aceptado por la iglesia.","h":"Manda hoy un mensaje para animar a alguien.","q":[["¿Qué significa el nombre Bernabé?","Hijo de consolación","Hijo del trueno","Hombre fuerte","Hijo de David"],["¿A quién ayudó Bernabé a ser aceptado por los discípulos?","A Pablo","A Pedro","A Juan","A Tomás"],["Según Proverbios 16:24, ¿a qué se parecen los dichos suaves?","A un panal de miel","A agua fría","A pan caliente","A un río"]]},{"t":"Callar a tiempo","v":"Proverbios 17:28","w":"calla","r":"Eclesiastés dice que hay tiempo de callar y tiempo de hablar. A veces, la respuesta más sabia es escuchar y no decir nada.","h":"Hoy escucha más de lo que hablas en una conversación.","q":[["Según Proverbios 17:28, ¿cómo es contado el necio cuando calla?","Por sabio","Por tonto","Por tímido","Por grosero"],["Según Eclesiastés 3:7, hay tiempo de callar y tiempo de…","Hablar","Cantar","Llorar","Dormir"],["Según Salmos 141:3, ¿qué le pide David a Dios?","Que ponga guarda a su boca","Que le dé fuerza","Que lo haga rico","Que castigue a sus enemigos"]]}]},{  su sobrino Lot peleaban por la tierra. Abraham, el mayor, cedió y dejó que Lot escogiera primero. La paz a veces cuesta ceder.","h":"Da hoy el primer paso para arreglar un conflicto.","q":[["¿Por qué pelearon los pastores de Abraham y Lot?","Por el ganado y la tierra","Por dinero","Por una mujer","Por religión"],["¿Quién escogió primero la tierra?","Lot","Abraham","Sara","Isaac"],["¿Cómo serán llamados los pacificadores?","Hijos de Dios","Reyes","Sabios","Profetas"]]},{"t":"Servir a otros","v":"Gálatas 5:13","w":"servíos","r":"Dorcas era conocida en Jope por sus buenas obras y la ropa que cosía para las viudas. Cuando murió, todos lloraban mostrando lo que ella había hecho. Servir deja huella.","h":"Haz hoy algo práctico por alguien que lo necesite.","q":[["¿Por qué era conocida Dorcas?","Por sus buenas obras y la ropa que cosía","Por predicar","Por ser reina","Por cantar"],["¿Qué apóstol oró por Dorcas y ella volvió a la vida?","Pedro","Pablo","Juan","Santiago"],["Según Gálatas 5:13, ¿cómo debemos usar nuestra libertad?","Para servirnos por amor","Para hacer lo que queramos","Para descansar","Para mandar"]]}]},{"u":"Propósito","c":"#2f7f86","l":[{"t":"Creado con propósito","v":"Efesios 2:10","w":"hechura","r":"No eres un accidente. Dios te formó con cuidado y preparó buenas obras para que camines en ellas. Tu vida tiene un propósito que va más allá de ti.","h":"Pregúntale hoy a Dios para qué te creó y anota lo que venga a tu mente.","q":[["Según Efesios 2:10, ¿para qué fuimos creados en Cristo?","Para buenas obras","Para ser ricos","Para descansar","Para ser famosos"],["Según Salmos 139:14, ¿cómo fuimos hechos?","Formidable y maravillosamente","Por casualidad","Rápidamente","Sin cuidado"],["Según Jeremías 1:5, ¿cuándo conoció Dios a Jeremías?","Antes de formarlo en el vientre","Al nacer","De joven","De anciano"]]},{"t":"Tus dones","v":"Romanos 12:6","w":"dones","r":"Moisés decía que no sabía hablar y Gedeón que era el menor de su familia. Dios no busca a los más c const CAMS = [{"n":"Fundamentos de la fe","e":"🌱","g":"linear-gradient(135deg,#ff9f1a,#c2410c)","d":"Los primeros pasos y las bases de la fe"},{"n":"La vida de Jesús","e":"✝️","g":"linear-gradient(135deg,#06d6a0,#1b7f8a)","d":"De Belén a la tumba vacía"},{"n":"Sabiduría para la vida","e":"🌳","g":"linear-gradient(135deg,#8338ec,#3a86ff)","d":"Familia, dinero, emociones y propósito"}];
const UPC=6;
let PRG = store.get('prg', {done:{}, xp:0, streak:0, last:null, placed:false});
const saveP = () => store.set('prg', PRG);
const lk = (u,l) => u+'-'+l;
const isDone = (u,l) => !!PRG.done[lk(u,l)];
const totalL = CAM.reduce((a,u)=>a+u.l.length,0);
const doneCount = () => Object.keys(PRG.done).length;
function nextLesson(){ for(let u=0;u<CAM.length;u++) for(let l=0;l<CAM[u].l.length;l++) if(!isDone(u,l)) return [u,l]; return null; }
function unlocked(u,l){ if(isDone(u,l)) return true; const n=nextLesson(); return !!n && n[0]===u && n[1]===l; }
const dayN = () => { const d=new Date(); return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5); };
function streakNow(){ if(PRG.last==null) return 0; return dayN()-PRG.last<=1 ? PRG.streak : 0; }
function award(u,l,perfect){
  const first=!isDone(u,l);
  const xp = first ? (10+(perfect?5:0)) : 5;
  PRG.done[lk(u,l)]={d:Date.now(),p:perfect||(PRG.done[lk(u,l)]||{}).p};
  PRG.xp+=xp; const t=dayN();
  if(PRG.last!==t){ PRG.streak = (PRG.last===t-1) ? PRG.streak+1 : 1; PRG.last=t; }
  PRG.placed=true; saveP(); setTimeout(checkAch,600); return xp;
}
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
let ALLW = CAM.flatMap(u=>u.l.map(l=>l.w)), ALLV = CAM.flatMap(u=>u.l.map(l=>l.v));
function pick3(pool, not){ return shuffle(pool.filter(x=>x.toLowerCase()!==not.toLowerCase())).filter((x,i,a)=>a.findIndex(y=>y.toLowerCase()===x.toLowerCase())===i).slice(0,3); }

const camOf=u=>Math.floor(u/UPC);
function camDone(k){ for(let u=k*UPC;u<(k+1)*UPC&&u<CAM.length;u++) for(let l=0;l<CAM[u].l.length;l++) if(!isDone(u,l)) return false; return true; }
const camUnlocked=k=>k===0||camDone(k-1);
function camCount(k){ let d=0,t=0; for(let u=k*UPC;u<(k+1)*UPC&&u<CAM.length;u++) CAM[u].l.forEach((_,l)=>{ t++; if(isDone(u,l)) d++; }); return [d,t]; }
function curCam(){ const n=nextLesson(); return n?camOf(n[0]):CAMS.length-1; }
function camCard(){
  const n=nextLesson(); const s=streakNow();
  if(!n) return `<a class="camcard" href="#camino"><div><div class="lbl">${T('Camino','Path')}</div><b>${T('¡Completaste todo el camino!','You finished the whole path!')}</b><span>${T('Repasa tus lecciones favoritas','Review your favorite lessons')}</span></div><div class="camfire">🏆</div></a>`;
  const L=CAM[n[0]].l[n[1]];
  return `<a class="camcard" href="#camino" style="--uc:${CAM[n[0]].c}"><div><div class="lbl">${T('Tu devocional de hoy','Your devotional for today')}</div><b>${esc(L.t)}</b><span>${T('Camino','Path')} ${camOf(n[0])+1} · ${T('Unidad','Unit')} ${n[0]%UPC+1} · ${esc(CAM[n[0]].u)}</span></div><div class="camfire">🔥<small>${s}</small></div></a>`;
}

  const offs=[0,48,72,48,0,-48,-72,-48];
  let html=camTabs('camino')+profileStrip();
  if(!PRG.placed && !doneCount()){
    html+=`<div class="panel" style="text-align:center;margin-top:14px"><b style="font-size:18px">${L('Bienvenido al Camino','Welcome to the Path')}</b><p class="intro" style="margin:8px 0 14px">${L('Un devocional corto cada día con preguntas para aprender jugando. ¿Desde dónde quieres empezar?','A short devotional every day with questions so you learn while you play. Where would you like to start?')}</p>
    <div class="acts2" style="flex-direction:column"><button class="btn pri" id="c-new">${L('Estoy empezando en la fe','I am new to the faith')}</button><a class="btn" href="#nivel">${L('Ya conozco la Biblia: hacer prueba de nivel','I know the Bible: take a placement test')}</a></div></div>`;
  }
  let sel=store.get('cam',null); if(sel==null||!CAMS[sel]) sel=curCam();
  html+=`<div class="cams">${CAMS.map((C,k)=>{ const [d,t]=camCount(k), done=camDone(k), un=camUnlocked(k);
    return `<button class="camc ${k===sel?'on':''} ${un?'':'lock'}" data-cam="${k}" style="background:${C.g}"><span class="st">${done?L('✓ Completo','✓ Complete'):un?(k===curCam()?L('En curso','In progress'):L('Abierto','Open')):'🔒'}</span><div class="ce">${C.e}</div><small>${L('Camino','Path')} ${k+1}</small><b>${esc(C.n)}</b><span>${esc(C.d)}</span><div class="bar"><i style="width:${Math.round(d/t*100)}%"></i></div><span>${d}/${t} ${L('lecciones','lessons')}</span></button>`; }).join('')}<div class="camsoon">✨<br>${L('Próximamente<br>más caminos','More paths<br>coming soon')}</div></div>`;
  if(!camUnlocked(sel)) html+=`<div class="lockban">🔒 ${L(`Termina el <b>Camino ${sel}</b> para desbloquear este camino.`,`Finish <b>Path ${sel}</b> to unlock this path.`)}</div>`;
  CAM.forEach((U,u)=>{
    if(camOf(u)!==sel) return;
