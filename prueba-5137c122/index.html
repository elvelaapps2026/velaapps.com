e can lie down and sleep because God sustains him.","Salmos 4":"An evening prayer. Surrounded by people slandering him, David finds peace and lies down trusting in God.","Salmos 5":"A morning prayer. David brings his request early and waits for God's answer.","Salmos 9":"David thanks God for defeating his enemies and celebrates Him as a refuge for the poor and oppressed.","Salmos 15":"A psalm perhaps sung on entering the temple. It asks who can stand in God's presence and answers: the one who walks with integrity.","Salmos 16":"David expresses his total trust in God. In Acts 2, Peter quotes it as a prophecy of Jesus' resurrection.","Salmos 19":"David looks at the sky and sees God's glory. Then he moves from creation to the Word: the law of the Lord is perfect.","Salmos 20":"The people's prayer for their king before battle, asking God to grant him the desires of his heart.","Salmos 22":"It begins with “My God, my God, why hast thou forsaken me?”, the words Jesus cried out on the cross. It describes suffering that ends in praise.","Salmos 24":"Probably sung when David brought the ark up to Jerusalem. It proclaims that the earth is the Lord's and announces the entry of the King of glory.","Salmos 25":"A prayer of David in times of loneliness and affliction, asking for forgiveness, direction and that God not abandon him.","Salmos 28":"David cries out to God in danger and ends in gratitude: the Lord is his strength and his shield.","Salmos 29":"David describes a thunderstorm as the voice of God over the waters and ends with a blessing of peace for his people.","Salmos 30":"It was written for the dedication of David's house, after God healed him or saved him from death. Weeping may endure for a night, but joy comes in the morning.","Salmos 33":"A song of praise to God the Creator. It declares blessed the nation whose God is the Lord.","Salmos 36":"David contrasts the wickedness of the ungodly with God's mercy, which reaches to the heavens.","Salmos 40":"David waited patiently and God lifted him out of the pit and the mire, and put a new song in his mouth.","Salmos 41":"David, sick and betrayed by a close friend, trusts that God sustains the one who cares for the poor.","Salmos 55":"David writes it after being betrayed by a close friend and wishes he could fly away like a dove. His conclusion is to cast his burden on the Lord.","Salmos 56":"David wrote it when the Philistines captured him in Gath. In the day he is afraid, he decides to trust in God.","Salmos 57":"David composed it hiding in a cave while King Saul hunted him to kill him. Even there he praises God.","Salmos 63":"David is in the wilderness of Judah, perhaps on the run. He thirsts for God like dry ground and meditates on Him even in bed.","Salmos 65":"A song of thanks for the harvest and the rain. God crowns the year with His goodness.","Salmos 68":"A victory song that celebrates God marching with His people. It calls Him a father of the fatherless and defender of widows.","Salmos 71":"The prayer of someone now old who has trusted God since youth and asks not to be forsaken in old age.","Salmos 73":"Asaph nearly loses his faith seeing the wicked prosper. When he enters the sanctuary he understands their end and declares that God is his portion.","Salmos 89":"A psalm that celebrates God's covenant with David and sings of His faithfulness, though it ends lamenting the crisis of the monarchy.","Salmos 92":"A song for the Sabbath day. The righteous will flourish like the palm tree and bear fruit even in old age.","Salmos 94":"The psalmist cries out to God against those who oppress the widow and the orphan, and finds comfort in the midst of his many worries.","Salmos 95":"An invitation to worship and kneel before God, with a warning not to harden our hearts like Israel in the wilderness.","Salmos 100":"A short psalm of thanksgiving that was probably sung when entering through the temple gates.","Salmos 107":"A song of those God rescued: lost in the desert, prisoners, the sick and the shipwrecked. They all cried out and He delivered them.","Salmos 112":"It describes the life of the man who fears God: generous, righteous, steady and not afraid of bad news.","Salmos 115":"It contrasts idols, which have mouths but cannot speak, with the living God who does whatever He pleases.","Salmos 116":"A man who was at the brink of death thanks God for hearing and delivering him.","Salmos 118":"The last of the psalms sung at Passover; Jesus probably sang it at the Last Supper. It includes “This is the day which the Lord hath made.”","Salmos 128":"A pilgrims' song describing the blessing on the home of someone who fears God: work, a wife and children around the table.","Salmos 133":"A short pilgrims' song for gathering in Jerusalem, celebrating how good it is for brothers to dwell together in unity.","Salmos 136":"A song the people answered in chorus: after every line they repeated “for his mercy endureth for ever.”","Salmos 138":"David gives thanks with his whole heart and trusts that God will finish what He began in him.","Salmos 141":"An evening prayer. David asks God to set a guard over his mouth and not let him incline to evil.","Salmos 143":"David, pursued and downcast, asks to hear God's lovingkindness in the morning and to be shown the way.","Salmos 145":"David's acrostic of praise about the greatness, goodness and nearness of God to those who call on Him.","Salmos 146":"It begins the series of “hallelujahs” that closes the book. It urges us not to trust in human princes, but in God, who protects the orphan and the widow.","Salmos 147":"Praise to the God who rebuilds Jerusalem, heals the brokenhearted and counts the stars.","Salmos 150":"The last psalm and the grand finale of the book: let everything that has breath praise the Lord, with every instrument.","Proverbios 1":"Solomon explains why he wrote the book: to give wisdom to the young. It begins like a father advising his son.","Proverbios 2":"The father encourages his son to search for wisdom like hidden treasure, because God is the one who gives it.","Proverbios 3":"A father's advice to his son: trust God with all your heart, honor Him with your wealth and don't despise His correction.","Proverbios 4":"The father passes on what his own father taught him: get wisdom and guard your heart above all else.","Proverbios 5":"A clear warning against adultery and an invitation to enjoy the love of your own wife.","Proverbios 6":"Practical advice: don't co-sign carelessly, learn from the ant and run from immorality.","Proverbios 9":"Wisdom and folly appear as two women inviting people into their homes. The fear of the Lord is the beginning of wisdom.","Proverbios 10":"Solomon's short sayings begin: each verse is a stand-alone piece of advice comparing the wise and the foolish, the righteous and the wicked.","Proverbios 11":"Solomon's sayings on honesty in business, humility and generosity.","Proverbios 12":"Solomon's sayings on work, words and truth. It contrasts the one who tells the truth with the liar.","Proverbios 13":"Solomon's sayings on effort, honestly earned money, friendships and disciplining children.","Proverbios 14":"Solomon's sayings on inner peace, work and the righteousness that exalts a nation.","Proverbios 15":"Solomon's sayings on how to speak: a soft answer calms anger. It also talks about seeking advice before making plans.","Proverbios 16":"Solomon's sayings on man's plans and God's control, and on the pride that goes before a fall.","Proverbios 17":"Solomon's sayings on loyal friendship, a cheerful heart and peace at home.","Proverbios 18":"Solomon's sayings on words: death and life are in the power of the tongue. It also talks about friendship and marriage.","Proverbios 19":"Solomon's sayings on laziness, patience and generosity toward the poor.","Proverbios 20":"Solomon's sayings on wine, laziness, integrity and gossip.","Proverbios 21":"Solomon's sayings reminding us that God directs the hearts of kings and prefers justice to sacrifices.","Proverbios 22":"Solomon's sayings on a good name, raising children and the danger of debt.","Proverbios 23":"Advice from the wise about not envying sinners, honoring parents and the joy a righteous child brings.","Proverbios 24":"More sayings of the wise: don't rejoice when your enemy falls, and don't be lazy.","Proverbios 25":"Proverbs of Solomon that King Hezekiah's scribes copied centuries later. They include treating your enemy well and self-control.","Proverbios 26":"Sayings about the fool, the lazy person and the gossip: where there is no wood, the fire goes out.","Proverbios 27":"Sayings about sincere friendship: faithful are the wounds of a friend, and iron sharpens iron. It also advises taking care of your own possessions.","Proverbios 28":"Sayings about integrity, justice and the danger of greed.","Proverbios 29":"Sayings about correcting children, controlling anger and just leadership.","Proverbios 31":"Advice that King Lemuel's mother gave her son. It ends with an acrostic poem about the virtuous woman.","Eclesiastés 5":"Solomon warns about making careless promises before God and observes that whoever loves money is never satisfied.","Eclesiastés 7":"Solomon's reflections on wisdom, anger and what we learn in hard times.","Eclesiastés 9":"Given how short life is, Solomon invites us to enjoy life with the one we love and to do everything with all our might.","Eclesiastés 11":"Solomon encourages generosity and enjoying youth, remembering that God will call us to account.","Eclesiastés 12":"The book's conclusion: remember God in your youth, before old age. The sum of it all is to fear God and keep His commandments.","Cantares 2":"The bride describes her beloved's love in springtime: “My beloved is mine, and I am his.”","Cantares 8":"The climax of the poem: love is strong as death and many waters cannot quench it.","Isaías 7":"King Ahaz is afraid of an enemy alliance. Isaiah gives him a sign: a virgin shall conceive and bear a son called Immanuel. Matthew applies it to the birth of Jesus.","Isaías 9":"In dark times of war with Assyria, Isaiah announces that a child will be born: Wonderful, Counsellor, The mighty God, The everlasting Father, The Prince of Peace.","Isaías 26":"A song Judah would sing on the day of restoration: God keeps in perfect peace whoever trusts in Him.","Isaías 30":"Judah looks to Egypt for military help instead of trusting God. Isaiah tells them their strength is in quietness and confidence.","Isaías 44":"God promises to pour out His Spirit on His people and mocks the idols made by human hands.","Isaías 46":"Babylon's idols have to be carried by animals, but God carries His people from the womb to old age.","Isaías 48":"God speaks to Israel in exile and explains that He refined them in the furnace of affliction.","Isaías 50":"The Servant of the Lord speaks: God gave Him words to encourage the weary, and He did not resist suffering.","Isaías 54":"After the suffering Servant of chapter 53, God promises to restore His people like a husband restores his wife. No weapon formed against her shall prosper.","Isaías 55":"An open invitation: come to the waters for free. God's ways and thoughts are higher than ours.","Isaías 58":"The people fasted and complained that God didn't notice. God answers that the fast He wants is to free the oppressed and share with the hungry.","Isaías 59":"Isaiah explains that it's not that God can't save, but that sin has separated them from Him.","Isaías 61":"The Messiah announces His mission to bring good news to the poor and comfort those who mourn. Jesus read this passage in the synagogue at Nazareth.","Isaías 66":"The final chapter of Isaiah: God will comfort Jerusalem like a mother comforts her child.","Jeremías 3":"God calls unfaithful Israel to return to Him, and promises to give them shepherds after His own heart.","Jeremías 17":"It contrasts the one who trusts in man with the one who trusts in God, who is like a tree planted by the waters. It also warns that the heart is deceitful.","Jeremías 30":"Part of Jeremiah's “book of comfort”: after the exile, God will heal His people's wounds.","Jeremías 31":"God promises a new covenant written on the heart and declares His everlasting love for His people.","Jeremías 32":"While Babylon besieges Jerusalem, God asks Jeremiah to buy a field as a sign of hope. Jeremiah prays: “there is nothing too hard for thee.”","Jeremías 33":"Jeremiah is still locked in the prison courtyard when God tells him: “Call unto me, and I will answer thee.”","Ezequiel 36":"To a people in exile, God promises to cleanse them, bring them back to their land and give them a new heart and His Spirit.","Daniel 2":"King Nebuchadnezzar has a dream no one can explain. Daniel prays with his friends, God reveals the dream to him, and he praises the God who changes the times.","Joel 2":"After a plague of locusts, Joel calls the people to return to God with all their heart and promises that God will restore what was lost and pour out His Spirit.","Amós 5":"Amos denounces a people who held religious feasts but oppressed the poor. God asks for justice to roll down like waters.","Miqueas 5":"About 700 years earlier, Micah announces that Israel's ruler would be born in Bethlehem, a small town.","Miqueas 7":"Micah laments the corruption of his time but ends with hope: God will cast our sins into the depths of the sea.","Habacuc 2":"God answers Habakkuk's complaint: the vision will come true in its time, even if it seems slow. The just shall live by his faith.","Habacuc 3":"Habakkuk's final prayer: though the fig tree does not blossom and everything fails, he will rejoice in God.","Sofonías 3":"After announcing judgment, Zephaniah ends by describing a God who rejoices over His people with singing.","Zacarías 8":"God promises that Jerusalem will again be full of old people and children playing, and asks them to speak the truth to one another.","Zacarías 13":"God promises to cleanse His people and test them the way gold is refined in fire.","Malaquías 2":"Malachi confronts the men who were abandoning the wife of their youth: God hates divorce.","Malaquías 3":"The people were robbing God in tithes. God challenges them: bring it all into the storehouse and see if I will not open the windows of heaven.","Mateo 1":"Jesus' genealogy and the announcement to Joseph, who was planning to quietly leave Mary. An angel tells him the child is from the Holy Spirit.","Mateo 2":"Wise men from the east follow a star to worship the newborn king. Herod, jealous, tries to kill Him and the family flees to Egypt.","Mateo 3":"John the Baptist preaches repentance at the Jordan. Jesus is baptized and the Father's voice is heard: “This is my beloved Son.”","Mateo 4":"Jesus fasts 40 days in the wilderness and overcomes the devil's temptations by quoting Scripture. Then He begins His ministry in Galilee.","Mateo 8":"After the Sermon on the Mount, Jesus heals a leper, a centurion's servant and many sick people.","Mateo 12":"The Pharisees accuse Jesus of breaking the Sabbath and of casting out demons by Satan's power. Jesus warns that we will give account for every word.","Mateo 13":"Jesus teaches from a boat with parables of the kingdom: the sower, the mustard seed, the hidden treasure and the pearl of great price.","Mateo 14":"After feeding five thousand, Jesus walks on the sea at night. Peter walks toward Him but sinks when he doubts.","Mateo 15":"The Pharisees criticize the disciples for not washing their hands. Jesus teaches that what defiles comes out of the heart.","Mateo 16":"At Caesarea Philippi, Jesus asks who people say He is. Peter answers: “Thou art the Christ, the Son of the living God.”","Mateo 17":"After the transfiguration, the disciples can't heal a boy. Jesus speaks to them about faith like a grain of mustard seed.","Mateo 20":"The mother of James and John asks for important positions for her sons. Jesus teaches that whoever wants to be great must be a servant.","Mateo 21":"Jesus enters Jerusalem on a donkey, hailed with “Hosanna.” He cleanses the temple and the children praise Him.","Mateo 23":"Jesus sharply confronts the scribes and Pharisees for their hypocrisy: they look clean on the outside but inside are full of wickedness.","Mateo 24":"On the Mount of Olives, the disciples ask about the end. Jesus speaks of the signs of His coming and of being ready, because no one knows the day.","Mateo 25":"Three parables about being ready for His return: the ten virgins, the talents and the judgment, where what was done for the needy was done for Him.","Marcos 1":"Mark starts straight in: John the Baptist, Jesus' baptism and His first miracles. Very early in the morning, Jesus goes off alone to pray.","Marcos 2":"Jesus forgives and heals a paralyzed man, eats with sinners and teaches that the Sabbath was made for man.","Marcos 4":"Parables by the sea and, at nightfall, a storm. Jesus is asleep in the boat, gets up and calms the wind with a word.","Marcos 6":"The disciples come back from their first mission and Jesus invites them to rest. Then He feeds five thousand.","Marcos 9":"A desperate father brings his son who has a demon. Jesus tells him all things are possible to him who believes, and he answers: “Lord, I believe; help thou mine unbelief.”","Marcos 11":"Jesus enters Jerusalem and withers a fig tree that had no fruit. He uses the moment to teach about faith, prayer and forgiveness.","Marcos 12":"In the temple, Jesus sees a poor widow put two mites into the offering and says she gave more than everyone, because she gave all she had.","Marcos 16":"The women find the tomb empty. The risen Jesus appears and sends His disciples to preach the gospel to every creature.","Lucas 1":"An angel announces the birth of John the Baptist and then visits Mary. Her cousin Elizabeth calls her blessed for believing.","Lucas 4":"Jesus overcomes temptation and returns to Nazareth. In the synagogue He reads Isaiah 61 and declares that the prophecy is fulfilled in Him.","Lucas 5":"Jesus calls His first disciples after a miraculous catch of fish and heals a leper by touching him.","Lucas 11":"The disciples ask, “Lord, teach us to pray.” Jesus gives them the Lord's Prayer and teaches them to keep on asking.","Lucas 12":"A man asks Jesus to divide an inheritance. He answers with the parable of the rich fool and teaches us not to worry.","Lucas 14":"Jesus eats at a Pharisee's house and teaches about humility, inviting the poor and counting the cost of following Him.","Lucas 16":"The parable of the unjust steward: whoever is faithful in little is faithful in much. You cannot serve God and money.","Lucas 17":"Jesus teaches us to forgive a brother who repents, even seven times a day, and heals ten lepers.","Lucas 18":"The parable of the persistent widow teaches us always to pray and not lose heart.","Lucas 22":"The Last Supper: Jesus institutes the Lord's Supper and then prays on the Mount of Olives: “not my will, but thine, be done.”","Lucas 24":"Some women find the tomb empty and the angels ask them: “Why seek ye the living among the dead?”","Juan 2":"At a wedding in Cana the wine runs out. Jesus turns water into wine: His first sign.","Juan 4":"At a well, Jesus talks with a Samaritan woman. Jews avoided Samaritans, but Jesus offers her living water and teaches her to worship in spirit and in truth.","Juan 5":"Jesus heals a man who had been paralyzed for 38 years, and teaches that whoever believes in Him has passed from death to life.","Juan 6":"After feeding five thousand, people look for Jesus because of the bread. He tells them: “I am the bread of life.”","Juan 12":"Six days before Passover, Jesus enters Jerusalem and the crowd welcomes Him with palm branches.","Juan 13":"At the Last Supper, Jesus washes His disciples' feet, a slave's job, and gives them a new commandment: love one another.","Juan 17":"Jesus' prayer before going to the cross. He prays for His disciples and for all who would believe later, that they may be one.","Juan 20":"The resurrection. Thomas doesn't believe until he sees the wounds, and Jesus tells him: “blessed are they that have not seen, and yet have believed.”","Juan 21":"By the sea, the risen Jesus asks Peter, who had denied Him three times, “Lovest thou me?” three times, and restores him.","Hechos 3":"Peter and John heal a lame man at the temple gate. Peter uses the moment to preach and call people to repent.","Hechos 4":"Peter and John are arrested for preaching. When they are released, the church prays for boldness and the place shakes.","Hechos 5":"The apostles are flogged for preaching and answer that we must obey God rather than men. They leave rejoicing.","Hechos 8":"Philip explains Isaiah 53 to an Ethiopian official in a chariot, who asks to be baptized right there.","Hechos 13":"The church in Antioch fasts and prays, and the Holy Spirit sets apart Barnabas and Saul for the first missionary journey.","Hechos 16":"Paul and Silas are in the jail at Philippi and sing at midnight. An earthquake opens the doors and the jailer is saved along with his whole household.","Hechos 20":"Paul says goodbye to the elders of Ephesus knowing they will not see him again. He reminds them to care for the church and that it is more blessed to give than to receive.","Romanos 1":"Paul introduces himself, says he is not ashamed of the gospel and explains that creation shows God's power.","Romanos 2":"Paul shows that no one can judge others, because all of us, Jews and Gentiles, are under sin.","Romanos 3":"Paul's conclusion: all have sinned, and all can be justified freely by the grace of Christ.","Romanos 10":"Paul explains what to do to be saved: confess with the mouth and believe in the heart. That's why preachers are needed.","Romanos 11":"Paul ends his explanation of God's plan for Israel and the nations with praise for the depth of God's wisdom.","Romanos 14":"In Rome, some Christians ate everything and others didn't; some kept special days and others didn't. Paul asks them not to judge each other over such things.","Romanos 15":"Paul asks them to accept one another as Christ accepted us and blesses the church with hope.","1 Corintios 1":"The church in Corinth was divided into factions (“I am of Paul,” “I am of Apollos”). Paul asks them for unity.","1 Corintios 2":"Paul explains that he didn't come with impressive words, but with the message of the cross. What God has prepared, eye has not seen.","1 Corintios 9":"Paul uses the image of athletes in the Isthmian games, famous in Corinth, to talk about discipline and self-control.","1 Corintios 11":"In Corinth, some ate and got drunk at the Lord's Supper while others went hungry. Paul reminds them how Jesus instituted it.","1 Corintios 12":"Paul explains spiritual gifts with the image of a body: many members, each with its own function, in one body.","1 Corintios 16":"Paul organizes an offering for the poor in Jerusalem and says goodbye: “Watch ye, stand fast in the faith.”","2 Corintios 1":"Paul has just been through a trial in Asia so hard that he thought he would die. He speaks of the God who comforts us so we can comfort others.","2 Corintios 2":"Paul asks them to forgive someone who had been disciplined and repented, and celebrates that God always leads us in triumph.","2 Corintios 3":"Paul contrasts the old covenant, written on stone, with the new one, written on the heart by the Spirit. Where the Spirit is, there is liberty.","2 Corintios 7":"Paul rejoices that his earlier letter led the Corinthians to true repentance, with a godly sorrow.","2 Corintios 9":"Paul encourages the Corinthians to complete their offering for the poor in Jerusalem: God loves a cheerful giver.","2 Corintios 10":"Paul answers those who criticized him. He explains that his weapons are not human and that he brings every thought captive to Christ.","Gálatas 2":"Paul tells how he confronted Peter for withdrawing from non-Jewish Christians, and declares: “I am crucified with Christ.”","Gálatas 3":"Paul uses the example of Abraham, who was justified by believing, to show that salvation is by faith. In Christ we are all one.","Gálatas 4":"Paul explains that Christ came “when the fulness of the time was come” to make us God's children, not slaves.","Efesios 1":"Paul opens with a long praise for all the blessings we have in Christ: chosen, forgiven and sealed with the Spirit.","Efesios 3":"Paul, a prisoner, prays that the Ephesians would grasp the breadth and depth of Christ's love.","Filipenses 1":"Paul writes from prison not knowing whether he will be executed. Even so he says that for him to live is Christ and to die is gain.","Colosenses 1":"Paul presents Christ as the image of the invisible God and creator of everything, against teachings that made Him less.","Colosenses 2":"Paul warns against human philosophies and rules, and encourages them to stay rooted in Christ, overflowing with gratitude.","Colosenses 4":"Final greetings and instructions: keep on praying and always speak with grace to outsiders.","2 Tesalonicenses 3":"Some in Thessalonica stopped working while waiting for Christ's return. Paul is clear: if anyone will not work, neither should he eat.","1 Timoteo 2":"Paul asks Timothy to have the church pray for everyone, including kings and rulers, so we may live in peace.","1 Timoteo 4":"Timothy was young to be a pastor and some looked down on him. Paul tells him to be an example in word, conduct, love and faith.","1 Timoteo 5":"Paul gives instructions for caring for widows and for one's own family, which is a responsibility of faith.","1 Timoteo 6":"Paul warns that the love of money is the root of all evil and that godliness with contentment is great gain.","2 Timoteo 1":"Paul, imprisoned in Rome, urges Timothy not to be ashamed and to stir up his gift, because God has not given us a spirit of fear.","2 Timoteo 2":"Paul encourages Timothy to be like a faithful soldier, athlete and farmer, and to flee youthful lusts.","2 Timoteo 4":"Paul's last written words: preach the Word. He has finished the race and awaits the crown.","Tito 2":"Paul explains how older people, women, young people and workers should live so the gospel is well regarded in Crete.","Tito 3":"Paul reminds them that God saved us by His mercy and not by our works, and asks them to respect the authorities.","Hebreos 1":"The letter opens by showing that Jesus is greater than the prophets and the angels: He is the brightness of God's glory.","Hebreos 2":"Jesus became human and suffered temptation so He could help those who are tempted and free us from the fear of death.","Hebreos 4":"The Word of God is living and powerful, and in Jesus we have a high priest who sympathizes with our weaknesses.","Hebreos 5":"The author scolds his readers because they should be teachers and still need spiritual milk instead of solid food.","Hebreos 6":"Hope in Christ is like a sure and steadfast anchor of the soul, and God does not forget work done out of love.","Hebreos 10":"Jesus was the perfect sacrifice once for all. That's why we can approach God with confidence and not stop meeting together.","Santiago 2":"James confronts favoritism toward the rich in the church and teaches that faith without works is dead.","Santiago 5":"James warns oppressive rich people, asks for patience until the Lord's coming and teaches us to pray for the sick.","1 Pedro 1":"Peter writes to scattered and persecuted Christians. He reminds them of their living hope and calls them to be holy.","1 Pedro 3":"Peter gives advice to wives and husbands, and asks us always to be ready to explain the reason for our hope.","1 Pedro 4":"Peter prepares believers for the persecution that was coming: don't be surprised by the fiery trial, and love each other fervently.","2 Pedro 1":"Peter, knowing he would soon die, encourages us to grow by adding to our faith virtue, knowledge, self-control and love.","2 Pedro 2":"A warning against false teachers who promise freedom but are slaves of corruption.","2 Pedro 3":"Some mocked that Jesus hadn't returned. Peter explains that God isn't slow: He is patient because He wants everyone to repent.","1 Juan 3":"John marvels that God calls us His children and teaches that love is shown in deeds and not just in words.","1 Juan 5":"John ends his letter with assurance of salvation: whoever has the Son has life, and our faith overcomes the world.","3 Juan 1":"A personal note from John the elder to his friend Gaius. He wishes him health and prosperity, and rejoices that he walks in the truth.","Judas 1":"Jude wanted to write about salvation, but had to warn against false teachers. He ends by praising the One who is able to keep us from falling.","Apocalipsis 1":"John, exiled on the island of Patmos for his faith, sees the glorified Jesus and is told to write to seven churches.","Apocalipsis 14":"In the middle of visions of judgment, a voice from heaven declares blessed those who die in the Lord.","Apocalipsis 22":"The last chapter of the Bible: the river of the water of life, the tree of life and Jesus' promise: “Surely I come quickly.”"}},"cam":[{"u":"First steps","l":[{"t":"The love of God","w":"world","r":"Before you ever did anything good or bad, God already loved you. John 3:16 sums up the whole Bible: a love that gives what is most precious so that you can have life.","h":"Think of someone who needs to know God loves them, and pray for that person.","q":[["What did God give because He loved the world?","His Son","A new law","A temple","Riches"],["According to Romans 5:8, when did Christ die for us?","While we were yet sinners","When we were good","After we repented","When we deserved it"],["Complete 1 John 4:8: “God is…”","love","a judge","far away","silent"]]},{"t":"The problem of sin","w":"sinned","r":"No one is perfect: we have all fallen short before God. Admitting it isn't meant to crush you, but to help you see how much you need Jesus.","h":"Ask God to show you something you should confess to Him today.","q":[["According to Romans 3:23, how many have sinned?","All","Only bad people","Half","No one"],["According to Romans 6:23, what are the wages of sin?","Death","Sadness","Poverty","Sickness"],["According to Romans 6:23, what is the gift of God?","Eternal life","Wealth","Fame","Perfect health"]]},{"t":"Saved by grace","w":"grace","r":"Salvation isn't earned by effort or good works: it is a gift received by faith. No one can boast, because it is all God's work.","h":"Thank God for something He gave you that you didn't deserve.","q":[["According to Ephesians 2:8-9, we are saved by…","Grace, through faith","Our works","Going to church","Keeping the law"],["Why are we not saved by works?","So that no one can boast","Because they are hard","Because God doesn't see them","Because they are optional"],["According to Romans 10:9, what must you do to be saved?","Confess Jesus as Lord and believe He rose again","Give an offering","Be baptized in a river","Read the whole Bible"]]},{"t":"Born again","w":"born","r":"Nicodemus was a respected religious leader, and still Jesus told him he needed to be born again. It's not about improving a little, but about receiving new life from God.","h":"Think of something God has already changed in you, or something you want Him to change.","q":[["Who visited Jesus at night in John 3?","Nicodemus","Zacchaeus","Peter","Pilate"],["According to 2 Corinthians 5:17, if anyone is in Christ, he is…","A new creature","Perfect","Rich","An angel"],["What was Nicodemus?","A Pharisee, a ruler of the Jews","A fisherman","A Roman soldier","A tax collector"]]},{"t":"Safe in His hands","w":"pluck","r":"Your salvation doesn't depend on how tightly you hold on, but on how tightly Jesus holds you. He is the good shepherd and He doesn't let go of His sheep.","h":"When you doubt, read Romans 8:38-39 out loud.","q":[["In John 10, Jesus presents Himself as the good…","Shepherd","King","Teacher","Judge"],["According to Romans 8:38-39, what can separate us from the love of God?","Nothing","A big sin","Death","Demons"],["According to Romans 8:1, how much condemnation is there for those in Christ?","None","A little","It depends on the day","A lot"]]}]},{"u":"Getting to know Jesus","l":[{"t":"His birth","w":"Saviour","r":"God didn't arrive with an army or at a palace, but as a baby in a manger. The first news went to humble shepherds: salvation is for everyone.","h":"Share with someone why Jesus came into the world.","q":[["In what town was Jesus born?","Bethlehem","Nazareth","Jerusalem","Capernaum"],["To whom did the angels first announce the birth?","To some shepherds","To the priests","To King Herod","To the Romans"],["What does Emmanuel mean (Matthew 1:23)?","God with us","King of kings","Son of David","Savior"]]},{"t":"His miracles","w":"wind","r":"The disciples were terrified of the storm while Jesus slept. With one word He calmed the sea. His miracles show He has authority over everything, including your storms.","h":"Name your storm today and hand it over to Jesus in prayer.","q":[["What was Jesus' first miracle in the Gospel of John?","He turned water into wine","He walked on water","He raised Lazarus","He healed a blind man"],["How many men did Jesus feed with five loaves and two fish?","Five thousand","One hundred","Twelve","One thousand"],["Which disciple walked on the water toward Jesus?","Peter","John","Judas","Thomas"]]},{"t":"His parables","w":"compassion","r":"In the parable of the prodigal son, the father doesn't wait to scold: he runs to hug his son. That's how God is with whoever comes back to Him, no matter how far they've gone.","h":"If you've drifted away in some area, today is a good day to come back.","q":[["What did the father do when he saw the prodigal son returning?","He ran to hug him","He scolded him","He made him wait","He sent him to work"],["In the parable of the good Samaritan, who helped the wounded man?","A Samaritan","A priest","A Levite","A soldier"],["How many sheep did the shepherd leave to look for the lost one?","Ninety-nine","Ten","Fifty","One hundred"]]},{"t":"The cross","w":"wounded","r":"Seven hundred years earlier, Isaiah described someone wounded for the sins of others. On the cross, Jesus took your place: the punishment we deserved fell on Him to give us peace.","h":"Read Luke 23 and thank Jesus for what He did for you.","q":[["What did Jesus say about those who crucified Him (Luke 23:34)?","Father, forgive them","Punish them","I don't know them","Let them be judged"],["What did Jesus say on the cross according to John 19:30?","It is finished","I am afraid","I'll come back tomorrow","Forgive me"],["Which Roman governor authorized the crucifixion?","Pontius Pilate","Herod","Caesar Augustus","Caiaphas"]]},{"t":"He is risen!","w":"risen","r":"The empty tomb changes everything: death didn't have the last word. Because Jesus rose again, you also have the hope of eternal life.","h":"Tell someone today that Jesus is alive.","q":[["Who found the empty tomb first?","Some women","The soldiers","The Pharisees","Pilate and Herod"],["Which disciple doubted until he saw Jesus' wounds?","Thomas","Peter","Andrew","Philip"],["On what day did Jesus rise again?","On the third day","On the seventh day","On the next day","After forty days"]]}]},{"u":"Heroes of faith","l":[{"t":"Abraham","w":"mount","r":"Abraham left his homeland without knowing where he was going and waited years for the promised son. When God tested him, he learned that God provides.","h":"Think of a need you have and trust that the Lord will provide.","q":[["What was the name of Abraham's son of the promise?","Isaac","Ishmael","Jacob","Joseph"],["What did God provide in place of Isaac?","A ram","A golden calf","A dove","A camel"],["What was the name of Abraham's wife?","Sarah","Rebekah","Rachel","Leah"]]},{"t":"Joseph","w":"good","r":"Joseph was sold by his brothers, falsely accused and forgotten in prison. But God raised him up to save many. What others do for evil, God can use for good.","h":"Pray for someone who has hurt you.","q":[["Who sold Joseph as a slave?","His brothers","The Egyptians","His father","The Philistines"],["What special gift did Jacob give Joseph?","A coat of many colors","A sword","A ring","A horse"],["What position did Joseph reach in Egypt?","Governor, second only to Pharaoh","High priest","Army captain","King of Egypt"]]},{"t":"Moses","w":"fight","r":"Moses didn't even feel capable of speaking, but God used him to bring a whole nation out of slavery. Facing the sea with an army behind them, God opened a way where there was none.","h":"What impossible way do you need God to open? Tell Him today.","q":[["Which sea did God part so Israel could cross?","The Red Sea","The Dead Sea","The Sea of Galilee","The Mediterranean"],["Where did Moses receive the Ten Commandments?","On Mount Sinai","On Mount Carmel","In Jerusalem","In Egypt"],["From where did God first speak to Moses?","From a burning bush","From a cloud","In a dream","From the temple"]]},{"t":"David","w":"name","r":"David was the youngest in his family and took care of sheep. Facing the giant Goliath, he didn't trust in weapons but in God. God looks at the heart, not at appearances.","h":"Face your giant today trusting in God.","q":[["What did David use to defeat Goliath?","A sling and a stone","A sword","A bow","A spear"],["What did David do before he was king?","He was a shepherd","He was a fisherman","He was a carpenter","He was a priest"],["Who was David's best friend?","Jonathan","Saul","Absalom","Goliath"]]},{"t":"Daniel","w":"angel","r":"Daniel kept praying three times a day even though the law forbade it. He was thrown into the lions' den, but God protected him. Being faithful in everyday things prepares you for big tests.","h":"Set aside a fixed time each day to pray.","q":[["Why was Daniel thrown into the lions' den?","For continuing to pray to God","For stealing","For lying to the king","For trying to escape"],["What were the names of Daniel's three friends thrown into the fiery furnace?","Shadrach, Meshach and Abednego","Peter, John and James","Caleb, Joshua and Aaron","Shem, Ham and Japheth"],["In which empire did Daniel live as an exile?","Babylon","Egypt","Rome","Greece"]]}]},{"u":"Life with God","l":[{"t":"Prayer","w":"prayer","r":"Praying is talking with your Father. You don't need fancy words: Jesus taught us to pray simply and with confidence.","h":"Pray for five minutes today: give thanks, ask, and then stay silent for a moment.","q":[["What prayer did Jesus teach His disciples?","The Lord's Prayer","Psalm 23","The Creed","The Shema"],["According to Matthew 6:6, where does Jesus recommend praying?","In your room, in secret","In the town square","Only in the temple","In front of everyone"],["According to 1 Thessalonians 5:17, how should we pray?","Without ceasing","Once a week","Only when in trouble","Only at church"]]},{"t":"The Word","w":"lamp","r":"The Bible is like a lamp: it doesn't show you the whole road at once, but it does show you the next step. Reading it every day is letting God speak to you.","h":"Read a chapter of Proverbs or of the Gospel of John today.","q":[["How many books are in the Protestant Bible?","66","73","39","27"],["According to 2 Timothy 3:16, all Scripture is…","Given by inspiration of God","Optional","Just history","For experts only"],["Which book of the Bible has the most chapters?","Psalms","Genesis","Isaiah","Revelation"]]},{"t":"Faith","w":"substance","r":"Faith isn't knowing everything; it's trusting the One who does. Hebrews 11 remembers ordinary people who trusted God before they saw the promise fulfilled.","h":"Take a step of faith today in something you've been putting off.","q":[["According to Hebrews 11:6, without faith it is impossible to…","Please God","Be happy","Have money","Have friends"],["Jesus said that with faith like a grain of… you can move mountains","Mustard seed","Wheat","Rice","Sand"],["According to Romans 10:17, faith comes by…","Hearing the word of God","Seeing miracles","Feeling emotions","Going to retreats"]]},{"t":"Praise","w":"praise","r":"Praising God doesn't depend on how you feel, but on who He is. When you give thanks, the way you see your problems changes.","h":"Write down three things you thank God for today.","q":[["What phrase ends the book of Psalms?","Let every thing that hath breath praise the Lord","The Lord is my shepherd","Bless the Lord, O my soul","God is our refuge"],["According to John 4:24, how must we worship God?","In spirit and in truth","Only with music","Only in Jerusalem","With many words"],["What did Paul and Silas do at midnight in prison?","They sang hymns to God","They escaped","They slept","They argued"]]},{"t":"The church","w":"assembling","r":"The Christian faith is not lived alone. The church is a family where we encourage one another, serve and grow together.","h":"Send a message today to someone from your church to encourage them.","q":[["At which feast did the Holy Spirit come down on the church?","Pentecost","Passover","Tabernacles","Purim"],["About how many people were baptized after Peter's sermon in Acts 2?","About three thousand","Twelve","One hundred","Ten thousand"],["Paul compares the church to a…","Body","Army","Palace","Ship"]]}]},{"u":"Heart and character","l":[{"t":"Forgiving","w":"forgiving","r":"Forgiving doesn't mean what happened was okay. It means releasing the debt and leaving justice to God, because He forgave us first.","h":"Think of someone you find it hard to forgive and pray for that person.","q":[["How many times did Jesus say we should forgive?","Seventy times seven","Seven times","Three times","Once"],["In the Lord's Prayer we ask forgiveness as…","We forgive our debtors","We deserve it","We pay","We promise to change"],["What did Joseph do with the brothers who sold him?","He forgave them","He jailed them","He sold them","He ignored them"]]},{"t":"Anxiety","w":"care","r":"God doesn't ask you to feel nothing, but to bring Him what worries you. He cares for you more than you can imagine, just as He cares for the birds and the lilies.","h":"Make a list of your worries and hand them to God one by one.","q":[["Jesus said to look at the birds and at the…","Lilies of the field","Trees","Fish","Mountains"],["According to Philippians 4:7, what guards our hearts?","The peace of God","Money","Effort","Luck"],["According to Matthew 6:33, what should we seek first?","The kingdom of God and His righteousness","A job","Security","Food"]]},{"t":"Words","w":"soft","r":"Your words can build up or tear down. James compares the tongue to a small fire. Speaking with grace is a way of loving.","h":"Tell someone something encouraging today.","q":[["According to Proverbs 18:21, what is in the power of the tongue?","Death and life","Wealth","Fame","Wisdom"],["James compares the tongue to a small…","Fire","Bird","River","Tree"],["According to Ephesians 4:29, our words should be used to…","Build up","Win arguments","Impress","Criticize"]]},{"t":"Humility","w":"humble","r":"Jesus, though He was God, washed His disciples' feet. In His kingdom, true greatness is serving others.","h":"Do someone a favor today without anyone finding out.","q":[["What did Jesus do at the Last Supper to teach humility?","He washed His disciples' feet","He gave them money","He sang to them","He gave them robes"],["According to Proverbs 16:18, what goes before destruction?","Pride","Sadness","Poverty","Rain"],["Jesus said whoever wants to be great must be…","The servant of others","The leader","The richest","The wisest"]]},{"t":"The fruit of the Spirit","w":"peace","r":"Fruit can't be forced: it grows when we stay connected to Jesus, like a branch to the vine. Fun fact: in another verse, 1 Corinthians 13, the King James Version translates “love” as “charity.”","h":"Which fruit do you need most today? Ask God for it.","q":[["Which of these is a fruit of the Spirit?","Peace","Fame","Wealth","Physical strength"],["Jesus said: I am the vine, ye are the…","Branches","Fruit","Farmers","Trees"],["How many qualities of the fruit of the Spirit does Galatians 5:22-23 list?","Nine","Seven","Twelve","Three"]]}]},{"u":"The mission","l":[{"t":"The Holy Spirit","w":"witnesses","r":"Jesus didn't leave His disciples alone: He promised them the power of the Holy Spirit to be His witnesses. That same Spirit lives in every believer today.","h":"Ask the Holy Spirit for courage to talk about Jesus.","q":[["What appeared over the disciples at Pentecost?","Tongues like fire","A dove","A rainbow","A star"],["Who preached the sermon at Pentecost?","Peter","Paul","John","Stephen"],["How far did Jesus say they would be His witnesses?","To the uttermost part of the earth","Only in Jerusalem","Only in Israel","As far as Rome"]]},{"t":"Paul","w":"gain","r":"Saul persecuted Christians until Jesus met him on the road to Damascus. He became Paul, the great missionary. No one is too far away for God.","h":"Pray for someone who seems far from God.","q":[["What was Paul's name before his conversion?","Saul","Simon","Silas","Barnabas"],["On the road to which city did Paul meet Jesus?","Damascus","Rome","Athens","Corinth"],["What happened to Paul after he saw the light from heaven?","He was blind for three days","He became rich","He fled to Egypt","He lost his voice"]]},{"t":"The great mission","w":"gospel","r":"Jesus' last words before going up to heaven were a mission: go and make disciples. That mission begins with the people close to you.","h":"Invite someone to read a verse with you this week.","q":[["To whom did Jesus send them to preach the gospel?","To every creature","Only to the Jews","Only to the poor","Only to the priests"],["What did Jesus promise in Matthew 28:20?","To be with us always","To make us rich","That there would be no problems","To come back the next day"],["According to Romans 1:16, the gospel is…","The power of God unto salvation","A tradition","Only for the wise","A philosophy"]]},{"t":"Your gifts","w":"gift","r":"God gave you talents and gifts not to keep them hidden, but to serve others. In the body of Christ no one is extra and everyone is needed.","h":"Think of a gift you have and how to use it to serve this week.","q":[["In the parable of the talents, what did the wicked servant do with his talent?","He hid it in the ground","He doubled it","He gave it away","He lost it at sea"],["According to 1 Corinthians 12, gifts come from…","The same Spirit","Studies","Inheritance","Luck"],["According to 1 Peter 4:10, what are gifts for?","To serve others","To show off","To make money","To be famous"]]},{"t":"He will return","w":"quickly","r":"History doesn't end in chaos: Jesus will return and make all things new. There will be no more crying or pain. That hope helps us live with purpose today.","h":"Live today like someone waiting for Jesus: with love and hope.","q":[["Who knows the day and hour of Jesus' coming?","Only the Father","The angels","The prophets","The priests"],["According to Revelation 21:4, what will God wipe from our eyes?","All tears","Dust","Blindness","Sleep"],["What is the last book of the Bible?","Revelation","Jude","Malachi","Acts"]]}]},{"u":"Before His ministry","l":[{"t":"The announcement to Mary","w":"impossible","r":"The angel Gabriel visited a simple young woman from Nazareth with impossible news. Mary didn't understand it all, but she answered with faith: “Behold the handmaid of the Lord.”","h":"Tell God “here I am” in something He is asking of you, even if you don't understand it all.","q":[["Which angel visited Mary?","Gabriel","Michael","Raphael","Uriel"],["In what town did Mary live?","Nazareth","Bethlehem","Jerusalem","Jericho"],["To whom was Mary engaged?","Joseph","Zechariah","John","Simeon"]]},{"t":"The wise men from the east","w":"worshipped","r":"Some wise men from the east traveled a long way following a star. When they found the child, they knelt down and gave Him the best they had.","h":"Give God the best of your time today: start the day with Him.","q":[["What did the wise men follow to find Jesus?","A star","An angel","A river","A cloud"],["What gifts did they give Him?","Gold, frankincense and myrrh","Bread, wine and oil","Silver, clothes and jewels","Lambs and doves"],["Which king wanted to kill the child Jesus?","Herod","Saul","Pilate","Nebuchadnezzar"]]},{"t":"Jesus at twelve","w":"wisdom","r":"At twelve, Jesus stayed in the temple listening to the teachers and asking them questions. His parents searched for Him for three days. Jesus grew in wisdom, in stature and in favor.","h":"Grow in something today: learn something new, take care of your body or be kind to someone.","q":[["How old was Jesus when He stayed in the temple?","Twelve","Seven","Thirty","Fifteen"],["How many days did His parents search for Him?","Three","One","Seven","Ten"],["What was Jesus doing in the temple?","Listening to the teachers and asking questions","Selling doves","Sleeping","Preaching to the crowd"]]},{"t":"The baptism","w":"beloved","r":"Before doing a single miracle, Jesus heard the Father's voice: “This is my beloved Son.” God's love isn't earned by achievements: it's the starting point.","h":"Before anything you do today, remember that you are loved by God.","q":[["Who baptized Jesus?","John the Baptist","Peter","Paul","Elijah"],["In which river was He baptized?","The Jordan","The Nile","The Euphrates","The Tigris"],["In what form did the Holy Spirit come down?","Like a dove","Like fire","Like wind","Like a cloud"]]},{"t":"The temptation in the wilderness","w":"bread","r":"Jesus fasted forty days and the devil tempted Him three times. Each time He answered with the Word of God. That is our best weapon too.","h":"Memorize a verse today to use when temptation comes.","q":[["How many days did Jesus fast in the wilderness?","Forty","Seven","Three","Twelve"],["How did Jesus answer each temptation?","With the Word of God","With a miracle","With silence","With anger"],["What did the devil ask Him to turn into bread?","Stones","Sand","Water","Leaves"]]}]},{"u":"His teachings","l":[{"t":"The Beatitudes","w":"pure","r":"Jesus began His great sermon saying that the blessed are not the strong or the rich, but the humble, those who mourn, the meek and the pure in heart.","h":"Think about which beatitude you need to live out today.","q":[["What is the sermon with the Beatitudes called?","The Sermon on the Mount","The Sermon by the Sea","The Temple Sermon","The Pentecost Sermon"],["What will the pure in heart see?","God","Riches","Angels","The future"],["According to Jesus, what will the meek receive?","The earth","A golden kingdom","Lots of money","A crown"]]},{"t":"Salt and light","w":"light","r":"Jesus said His followers are salt and light: salt gives flavor and preserves; light shows the way. It's not about hiding but about shining with good works.","h":"Do a good deed today that shows God's love.","q":[["Jesus said His followers are the salt of the…","Earth","Table","City","Church"],["Where do you not put a lit lamp?","Under a bushel (a basket)","On a candlestick","On the table","In the window"],["Why should our good works be seen?","So people glorify the Father","To become famous","To win prizes","So people admire us"]]},{"t":"Don't worry about tomorrow","w":"morrow","r":"Jesus pointed to the birds and the lilies: God takes care of them without them worrying. If He cares for them, how much more for you. Live one day at a time.","h":"Today, every time you worry about the future, say: “God is already there.”","q":[["What examples from nature did Jesus use against worry?","The birds and the lilies","Lions and the sea","The stars and the moon","Trees and the wind"],["According to Matthew 6:33, what should we seek first?","The kingdom of God","Work","Money","Peace"],["Which king did Jesus say was not dressed like a lily?","Solomon","David","Saul","Herod"]]},{"t":"The house on the rock","w":"rock","r":"Jesus ended His sermon with two houses: one on the rock and one on the sand. Both faced the storm. The difference was putting into practice what they heard.","h":"Choose one of Jesus' teachings and put it into practice today.","q":[["What happened to the house built on the sand?","It fell","It stood firm","It burned","It was sold"],["According to Jesus, the wise man is the one who…","Hears His words and does them","Only hears them","Writes them down","Memorizes them"],["What beat against both houses?","Rain, floods and winds","An earthquake","Fire","Thieves"]]},{"t":"The great commandment","w":"heart","r":"An expert in the law asked Him which commandment was the most important. Jesus summed up the whole law in two: love God with everything and love your neighbor as yourself.","h":"Love God today with your time and your neighbor with a concrete act.","q":[["What is the first and great commandment according to Jesus?","Love God with all your heart","Do not steal","Keep the Sabbath","Honor your parents"],["What is the second?","Love your neighbor as yourself","Do not lie","Give the tithe","Fast"],["With what did Jesus say we must love God?","Heart, soul and mind","Money and time","Words and songs","Eyes and hands"]]}]},{"u":"His miracles","l":[{"t":"Water into wine","w":"miracles","r":"At a wedding the wine ran out, which was very embarrassing for the couple. Mary told the servants: “Whatsoever he saith unto you, do it.” Jesus turned the water into the best wine.","h":"Bring to Jesus something that has “run out” in your life and do what He tells you.","q":[["Where was the wedding?","Cana of Galilee","Jerusalem","Bethlehem","Nazareth"],["What did Mary tell the servants?","Whatever He says to you, do it","Go buy wine","Call the guests","Wait outside"],["How many stone water jars were there?","Six","Twelve","Three","Seven"]]},{"t":"The paralyzed man and his friends","w":"forgiven","r":"Four friends couldn't get in because of the crowd, so they opened the roof and lowered their paralyzed friend in front of Jesus. Jesus saw their faith.","h":"For which friend can you “open the roof” in prayer today?","q":[["How many friends carried the paralyzed man?","Four","Two","Twelve","Seven"],["How did they lower him?","Through the roof","Through the window","Through the back door","Down a well"],["What did Jesus say to him first?","Your sins are forgiven","Get up and run","Go home","Don't tell anyone"]]},{"t":"Five loaves and two fish","w":"loaves","r":"In front of thousands of hungry people, a boy gave the little he had. In Jesus' hands, that little bit fed five thousand, and twelve baskets were left over.","h":"Give God something “small” you have: time, a talent, a helping hand.","q":[["Who had the loaves and the fish?","A boy","Peter","A widow","A Pharisee"],["How many baskets were left over?","Twelve","Five","Seven","None"],["What were the loaves made of?","Barley","Wheat","Corn","Rye"]]},{"t":"Blind Bartimaeus","w":"whole","r":"Bartimaeus, a blind beggar, cried out: “Jesus, thou Son of David, have mercy on me!” People wanted to silence him, but he shouted even louder, and Jesus stopped for him.","h":"Don't stay quiet: cry out to Jesus for what you need.","q":[["What was the blind man's name?","Bartimaeus","Lazarus","Zacchaeus","Nicodemus"],["What did people do when he shouted?","They told him to be quiet","They helped him walk","They gave him money","They carried him"],["What did Bartimaeus do after receiving his sight?","He followed Jesus on the road","He went home","He went back to begging","He hid"]]},{"t":"Jairus' daughter","w":"believe","r":"Jairus, a synagogue leader, begged Jesus for his dying daughter. On the way they told him she had already died. Jesus said: “Be not afraid, only believe,” and He raised her up.","h":"In the face of the hardest news, listen to Jesus: “Don't be afraid, only believe.”","q":[["Who was Jairus?","A ruler of the synagogue","A fisherman","A Roman soldier","A tax collector"],["What did Jesus tell him on hearing the bad news?","Don't be afraid, only believe","It's too late","Come back tomorrow","Weep with them"],["How old was the girl?","Twelve","Five","Twenty","One"]]}]},{"u":"His parables","l":[{"t":"The sower","w":"fruit","r":"A sower scattered seed on four kinds of soil: the path, the rocks, the thorns and the good ground. The seed is the Word and the soil is our heart.","h":"Ask yourself what kind of soil your heart is today and pull out one “thorn.”","q":[["What does the seed represent?","The Word of God","Money","Children","Work"],["What choked the seed among the thorns?","The cares of this world and riches","The birds","The sun","The rain"],["Which soil bore fruit?","The good ground","The path","The rocks","The thorns"]]},{"t":"The lost sheep","w":"joy","r":"A shepherd had a hundred sheep and lost one. He left the ninety-nine to look for it and, when he found it, carried it home happily. That's how God searches for you.","h":"If you know someone who has drifted away, reach out to them today with a kind message.","q":[["How many sheep did the shepherd have?","One hundred","Ten","One thousand","Fifty"],["What did he do when he found the sheep?","He carried it on his shoulders, rejoicing","He scolded it","He sold it","He left it there"],["What other lost things appear in Luke 15?","A coin and a son","A ring and a key","A camel and a donkey","A boat and a net"]]},{"t":"The prodigal son","w":"lost","r":"The younger son asked for his inheritance, wasted it and ended up feeding pigs. When he came back repentant, his father ran to hug him and threw a party. The older brother, on the other hand, was angry.","h":"Are you more like the younger son or the older one today? Talk to God about it.","q":[["What work did the younger son do when he ran out of money?","Feeding pigs","Fishing","Building houses","Selling clothes"],["What did the father do when he saw him from far away?","He ran and hugged him","He shut the door","He waited sitting down","He sent a servant"],["How did the older brother react?","He got angry and wouldn't go in","He organized the party","He gave him his inheritance","He hugged him first"]]},{"t":"The good Samaritan","w":"likewise","r":"A man was robbed and left half dead. A priest and a Levite passed by on the other side. A Samaritan, from a despised people, stopped, treated his wounds and paid for his lodging.","h":"Stop today for someone who needs help, even if they're not “one of yours.”","q":[["Who passed by on the other side?","A priest and a Levite","Two soldiers","A king and a servant","Two fishermen"],["Where did the Samaritan take the wounded man?","To an inn","To his house","To the temple","To Jerusalem"],["What question did Jesus answer with this parable?","Who is my neighbor?","When will the kingdom come?","How should we pray?","Who is the greatest?"]]},{"t":"The talents","w":"faithful","r":"A master gave talents to three servants. Two multiplied them; one buried his out of fear. God doesn't ask you to have a lot, but to be faithful with what He gave you.","h":"Use one of your talents today to bless someone.","q":[["What did the wicked servant do with his talent?","He hid it in the ground","He spent it","He doubled it","He gave it away"],["Why did he hide it?","Out of fear","Because he wanted to give it away","Because he forgot","Because he lost it"],["What did the master say to the faithful servants?","Well done, good and faithful servant","Go away","Give me everything","Work harder"]]}]},{"u":"The last days","l":[{"t":"The entry into Jerusalem","w":"Hosanna","r":"Jesus rode into Jerusalem on a donkey, just as the prophet Zechariah had announced. People spread their cloaks and branches and shouted “Hosanna!” He was a different kind of king: humble and peaceful.","h":"Praise Jesus as your King today with a song or a prayer.","q":[["On what animal did Jesus enter Jerusalem?","A donkey","A horse","A camel","A chariot"],["What did people put on the road?","Cloaks and branches","Flowers and gold","Stones","Candles"],["Which prophet announced this entry?","Zechariah","Jonah","Elijah","Daniel"]]},{"t":"The washing of feet","w":"feet","r":"At the Last Supper, Jesus took a towel and washed His disciples' dirty feet, even Judas' feet. Peter didn't want to let Him. The Teacher showed that love serves.","h":"Serve someone at home today in something nobody wants to do.","q":[["Which disciple didn't want Jesus to wash his feet?","Peter","John","Thomas","Andrew"],["When did Jesus wash their feet?","At the Last Supper","At His baptism","At a wedding","On the mountain"],["What new commandment did Jesus give that night?","To love one another","To fast","To go to the temple","Not to eat bread"]]},{"t":"Gethsemane","w":"will","r":"In the garden of Gethsemane, Jesus prayed in such anguish that His sweat was like drops of blood. Even so, He surrendered to the Father: “Not my will, but thine, be done.”","h":"Hand God a hard decision today with that same prayer.","q":[["What was the name of the garden where Jesus prayed?","Gethsemane","Eden","Bethany","Golgotha"],["What were the disciples doing while Jesus prayed?","Sleeping","Praying with Him","Singing","Fishing"],["Who betrayed Jesus with a kiss?","Judas","Peter","Thomas","Matthew"]]},{"t":"It is finished","w":"finished","r":"On the cross, Jesus forgave those who crucified Him, promised paradise to a repentant thief and took care of His mother. His last word was “It is finished”: the debt was paid in full.","h":"Give thanks that your debt to God is paid: you don't have to earn it.","q":[["What did Jesus promise the repentant thief?","That he would be with Him in paradise","That he would come down from the cross","That he would set him free","Nothing"],["To whom did Jesus entrust the care of His mother?","To the disciple John","To Peter","To Lazarus","To Joseph of Arimathea"],["What does “It is finished” mean?","That the work was complete","That He was thirsty","That He was giving up","That He would be back soon"]]},{"t":"The sealed tomb","w":"sepulchre","r":"Joseph of Arimathea laid Jesus' body in a new tomb cut out of the rock. The leaders sealed the stone and set guards. No seal could stop what was coming.","h":"Think of something that seems “sealed” in your life and entrust it to God.","q":[["Who asked for Jesus' body to bury it?","Joseph of Arimathea","Peter","Pilate","John the Baptist"],["What did they set to watch the tomb?","Guards","Dogs","Angels","Disciples"],["What closed the tomb?","A great stone","A wooden door","Iron bars","Nothing"]]}]},{"u":"He is alive!","l":[{"t":"The empty tomb","w":"risen","r":"Early on Sunday, some women brought spices to the tomb. The stone was rolled away and two men in shining clothes asked them: “Why seek ye the living among the dead?”","h":"Tell someone today what Jesus has done in your life.","q":[["On what day did Jesus rise?","The first day of the week","Saturday","Friday","Monday"],["What did the women bring to the tomb?","Spices","Flowers","Bread","Candles"],["What did the men in shining clothes ask them?","Why do you seek the living among the dead?","Where is Peter?","Who moved the stone?","Are you afraid?"]]},{"t":"The road to Emmaus","w":"burn","r":"Two disciples were walking sadly toward Emmaus. The risen Jesus walked with them, but they didn't recognize Him until He broke the bread. He walks with you even when you don't notice.","h":"When you eat today, remember that Jesus is at your table.","q":[["To which village were the two disciples going?","Emmaus","Bethany","Jericho","Nazareth"],["When did they recognize Jesus?","When He broke the bread","When they saw His wounds","When they heard His name","When they got to Jerusalem"],["What did they feel while Jesus explained the Scriptures?","That their hearts burned within them","Fear","Sleepiness","Anger"]]},{"t":"Thomas sees and believes","w":"believed","r":"Thomas wasn't there when Jesus appeared, and he said he wouldn't believe without touching His wounds. Eight days later, Jesus invited him to touch them. Thomas exclaimed: “My Lord and my God!”","h":"Bring your doubts to Jesus honestly: He doesn't reject you.","q":[["What did Thomas say when he saw Jesus?","My Lord and my God!","It's a ghost!","It can't be!","Forgive me!"],["How many days later did Jesus appear to Thomas?","Eight","Three","Forty","One"],["Whom did Jesus call blessed?","Those who have not seen and yet have believed","Those who have seen","The apostles","The priests"]]},{"t":"Peter restored","w":"sheep","r":"Peter had denied Jesus three times. By the sea, after a miraculous catch of fish, Jesus asked him three times “Do you love me?” and entrusted His sheep to him. Jesus restores those who fall.","h":"If you've failed God, come back to Him today: His answer is to restore you.","q":[["How many times did Jesus ask Peter if he loved Him?","Three","One","Seven","Two"],["What did Jesus entrust to Peter?","To feed His sheep","To build a temple","To go back to fishing","To write a book"],["Where did this happen?","By the Sea of Galilee","In the temple","In Gethsemane","In Rome"]]},{"t":"He ascended into heaven","w":"heaven","r":"Forty days after rising again, Jesus went up into heaven in front of His disciples. Two angels told them He would come back the same way. In the meantime, He left us a mission.","h":"Carry out the mission today: share a verse with someone.","q":[["How many days was Jesus with His disciples after rising again?","Forty","Seven","Three","One hundred"],["What did the angels tell the disciples?","That Jesus will come back the same way","To go home","That Jesus would not return","To wait in Galilee"],["From which mountain did Jesus go up to heaven?","The Mount of Olives","Mount Sinai","Mount Carmel","Mount Ararat"]]}]},{"u":"Family","l":[{"t":"Building with God","w":"build","r":"A house can have strong walls and still fall apart inside. This psalm teaches that a firm home is built with God at the center.","h":"Pray briefly together as a family today, even if it's just before a meal.","q":[["Who is Psalm 127 attributed to?","Solomon","David","Moses","Asaph"],["According to the psalm, children are…","A heritage of the Lord","A burden","A reward for good works","The government's responsibility"],["What happens if the Lord does not build the house?","Those who build it labor in vain","It becomes rich","It gets bigger","Nothing"]]},{"t":"Husbands and wives","w":"Christ","r":"Paul sets the bar very high: love as Christ loved, giving yourself. In marriage, love isn't just a feeling: it's a daily decision to serve and respect.","h":"Do something for your spouse or family today without being asked.","q":[["How should husbands love, according to Ephesians 5?","As Christ loved the church","As they love their parents","As they love their friends","When she deserves it"],["According to Genesis 2:24, what will husband and wife be?","One flesh","Business partners","Two separate people","Siblings"],["According to Ecclesiastes 4:12, what is not quickly broken?","A threefold cord","A new rope","A gold chain","A net"]]},{"t":"Parents and children","w":"provoke","r":"The Bible asks children to honor their parents, and parents not to provoke their children. It's a two-way street: respect on one side and patience on the other.","h":"Tell your dad, mom or child today something you value about them.","q":[["Which commandment comes with a promise, according to Ephesians 6:2?","Honor your father and mother","You shall not kill","You shall not steal","Keep the Sabbath holy"],["What should parents not do, according to Ephesians 6:4?","Provoke their children to anger","Discipline them","Teach them","Play with them"],["According to Proverbs 22:6, a child trained in the way he should go…","Will not depart from it when he is old","Will leave home","Will be rich","Will be king"]]},{"t":"Brothers and sisters","w":"dwell","r":"Cain and Abel, Jacob and Esau, Joseph and his brothers: the Bible doesn't hide the fights between siblings. But it also shows the beauty of reconciliation.","h":"Reach out today to a sibling or relative you've grown distant from.","q":[["Who killed his brother Abel?","Cain","Seth","Esau","Reuben"],["Which brothers reconciled after years of conflict?","Jacob and Esau","Cain and Abel","Amnon and Absalom","Moses and Aaron"],["What did Joseph finally do with his brothers?","He forgave them and cared for them","He put them in jail","He took revenge","He never saw them again"]]},{"t":"A faith passed down","w":"grandmother","r":"Timothy's faith began with his grandmother Lois and his mother Eunice. What is sown at home can last for generations.","h":"Tell a child or young person how God has helped you.","q":[["What was the name of Timothy's grandmother?","Lois","Hannah","Ruth","Sarah"],["And his mother?","Eunice","Mary","Elizabeth","Deborah"],["According to Proverbs 17:6, what is the crown of old men?","Grandchildren","Money","Fame","Gray hair"]]}]},{"u":"Money and work","l":[{"t":"Working for the Lord","w":"heartily","r":"Paul wrote to workers with difficult bosses: do everything as for the Lord. That way any job, however simple, becomes worship.","h":"Do your work with excellence today, as if Jesus were your customer.","q":[["According to Colossians 3:23, who should we work for?","As for the Lord","For the boss","For ourselves","To be seen"],["According to Proverbs 6, which animal teaches the lazy person?","The ant","The bee","The lion","The horse"],["According to 2 Thessalonians 3:10, whoever will not work…","Should not eat","Should rest","Should ask for help","Should pray more"]]},{"t":"Debt","w":"servant","r":"Debts can become chains. The Bible doesn't forbid every loan, but it warns of the danger and encourages us to owe no one anything but love.","h":"Review your spending today and write down one debt you want to start paying off.","q":[["According to Proverbs 22:7, the borrower is…","Servant to the lender","Free","Wise","Rich"],["According to Romans 13:8, what is the only thing we should owe?","Love","Money","Favors","Nothing"],["According to Luke 14:28, what does someone who wants to build a tower do?","First counts the cost","Borrows money","Starts without thinking","Looks for partners"]]},{"t":"Giving cheerfully","w":"cheerful","r":"God doesn't need our money, but He does want our heart. Giving cheerfully frees us from the love of money and blesses others.","h":"Give something cheerfully today: an offering, a meal or your time.","q":[["Which giver does God love?","A cheerful one","A rich one","One who gives a lot","One who gives in secret"],["Which widow gave everything she had at the temple?","The one who put two mites in the offering","Naomi","Hannah","Deborah"],["According to Acts 20:35, what is more blessed?","To give than to receive","To receive than to give","To save","To earn"]]},{"t":"Contentment","w":"content","r":"Paul wrote from prison that he had learned to be content with little or with much. Contentment can't be bought: it's learned by trusting God.","h":"List five things you already have and give thanks for them.","q":[["Where did Paul write the letter to the Philippians from?","From prison","From a ship","From Jerusalem","From his home"],["According to 1 Timothy 6:10, what is the root of all evil?","The love of money","Money","Poverty","Work"],["According to Hebrews 13:5, why can we be content?","Because God will never leave us","Because we'll be rich","Because there are no problems","Because we work hard"]]},{"t":"Plans and projects","w":"Commit","r":"Making plans is wise, but the Bible invites us to place them in God's hands. He can establish our ways or redirect them for good.","h":"Write down your main goal for the month and give it to God in prayer.","q":[["According to Proverbs 16:9, a man plans his way, but…","The Lord directs his steps","He decides everything","Luck decides","Others decide"],["According to Proverbs 15:22, what do plans need to succeed?","Many counselors","Lots of money","Lots of luck","Working alone"],["According to James 4:15, what should we say when making plans?","If the Lord wills","I'll definitely do it","Tomorrow will be better","No one can stop me"]]}]},{"u":"Emotions","l":[{"t":"Sadness","w":"hope","r":"The psalmist speaks to his own sad soul: “Why art thou cast down?” He doesn't deny the sadness, but he reminds himself to hope in God. It's okay to feel; it's not okay to carry it alone.","h":"Write to God what you feel today and find someone you trust to talk to.","q":[["Who is the psalmist talking to in Psalm 42?","His own soul","A king","An angel","His enemy"],["To what animal does he compare his thirst for God?","A deer","A lion","A dove","A camel"],["According to Psalm 34:18, who is the Lord near to?","The brokenhearted","The rich","The strong","The famous"]]},{"t":"Fear","w":"Fear","r":"“Fear not” appears many times in the Bible, almost always with a reason: “for I am with thee.” Courage isn't feeling no fear, but moving forward with company.","h":"Name your fear today and say Isaiah 41:10 out loud.","q":[["What reason does God give in Isaiah 41:10 not to fear?","That He is with us","That nothing bad will happen","That we are strong","That it's a dream"],["According to 2 Timothy 1:7, God has not given us a spirit of…","Fear","Love","Power","A sound mind"],["According to Psalm 56:3, what does the psalmist do when he is afraid?","Trusts in God","Runs away","Hides","Cries"]]},{"t":"Anger","w":"wrath","r":"James gives a simple formula: quick to listen, slow to speak, slow to anger. Anger isn't sin in itself, but handled badly it hurts the people we love most.","h":"Today, before answering in anger, take a breath and count to ten.","q":[["According to James 1:19, how should we be to hear?","Swift","Slow","Distracted","Silent"],["According to Ephesians 4:26, when should anger end?","Before the sun goes down","In a week","Never","When the other person apologizes"],["According to Proverbs 15:1, what turns away wrath?","A soft answer","Silence","A gift","Shouting louder"]]},{"t":"Loneliness","w":"forsake","r":"Elijah felt so alone that he wanted to die under a juniper tree. God didn't scold him: He fed him, let him rest and reminded him he wasn't alone. God treats you with the same tenderness.","h":"Call someone today who might also be feeling lonely.","q":[["Under what tree did the discouraged Elijah sit?","A juniper tree","An olive tree","A palm tree","A sycamore"],["What did God do first with Elijah?","He fed him and let him sleep","He scolded him","He gave him a mission","He took him to heaven"],["What does God promise in Hebrews 13:5?","I will never leave you nor forsake you","I will make you rich","You will not suffer","You will have many friends"]]},{"t":"Joy","w":"joy","r":"Biblical joy isn't being happy all the time: it's a strength that comes from God even in hard times. Paul and Silas sang in chains in prison.","h":"Listen to or sing a worship song today, even if you don't feel like it.","q":[["According to Nehemiah 8:10, the joy of the Lord is our…","Strength","Reward","Inheritance","Food"],["What did Paul and Silas do in chains in prison?","They sang hymns","They cried","They slept","They complained"],["According to Philippians 4:4, when should we rejoice in the Lord?","Always","On Sundays","When everything goes well","Never"]]}]},{"u":"Words","l":[{"t":"The power of the tongue","w":"fire","r":"James compares the tongue to a ship's rudder and to a spark that sets a forest on fire. Something so small can steer or destroy a lot.","h":"Today, skip one criticism and replace it with a compliment.","q":[["What does James compare the tongue to?","A little fire","A sword","A flower","A stone"],["What part of a ship does James mention?","The rudder","The anchor","The sail","The mast"],["According to Proverbs 18:21, what is in the power of the tongue?","Death and life","Money","Health","Fame"]]},{"t":"The truth","w":"truth","r":"Ananias and Sapphira lied about an offering to look generous, and it cost them dearly. Truth builds trust; lies destroy it little by little.","h":"If you owe someone the truth, tell them today with love.","q":[["Who lied about an offering in Acts 5?","Ananias and Sapphira","Aquila and Priscilla","Paul and Silas","Adam and Eve"],["According to Proverbs 12:22, lying lips are…","An abomination to the Lord","Clever","Funny","Necessary"],["According to John 8:32, what will make us free?","The truth","Money","Strength","Luck"]]},{"t":"Gossip","w":"talebearer","r":"Gossip is like wood for a fire: it feeds quarrels. If no one repeats it, it dies out on its own. Protecting other people's reputation is a way of loving them.","h":"Today, if you hear gossip, don't repeat it and change the subject.","q":[["According to Proverbs 26:20, what happens where there is no talebearer?","The strife ceases","People get bored","There's fake peace","No one talks"],["According to the proverb, what makes the fire go out?","No wood","Water","Wind","Rain"],["According to Ephesians 4:29, what words should come out of our mouths?","Words that build up","Funny ones","Harsh ones","None"]]},{"t":"Encouraging words","w":"honeycomb","r":"Joseph, a believer from Cyprus, was called Barnabas, “son of consolation,” because he encouraged everyone. His words helped Paul be accepted by the church.","h":"Send someone an encouraging message today.","q":[["What does the name Barnabas mean?","Son of consolation","Son of thunder","Strong man","Son of David"],["Whom did Barnabas help to be accepted by the disciples?","Paul","Peter","John","Thomas"],["According to Proverbs 16:24, what are pleasant words like?","A honeycomb","Cold water","Warm bread","A river"]]},{"t":"Knowing when to be quiet","w":"wise","r":"Ecclesiastes says there is a time to keep silent and a time to speak. Sometimes the wisest answer is to listen and say nothing.","h":"In one conversation today, listen more than you speak.","q":[["According to Proverbs 17:28, how is a fool counted when he holds his peace?","As wise","As foolish","As shy","As rude"],["According to Ecclesiastes 3:7, there is a time to keep silent and a time to…","Speak","Sing","Cry","Sleep"],["According to Psalm 141:3, what does David ask God?","To set a watch before his mouth","To give him strength","To make him rich","To punish his enemies"]]}]},{"u":"Relationships","l":[{"t":"True friendship","w":"friend","r":"David and Jonathan were loyal friends, even though Jonathan's father wanted to kill David. A true friend is there in good times and bad.","h":"Thank a friend today for being there for you.","q":[["Who was David's best friend?","Jonathan","Saul","Nathan","Joab"],["Who was Jonathan's father?","King Saul","Samuel","Jesse","Goliath"],["According to Proverbs 27:17, iron sharpens iron, and a man…","Sharpens his friend","Stays alone","Fights","Rests"]]},{"t":"Forgiving for real","w":"forgiving","r":"Jesus told of a servant who was forgiven a huge debt but refused to forgive a small one. We forgive because we were forgiven first.","h":"Write the name of someone you need to forgive and pray for that person.","q":[["In the parable, what did the forgiven servant do to his fellow servant?","He refused to forgive a small debt","He gave him money","He forgave him everything","He invited him to dinner"],["How should we forgive, according to Colossians 3:13?","As Christ forgave us","Only once","When they apologize","If it suits us"],["Up to how many times did Peter ask if he should forgive?","Up to seven","Up to three","Up to ten","Once"]]},{"t":"Not judging","w":"beam","r":"Jesus used an almost comical image: someone with a beam in his eye trying to take a speck out of someone else's. Before correcting others, we need to check our own heart.","h":"Before criticizing someone today, think of one of your own mistakes.","q":[["What is in the eye of the one who judges, according to Jesus?","A beam","A stone","A finger","Nothing"],["What did Jesus say to those who wanted to stone the woman?","He who is without sin, let him cast the first stone","Stone her","Go home","Call the priests"],["According to James 4:12, who is the only judge?","God","The king","The pastor","Us"]]},{"t":"Making peace","w":"peacemakers","r":"The herd
