nally, my brethren, be strong in the Lord, and in the power of his might.","48.6.11":"Put on the whole armour of God, that ye may be able to stand against the wiles of the devil.","48.6.12":"For we wrestle not against flesh and blood, but against principalities, against powers, against the rulers of the darkness of this world, against spiritual wickedness in high places.","48.6.13":"Wherefore take unto you the whole armour of God, that ye may be able to withstand in the evil day, and having done all, to stand.","48.6.14":"Stand therefore, having your loins girt about with truth, and having on the breastplate of righteousness;","48.6.15":"And your feet shod with the preparation of the gospel of peace;","48.6.16":"Above all, taking the shield of faith, wherewith ye shall be able to quench all the fiery darts of the wicked.","48.6.17":"And take the helmet of salvation, and the sword of the Spirit, which is the word of God:","48.6.18":"Praying always with all prayer and supplication in the Spirit, and watching thereunto with all perseverance and supplication for all saints;","59.5.8":"Be sober, be vigilant; because your adversary the devil, as a roaring lion, walketh about, seeking whom he may devour:","59.5.9":"Whom resist stedfast in the faith, knowing that the same afflictions are accomplished in your brethren that are in the world.","46.10.4":"(For the weapons of our warfare are not carnal, but mighty through God to the pulling down of strong holds;)","61.4.4":"Ye are of God, little children, and have overcome them: because greater is he that is in you, than he that is in the world.","41.10.19":"Behold, I give unto you power to tread on serpents and scorpions, and over all the power of the enemy: and nothing shall by any means hurt you.","19.19.17":"He that hath pity upon the poor lendeth unto the Lord; and that which he hath given will he pay him again.","19.11.25":"The liberal soul shall be made fat: and he that watereth shall be watered also himself.","19.22.9":"He that hath a bountiful eye shall be blessed; for he giveth of his bread to the poor.","61.3.17":"But whoso hath this world’s good, and seeth his brother have need, and shutteth up his bowels of compassion from him, how dwelleth the love of God in him?","61.3.18":"My little children, let us not love in word, neither in tongue; but in deed and in truth.","58.2.15":"If a brother or sister be naked, and destitute of daily food,","58.2.16":"And one of you say unto them, Depart in peace, be ye warmed and filled; notwithstanding ye give them not those things which are needful to the body; what doth it profit?","49.2.15":"That ye may be blameless and harmless, the sons of God, without rebuke, in the midst of a crooked and perverse nation, among whom ye shine as lights in the world;","59.2.12":"Having your conversation honest among the Gentiles: that, whereas they speak against you as evildoers, they may by your good works, which they shall behold, glorify God in the day of visitation.","50.4.5":"Walk in wisdom toward them that are without, redeeming the time.","50.4.6":"Let your speech be alway with grace, seasoned with salt, that ye may know how ye ought to answer every man.","55.2.7":"In all things shewing thyself a pattern of good works: in doctrine shewing uncorruptness, gravity, sincerity,","55.2.8":"Sound speech, that cannot be condemned; that he that is of the contrary part may be ashamed, having no evil thing to say of you.","39.7.1":"Judge not, that ye be not judged.","39.7.2":"For with what judgment ye judge, ye shall be judged: and with what measure ye mete, it shall be measured to you again.","39.7.3":"And why beholdest thou the mote that is in thy brother’s eye, but considerest not the beam that is in thine own eye?","39.7.4":"Or how wilt thou say to thy brother, Let me pull out the mote out of thine eye; and, behold, a beam is in thine own eye?","39.7.5":"Thou hypocrite, first cast out the beam out of thine own eye; and then shalt thou see clearly to cast out the mote out of thy brother’s eye.","44.14.10":"But why dost thou judge thy brother? or why dost thou set at nought thy brother? for we shall all stand before the judgment seat of Christ.","44.14.11":"For it is written, As I live, saith the Lord, every knee shall bow to me, and every tongue shall confess to God.","44.14.12":"So then every one of us shall give account of himself to God.","44.14.13":"Let us not therefore judge one another any more: but judge this rather, that no man put a stumblingblock or an occasion to fall in his brother’s way.","44.2.1":"Therefore thou art inexcusable, O man, whosoever thou art that judgest: for wherein thou judgest another, thou condemnest thyself; for thou that judgest doest the same things.","58.4.11":"Speak not evil one of another, brethren. He that speaketh evil of his brother, and judgeth his brother, speaketh evil of the law, and judgeth the law: but if thou judge the law, thou art not a doer of the law, but a judge.","58.4.12":"There is one lawgiver, who is able to save and to destroy: who art thou that judgest another?","42.8.7":"So when they continued asking him, he lifted up himself, and said unto them, He that is without sin among you, let him first cast a stone at her.","39.23.27":"Woe unto you, scribes and Pharisees, hypocrites! for ye are like unto whited sepulchres, which indeed appear beautiful outward, but are within full of dead men’s bones, and of all uncleanness.","39.23.28":"Even so ye also outwardly appear righteous unto men, but within ye are full of hypocrisy and iniquity.","39.6.1":"Take heed that ye do not your alms before men, to be seen of them: otherwise ye have no reward of your Father which is in heaven.","39.6.2":"Therefore when thou doest thine alms, do not sound a trumpet before thee, as the hypocrites do in the synagogues and in the streets, that they may have glory of men. Verily I say unto you, They have their reward.","39.6.3":"But when thou doest alms, let not thy left hand know what thy right hand doeth:","39.6.4":"That thine alms may be in secret: and thy Father which seeth in secret himself shall reward thee openly.","58.1.26":"If any man among you seem to be religious, and bridleth not his tongue, but deceiveth his own heart, this man’s religion is vain.","44.12.9":"Let love be without dissimulation. Abhor that which is evil; cleave to that which is good.","59.1.6":"Wherein ye greatly rejoice, though now for a season, if need be, ye are in heaviness through manifold temptations:","59.1.7":"That the trial of your faith, being much more precious than of gold that perisheth, though it be tried with fire, might be found unto praise and honour and glory at the appearing of Jesus Christ:","17.23.10":"But he knoweth the way that I take: when he hath tried me, I shall come forth as gold.","22.48.10":"Behold, I have refined thee, but not with silver; I have chosen thee in the furnace of affliction.","37.13.9":"And I will bring the third part through the fire, and will refine them as silver is refined, and will try them as gold is tried: they shall call on my name, and I will hear them: I will say, It is my people: and they shall say, The Lord is my God.","1.20.8":"Remember the sabbath day, to keep it holy.","1.20.9":"Six days shalt thou labour, and do all thy work:","1.20.10":"But the seventh day is the sabbath of the Lord thy God: in it thou shalt not do any work, thou, nor thy son, nor thy daughter, thy manservant, nor thy maidservant, nor thy cattle, nor thy stranger that is within thy gates:","40.2.27":"And he said unto them, The sabbath was made for man, and not man for the sabbath:","40.6.31":"And he said unto them, Come ye yourselves apart into a desert place, and rest a while: for there were many coming and going, and they had no leisure so much as to eat.","57.4.9":"There remaineth therefore a rest to the people of God.","57.4.10":"For he that is entered into his rest, he also hath ceased from his own works, as God did from his.","18.46.10":"Be still, and know that I am God: I will be exalted among the heathen, I will be exalted in the earth.","22.30.15":"For thus saith the Lord God, the Holy One of Israel; In returning and rest shall ye be saved; in quietness and in confidence shall be your strength: and ye would not.","59.5.2":"Feed the flock of God which is among you, taking the oversight thereof, not by constraint, but willingly; not for filthy lucre, but of a ready mind;","59.5.3":"Neither as being lords over God’s heritage, but being ensamples to the flock.","59.5.4":"And when the chief Shepherd shall appear, ye shall receive a crown of glory that fadeth not away.","43.20.28":"Take heed therefore unto yourselves, and to all the flock, over the which the Holy Ghost hath made you overseers, to feed the church of God, which he hath purchased with his own blood.","23.3.15":"And I will give you pastors according to mine heart, which shall feed you with knowledge and understanding.","53.4.13":"Till I come, give attendance to reading, to exhortation, to doctrine.","53.4.14":"Neglect not the gift that is in thee, which was given thee by prophecy, with the laying on of the hands of the presbytery.","53.4.15":"Meditate upon these things; give thyself wholly to them; that thy profiting may appear to all.","53.4.16":"Take heed unto thyself, and unto the doctrine; continue in them: for in doing this thou shalt both save thyself, and them that hear thee.","45.15.58":"Therefore, my beloved brethren, be ye stedfast, unmoveable, always abounding in the work of the Lord, forasmuch as ye know that your labour is not in vain in the Lord.","45.10.31":"Whether therefore ye eat, or drink, or whatsoever ye do, do all to the glory of God.","53.4.8":"For bodily exercise profiteth little: but godliness is profitable unto all things, having promise of the life that now is, and of that which is to come.","19.17.22":"A merry heart doeth good like a medicine: but a broken spirit drieth the bones.","19.3.7":"Be not wise in thine own eyes: fear the Lord, and depart from evil.","19.3.8":"It shall be health to thy navel, and marrow to thy bones.","19.9.10":"The fear of the Lord is the beginning of wisdom: and the knowledge of the holy is understanding.","19.2.6":"For the Lord giveth wisdom: out of his mouth cometh knowledge and understanding.","19.3.13":"Happy is the man that findeth wisdom, and the man that getteth understanding.","19.3.14":"For the merchandise of it is better than the merchandise of silver, and the gain thereof than fine gold.","19.4.7":"Wisdom is the principal thing; therefore get wisdom: and with all thy getting get understanding.","58.3.17":"But the wisdom that is from above is first pure, then peaceable, gentle, and easy to be intreated, full of mercy and good fruits, without partiality, and without hypocrisy.","20.7.12":"For wisdom is a defence, and money is a defence: but the excellency of knowledge is, that wisdom giveth life to them that have it.","18.90.12":"So teach us to number our days, that we may apply our hearts unto wisdom.","19.12.22":"Lying lips are abomination to the Lord: but they that deal truly are his delight.","48.4.25":"Wherefore putting away lying, speak every man truth with his neighbour: for we are members one of another.","50.3.9":"Lie not one to another, seeing that ye have put off the old man with his deeds;","37.8.16":"These are the things that ye shall do; Speak ye every man the truth to his neighbour; execute the judgment of truth and peace in your gates:","19.11.3":"The integrity of the upright shall guide them: but the perverseness of transgressors shall destroy them.","19.10.9":"He that walketh uprightly walketh surely: but he that perverteth his ways shall be known.","19.18.21":"Death and life are in the power of the tongue: and they that love it shall eat the fruit thereof.","58.3.5":"Even so the tongue is a little member, and boasteth great things. Behold, how great a matter a little fire kindleth!","58.3.6":"And the tongue is a fire, a world of iniquity: so is the tongue among our members, that it defileth the whole body, and setteth on fire the course of nature; and it is set on fire of hell.","58.3.7":"For every kind of beasts, and of birds, and of serpents, and of things in the sea, is tamed, and hath been tamed of mankind:","58.3.8":"But the tongue can no man tame; it is an unruly evil, full of deadly poison.","58.3.9":"Therewith bless we God, even the Father; and therewith curse we men, which are made after the similitude of God.","58.3.10":"Out of the same mouth proceedeth blessing and cursing. My brethren, these things ought not so to be.","48.4.29":"Let no corrupt communication proceed out of your mouth, but that which is good to the use of edifying, that it may minister grace unto the hearers.","19.16.24":"Pleasant words are as an honeycomb, sweet to the soul, and health to the bones.","19.21.23":"Whoso keepeth his mouth and his tongue keepeth his soul from troubles.","39.12.36":"But I say unto you, That every idle word that men shall speak, they shall give account thereof in the day of judgment.","39.12.37":"For by thy words thou shalt be justified, and by thy words thou shalt be condemned.","18.141.3":"Set a watch, O Lord, before my mouth; keep the door of my lips.","19.26.20":"Where no wood is, there the fire goeth out: so where there is no talebearer, the strife ceaseth.","19.16.28":"A froward man soweth strife: and a whisperer separateth chief friends.","19.11.13":"A talebearer revealeth secrets: but he that is of a faithful spirit concealeth the matter.","19.20.19":"He that goeth about as a talebearer revealeth secrets: therefore meddle not with him that flattereth with his lips.","1.20.16":"Thou shalt not bear false witness against thy neighbour.","2.19.16":"Thou shalt not go up and down as a talebearer among thy people: neither shalt thou stand against the blood of thy neighbour: I am the Lord.","19.25.28":"He that hath no rule over his own spirit is like a city that is broken down, and without walls.","45.9.25":"And every man that striveth for the mastery is temperate in all things. Now they do it to obtain a corruptible crown; but we an incorruptible.","45.9.26":"I therefore so run, not as uncertainly; so fight I, not as one that beateth the air:","45.9.27":"But I keep under my body, and bring it into subjection: lest that by any means, when I have preached to others, I myself should be a castaway.","45.16.13":"Watch ye, stand fast in the faith, quit you like men, be strong.","19.28.1":"The wicked flee when no man pursueth: but the righteous are bold as a lion.","43.4.29":"And now, Lord, behold their threatenings: and grant unto thy servants, that with all boldness they may speak thy word,","41.6.36":"Be ye therefore merciful, as your Father also is merciful.","50.3.12":"Put on therefore, as the elect of God, holy and beloved, bowels of mercies, kindness, humbleness of mind, meekness, longsuffering;","19.3.3":"Let not mercy and truth forsake thee: bind them about thy neck; write them upon the table of thine heart:","19.3.4":"So shalt thou find favour and good understanding in the sight of God and man.","19.21.21":"He that followeth after righteousness and mercy findeth life, righteousness, and honour.","47.6.10":"As we have therefore opportunity, let us do good unto all men, especially unto them who are of the household of faith.","29.5.24":"But let judgment run down as waters, and righteousness as a mighty stream.","19.21.3":"To do justice and judgment is more acceptable to the Lord than sacrifice.","19.31.8":"Open thy mouth for the dumb in the cause of all such as are appointed to destruction.","19.31.9":"Open thy mouth, judge righteously, and plead the cause of the poor and needy.","18.89.14":"Justice and judgment are the habitation of thy throne: mercy and truth shall go before thy face.","39.23.23":"Woe unto you, scribes and Pharisees, hypocrites! for ye pay tithe of mint and anise and cummin, and have omitted the weightier matters of the law, judgment, mercy, and faith: these ought ye to have done, and not to leave the other undone.","49.4.12":"I know both how to be abased, and I know how to abound: every where and in all things I am instructed both to be full and to be hungry, both to abound and to suffer need.","49.4.13":"I can do all things through Christ which strengtheneth me.","53.6.6":"But godliness with contentment is great gain.","53.6.7":"For we brought nothing into this world, and it is certain we can carry nothing out.","53.6.8":"And having food and raiment let us be therewith content.","19.15.16":"Better is little with the fear of the Lord than great treasure and trouble therewith.","20.5.10":"He that loveth silver shall not be satisfied with silver; nor he that loveth abundance with increase: this is also vanity.","18.23.1":"The Lord is my shepherd; I shall not want.","19.20.7":"The just man walketh in his integrity: his children are blessed after him.","18.15.1":"Lord, who shall abide in thy tabernacle? who shall dwell in thy holy hill?","18.15.2":"He that walketh uprightly, and worketh righteousness, and speaketh the truth in his heart.","18.25.21":"Let integrity and uprightness preserve me; for I wait on thee.","19.28.6":"Better is the poor that walketh in his uprightness, than he that is perverse in his ways, though he be rich.","19.31.10":"Who can find a virtuous woman? for her price is far above rubies.","19.31.11":"The heart of her husband doth safely trust in her, so that he shall have no need of spoil.","19.31.12":"She will do him good and not evil all the days of her life.","19.31.13":"She seeketh wool, and flax, and worketh willingly with her hands.","19.31.14":"She is like the merchants’ ships; she bringeth her food from afar.","19.31.15":"She riseth also while it is yet night, and giveth meat to her household, and a portion to her maidens.","19.31.16":"She considereth a field, and buyeth it: with the fruit of her hands she planteth a vineyard.","19.31.17":"She girdeth her loins with strength, and strengtheneth her arms.","19.31.18":"She perceiveth that her merchandise is good: her candle goeth not out by night.","19.31.19":"She layeth her hands to the spindle, and her hands hold the distaff.","19.31.20":"She stretcheth out her hand to the poor; yea, she reacheth forth her hands to the needy.","19.31.21":"She is not afraid of the snow for her household: for all her household are clothed with scarlet.","19.31.22":"She maketh herself coverings of tapestry; her clothing is silk and purple.","19.31.23":"Her husband is known in the gates, when he sitteth among the elders of the land.","19.31.24":"She maketh fine linen, and selleth it; and delivereth girdles unto the merchant.","19.31.25":"Strength and honour are her clothing; and she shall rejoice in time to come.","19.31.26":"She openeth her mouth with wisdom; and in her tongue is the law of kindness.","19.31.27":"She looketh well to the ways of her household, and eateth not the bread of idleness.","19.31.28":"Her children arise up, and call her blessed; her husband also, and he praiseth her.","19.31.29":"Many daughters have done virtuously, but thou excellest them all.","19.31.30":"Favour is deceitful, and beauty is vain: but a woman that feareth the Lord, she shall be praised.","19.31.31":"Give her of the fruit of her hands; and let her own works praise her in the gates.","59.3.3":"Whose adorning let it not be that outward adorning of plaiting the hair, and of wearing of gold, or of putting on of apparel;","59.3.4":"But let it be the hidden man of the heart, in that which is not corruptible, even the ornament of a meek and quiet spirit, which is in the sight of God of great price.","7.3.11":"And now, my daughter, fear not; I will do to thee all that thou requirest: for all the city of my people doth know that thou art a virtuous woman.","41.1.45":"And blessed is she that believed: for there shall be a performance of those things which were told her from the Lord.","55.2.3":"The aged women likewise, that they be in behaviour as becometh holiness, not false accusers, not given to much wine, teachers of good things;","55.2.4":"That they may teach the young women to be sober, to love their husbands, to love their children,","55.2.5":"To be discreet, chaste, keepers at home, good, obedient to their own husbands, that the word of God be not blasphemed.","45.16.14":"Let all your things be done with charity.","10.2.2":"I go the way of all the earth: be thou strong therefore, and shew thyself a man;","10.2.3":"And keep the charge of the Lord thy God, to walk in his ways, to keep his statutes, and his commandments, and his judgments, and his testimonies, as it is written in the law of Moses, that thou mayest prosper in all that thou doest, and whithersoever thou turnest thyself:","18.112.1":"Blessed is the man that feareth the Lord, that delighteth greatly in his commandments.","20.9.10":"Whatsoever thy hand findeth to do, do it with thy might; for there is no work, nor device, nor knowledge, nor wisdom, in the grave, whither thou goest.","19.14.23":"In all labour there is profit: but the talk of the lips tendeth only to penury.","19.12.11":"He that tilleth his land shall be satisfied with bread: but he that followeth vain persons is void of understanding.","19.13.4":"The soul of the sluggard desireth, and hath nothing: but the soul of the diligent shall be made fat.","19.22.29":"Seest thou a man diligent in his business? he shall stand before kings; he shall not stand before mean men.","52.3.10":"For even when we were with you, this we commanded you, that if any would not work, neither should he eat.","51.4.11":"And that ye study to be quiet, and to do your own business, and to work with your own hands, as we commanded you;","51.4.12":"That ye may walk honestly toward them that are without, and that ye may have lack of nothing.","0.2.15":"And the Lord God took the man, and put him into the garden of Eden to dress it and to keep it.","19.22.7":"The rich ruleth over the poor, and the borrower is servant to the lender.","18.37.21":"The wicked borroweth, and payeth not again: but the righteous sheweth mercy, and giveth.","19.21.5":"The thoughts of the diligent tend only to plenteousness; but of every one that is hasty only to want.","19.13.11":"Wealth gotten by vanity shall be diminished: but he that gathereth by labour shall increase.","41.14.28":"For which of you, intending to build a tower, sitteth not down first, and counteth the cost, whether he have sufficient to finish it?","53.6.10":"For the love of money is the root of all evil: which while some coveted after, they have erred from the faith, and pierced themselves through with many sorrows.","49.4.19":"But my God shall supply all your need according to his riches in glory by Christ Jesus.","18.37.25":"I have been young, and now am old; yet have I not seen the righteous forsaken, nor his seed begging bread.","18.34.10":"The young lions do lack, and suffer hunger: but they that seek the Lord shall not want any good thing.","41.12.24":"Consider the ravens: for they neither sow nor reap; which neither have storehouse nor barn; and God feedeth them: how much more are ye better than the fowls?","46.9.8":"And God is able to make all grace abound toward you; that ye, always having all sufficiency in all things, may abound to every good work:","0.22.14":"And Abraham called the name of that place Jehovah–jireh: as it is said to this day, In the mount of the Lord it shall be seen.","19.16.3":"Commit thy works unto the Lord, and thy thoughts shall be established.","19.15.22":"Without counsel purposes are disappointed: but in the multitude of counsellors they are established.","41.14.29":"Lest haply, after he hath laid the foundation, and is not able to finish it, all that behold it begin to mock him,","41.14.30":"Saying, This man began to build, and was not able to finish.","58.4.13":"Go to now, ye that say, To day or to morrow we will go into such a city, and continue there a year, and buy and sell, and get gain:","58.4.14":"Whereas ye know not what shall be on the morrow. For what is your life? It is even a vapour, that appeareth for a little time, and then vanisheth away.","58.4.15":"For that ye ought to say, If the Lord will, we shall live, and do this, or that.","19.27.23":"Be thou diligent to know the state of thy flocks, and look well to thy herds.","19.27.24":"For riches are not for ever: and doth the crown endure to every generation?","4.8.18":"But thou shalt remember the Lord thy God: for it is he that giveth thee power to get wealth, that he may establish his covenant which he sware unto thy fathers, as it is this day.","19.6.6":"Go to the ant, thou sluggard; consider her ways, and be wise:","19.6.7":"Which having no guide, overseer, or ruler,","19.6.8":"Provideth her meat in the summer, and gathereth her food in the harvest.","19.6.9":"How long wilt thou sleep, O sluggard? when wilt thou arise out of thy sleep?","19.6.10":"Yet a little sleep, a little slumber, a little folding of the hands to sleep:","19.6.11":"So shall thy poverty come as one that travelleth, and thy want as an armed man.","19.10.4":"He becometh poor that dealeth with a slack hand: but the hand of the diligent maketh rich.","19.20.13":"Love not sleep, lest thou come to poverty; open thine eyes, and thou shalt be satisfied with bread.","19.19.15":"Slothfulness casteth into a deep sleep; and an idle soul shall suffer hunger.","19.26.14":"As the door turneth upon his hinges, so doth the slothful upon his bed.","19.26.15":"The slothful hideth his hand in his bosom; it grieveth him to bring it again to his mouth.","52.3.11":"For we hear that there are some which walk among you disorderly, working not at all, but are busybodies.","52.3.12":"Now them that are such we command and exhort by our Lord Jesus Christ, that with quietness they work, and eat their own bread.","18.1.1":"Blessed is the man that walketh not in the counsel of the ungodly, nor standeth in the way of sinners, nor sitteth in the seat of the scornful.","18.1.2":"But his delight is in the law of the Lord; and in his law doth he meditate day and night.","18.1.3":"And he shall be like a tree planted by the rivers of water, that bringeth forth his fruit in his season; his leaf also shall not wither; and whatsoever he doeth shall prosper.","23.17.7":"Blessed is the man that trusteth in the Lord, and whose hope the Lord is.","23.17.8":"For he shall be as a tree planted by the waters, and that spreadeth out her roots by the river, and shall not see when heat cometh, but her leaf shall be green; and shall not be careful in the year of drought, neither shall cease from yielding fruit.","39.16.26":"For what is a man profited, if he shall gain the whole world, and lose his own soul? or what shall a man give in exchange for his soul?","53.6.9":"But they that will be rich fall into temptation and a snare, and into many foolish and hurtful lusts, which drown men in destruction and perdition.","19.28.25":"He that is of a proud heart stirreth up strife: but he that putteth his trust in the Lord shall be made fat.","50.3.5":"Mortify therefore your members which are upon the earth; fornication, uncleanness, inordinate affection, evil concupiscence, and covetousness, which is idolatry:","34.3.17":"Although the fig tree shall not blossom, neither shall fruit be in the vines; the labour of the olive shall fail, and the fields shall yield no meat; the flock shall be cut off from the fold, and there shall be no herd in the stalls:","34.3.18":"Yet I will rejoice in the Lord, I will joy in the God of my salvation.","44.13.1":"Let every soul be subject unto the higher powers. For there is no power but of God: the powers that be are ordained of God.","44.13.2":"Whosoever therefore resisteth the power, resisteth the ordinance of God: and they that resist shall receive to themselves damnation.","44.13.3":"For rulers are not a terror to good works, but to the evil. Wilt thou then not be afraid of the power? do that which is good, and thou shalt have praise of the same:","44.13.4":"For he is the minister of God to thee for good. But if thou do that which is evil, be afraid; for he beareth not the sword in vain: for he is the minister of God, a revenger to execute wrath upon him that doeth evil.","44.13.5":"Wherefore ye must needs be subject, not only for wrath, but also for conscience sake.","44.13.6":"For for this cause pay ye tribute also: for they are God’s ministers, attending continually upon this very thing.","44.13.7":"Render therefore to all their dues: tribute to whom tribute is due; custom to whom custom; fear to whom fear; honour to whom honour.","53.2.1":"I exhort therefore, that, first of all, supplications, prayers, intercessions, and giving of thanks, be made for all men;","53.2.2":"For kings, and for all that are in authority; that we may lead a quiet and peaceable life in all godliness and honesty.","59.2.13":"Submit yourselves to every ordinance of man for the Lord’s sake: whether it be to the king, as supreme;","59.2.14":"Or unto governors, as unto them that are sent by him for the punishment of evildoers, and for the praise of them that do well.","59.2.15":"For so is the will of God, that with well doing ye may put to silence the ignorance of foolish men:","59.2.16":"As free, and not using your liberty for a cloke of maliciousness, but as the servants of God.","59.2.17":"Honour all men. Love the brotherhood. Fear God. Honour the king.","55.3.1":"Put them in mind to be subject to principalities and powers, to obey magistrates, to be ready to every good work,","19.21.1":"The king’s heart is in the hand of the Lord, as the rivers of water: he turneth it whithersoever he will.","18.33.12":"Blessed is the nation whose God is the Lord; and the people whom he hath chosen for his own inheritance.","19.14.34":"Righteousness exalteth a nation: but sin is a reproach to any people.","19.29.2":"When the righteous are in authority, the people rejoice: but when the wicked beareth rule, the people mourn.","23.29.7":"And seek the peace of the city whither I have caused you to be carried away captives, and pray unto the Lord for it: for in the peace thereof shall ye have peace.","18.91.1":"He that dwelleth in the secret place of the most High shall abide under the shadow of the Almighty.","18.91.2":"I will say of the Lord, He is my refuge and my fortress: my God; in him will I trust.","18.91.3":"Surely he shall deliver thee from the snare of the fowler, and from the noisome pestilence.","18.91.4":"He shall cover thee with his feathers, and under his wings shalt thou trust: his truth shall be thy shield and buckler.","18.91.5":"Thou shalt not be afraid for the terror by night; nor for the arrow that flieth by day;","18.91.6":"Nor for the pestilence that walketh in darkness; nor for the destruction that wasteth at noonday.","18.91.7":"A thousand shall fall at thy side, and ten thousand at thy right hand; but it shall not come nigh thee.","18.91.8":"Only with thine eyes shalt thou behold and see the reward of the wicked.","18.91.9":"Because thou hast made the Lord, which is my refuge, even the most High, thy habitation;","18.91.10":"There shall no evil befall thee, neither shall any plague come nigh thy dwelling.","18.91.13":"Thou shalt tread upon the lion and adder: the young lion and the dragon shalt thou trample under feet.","18.91.14":"Because he hath set his love upon me, therefore will I deliver him: I will set him on high, because he hath known my name.","18.91.15":"He shall call upon me, and I will answer him: I will be with him in trouble; I will deliver him, and honour him.","18.91.16":"With long life will I satisfy him, and shew him my salvation.","18.121.1":"I will lift up mine eyes unto the hills, from whence cometh my help.","18.121.2":"My help cometh from the Lord, which made heaven and earth.","18.121.3":"He will not suffer thy foot to be moved: he that keepeth thee will not slumber.","18.121.4":"Behold, he that keepeth Israel shall neither slumber nor sleep.","18.121.5":"The Lord is thy keeper: the Lord is thy shade upon thy right hand.","18.121.6":"The sun shall not smite thee by day, nor the moon by night.","18.121.7":"The Lord shall preserve thee from all evil: he shall preserve thy soul.","18.121.8":"The Lord shall preserve thy going out and thy coming in from this time forth, and even for evermore.","19.18.10":"The name of the Lord is a strong tower: the righteous runneth into it, and is safe.","52.3.3":"But the Lord is faithful, who shall stablish you, and keep you from evil.","22.54.17":"No weapon that is formed against thee shall prosper; and every tongue that shall rise against thee in judgment thou shalt condemn. This is the heritage of the servants of the Lord, and their righteousness is of me, saith the Lord.","0.28.15":"And, behold, I am with thee, and will keep thee in all places whither thou goest, and will bring thee again into this land; for I will not leave thee, until I have done that which I have spoken to thee of.","18.139.9":"If I take the wings of the morning, and dwell in the uttermost parts of the sea;","18.139.10":"Even there shall thy hand lead me, and thy right hand shall hold me.","19.3.23":"Then shalt thou walk in thy way safely, and thy foot shall not stumble.","19.3.24":"When thou liest down, thou shalt not be afraid: yea, thou shalt lie down, and thy sleep shall be sweet.","18.3.5":"I laid me down and slept; I awaked; for the Lord sustained me.","18.63.6":"When I remember thee upon my bed, and meditate on thee in the night watches.","18.5.3":"My voice shalt thou hear in the morning, O Lord; in the morning will I direct my prayer unto thee, and will look up.","18.143.8":"Cause me to hear thy lovingkindness in the morning; for in thee do I trust: cause me to know the way wherein I should walk; for I lift up my soul unto thee.","18.90.14":"O satisfy us early with thy mercy; that we may rejoice and be glad all our days.","22.50.4":"The Lord God hath given me the tongue of the learned, that I should know how to speak a word in season to him that is weary: he wakeneth morning by morning, he wakeneth mine ear to hear as the learned.","40.1.35":"And in the morning, rising up a great while before day, he went out, and departed into a solitary place, and there prayed.","18.20.4":"Grant thee according to thine own heart, and fulfil all thy counsel.","18.139.16":"Thine eyes did see my substance, yet being unperfect; and in thy book all my members were written, which in continuance were fashioned, when as yet there was none of them.","19.9.11":"For by me thy days shall be multiplied, and the years of thy life shall be increased.","7.1.16":"And Ruth said, Intreat me not to leave thee, or to return from following after thee: for whither thou goest, I will go; and where thou lodgest, I will lodge: thy people shall be my people, and thy God my God:","7.1.17":"Where thou diest, will I die, and there will I be buried: the Lord do so to me, and more also, if ought but death part thee and me.","18.139.15":"My substance was not hid from thee, when I was made in secret, and curiously wrought in the lowest parts of the earth.","8.1.27":"For this child I prayed; and the Lord hath given me my petition which I asked of him:","8.1.28":"Therefore also I have lent him to the Lord; as long as he liveth he shall be lent to the Lord. And he worshipped the Lord there.","18.22.9":"But thou art he that took me out of the womb: thou didst make me hope when I was upon my mother’s breasts.","18.22.10":"I was cast upon thee from the womb: thou art my God from my mother’s belly.","22.44.2":"Thus saith the Lord that made thee, and formed thee from the womb, which will help thee; Fear not, O Jacob, my servant; and thou, Jesurun, whom I have chosen.","22.43.18":"Remember ye not the former things, neither consider the things of old.","22.43.19":"Behold, I will do a new thing; now it shall spring forth; shall ye not know it? I will even make a way in the wilderness, and rivers in the desert.","18.37.5":"Commit thy way unto the Lord; trust also in him; and he shall bring it to pass.","18.65.11":"Thou crownest the year with thy goodness; and thy paths drop fatness.","41.2.8":"And there were in the same country shepherds abiding in the field, keeping watch over their flock by night.","41.2.9":"And, lo, the angel of the Lord came upon them, and the glory of the Lord shone round about them: and they were sore afraid.","41.2.12":"And this shall be a sign unto you; Ye shall find the babe wrapped in swaddling clothes, lying in a manger.","41.2.13":"And suddenly there was with the angel a multitude of the heavenly host praising God, and saying,","41.2.14":"Glory to God in the highest, and on earth peace, good will toward men.","39.2.1":"Now when Jesus was born in Bethlehem of Judea in the days of Herod the king, behold, there came wise men from the east to Jerusalem,","39.2.2":"Saying, Where is he that is born King of the Jews? for we have seen his star in the east, and are come to worship him.","39.2.10":"When they saw the star, they rejoiced with exceeding great joy.","39.2.11":"And when they were come into the house, they saw the young child with Mary his mother, and fell down, and worshipped him: and when they had opened their treasures, they presented unto him gifts; gold, and frankincense, and myrrh.","42.12.12":"On the next day much people that were come to the feast, when they heard that Jesus was coming to Jerusalem,","42.12.13":"Took branches of palm trees, and went forth to meet him, and cried, Hosanna: Blessed is the King of Israel that cometh in the name of the Lord.","41.22.42":"Saying, Father, if thou be willing, remove this cup from me: nevertheless not my will, but thine, be done.","22.53.3":"He is despised and rejected of men; a man of sorrows, and acquainted with grief: and we hid as it were our faces from him; he was despised, and we esteemed him not.","22.53.4":"Surely he hath borne our griefs, and carried our sorrows: yet we did esteem him stricken, smitten of God, and afflicted.","22.53.7":"He was oppressed, and he was afflicted, yet he opened not his mouth: he is brought as a lamb to the slaughter, and as a sheep before her shearers is dumb, so he openeth not his mouth.","42.19.28":"After this, Jesus knowing that all things were now accomplished, that the scripture might be fulfilled, saith, I thirst.","42.19.29":"Now there was set a vessel full of vinegar: and they filled a spunge with vinegar, and put it upon hyssop, and put it to his mouth.","41.23.46":"And when Jesus had cried with a loud voice, he said, Father, into thy hands I commend my spirit: and having said thus, he gave up the ghost.","39.28.7":"And go quickly, and tell his disciples that he is risen from the dead; and, behold, he goeth before you into Galilee; there shall ye see him: lo, I have told you.","44.12.17":"Recompense to no man evil for evil. Provide things honest in the sight of all men.","18.37.3":"Trust in the Lord, and do good; so shalt thou dwell in the land, and verily thou shalt be fed.","18.37.6":"And he shall bring forth thy righteousness as the light, and thy judgment as the noonday.","0.50.20":"But as for you, ye thought evil against me; but God meant it unto good, to bring to pass, as it is this day, to save much people alive.","59.2.19":"For this is thankworthy, if a man for conscience toward God endure grief, suffering wrongfully.","59.2.20":"For what glory is it, if, when ye be buffeted for your faults, ye shall take it patiently? but if, when ye do well, and suffer for it, ye take it patiently, this is acceptable with God.","59.2.21":"For even hereunto were ye called: because Christ also suffered for us, leaving us an example, that ye should follow his steps:","59.2.22":"Who did no sin, neither was guile found in his mouth:","59.2.23":"Who, when he was reviled, reviled not again; when he suffered, he threatened not; but committed himself to him that judgeth righteously:","18.9.9":"The Lord also will be a refuge for the oppressed, a refuge in times of trouble.","42.15.18":"If the world hate you, ye know that it hated me before it hated you.","42.15.19":"If ye were of the world, the world would love his own: but because ye are not of the world, but I have chosen you out of the world, therefore the world hateth you.","42.15.20":"Remember the word that I said unto you, The servant is not greater than his lord. If they have persecuted me, they will also persecute you; if they have kept my saying, they will keep yours also.","54.3.12":"Yea, and all that will live godly in Christ Jesus shall suffer persecution.","59.4.14":"If ye be reproached for the name of Christ, happy are ye; for the spirit of glory and of God resteth upon you: on their part he is evil spoken of, but on your part he is glorified.","44.8.35":"Who shall separate us from the love of Christ? shall tribulation, or distress, or persecution, or famine, or nakedness, or peril, or sword?","44.8.36":"As it is written, For thy sake we are killed all the day long; we are accounted as sheep for the slaughter.","43.5.41":"And they departed from the presence of the council, rejoicing that they were counted worthy to suffer shame for his name.","49.1.21":"For to me to live is Christ, and to die is gain.","57.2.14":"Forasmuch then as the children are partakers of flesh and blood, he also himself likewise took part of the same; that through death he might destroy him that had the power of death, that is, the devil;","57.2.15":"And deliver them who through fear of death were all their lifetime subject to bondage.","44.14.8":"For whether we live, we live unto the Lord; and whether we die, we die unto the Lord: whether we live therefore, or die, we are the Lord’s.","65.14.13":"And I heard a voice from heaven saying unto me, Write, Blessed are the dead which die in the Lord from henceforth: Yea, saith the Spirit, that they may rest from their labours; and their atever you do, do it heartily, as for the Lord."},{"t":"Money and debt","k":"money debt debts finances budget borrow","d":"The borrower is servant to the lender. Biblical principles for your finances."},{"t":"God's provision","k":"provision provide needs supply","d":"My God shall supply all your needs. Seek first the kingdom of God."},{"t":"Business and plans","k":"business plans planning entrepreneur projects","d":"Commit your works to the Lord and your plans will be established."},{"t":"Laziness","k":"laziness lazy sluggard idle","d":"Go to the ant, you sluggard. What Proverbs says about laziness."},{"t":"Success and prosperity","k":"success prosperity prosper successful","d":"Success God's way: meditating on His Word and being like a tree planted by streams of water."},{"t":"Greed","k":"greed greedy covetousness possessions","d":"Watch out and beware of all covetousness: life does not consist in the abundance of possessions."},{"t":"Job loss and crisis","k":"job loss unemployment crisis fired hardship","d":"Though the fig tree does not blossom, yet I will rejoice in the Lord."},{"t":"Authorities and government","k":"authorities government leaders rulers caesar","d":"Pray for those in authority and give to Caesar what is Caesar's."},{"t":"For the nation","k":"nation country land pray heal","d":"If my people humble themselves... I will heal their land."},{"t":"Protection","k":"protection protect safe safety refuge","d":"Whoever dwells in the shelter of the Most High. The Lord will keep you from all evil."},{"t":"Travel","k":"travel trip journey traveling","d":"The Lord will keep your going out and your coming in, from this time forth and forevermore."},{"t":"For sleep","k":"sleep night bedtime insomnia","d":"I will both lie down in peace and sleep."},{"t":"To start the day","k":"morning start day today","d":"This is the day the Lord has made. His mercies are new every morning."},{"t":"Birthdays and blessings","k":"birthday blessing bless celebrate","d":"To bless someone on their day: the Lord bless you and keep you."},{"t":"Wedding","k":"wedding bride groom ceremony","d":"Passages for a ceremony or to congratulate the couple."},{"t":"Birth of a baby","k":"baby birth newborn pregnancy","d":"You formed my inward parts. To celebrate a new life."},{"t":"New beginnings","k":"new beginnings start graduation move change","d":"Behold, I am doing a new thing. For a graduation, a move or a new season."},{"t":"New Year","k":"new year resolutions","d":"You crown the year with your goodness. To close one year and begin another."},{"t":"Christmas","k":"christmas nativity savior born","d":"Unto you is born this day a Savior. The story of the first Christmas."},{"t":"Holy Week","k":"holy week easter palm sunday passion","d":"From the triumphal entry to the empty tomb."},{"t":"Injustice","k":"injustice unfair wronged revenge vengeance","d":"Vengeance is mine, says the Lord. What you meant for evil, God meant for good."},{"t":"Persecution","k":"persecution persecuted mocked faith","d":"Blessed are those who are persecuted for righteousness' sake."},{"t":"Facing death","k":"death dying terminal","d":"For me to live is Christ, and to die is gain. O death, where is your sting?"},{"t":"Purpose and seasons","k":"purpose seasons time calling meaning","d":"To everything there is a season under heaven. We were created for good works."},{"t":"God's promises","k":"promises promise god's promises","d":"All the promises of God in Him are Yes, and in Him Amen."},{"t":"The best-known verses","k":"best known famous popular verses memorize","d":"The passages people memorize and share the most."},{"t":"God with you","k":"god with you presence never alone","d":"Lo, I am with you always, even to the end of the age."},{"t":"Strength","k":"strength strong weak weakness power","d":"I can do all things through Christ who strengthens me. My power is made perfect in weakness."},{"t":"Victory","k":"victory overcome win conquer","d":"We are more than conquerors through Him who loved us."},{"t":"Blessing","k":"blessing blessed bless","d":"Blessed is the man who walks not in the counsel of the ungodly. The blessing of God."},{"t":"The first step: asking for help","k":"first step ask help admit confess recovery","d":"Admitting the problem is not weakness; it is the beginning of freedom. God does not ask you to fix it alone: He invites you to confess it and seek help.","p":"Talk today with someone you trust and tell them the truth. If you need professional guidance, call a helpline."},{"t":"Alcohol","k":"alcohol drinking drunk drunkenness beer liquor","d":"The Bible clearly warns against drunkenness, but it also reminds us that many were set free: “and such were some of you, but you are washed.”","p":"Identify the time of day when the craving is strongest and plan something different for that hour."},{"t":"Drugs","k":"drugs addiction substance use high","d":"Your body is the temple of the Holy Spirit and God wants to see you free. No chain is stronger than His power to make you a new creation.","p":"Stay away today from a place, contact or group that pulls you toward using."},{"t":"Pornography","k":"pornography porn lust purity eyes","d":"Job made a covenant with his eyes. Purity is not only avoiding something; it is filling your mind with what is true and pure. In Christ there is forgiveness and strength to start over.","p":"Set up a filter or limit on your phone today and find someone to hold you accountable."},{"t":"Gambling","k":"gambling betting bets casino lottery","d":"The promise of easy money hides a trap. The Bible teaches that wealth gained by work grows, and that the love of money brings many sorrows.","p":"Delete gambling apps today and hand control of your money to someone you trust for a while."},{"t":"Phone and social media","k":"phone cellphone social media screens internet","d":"Screens can steal our time, our peace and our presence with those we love. The Bible invites us to make the most of our time and seek silence with God.","p":"Leave your phone outside your room tonight for an hour before you sleep."},{"t":"Cigarettes and tobacco","k":"cigarettes smoking tobacco nicotine vape","d":"Caring for your body also honors God. Quitting is hard, but the Spirit gives self-control day by day.","p":"Today, swap your first cigarette of the day for a glass of water and a short prayer."},{"t":"When temptation comes","k":"temptation craving urge tempted","d":"Temptation comes, but it does not have the last word. God promises a way out, and Jesus understands how you feel because He was tempted too.","p":"Have a plan ready for the moment of craving: who to call, where to go and which verse to read."},{"t":"Relapse: getting back up","k":"relapse fall again failure start over","d":"Falling again does not erase your journey. The righteous falls seven times and rises again. God's mercy is new every morning.","p":"Don't hide: tell someone you trust today and start again, one day at a time."},{"t":"For the family of someone who is struggling","k":"family loved one addict addiction support","d":"Loving someone with an addiction hurts. These passages are for parents, spouses, children and friends who hold on, wait and pray without losing hope.","p":"Find support for yourself too: a group, a counselor or your church. You don't have to carry this alone."},{"t":"Hope and new life","k":"hope new life freedom new heart","d":"God doesn't just break chains: He gives a new heart and restores the lost years. Your story does not end with your addiction.","p":"Write down one goal for the next 30 days of your new life and share it with someone."}],"ctx":{"libros":{"Génesis":["Moses, according to tradition","Around the 15th century BC","The book of beginnings: creation, the fall of humanity, the flood and the story of Abraham, Isaac, Jacob and Joseph. God begins forming a people through whom He will bless all nations."],"Éxodo":["Moses","Around the 15th century BC","Israel is enslaved in Egypt and God frees them through Moses. On Mount Sinai He gives them the Ten Commandments and the instructions for the tabernacle."],"Levítico":["Moses","Around the 15th century BC","A holiness manual for Israel in the wilderness: sacrifices, priesthood, feasts and laws for living as a people set apart for God."],"Números":["Moses","Around the 15th century BC","Israel's 40 years in the wilderness. Because of their unbelief, one generation does not enter the promised land, but God remains faithful."],"Deuteronomio":["Moses","Around the 15th century BC","Moses' final speeches before his death. He reviews the law for the new generation about to enter Canaan and calls them to love God with all their heart."],"Josué":["Joshua and successors","Around the 14th century BC","Israel enters and conquers the promised land under the leadership of Joshua, Moses' successor."],"Jueces":["Probably Samuel","11th century BC","A time without a king when Israel falls into idolatry again and again. God raises up judges like Deborah, Gideon and Samson to deliver them."],"Rut":["Unknown","11th century BC","A story of loyalty and redemption in the time of the judges. Ruth, a foreigner, becomes the great-grandmother of King David."],"1 Samuel":["Samuel and other prophets","10th century BC","Israel moves from the judges to the monarchy: the prophet Samuel, King Saul and the rise of young David."],"2 Samuel":["Court prophets","10th century BC","The reign of David: his victories, his sin with Bathsheba and its consequences in his family, and the promise of an everlasting kingdom."],"1 Reyes":["Unknown","6th century BC","From the glory of Solomon and the temple to the division of the kingdom. It includes the prophet Elijah facing the prophets of Baal."],"2 Reyes":["Unknown","6th century BC","The decline of Israel and Judah until both fall to Assyria and Babylon because of their unfaithfulness to God."],"1 Crónicas":["Ezra, according to tradition","5th century BC","A review of Israel's history centered on David, written for the people returning from exile."],"2 Crónicas":["Ezra, according to tradition","5th century BC","The history of Judah from Solomon to the exile, highlighting the kings who sought God and the times of revival."],"Esdras":["Ezra","5th century BC","The return of the Jews from Babylon and the rebuilding of the temple and of the people's spiritual life."],"Nehemías":["Nehemiah","5th century BC","Nehemiah leaves the Persian court to rebuild the walls of Jerusalem in 52 days, despite opposition."],"Ester":["Unknown","5th century BC","A young Jewish woman becomes queen of Persia and risks her life to save her people. God is never mentioned, but His hand is seen in everything."],"Job":["Unknown","Very ancient times","A righteous man loses everything and struggles to understand his suffering. In the end he meets God, who answers him out of the whirlwind."],"Salmos":["David and other authors","From the 10th to the 5th century BC","Israel's book of songs and prayers. It expresses every emotion before God: praise, pain, anger, trust and repentance."],"Proverbios":["Mainly Solomon","10th century BC","Sayings of practical wisdom for daily life: work, words, family, money and friendships. Its foundation is the fear of the Lord."],"Eclesiastés":["Solomon, according to tradition","10th century BC","The reflections of a man who tried everything and concluded that, without God, all is vanity."],"Cantares":["Solomon","10th century BC","A love poem between a husband and wife that celebrates love and intimacy within marriage."],"Isaías":["The prophet Isaiah","8th century BC","A prophet in Jerusalem who announced judgment for sin, but also comfort and the coming of the Messiah, the suffering Servant."],"Jeremías":["The prophet Jeremiah","7th and 6th centuries BC","The “weeping prophet” warned Judah before its fall to Babylon. In the middle of disaster, he announced a new covenant and a future with hope."],"Lamentaciones":["Jeremiah, according to tradition","586 BC","Five poems of mourning for the destruction of Jerusalem. In the middle of the pain, God's faithfulness shines, new every morning."],"Ezequiel":["The prophet Ezekiel","6th century BC","A priest and prophet in exile in Babylon. He had visions of God's glory and announced a new heart for His people."],"Daniel":["Daniel","6th century BC","A young Jew taken to Babylon stays faithful to God in the court of pagan kings: the fiery furnace and the lions' den."],"Oseas":["The prophet Hosea","8th century BC","God asks Hosea to marry an unfaithful woman as a picture of His love for Israel, who had also been unfaithful to Him."],"Joel":["The prophet Joel","Uncertain date","A plague of locusts becomes a call to repentance and a promise that God will pour out His Spirit."],"Amós":["Amos, a shepherd","8th century BC","A shepherd from Judah denounces social injustice and empty religion in the northern kingdom during a time of prosperity."],"Abdías":["The prophet Obadiah","6th century BC","A short prophecy against Edom for rejoicing over the fall of Jerusalem."],"Jonás":["Jonah","8th century BC","A prophet runs from the mission of preaching to Nineveh, his enemies. God shows His mercy even to those who don't deserve it."],"Miqueas":["The prophet Micah","8th century BC","A country prophet who denounced corruption, announced that the Messiah would be born in Bethlehem and summed up what God requires: justice, mercy and humility."],"Nahúm":["The prophet Nahum","7th century BC","Announces the fall of Nineveh, the cruel capital of Assyria."],"Habacuc":["The prophet Habakkuk","7th century BC","A prophet asks God why He allows evil, and learns to trust Him and rejoice in Him even when everything fails."],"Sofonías":["The prophet Zephaniah","7th century BC","Warns of the day of the Lord, but ends with a God who rejoices over His people with singing."],"Hageo":["The prophet Haggai","520 BC","Encourages those who returned from exile to stop putting off the rebuilding of the temple."],"Zacarías":["The prophet Zechariah","520 BC","Visions of hope for those who returned from exile and announcements of the King who would come humbly, riding on a donkey."],"Malaquías":["The prophet Malachi","5th century BC","The last book of the Old Testament. It confronts the people's spiritual coldness and announces the messenger who would prepare the way of the Lord."],"Mateo":["Matthew, the tax collector","AD 50s–60s","Written mainly for Jews. It presents Jesus as the promised Messiah and King and gathers His great teachings, like the Sermon on the Mount."],"Marcos":["John Mark, Peter's companion","AD 50s–60s","The shortest and most direct gospel. It shows Jesus as the Servant who came to serve and give His life, full of action and miracles."],"Lucas":["Luke, a physician and Paul's companion","AD 60s","A careful investigation of Jesus' life that highlights His compassion for the poor, women, the sick and the outcast."],"Juan":["John, the beloved disciple","AD 80s–90s","Written “that ye might believe that Jesus is the Christ.” It shows His divinity through seven signs and the “I am” sayings, and tells of the Last Supper in detail."],"Hechos":["Luke","AD 60s","The sequel to Luke: the Holy Spirit comes at Pentecost and the church spreads from Jerusalem to Rome with Peter and Paul."],"Romanos":["The apostle Paul","Around AD 57","A letter to the church in Rome explaining the gospel step by step: all have sinned, we are justified by faith and we live by the Spirit."],"1 Corintios":["The apostle Paul","Around AD 55","Corinth was a rich and morally loose city. Paul corrects divisions, immorality and disorder in the church, and speaks about love and the resurrection."],"2 Corintios":["The apostle Paul","Around AD 56","Paul's most personal letter. He defends his ministry and speaks of how God's power is shown in weakness."],"Gálatas":["The apostle Paul","Around AD 49","Some were teaching that you had to keep the Jewish law to be saved. Paul strongly defends freedom and salvation by grace alone through faith."],"Efesios":["The apostle Paul, from prison","Around AD 60","Explains the riches we have in Christ, the unity of the church and how to live out that faith in marriage, family and work."],"Filipenses":["The apostle Paul, from prison","Around AD 61","A letter of joy and gratitude written from prison to a much-loved church that supported him."],"Colosenses":["The apostle Paul, from prison","Around AD 60","Against philosophies that downplayed Christ, Paul shows that He is supreme and sufficient, and what the new life looks like at home."],"1 Tesalonicenses":["The apostle Paul","Around AD 51","One of Paul's first letters. It encourages a new, persecuted church and answers questions about those who die before Christ returns."],"2 Tesalonicenses":["The apostle Paul","Around AD 51","Corrects confusion about the Second Coming and calls believers to keep working while they wait."],"1 Timoteo":["The apostle Paul","Around AD 63","Instructions to his young disciple Timothy, a pastor in Ephesus, on how to lead the church and guard sound teaching."],"2 Timoteo":["The apostle Paul","Around AD 67","Paul's last letter, written in prison shortly before his execution. He urges Timothy to be faithful and to preach the Word."],"Tito":["The apostle Paul","Around AD 63","Instructions to Titus for organizing the churches on the island of Crete and teaching a life of good works."],"Filemón":["The apostle Paul","Around AD 60","A short letter in which Paul asks Philemon to welcome Onesimus as a brother, his slave who had run away and become a believer."],"Hebreos":["Unknown","Before AD 70","For Jewish Christians tempted to go back to Judaism. It shows that Jesus is superior to everything and is the perfect priest."],"Santiago":["James, the brother of Jesus","AD 40s–50s","Practical wisdom: true faith shows in our works, in how we speak and in how we treat the poor."],"1 Pedro":["The apostle Peter","Around AD 63","To Christians suffering for their faith. It gives them hope and calls them to live holy lives as strangers in this world."],"2 Pedro":["The apostle Peter","Around AD 67","Warns against false teachers and reminds us that the Lord will return, even if He seems to delay."],"1 Juan":["The apostle John","AD 85–95","A letter to give assurance of salvation. It insists that God is love and that whoever knows Him loves his brother."],"2 Juan":["The apostle John","AD 85–95","A short note to a church: walk in truth and love, and beware of deceivers."],"3 Juan":["The apostle John","AD 85–95","A note to his friend Gaius, whom he praises for his hospitality to missionaries."],"Judas":["Jude, the brother of Jesus","AD 60s","An urgent call to contend for the faith against false teachers who had slipped into the church."],"Apocalipsis":["The apostle John, exiled on Patmos","Around AD 95","A revelation of Christ's final triumph, written to persecuted churches. It ends with a new heaven, a new earth and God dwelling with His people."]},"caps":{"Génesis 1":"The creation of the world in six days. The central point is that everything that exists comes from God and that human beings were made in His image.","Génesis 2":"A closer look at the creation of man and woman in the Garden of Eden. Here marriage is established: the two shall be one flesh.","Éxodo 20":"On Mount Sinai, just out of Egypt, God gives Israel the Ten Commandments as the foundation of His covenant with them.","Deuteronomio 31":"Moses, at 120 years old, knows he will not enter the promised land. He hands leadership to Joshua and encourages the people: God will go before them.","Josué 1":"Moses has just died and Joshua must lead a whole nation to conquer Canaan. God tells him three times: “be strong and of a good courage.”","Salmos 23":"David, who had been a shepherd, describes God as his shepherd: He guides him, cares for him and goes with him even through the valley of the shadow of death.","Salmos 27":"David writes in times of danger and enemies. Even so, he trusts because God is his light and his salvation.","Salmos 32":"David describes the relief of confessing his sin after keeping silent about it. It is often linked to his sin with Bathsheba.","Salmos 34":"David wrote it after escaping from a Philistine king by pretending to be mad. It is a song of gratitude for God's deliverance.","Salmos 37":"A wisdom psalm from David in his old age: don't envy the wicked who prosper, but trust and wait on God.","Salmos 42":"Written by the sons of Korah, Levite musicians, from far away from the temple. The psalmist speaks to his own depressed soul and encourages himself to hope in God.","Salmos 46":"A song of trust in the middle of chaos: though the earth shakes, God is our refuge. It inspired Luther's famous hymn “A Mighty Fortress Is Our God.”","Salmos 51":"David's prayer of repentance after the prophet Nathan confronted him over his adultery with Bathsheba and the death of Uriah.","Salmos 90":"The only psalm attributed to Moses. It contrasts God's eternity with the brevity of human life and asks for wisdom to number our days.","Salmos 91":"A much-quoted psalm of protection. It describes the safety of the one who dwells in the shelter of the Most High.","Salmos 103":"David invites his own soul to bless God for all His benefits: forgiveness, healing, rescue and a mercy that never ends.","Salmos 119":"The longest psalm in the Bible, a Hebrew acrostic with 22 sections, one for each letter. The whole psalm celebrates the Word of God.","Salmos 121":"A “song of degrees” that pilgrims sang as they went up to Jerusalem for the feasts. They asked for God's protection on the road.","Salmos 127":"Attributed to Solomon, who built the temple. It teaches that home, city, work and children all depend on God.","Salmos 139":"David marvels that God knows him completely, is everywhere and formed him in his mother's womb.","Eclesiastés 3":"The famous poem of seasons: there is a time for everything under heaven. It invites us to trust God's timing.","Eclesiastés 4":"Solomon observes loneliness and oppression, and concludes that two are better than one and that a threefold cord is not quickly broken.","Isaías 1":"Isaiah opens his book confronting Judah: they offered sacrifices but lived in injustice. Even so, God offers to wash away their sin.","Isaías 40":"This begins the section of comfort for the Jews who would live through exile in Babylon. God does not grow weary and renews the strength of those who wait on Him.","Isaías 41":"God speaks to Israel, small and afraid in front of powerful empires: “Fear thou not; for I am with thee.”","Isaías 43":"Promises for Israel in exile. God calls them by name, will be with them through fire and water, and will do a new thing.","Isaías 53":"Written about 700 years before Christ. It describes the suffering Servant who bears the sin of others, and the New Testament applies it to Jesus.","Jeremías 1":"God calls Jeremiah when he is very young. He feels inadequate, but God tells him He knew him before forming him.","Jeremías 29":"Jeremiah's letter to the Jews deported to Babylon. He tells them to settle there, because they will be there 70 years, but that God has plans of good for them.","Lamentaciones 3":"Written among the ruins of Jerusalem. In the darkest chapter, the author remembers that God's mercies are new every morning.","Miqueas 6":"God presents a kind of court case against Israel and answers what He really requires: to do justly, love mercy and walk humbly before Him.","Mateo 5":"This begins the Sermon on the Mount, Jesus' most famous teaching, given to His disciples and the crowd on a hillside in Galilee.","Mateo 6":"The Sermon on the Mount continues: Jesus teaches about giving, praying and fasting in secret, about treasures in heaven and about not worrying.","Mateo 7":"The end of the Sermon on the Mount: don't judge, ask with confidence, the golden rule, and build your life on the rock.","Mateo 11":"Jesus invites the weary and burdened to find rest in Him, in contrast to the religious burdens the Pharisees imposed.","Mateo 18":"The disciples were arguing about who would be the greatest. Jesus speaks to them about becoming like children, seeking the lost and always forgiving.","Mateo 19":"The Pharisees test Jesus on divorce. He answers by quoting the original design in Genesis.","Mateo 22":"In the temple, the leaders try to trap Jesus with questions. He sums up the whole law as loving God and your neighbor.","Mateo 26":"The Last Supper and Gethsemane. Jesus institutes the Lord's Supper and prays in anguish before being arrested.","Mateo 28":"The resurrection. The risen Jesus sends His disciples to make disciples of all nations: the Great Commission.","Marcos 3":"Jesus' family came looking for Him because they thought He was out of His mind. He used the moment to teach that His family is whoever does God's will.","Marcos 10":"On the way to Jerusalem, Jesus talks about marriage, welcomes the children the disciples wanted to send away, and teaches that He came to serve.","Lucas 2":"The birth of Jesus in Bethlehem during a Roman census. The first to hear the news were some humble shepherds.","Lucas 6":"Luke's version of Jesus' sermon, given on a plain. It includes the call to love our enemies and not to judge.","Lucas 10":"An expert in the law asks, “Who is my neighbor?” Jesus answers with the good Samaritan, at a time when Jews and Samaritans despised each other.","Lucas 15":"The Pharisees criticized Jesus for eating with sinners. He answers with three parables: the sheep, the coin and the prodigal son.","Lucas 23":"The crucifixion. Even on the cross, Jesus asks forgiveness for those crucifying Him and promises paradise to one of the thieves.","Juan 1":"John begins his gospel before creation: the Word was God and became flesh. He presents Jesus as eternal.","Juan 3":"Nicodemus, an important Pharisee, visits Jesus at night. Jesus explains that one must be born again and tells him the most famous verse in the Bible.","Juan 8":"Jesus teaches in the temple during the Feast of Tabernacles, when huge lamps were lit. There He says, “I am the light of the world.”","Juan 10":"Jesus presents Himself as the good shepherd who gives His life for the sheep, in contrast to the religious leaders who did not care for the people.","Juan 11":"Lazarus, Jesus' friend, dies. Jesus weeps with the family and then raises him after four days.","Juan 14":"It is the night of the Last Supper and the disciples are troubled because Jesus is leaving. He promises them a place in heaven, the Holy Spirit and His peace.","Juan 15":"On the way to Gethsemane, perhaps passing by vineyards, Jesus teaches that He is the vine and His disciples are the branches.","Juan 16":"Jesus prepares the disciples for His death. He warns them they will have tribulation, but assures them He has overcome the world.","Juan 19":"The crucifixion. From the cross, Jesus entrusts His mother Mary to the care of the disciple John.","Hechos 1":"Before going up to heaven, Jesus promises the power of the Holy Spirit and sends His disciples to be witnesses to the ends of the earth.","Hechos 2":"Pentecost, a Jewish feast 50 days after Passover. The Holy Spirit comes down, Peter preaches and about three thousand people are baptized.","Romanos 5":"Paul explains the fruits of being justified by faith: peace with God and hope even in tribulation, because Christ died for us while we were still sinners.","Romanos 6":"Paul answers whether we can keep sinning since there is grace. His answer is no: in baptism we die to sin to live a new life.","Romanos 8":"One of the best-loved chapters. Paul moves from “no condemnation” to “nothing can separate us from the love of God.”","Romanos 12":"After eleven chapters of doctrine, Paul turns to practical life: offering ourselves to God, renewing the mind and loving without pretending.","Romanos 13":"Paul writes to Christians living under the Roman Empire. He teaches them to respect the authorities and that love fulfills the law.","1 Corintios 6":"In Corinth, a city famous for its immorality, some Christians thought what they did with their bodies didn't matter. Paul reminds them the body is the temple of the Spirit.","1 Corintios 7":"Paul answers questions the Corinthians had asked him about marriage, singleness and married sexual life.","1 Corintios 10":"Paul uses Israel's history in the wilderness as a warning, and assures them God always provides a way out of temptation.","1 Corintios 13":"The “hymn to love.” Paul writes it in the middle of a discussion about spiritual gifts: without love, no gift is worth anything.","1 Corintios 15":"Some in Corinth denied the resurrection. Paul lists the witnesses of the risen Jesus and explains our future resurrection.","2 Corintios 4":"Paul describes the pressures of ministry: we are clay jars carrying a treasure, and our afflictions are light compared to the glory.","2 Corintios 5":"Paul speaks of our body as a temporary tent and of being a new creation in Christ, with the ministry of reconciliation.","2 Corintios 12":"Paul asked God three times to remove a “thorn in the flesh.” The answer was, “My grace is sufficient for thee.”","Gálatas 5":"Paul concludes his defense of Christian freedom: don't go back to slavery under the law, and walk in the Spirit, whose fruit is love, joy and peace.","Gálatas 6":"Paul encourages believers to help carry one another's burdens and not to grow weary in doing good, because we reap what we sow.","Efesios 2":"Paul explains that we were once dead in sin, but by grace we were saved through faith, not by works.","Efesios 4":"The practical part of the letter begins: the unity of the church, the gifts that build it up and leaving the old way of life behind.","Efesios 5":"Paul talks about living as children of light and about a marriage that reflects Christ's love for His church.","Efesios 6":"Instructions for children, parents and workers, and the image of the armor of God, inspired by the Roman soldiers guarding Paul.","Filipenses 2":"Paul asks for unity and humility and gives Christ as the example, who humbled Himself to death on a cross. He is probably quoting an early Christian hymn.","Filipenses 3":"Paul tells how he gave up all his religious prestige to know Christ and how he keeps pressing on toward the goal.","Filipenses 4":"Written from prison, Paul thanks the Philippians for a gift. He says he has learned to be content in every situation and can do all things through Christ.","Colosenses 3":"Paul describes the new life in Christ: setting our minds on things above, and how that life looks at home, in marriage and at work.","1 Tesalonicenses 4":"The Thessalonians were grieving over believers who had died. Paul assures them they will rise again when Christ returns.","1 Tesalonicenses 5":"Paul's final advice: rejoice always, pray without ceasing and give thanks in everything.","2 Timoteo 3":"Paul warns of difficult times and urges Timothy to remain in the Scriptures, which are inspired by God.","Hebreos 11":"The “hall of faith”: Abel, Noah, Abraham, Moses and many more who trusted God without yet seeing the promise fulfilled.","Hebreos 12":"After the hall of faith, the author encourages us to run the race with our eyes fixed on Jesus.","Hebreos 13":"Final exhortations: hospitality, honoring marriage, living free from greed and trusting that God will never leave us.","Santiago 1":"James writes to scattered Jewish believers going through trials. He tells them trials produce patience and that we must be doers of the Word.","Santiago 3":"James compares the tongue to a small fire that can set a whole forest ablaze, and contrasts earthly wisdom with the wisdom from above.","Santiago 4":"James confronts quarrels and pride in the church, and warns against making plans without taking God into account.","1 Pedro 2":"Peter calls believers “a chosen generation.” He writes to Christians living as strangers and asks them to live well among those who don't believe.","1 Pedro 5":"Peter, now an old man, advises pastors to care for the flock, and tells everyone to cast their anxiety on God and resist the devil.","1 Juan 1":"John, an eyewitness of Jesus' life, writes that God is light and that if we confess our sins He is faithful to forgive.","1 Juan 4":"John teaches how to tell false spirits apart and sums it all up: God is love, and whoever loves God loves his brother.","Apocalipsis 21":"John's final vision: a new heaven and a new earth, where God lives with His people and there is no more death, crying or pain.","Génesis 22":"God tests Abraham by asking him to offer Isaac, the son of the promise. At the last moment He stops his hand and provides a ram. Abraham names the place “The Lord will provide.”","Génesis 28":"Jacob flees from his brother Esau, whom he had deceived. He sleeps on the road with a stone for a pillow, dreams of a ladder to heaven, and God promises to be with him wherever he goes.","Génesis 50":"Jacob dies and Joseph's brothers fear he will now take revenge for selling him as a slave. Joseph forgives them: what they meant for evil, God meant for good.","Éxodo 15":"Israel has just crossed the Red Sea on dry ground and watched the Egyptians sink. Moses and Miriam sing of victory, and in the wilderness God reveals Himself as “the Lord that healeth thee.”","Éxodo 22":"Part of the laws God gave at Sinai about daily life: theft, loans and care for the most vulnerable, such as widows, orphans and foreigners.","Éxodo 23":"More laws of the covenant: justice in court, rest and feasts. God promises to send an angel ahead of Israel to guide them to the promised land.","Éxodo 33":"After the golden calf, Moses intercedes for the people and asks God not to leave them. God promises: “My presence shall go with thee, and I will give thee rest.”","Levítico 19":"Instructions for being a holy people in everyday life: honor parents, don't steal, don't lie, respect the elderly and love your neighbor as yourself.","Levítico 20":"God warns against the practices of the Canaanite peoples and calls Israel to be holy, set apart for Him.","Levítico 27":"The last chapter of Leviticus, about vows and offerings dedicated to God. Here it is established that the tithe of the harvest belongs to the Lord.","Números 6":"Instructions for the Nazirite vow and the priestly blessing Aaron and his sons were to speak over Israel: “The Lord bless thee, and keep thee.”","Números 23":"King Balak hires the soothsayer Balaam to curse Israel, but God only lets him bless them. Balaam declares that God is not a man, that He should lie.","Deuteronomio 6":"The “Shema,” Israel's central confession: the Lord is one, and we must love Him with all our heart and teach His words to our children at all times.","Deuteronomio 7":"Moses reminds Israel that God didn't choose them because they were great, but because of His love, and that He is faithful to a thousand generations.","Deuteronomio 8":"Before they enter a prosperous land, Moses warns: don't forget God when you are full, because He is the one who gives you power to get wealth.","Deuteronomio 10":"Moses sums up what God requires: to fear Him, love Him and serve Him. He describes a God who defends the orphan and the widow and loves the foreigner.","Deuteronomio 20":"Instructions for when Israel went to war. Before battle, the priest was to encourage the people: God fights for you.","Deuteronomio 28":"Moses presents the blessings for obeying God and the consequences of disobeying Him, as part of renewing the covenant.","Josué 24":"Joshua, now old, gathers all Israel at Shechem and challenges them to decide whom they will serve. He declares: “as for me and my house, we will serve the Lord.”","Rut 1":"Naomi loses her husband and sons in Moab and decides to return to Bethlehem. Her daughter-in-law Ruth refuses to leave her: “thy people shall be my people, and thy God my God.”","Rut 3":"Ruth goes to Boaz, Naomi's relative, to ask him to redeem her. Boaz recognizes her before all the people as a virtuous woman.","1 Samuel 1":"Hannah suffers because she has no children and prays with tears at the temple. God gives her Samuel, and she keeps her promise to dedicate him to the Lord.","1 Samuel 15":"King Saul disobeys God's command and excuses himself by saying he kept animals to sacrifice. Samuel answers that to obey is better than sacrifice.","1 Samuel 16":"God sends Samuel to anoint a new king among Jesse's sons. He doesn't choose the tallest or the oldest, but David, the youngest, because God looks at the heart.","1 Samuel 18":"After David defeats Goliath, Jonathan, King Saul's son, loves him as his own soul. It's the start of one of the most famous friendships in the Bible.","1 Reyes 2":"David, about to die, gives his final instructions to his son Solomon: be strong, show yourself a man and keep God's ways.","2 Crónicas 7":"Solomon dedicates the temple and fire comes down from heaven. That night God promises to hear and heal the land if His people humble themselves and pray.","Esdras 8":"Ezra is about to lead a group back to Jerusalem with many treasures. He is ashamed to ask the king for an escort, so he fasts and prays for God's protection.","Nehemías 8":"With the walls rebuilt, the people gather to hear Ezra read the law. They weep when they understand it, but Nehemiah tells them not to grieve: the joy of the Lord is their strength.","Job 12":"Job answers his friends, who accuse him of having sinned. He reminds them that wisdom and power belong to God.","Job 23":"Job looks for God and can't find Him, but he trusts that God knows his way and that he will come out of the trial like gold.","Job 31":"Job's final defense before his friends: he reviews his integrity, including the covenant he made with his eyes not to look with lust.","Salmos 1":"The psalm that opens the whole book presents two paths: the righteous person who meditates on God's law is like a tree planted by rivers of water.","Salmos 3":"David wrote it while fleeing from his own son Absalom, who wanted to take his throne. Even so, h
