<!DOCTYPE html>
<html lang="es">
<head><meta name="robots" content="noindex,nofollow"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Lámpara"><link rel="apple-touch-icon" href="icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lámpara · Encuentra la Palabra</title>
<style>
@font-face{font-family:Inter;font-weight:400;font-display:swap;src:url(fonts/inter-400.woff) format("woff")}
@font-face{font-family:Inter;font-weight:500;font-display:swap;src:url(fonts/inter-500.woff) format("woff")}
@font-face{font-family:Inter;font-weight:600;font-display:swap;src:url(fonts/inter-600.woff) format("woff")}
@font-face{font-family:Inter;font-weight:700 800;font-display:swap;src:url(fonts/inter-700.woff) format("woff")}
@font-face{font-family:Lora;font-weight:400 700;font-style:normal;font-display:swap;src:url(fonts/lora.woff) format("woff")}
@font-face{font-family:Lora;font-weight:400 700;font-style:italic;font-display:swap;src:url(fonts/lora-italic.woff) format("woff")}
#totop{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));width:48px;height:48px;border-radius:50%;border:0;background:var(--accent,#a8552c);color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;z-index:50;opacity:0;pointer-events:none;transform:translateY(10px);transition:opacity .2s,transform .2s;cursor:pointer}#totop.show{opacity:1;pointer-events:auto;transform:none}body.quiz #totop{display:none}
</style>
<style>
:root{
  --bg:#f7f2ea; --card:#fffdf9; --ink:#2b241f; --muted:#7a6d62; --line:#e8dfd2;
  --accent:#a8552c; --accent-soft:#f3e3d6; --gold:#c08a2e; --ok:#3f7a5a;
  --fs:19px; --radius:16px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#1b1714;--card:#262019;--ink:#f1e9df;--muted:#a99b8d;--line:#3a3129;--accent:#e08a5a;--accent-soft:#3a2a20;--gold:#e0b25c}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit}
.wrap{max-width:680px;margin:0 auto;padding:0 16px 110px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .in{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:12px 16px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;letter-spacing:-.2px}
.logo svg{width:26px;height:26px}
.top .sp{flex:1}
.iconbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:500;margin:14px 0 4px;font-size:15px}

/* search */
.search{position:relative;margin:16px 0 8px}
.search input{width:100%;font:inherit;font-size:17px;padding:15px 16px 15px 46px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);outline:none}
.search input:focus{border-color:var(--accent)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
.hint{color:var(--muted);font-size:13.5px;margin:0 2px 6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:8px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:500}

h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:26px 2px 10px;font-weight:600}
h1.title{font-family:Lora,serif;font-size:30px;line-height:1.15;margin:6px 0 8px;font-weight:600}
.intro{color:var(--muted);font-size:16px;line-height:1.5;margin:0 0 6px}

/* verse of day */
.vod{background:linear-gradient(150deg,var(--accent) 0%,#7d3a1c 100%);color:#fff8f0;border-radius:20px;padding:22px 20px 16px;margin-top:14px;box-shadow:0 8px 24px rgba(120,60,20,.18)}
.vod .lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.8;font-weight:600}
.vod .tx{font-family:Lora,serif;font-size:calc(var(--fs) + 2px);line-height:1.5;margin:10px 0 12px}
.vod .rf{font-weight:600;opacity:.95}
.vod .acts{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.vod .acts svg{width:16px;height:16px}
.vod .acts button,.vod .acts a{background:rgba(255,255,255,.16);color:#fff;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:500;text-decoration:none;display:inline-flex;gap:6px;align-items:center}

/* grid */
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-align:left;min-height:84px;display:flex;flex-direction:column;justify-content:space-between}
.cat b{font-size:15.5px;line-height:1.25}
.cat span{color:var(--muted);font-size:13px;margin-top:6px}
.tlist{display:flex;flex-direction:column;gap:8px}
.trow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;text-align:left;width:100%}
.trow .nm{font-weight:600;font-size:16px;flex:1}
.trow .ct{color:var(--muted);font-size:13px}
.trow .ar{color:var(--muted)}

/* verse cards */
.vc{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 16px 10px;margin:10px 0}
.vc .rf{font-weight:700;color:var(--accent);font-size:15px;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.vc .tx{font-family:Lora,serif;font-size:var(--fs);line-height:1.62;margin:8px 0 6px}
.vc sup,.chap sup{font-family:Inter,sans-serif;font-size:.6em;color:var(--gold);font-weight:700;margin-right:3px}
.vc .acts{display:flex;gap:2px;margin-left:-8px;flex-wrap:wrap}
.act{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:13.5px;font-weight:500;padding:8px;border-radius:9px;text-decoration:none}
.act:hover{background:var(--accent-soft)}
.act svg{width:18px;height:18px}
.act.on{color:var(--accent)}
mark{background:color-mix(in srgb,var(--gold) 35%,transparent);color:inherit;border-radius:3px;padding:0 1px}

/* reader */
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.bk{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;text-align:left;font-weight:500;font-size:15px}
.chs{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.chn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 0;font-weight:600;text-align:center}
.chap{font-family:Lora,serif;font-size:var(--fs);line-height:1.75;margin-top:8px}
.chap .v{border-radius:6px;padding:2px 2px;cursor:pointer;transition:background .2s}
.chap .v.sel{background:var(--accent-soft)}
.chap .v.hl{background:color-mix(in srgb,var(--gold) 28%,transparent)}
.nav2{display:flex;justify-content:space-between;gap:10px;margin:22px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--card);border:1px solid var(--line);font-size:15px;text-decoration:none}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;z-index:40;background:var(--ink);color:var(--bg);border-radius:14px;padding:6px;display:flex;gap:2px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 24px)}
.selbar .act{color:var(--bg)}
.selbar .act:hover{background:rgba(255,255,255,.12)}

/* bottom nav */
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 10px;font-size:11.5px;font-weight:600;color:var(--muted);text-decoration:none}
nav.tabs a svg{width:23px;height:23px}
nav.tabs a.on{color:var(--accent)}

.empty{text-align:center;color:var(--muted);padding:40px 20px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;transition:.25s;z-index:50;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:60vh;color:var(--muted)}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.count{color:var(--muted);font-size:14px;margin:4px 2px}
.foot{color:var(--muted);font-size:12.5px;text-align:center;margin:36px 0 0;line-height:1.5}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin:10px 0}
.seg button{flex:1;padding:9px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.pstitle{font-family:Lora,serif;font-style:italic;color:var(--muted);margin:4px 0 0;font-size:15.5px}
.ctx{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:14px;padding:14px 16px;margin:12px 0 4px;font-size:15.5px;line-height:1.55}
.ctx .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:700;margin-bottom:4px}
.ctx p{margin:0}
.ctx details{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.ctx summary{cursor:pointer;font-weight:600;color:var(--accent);list-style:none}
.ctx summary::-webkit-details-marker{display:none}
.ctx .meta{color:var(--muted);font-size:13.5px;margin:6px 0 4px}
.backrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.note{background:color-mix(in srgb,var(--gold) 14%,transparent);border-radius:12px;padding:10px 12px;margin:4px 0 6px;font-size:15px;line-height:1.5;white-space:pre-wrap;cursor:pointer}
.note .nl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);font-weight:700;margin-bottom:2px}
.chap .v.nt sup{background:var(--gold);color:#fff;border-radius:4px;padding:0 3px}
.mbox textarea{width:100%;font:inherit;font-size:16px;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);min-height:150px;margin-top:10px;outline:none;resize:vertical}
.mbox textarea:focus{border-color:var(--accent)}
.mbox .mref{font-weight:700;color:var(--accent)}
.mbox .mtx{font-family:Lora,serif;color:var(--muted);font-size:14.5px;margin-top:4px;max-height:90px;overflow:auto}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:60;padding:16px}
.mbox{background:var(--card);border-radius:18px;padding:18px;max-width:520px;width:100%;font-size:16px;line-height:1.45}
nav.tabs .in{grid-template-columns:repeat(5,1fr)!important}
body.quiz nav.tabs{display:none}
.camcard{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--uc,var(--accent));border-radius:16px;padding:14px 16px;margin-top:12px;text-decoration:none}
.camcard .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.camcard b{display:block;font-size:17px;margin:2px 0}.camcard span{font-size:13px;color:var(--muted)}
.camfire{font-size:30px;text-align:center;line-height:1}.camfire small{display:block;font-size:14px;font-weight:700;color:var(--accent)}
.camhead{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.camhead div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.camhead b{display:block;font-size:19px}.camhead span{font-size:12px;color:var(--muted)}
.unit{display:flex;justify-content:space-between;align-items:center;background:var(--uc);color:#fff;border-radius:16px;padding:14px 16px;margin:26px 0 8px}
.unit small{display:block;font-size:12px;opacity:.85;text-transform:uppercase;letter-spacing:.08em;font-weight:600}.unit b{font-size:18px}.unit span{font-weight:700;opacity:.9}
.path{display:flex;flex-direction:column;align-items:center;gap:14px;padding:12px 0}
.node-wrap{display:flex;flex-direction:column;align-items:center;position:relative}
.node{width:70px;height:70px;border-radius:50%;font-size:26px;font-weight:800;display:grid;place-items:center;color:#fff;transition:transform .1s}
.node:active{transform:scale(.94)}
.node.done{background:var(--uc);box-shadow:0 5px 0 color-mix(in srgb,var(--uc) 60%,#000)}
.node.cur{background:var(--uc);box-shadow:0 5px 0 color-mix(in srgb,var(--uc) 60%,#000),0 0 0 7px color-mix(in srgb,var(--uc) 25%,transparent);animation:pulse 1.6s infinite}
.node.lock{background:var(--line);color:var(--muted);font-size:20px;box-shadow:0 5px 0 color-mix(in srgb,var(--line) 70%,#000)}
@keyframes pulse{50%{box-shadow:0 5px 0 color-mix(in srgb,var(--uc) 60%,#000),0 0 0 12px color-mix(in srgb,var(--uc) 12%,transparent)}}
.nlabel{font-size:13px;font-weight:600;margin-top:9px;color:var(--muted);max-width:130px;text-align:center}
.bubble{position:absolute;top:-30px;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:3px 10px;font-size:12.5px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
.lesshead{color:var(--uc,var(--accent));font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.08em;margin-top:12px}
.refl{font-size:17px;line-height:1.6;margin:0}
.btn.big{padding:16px;font-size:16.5px;border-radius:14px}
.qtop{display:flex;align-items:center;gap:12px;margin-top:16px}.qtop .bar{flex:1;height:14px;margin:0}.qtop .bar i{transition:width .3s}
.qx{font-size:22px;color:var(--muted);width:32px}
.qp{font-size:22px;line-height:1.3;margin:22px 0 12px;font-weight:700}
.qx-text{font-family:Lora,serif;font-size:calc(var(--fs) - 1px);line-height:1.6;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.qref{font-family:Inter,sans-serif;font-weight:700;color:var(--accent);font-size:14px;margin-top:8px}
.blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--accent);color:transparent}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.opt{text-align:left;padding:15px 16px;border-radius:14px;border:2px solid var(--line);border-bottom-width:4px;background:var(--card);font-size:16.5px;font-weight:500}
.opt.ok{border-color:#3f9a5a;background:#e5f5ea;color:#1f6b38}.opt.bad{border-color:#d0543f;background:#fbe7e3;color:#a3291c}
@media (prefers-color-scheme:dark){.opt.ok{background:#1d3a26;color:#9ee0b0}.opt.bad{background:#3d1f1a;color:#f2a497}}
.fb{position:fixed;left:0;right:0;bottom:0;padding:16px 20px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:4px;z-index:40;animation:up .2s}
.fb.ok{background:#d7f0de;color:#1f6b38}.fb.bad{background:#f9dcd6;color:#a3291c}
@media (prefers-color-scheme:dark){.fb.ok{background:#1d3a26;color:#9ee0b0}.fb.bad{background:#3d1f1a;color:#f2a497}}
.fb b{font-size:19px}.fb span{font-size:16px;margin-bottom:6px}.fb .btn{margin-top:8px;padding:14px}
.fb.ok .btn{background:#3f9a5a;border-color:#3f9a5a}.fb.bad .btn{background:#d0543f;border-color:#d0543f}
@keyframes up{from{transform:translateY(100%)}}
.panel .acts2[style*=column] .btn{flex:none;width:100%}
.qtop .bar{background:color-mix(in srgb,var(--line) 70%,var(--muted))}
.done-screen{text-align:center;padding-top:30px}.big-emoji{font-size:64px}
/* juegos y logros */
.camseg{margin-top:8px}.camseg button{font-size:13.5px}
.prof{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#fff4e0,#ffe3ec);border-radius:20px;padding:14px;margin:12px 0}
@media (prefers-color-scheme:dark){.prof{background:linear-gradient(135deg,#3a2a1a,#3a1f2c)}}
.prof small{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}.prof b{display:block;font-size:19px}
.prof .bar{margin-top:6px;height:9px}.prof .bar i{background:linear-gradient(90deg,#ffbe0b,#fb5607,#ff006e)}.prof span{font-size:12px;color:var(--muted)}
.pstreak{text-align:center;font-size:24px}.pstreak b{display:block;font-size:16px}
.lvb,.ab{width:var(--s);height:var(--s);border-radius:50%;display:grid;place-items:center;position:relative;flex:none;font-size:calc(var(--s)*.42)}
.lvb span{line-height:1}.lvb b{position:absolute;bottom:-4px;right:-4px;background:#2b241f;color:#fff;border-radius:99px;font-size:12px;min-width:24px;height:24px;display:grid;place-items:center;border:2px solid #fff}
.t0{background:radial-gradient(circle at 30% 30%,#e9e2d8,#c9bfb2);box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.t1{background:radial-gradient(circle at 30% 30%,#f2b27a,#b8692c 60%,#7d4318);box-shadow:0 0 0 4px #e7c3a2,0 6px 14px rgba(140,80,30,.35)}
.t2{background:radial-gradient(circle at 30% 30%,#ffffff,#c9d1de 55%,#8c97ab);box-shadow:0 0 0 4px #fff,0 0 0 7px #b9c3d4,0 8px 18px rgba(80,90,120,.35)}
.t3{background:radial-gradient(circle at 30% 30%,#fff6b0,#ffc83d 50%,#e08a00);box-shadow:0 0 0 4px #fff3c4,0 0 0 8px #ffb703,0 0 24px rgba(255,183,3,.7)}
.t4{background:conic-gradient(from 0deg,#ff006e,#fb5607,#ffbe0b,#06d6a0,#3a86ff,#8338ec,#ff006e);box-shadow:0 0 0 4px #fff,0 0 0 8px rgba(131,56,236,.6),0 0 30px rgba(58,134,255,.8);animation:spin 6s linear infinite}
.t4>span,.t4>b{animation:spin 6s linear infinite reverse}
.t3::after,.t4::after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(120deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);background-size:250% 100%;animation:shine 2.6s infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes shine{0%{background-position:150% 0}100%{background-position:-100% 0}}
.ab i{position:absolute;bottom:-10px;font-style:normal;font-size:11px;color:#ffb703;text-shadow:0 1px 2px rgba(0,0,0,.4);letter-spacing:-1px;background:#2b241f;border-radius:99px;padding:1px 6px}
.ab.t4 i{animation:spin 6s linear infinite reverse}
.lvb.t0{background:radial-gradient(circle at 30% 30%,#b8f5a0,#3fbf5f 60%,#1f8a3c);box-shadow:0 0 0 4px #d6f5c8,0 6px 14px rgba(40,140,60,.35)}
.games{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.game{border-radius:20px;padding:16px 14px;color:#fff;text-decoration:none;min-height:140px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 8px 18px rgba(0,0,0,.15);position:relative;overflow:hidden;transition:transform .12s}
.game:active{transform:scale(.97)}
.game .gi{font-size:38px;position:absolute;top:12px;right:12px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
.game b{font-size:17px;line-height:1.15}.game small{font-size:12.5px;opacity:.92;margin-top:4px;line-height:1.3}
.bigprof{display:flex;flex-direction:column;align-items:center;gap:6px;margin:18px 0 6px}.bigprof b{font-size:22px;margin-top:10px}.bigprof small{color:var(--muted)}
.lvrow{display:flex;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px;font-size:20px}
.lvrow div{opacity:.25;filter:grayscale(1)}.lvrow div.on{opacity:1;filter:none}
.achs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.achc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 12px 12px;display:flex;flex-direction:column;align-items:center;text-align:center}

<script>
const CTX={"libros":{"Génesis":["Moisés, según la tradición","Hacia el siglo XV a.C.","El libro de los comienzos: la creación, la caída del ser humano, el diluvio y la historia de Abraham, Isaac, Jacob y José. Dios empieza a formar un pueblo para bendecir por medio de él a todas las naciones."],"Éxodo":["Moisés","Hacia el siglo XV a.C.","Israel es esclavo en Egipto y Dios lo libera por medio de Moisés. En el monte Sinaí le da los Diez Mandamientos y las instrucciones para el tabernáculo."],"Levítico":["Moisés","Hacia el siglo XV a.C.","Manual de santidad para Israel en el desierto: sacrificios, sacerdocio, fiestas y leyes para vivir como pueblo apartado para Dios."],"Números":["Moisés","Hacia el siglo XV a.C.","Los 40 años de Israel en el desierto. Por su incredulidad, una generación no entra a la tierra prometida, pero Dios sigue siendo fiel."],"Deuteronomio":["Moisés","Hacia el siglo XV a.C.","Los últimos discursos de Moisés antes de morir. Repasa la ley para la nueva generación que está por entrar a Canaán y la llama a amar a Dios con todo el corazón."],"Josué":["Josué y sucesores","Hacia el siglo XIV a.C.","Israel entra y conquista la tierra prometida bajo el liderazgo de Josué, sucesor de Moisés."],"Jueces":["Probablemente Samuel","Siglo XI a.C.","Época sin rey en la que Israel cae una y otra vez en idolatría. Dios levanta jueces como Débora, Gedeón y Sansón para librarlos."],"Rut":["Desconocido","Siglo XI a.C.","Una historia de lealtad y redención en tiempos de los jueces. Rut, una extranjera, se vuelve bisabuela del rey David."],"1 Samuel":["Samuel y otros profetas","Siglo X a.C.","Israel pasa de los jueces a la monarquía: el profeta Samuel, el rey Saúl y el ascenso del joven David."],"2 Samuel":["Profetas de la corte","Siglo X a.C.","El reinado de David: sus victorias, su pecado con Betsabé y las consecuencias en su familia, y la promesa de un reino eterno."],"1 Reyes":["Desconocido","Siglo VI a.C.","De la gloria de Salomón y el templo a la división del reino. Incluye al profeta Elías frente a los profetas de Baal."],"2 Reyes":["Desconocido","Siglo VI a.C.","La decadencia de Israel y Judá hasta que ambos caen ante Asiria y Babilonia por su infidelidad a Dios."],"1 Crónicas":["Esdras, según la tradición","Siglo V a.C.","Repaso de la historia de Israel, centrado en David, escrito para el pueblo que volvía del exilio."],"2 Crónicas":["Esdras, según la tradición","Siglo V a.C.","Historia de Judá desde Salomón hasta el exilio, destacando a los reyes que buscaron a Dios y los avivamientos."],"Esdras":["Esdras","Siglo V a.C.","El regreso de los judíos de Babilonia y la reconstrucción del templo y de la vida espiritual del pueblo."],"Nehemías":["Nehemías","Siglo V a.C.","Nehemías deja la corte de Persia para reconstruir los muros de Jerusalén en 52 días, a pesar de la oposición."],"Ester":["Desconocido","Siglo V a.C.","Una joven judía llega a reina de Persia y arriesga su vida para salvar a su pueblo. Dios no se menciona, pero se ve su mano en todo."],"Job":["Desconocido","Época muy antigua","Un hombre justo lo pierde todo y lucha por entender su sufrimiento. Al final se encuentra con Dios, que le responde desde el torbellino."],"Salmos":["David y otros autores","Del siglo X al V a.C.","El libro de cantos y oraciones de Israel. Expresa todas las emociones ante Dios: alabanza, dolor, enojo, confianza y arrepentimiento."],"Proverbios":["Salomón principalmente","Siglo X a.C.","Dichos de sabiduría práctica para la vida diaria: trabajo, palabras, familia, dinero y amistades. Su base es el temor de Dios."],"Eclesiastés":["Salomón, según la tradición","Siglo X a.C.","Reflexión de un hombre que lo probó todo y concluyó que, sin Dios, todo es vanidad."],"Cantares":["Salomón","Siglo X a.C.","Poema de amor entre un esposo y su esposa que celebra el amor y la intimidad dentro del matrimonio."],"Isaías":["El profeta Isaías","Siglo VIII a.C.","Profeta en Jerusalén que anunció juicio por el pecado, pero también consuelo y la venida del Mesías, el Siervo sufriente."],"Jeremías":["El profeta Jeremías","Siglos VII y VI a.C.","El «profeta llorón» advirtió a Judá antes de la caída ante Babilonia. En medio del desastre, anunció un nuevo pacto y un futuro con esperanza."],"Lamentaciones":["Jeremías, según la tradición","586 a.C.","Cinco poemas de luto por la destrucción de Jerusalén. En medio del dolor brilla la fidelidad de Dios, nueva cada mañana."],"Ezequiel":["El profeta Ezequiel","Siglo VI a.C.","Sacerdote y profeta en el exilio en Babilonia. Tuvo visiones de la gloria de Dios y anunció un corazón nuevo para su pueblo."],"Daniel":["Daniel","Siglo VI a.C.","Un joven judío llevado a Babilonia se mantiene fiel a Dios en la corte de reyes paganos: el horno de fuego y el foso de los leones."],"Oseas":["El profeta Oseas","Siglo VIII a.C.","Dios le pide a Oseas casarse con una mujer infiel como imagen de su amor por Israel, que también le fue infiel."],"Joel":["El profeta Joel","Fecha incierta","Una plaga de langostas se vuelve llamado al arrepentimiento y a la promesa de que Dios derramará su Espíritu."],"Amós":["Amós, un pastor","Siglo VIII a.C.","Un pastor de Judá denuncia la injusticia social y la religión vacía del reino del norte en tiempos de prosperidad."],"Abdías":["El profeta Abdías","Siglo VI a.C.","Profecía breve contra Edom por alegrarse de la caída de Jerusalén."],"Jonás":["Jonás","Siglo VIII a.C.","Un profeta huye de la misión de predicar a Nínive, sus enemigos. Dios muestra su misericordia aun con quienes no la merecen."],"Miqueas":["El profeta Miqueas","Siglo VIII a.C.","Profeta del campo que denunció la corrupción, anunció que el Mesías nacería en Belén y resumió lo que Dios pide: justicia, misericordia y humildad."],"Nahúm":["El profeta Nahúm","Siglo VII a.C.","Anuncia la caída de Nínive, la cruel capital de Asiria."],"Habacuc":["El profeta Habacuc","Siglo VII a.C.","Un profeta pregunta a Dios por qué permite el mal, y aprende a confiar y alegrarse en Él aunque todo falle."],"Sofonías":["El profeta Sofonías","Siglo VII a.C.","Advierte del día del Señor, pero termina con un Dios que se alegra sobre su pueblo con cánticos."],"Hageo":["El profeta Hageo","520 a.C.","Anima a los que volvieron del exilio a dejar de posponer la reconstrucción del templo."],"Zacarías":["El profeta Zacarías","520 a.C.","Visiones de esperanza para los que volvieron del exilio y anuncios del Rey que llegaría humilde, montado en un asno."],"Malaquías":["El profeta Malaquías","Siglo V a.C.","Último libro del Antiguo Testamento. Confronta la frialdad espiritual del pueblo y anuncia al mensajero que prepararía el camino del Señor."],"Mateo":["Mateo, el cobrador de impuestos","Años 50–60 d.C.","Escrito sobre todo para judíos. Presenta a Jesús como el Mesías y Rey prometido y reúne sus grandes enseñanzas, como el Sermón del Monte."],"Marcos":["Juan Marcos, compañero de Pedro","Años 50–60 d.C.","El evangelio más corto y directo. Muestra a Jesús como el Siervo que vino a servir y dar su vida, con mucha acción y milagros."],"Lucas":["Lucas, médico y compañero de Pablo","Años 60 d.C.","Una investigación cuidadosa de la vida de Jesús que destaca su compasión por los pobres, las mujeres, los enfermos y los marginados."],"Juan":["Juan, el discípulo amado","Años 80–90 d.C.","Escrito «para que creáis que Jesús es el Cristo». Muestra su divinidad con siete señales y los «Yo soy», y narra a detalle la última cena."],"Hechos":["Lucas","Años 60 d.C.","Continuación de Lucas: el Espíritu Santo llega en Pentecostés y la iglesia se extiende desde Jerusalén hasta Roma con Pedro y Pablo."],"Romanos":["El apóstol Pablo","Hacia el año 57 d.C.","Carta a la iglesia en Roma que explica el evangelio paso a paso: todos pecaron, somos justificados por la fe y vivimos por el Espíritu."],"1 Corintios":["El apóstol Pablo","Hacia el año 55 d.C.","Corinto era una ciudad rica y moralmente relajada. Pablo corrige divisiones, inmoralidad y desorden en la iglesia, y habla del amor y la resurrección."],"2 Corintios":["El apóstol Pablo","Hacia el año 56 d.C.","La carta más personal de Pablo. Defiende su ministerio y habla de cómo el poder de Dios se muestra en la debilidad."],"Gálatas":["El apóstol Pablo","Hacia el año 49 d.C.","Algunos enseñaban que había que cumplir la ley judía para ser salvo. Pablo defiende con fuerza la libertad y la salvación solo por gracia mediante la fe."],"Efesios":["El apóstol Pablo, desde la cárcel","Hacia el año 60 d.C.","Explica la riqueza que tenemos en Cristo, la unidad de la iglesia y cómo vivir esa fe en el matrimonio, la familia y el trabajo."],"Filipenses":["El apóstol Pablo, desde la cárcel","Hacia el año 61 d.C.","Una carta de gozo y gratitud escrita desde prisión a una iglesia muy querida que lo apoyaba."],"Colosenses":["El apóstol Pablo, desde la cárcel","Hacia el año 60 d.C.","Contra filosofías que restaban importancia a Cristo, Pablo muestra que Él es supremo y suficiente, y cómo se ve la vida nueva en casa."],"1 Tesalonicenses":["El apóstol Pablo","Hacia el año 51 d.C.","Una de las primeras cartas de Pablo. Anima a una iglesia nueva perseguida y responde dudas sobre los que mueren antes del regreso de Cristo."],"2 Tesalonicenses":["El apóstol Pablo","Hacia el año 51 d.C.","Corrige confusiones sobre la segunda venida y llama a no dejar de trabajar mientras esperan."],"1 Timoteo":["El apóstol Pablo","Hacia el año 63 d.C.","Instrucciones a su joven discípulo Timoteo, pastor en Éfeso, sobre cómo dirigir la iglesia y cuidar la sana enseñanza."],"2 Timoteo":["El apóstol Pablo","Hacia el año 67 d.C.","La última carta de Pablo, escrita en la cárcel poco antes de su ejecución. Anima a Timoteo a ser fiel y a predicar la Palabra."],"Tito":["El apóstol Pablo","Hacia el año 63 d.C.","Instrucciones a Tito para organizar las iglesias en la isla de Creta y enseñar una vida de buenas obras."],"Filemón":["El apóstol Pablo","Hacia el año 60 d.C.","Carta breve en la que Pablo pide a Filemón recibir como hermano a Onésimo, su esclavo que había huido y se convirtió."],"Hebreos":["Desconocido","Antes del año 70 d.C.","Para cristianos judíos tentados a volver al judaísmo. Muestra que Jesús es superior a todo y es el sacerdote perfecto."],"Santiago":["Santiago, hermano de Jesús","Años 40–50 d.C.","Sabiduría práctica: una fe verdadera se nota en las obras, en cómo hablamos y en cómo tratamos a los pobres."],"1 Pedro":["El apóstol Pedro","Hacia el año 63 d.C.","A cristianos que sufrían por su fe. Les da esperanza y los llama a vivir con santidad como extranjeros en este mundo."],"2 Pedro":["El apóstol Pedro","Hacia el año 67 d.C.","Advierte contra falsos maestros y recuerda que el Señor volverá, aunque parezca tardar."],"1 Juan":["El apóstol Juan","Años 85–95 d.C.","Carta para dar seguridad de salvación. Insiste en que Dios es amor y en que quien lo conoce ama a su hermano."],"2 Juan":["El apóstol Juan","Años 85–95 d.C.","Nota breve a una iglesia: andar en la verdad y en el amor, y cuidarse de los engañadores."],"3 Juan":["El apóstol Juan","Años 85–95 d.C.","Nota a su amigo Gayo, a quien elogia por su hospitalidad con los misioneros."],"Judas":["Judas, hermano de Jesús","Años 60 d.C.","Llamado urgente a contender por la fe frente a falsos maestros que se habían infiltrado en la iglesia."],"Apocalipsis":["El apóstol Juan, exiliado en Patmos","Hacia el año 95 d.C.","Revelación del triunfo final de Cristo, escrita a iglesias perseguidas. Termina con cielo nuevo, tierra nueva y Dios habitando con su pueblo."]},"caps":{"Génesis 1":"La creación del mundo en seis días. El punto central es que todo lo que existe viene de Dios y que el ser humano fue hecho a su imagen.","Génesis 2":"Un acercamiento a la creación del hombre y la mujer en el huerto del Edén. Aquí se establece el matrimonio: los dos serán una sola carne.","Éxodo 20":"En el monte Sinaí, recién salidos de Egipto, Dios da a Israel los Diez Mandamientos como base de su pacto con ellos.","Deuteronomio 31":"Moisés, con 120 años, sabe que no entrará a la tierra prometida. Pasa el liderazgo a Josué y anima al pueblo: Dios irá delante de ellos.","Josué 1":"Moisés acaba de morir y Josué debe guiar a todo un pueblo a conquistar Canaán. Dios le repite tres veces: «esfuérzate y sé valiente».","Salmos 23":"David, que había sido pastor de ovejas, describe a Dios como su pastor: lo guía, lo cuida y lo acompaña aun en el valle de sombra de muerte.","Salmos 27":"David escribe en tiempos de peligro y enemigos. Aun así, confía porque Dios es su luz y su salvación.","Salmos 32":"David describe el alivio de confesar su pecado después de callarlo. Suele relacionarse con su pecado con Betsabé.","Salmos 34":"David lo escribió después de escapar de un rey filisteo fingiéndose loco. Es un canto de gratitud por la liberación de Dios.","Salmos 37":"Un salmo de sabiduría de David ya anciano: no envidiar a los malvados que prosperan, sino confiar y esperar en Dios.","Salmos 42":"Escrito por los hijos de Coré, levitas músicos, desde lejos del templo. El salmista habla con su propia alma deprimida y se anima a esperar en Dios.","Salmos 46":"Un canto de confianza en medio del caos: aunque la tierra tiemble, Dios es refugio. Inspiró el famoso himno de Lutero «Castillo fuerte».","Salmos 51":"La oración de arrepentimiento de David después de que el profeta Natán lo confrontó por su adulterio con Betsabé y la muerte de Urías.","Salmos 90":"El único salmo atribuido a Moisés. Contrasta la eternidad de Dios con lo breve de la vida humana y pide sabiduría para contar nuestros días.","Salmos 91":"Un salmo de protección muy citado. Describe la seguridad de quien vive al abrigo del Altísimo.","Salmos 103":"David invita a su propia alma a bendecir a Dios por todos sus beneficios: perdón, sanidad, rescate y una misericordia que no se acaba.","Salmos 119":"El salmo más largo de la Biblia, un acróstico en hebreo de 22 secciones, una por letra. Todo él celebra la Palabra de Dios.","Salmos 121":"Un «cántico gradual» que cantaban los peregrinos al subir a Jerusalén para las fiestas. Pedían la protección de Dios en el camino.","Salmos 127":"Atribuido a Salomón, el que construyó el templo. Enseña que casa, ciudad, trabajo e hijos dependen de Dios.","Salmos 139":"David se maravilla de que Dios lo conoce por completo, está en todas partes y lo formó en el vientre de su madre.","Eclesiastés 3":"El famoso poema de los tiempos: hay un momento para cada cosa bajo el cielo. Invita a confiar en el tiempo de Dios.","Eclesiastés 4":"Salomón observa la soledad y la opresión, y concluye que dos son mejor que uno y que el cordón de tres dobleces no se rompe pronto.","Isaías 1":"Isaías abre su libro confrontando a Judá: ofrecían sacrificios pero vivían en injusticia. Aun así, Dios ofrece limpiar su pecado.","Isaías 40":"Inicia la sección de consuelo para los judíos que vivirían el exilio en Babilonia. Dios no se cansa y renueva las fuerzas del que espera en Él.","Isaías 41":"Dios habla a Israel, pequeño y temeroso frente a imperios poderosos: «No temas, yo estoy contigo».","Isaías 43":"Promesas para Israel en el exilio. Dios los llama por su nombre, los acompañará en el fuego y el agua, y hará algo nuevo.","Isaías 53":"Escrito unos 700 años antes de Cristo. Describe al Siervo sufriente que carga el pecado de otros, y el Nuevo Testamento lo aplica a Jesús.","Jeremías 1":"Dios llama a Jeremías siendo muy joven. Él se siente incapaz, pero Dios le dice que lo conocía desde antes de formarlo.","Jeremías 29":"Carta de Jeremías a los judíos deportados a Babilonia. Les dice que se establezcan allí, porque estarán 70 años, pero que Dios tiene planes de bien para ellos.","Lamentaciones 3":"Escrito entre las ruinas de Jerusalén. En el capítulo más oscuro, el autor recuerda que las misericordias de Dios son nuevas cada mañana.","Miqueas 6":"Dios presenta una especie de juicio contra Israel y responde qué es lo que realmente pide: hacer justicia, amar misericordia y humillarse ante Él.","Mateo 5":"Inicia el Sermón del Monte, la enseñanza más famosa de Jesús, dada a sus discípulos y a la multitud en una colina de Galilea.","Mateo 6":"Continúa el Sermón del Monte: Jesús enseña sobre dar, orar y ayunar en secreto, sobre los tesoros del cielo y sobre no afanarse.","Mateo 7":"Final del Sermón del Monte: no juzgar, pedir con confianza, la regla de oro y construir la vida sobre la roca.","Mateo 11":"Jesús invita a los cansados y cargados a encontrar descanso en Él, en contraste con las cargas religiosas que imponían los fariseos.","Mateo 18":"Los discípulos discutían quién sería el mayor. Jesús les habla de ser como niños, de buscar al perdido y de perdonar siempre.","Mateo 19":"Los fariseos ponen a prueba a Jesús con el divorcio. Él responde citando el diseño original de Génesis.","Mateo 22":"En el templo, los líderes intentan atrapar a Jesús con preguntas. Él resume toda la ley en amar a Dios y al prójimo.","Mateo 26":"La última cena y Getsemaní. Jesús instituye la Santa Cena y ora angustiado antes de ser arrestado.","Mateo 28":"La resurrección. Jesús resucitado envía a sus discípulos a hacer discípulos de todas las naciones: la Gran Comisión.","Marcos 3":"La familia de Jesús llegó a buscarlo porque pensaban que estaba fuera de sí. Él aprovechó para enseñar que su familia es quien hace la voluntad de Dios.","Marcos 10":"Camino a Jerusalén, Jesús habla del matrimonio, recibe a los niños que los discípulos querían alejar y enseña que vino a servir.","Lucas 2":"El nacimiento de Jesús en Belén durante un censo romano. Los primeros en recibir la noticia fueron unos humildes pastores.","Lucas 6":"La versión de Lucas del sermón de Jesús, dado en una llanura. Incluye el llamado a amar a los enemigos y a no juzgar.","Lucas 10":"Un experto en la ley pregunta «¿quién es mi prójimo?». Jesús responde con el buen samaritano, cuando judíos y samaritanos se despreciaban.","Lucas 15":"Los fariseos criticaban que Jesús comiera con pecadores. Él responde con tres parábolas: la oveja, la moneda y el hijo pródigo.","Lucas 23":"La crucifixión. Aun en la cruz, Jesús pide perdón para quienes lo crucifican y promete el paraíso a uno de los ladrones.","Juan 1":"Juan empieza su evangelio antes de la creación: el Verbo era Dios y se hizo carne. Presenta a Jesús como eterno.","Juan 3":"Nicodemo, un fariseo importante, visita a Jesús de noche. Jesús le explica que es necesario nacer de nuevo y le dice el versículo más famoso de la Biblia.","Juan 8":"Jesús enseña en el templo durante la fiesta de los Tabernáculos, cuando se encendían grandes lámparas. Ahí dice «Yo soy la luz del mundo».","Juan 10":"Jesús se presenta como el buen pastor que da su vida por las ovejas, en contraste con los líderes religiosos que no cuidaban al pueblo.","Juan 11":"Muere Lázaro, amigo de Jesús. Jesús llora con la familia y luego lo resucita después de cuatro días.","Juan 14":"Es la noche de la última cena y los discípulos están turbados porque Jesús se va. Él les promete un lugar en el cielo, el Espíritu Santo y su paz.","Juan 15":"De camino a Getsemaní, quizá pasando junto a viñedos, Jesús enseña que Él es la vid y sus discípulos los pámpanos.","Juan 16":"Jesús prepara a los discípulos para su muerte. Les advierte que tendrán aflicción, pero les asegura que Él ha vencido al mundo.","Juan 19":"La crucifixión. Desde la cruz, Jesús encarga a su madre María al cuidado del discípulo Juan.","Hechos 1":"Antes de subir al cielo, Jesús promete el poder del Espíritu Santo y envía a sus discípulos a ser testigos hasta lo último de la tierra.","Hechos 2":"Pentecostés, una fiesta judía 50 días después de la Pascua. El Espíritu Santo desciende, Pedro predica y se bautizan unas tres mil personas.","Romanos 5":"Pablo explica los frutos de ser justificados por la fe: paz con Dios y esperanza aun en las tribulaciones, porque Cristo murió por nosotros siendo pecadores.","Romanos 6":"Pablo responde si podemos seguir pecando ya que hay gracia. Su respuesta es que no: en el bautismo morimos al pecado para vivir una vida nueva.","Romanos 8":"Uno de los capítulos más amados. Pablo pasa de «ninguna condenación» a «nada nos podrá separar del amor de Dios».","Romanos 12":"Después de once capítulos de doctrina, Pablo pasa a la vida práctica: ofrecerse a Dios, renovar la mente y amar sin fingir.","Romanos 13":"Pablo escribe a cristianos que vivían bajo el Imperio Romano. Les enseña a respetar a las autoridades y a que el amor cumple la ley.","1 Corintios 6":"En Corinto, ciudad famosa por su inmoralidad, algunos cristianos pensaban que lo que hacían con el cuerpo no importaba. Pablo les recuerda que el cuerpo es templo del Espíritu.","1 Corintios 7":"Pablo responde preguntas que le hicieron los corintios sobre el matrimonio, la soltería y la vida sexual en pareja.","1 Corintios 10":"Pablo usa la historia de Israel en el desierto como advertencia, y asegura que Dios siempre da la salida en la tentación.","1 Corintios 13":"El «himno al amor». Pablo lo escribe en medio de una discusión sobre los dones espirituales: sin amor, ningún don sirve.","1 Corintios 15":"Algunos en Corinto negaban la resurrección. Pablo enumera a los testigos de Jesús resucitado y explica nuestra resurrección futura.","2 Corintios 4":"Pablo describe las presiones del ministerio: somos vasos de barro que llevan un tesoro, y las aflicciones son leves comparadas con la gloria.","2 Corintios 5":"Pablo habla de nuestro cuerpo como una tienda temporal y de ser una nueva creación en Cristo, con el ministerio de la reconciliación.","2 Corintios 12":"Pablo pidió tres veces que Dios le quitara un «aguijón en la carne». La respuesta fue «bástate mi gracia».","Gálatas 5":"Pablo concluye su defensa de la libertad cristiana: no volver a la esclavitud de la ley y andar en el Espíritu, cuyo fruto es amor, gozo y paz.","Gálatas 6":"Pablo anima a ayudarse unos a otros con las cargas y a no cansarse de hacer el bien, porque se cosecha lo que se siembra.","Efesios 2":"Pablo explica que antes estábamos muertos en pecado, pero por gracia fuimos salvados por medio de la fe, no por obras.","Efesios 4":"Inicia la parte práctica de la carta: la unidad de la iglesia, los dones para edificarla y dejar la vieja manera de vivir.","Efesios 5":"Pablo habla de vivir como hijos de luz y de un matrimonio que refleja el amor de Cristo por su iglesia.","Efesios 6":"Instrucciones para hijos, padres y trabajadores, y la imagen de la armadura de Dios, inspirada en los soldados romanos que custodiaban a Pablo.","Filipenses 2":"Pablo pide unidad y humildad, y pone de ejemplo a Cristo, que se humilló hasta la muerte de cruz. Probablemente cita un himno cristiano antiguo.","Filipenses 3":"Pablo cuenta que dejó todo su prestigio religioso por conocer a Cristo y que sigue avanzando hacia la meta.","Filipenses 4":"Escrito desde la cárcel, Pablo agradece una ofrenda de los filipenses. Dice que aprendió a estar contento en toda situación y que todo lo puede en Cristo.","Colosenses 3":"Pablo describe la vida nueva en Cristo: poner la mira en las cosas de arriba y cómo se vive en el hogar, en el matrimonio y en el trabajo.","1 Tesalonicenses 4":"Los tesalonicenses estaban tristes por hermanos que habían muerto. Pablo les asegura que resucitarán cuando Cristo vuelva.","1 Tesalonicenses 5":"Consejos finales de Pablo: estar siempre gozosos, orar sin cesar y dar gracias en todo.","2 Timoteo 3":"Pablo advierte de tiempos difíciles y anima a Timoteo a permanecer en las Escrituras, que son inspiradas por Dios.","Hebreos 11":"La «galería de la fe»: Abel, Noé, Abraham, Moisés y muchos más que confiaron en Dios sin ver todavía la promesa cumplida.","Hebreos 12":"Después de la galería de la fe, el autor anima a correr la carrera con los ojos puestos en Jesús.","Hebreos 13":"Exhortaciones finales: hospitalidad, honrar el matrimonio, vivir sin avaricia y confiar en que Dios no nos dejará.","Santiago 1":"Santiago escribe a creyentes judíos dispersos y probados. Les dice que las pruebas producen paciencia y que hay que ser hacedores de la Palabra.","Santiago 3":"Santiago compara la lengua con un pequeño fuego capaz de incendiar un bosque, y contrasta la sabiduría terrenal con la que viene de arriba.","Santiago 4":"Santiago confronta los pleitos y el orgullo en la iglesia, y advierte contra hacer planes sin contar con Dios.","1 Pedro 2":"Pedro llama a los creyentes «linaje escogido». Escribe a cristianos que vivían como extranjeros y les pide vivir bien entre los que no creen.","1 Pedro 5":"Pedro, ya anciano, aconseja a los pastores cuidar el rebaño y a todos echar su ansiedad sobre Dios y resistir al diablo.","1 Juan 1":"Juan, testigo de la vida de Jesús, escribe que Dios es luz y que si confesamos nuestros pecados Él es fiel para perdonar.","1 Juan 4":"Juan enseña a distinguir espíritus falsos y lo resume todo así: Dios es amor, y quien ama a Dios ama a su hermano.","Apocalipsis 21":"La visión final de Juan: un cielo nuevo y una tierra nueva, donde Dios vive con su pueblo y ya no hay muerte, llanto ni dolor.","Génesis 22":"Dios prueba a Abraham pidiéndole que ofrezca a Isaac, el hijo de la promesa. En el último momento detiene su mano y provee un carnero. Abraham llama al lugar «Jehová proveerá».","Génesis 28":"Jacob huye de su hermano Esaú, a quien engañó. Duerme en el camino con una piedra por almohada, sueña con una escalera al cielo y Dios le promete estar con él a donde vaya.","Génesis 50":"Muere Jacob y los hermanos de José temen que ahora se vengue por haberlo vendido como esclavo. José los perdona: lo que ellos pensaron para mal, Dios lo encaminó a bien.","Éxodo 15":"Israel acaba de cruzar el mar Rojo en seco y ve a los egipcios hundirse. Moisés y Miriam cantan la victoria, y en el desierto Dios se revela como «Jehová tu sanador».","Éxodo 22":"Parte de las leyes que Dios dio en el Sinaí sobre la vida diaria: robos, préstamos y el cuidado de los más vulnerables, como viudas, huérfanos y extranjeros.","Éxodo 23":"Más leyes del pacto: justicia en los juicios, descanso y fiestas. Dios promete enviar un ángel delante de Israel para guiarlo a la tierra prometida.","Éxodo 33":"Después del becerro de oro, Moisés intercede por el pueblo y pide que Dios no los deje. Dios promete: «Mi rostro irá contigo, y te haré descansar».","Levítico 19":"Instrucciones para ser un pueblo santo en lo cotidiano: honrar a los padres, no robar, no mentir, respetar a los ancianos y amar al prójimo como a uno mismo.","Levítico 20":"Dios advierte contra las prácticas de los pueblos cananeos y llama a Israel a ser santo, apartado para Él.","Levítico 27":"Último capítulo de Levítico, sobre votos y ofrendas dedicadas a Dios. Aquí se establece que el diezmo de la cosecha pertenece a Jehová.","Números 6":"Instrucciones para el voto de los nazareos y la bendición sacerdotal que Aarón y sus hijos debían pronunciar sobre Israel: «Jehová te bendiga, y te guarde».","Números 23":"El rey Balac contrata al adivino Balaam para maldecir a Israel, pero Dios solo le permite bendecirlo. Balaam declara que Dios no es hombre para que mienta.","Deuteronomio 6":"El «Shemá», la confesión central de Israel: Jehová es uno, y hay que amarlo con todo el corazón y enseñar sus palabras a los hijos en todo momento.","Deuteronomio 7":"Moisés recuerda a Israel que Dios no los eligió por ser grandes, sino por amor, y que Él es fiel por mil generaciones.","Deuteronomio 8":"Antes de entrar a una tierra próspera, Moisés advierte: no olviden a Dios cuando estén satisfechos, porque Él es quien da el poder para hacer riquezas.","Deuteronomio 10":"Moisés resume lo que Dios pide: temerle, amarle y servirle. Describe a un Dios que hace justicia al huérfano y a la viuda y ama al extranjero.","Deuteronomio 20":"Instrucciones para cuando Israel saliera a la guerra. Antes de la batalla, el sacerdote debía animar al pueblo: Dios pelea por ustedes.","Deuteronomio 28":"Moisés presenta las bendiciones por obedecer a Dios y las consecuencias por desobedecerle, como parte de la renovación del pacto.","Josué 24":"Josué, ya anciano, reúne a todo Israel en Siquem y los reta a decidir a quién servirán. Él declara: «yo y mi casa serviremos a Jehová».","Rut 1":"Noemí pierde a su esposo y a sus hijos en Moab y decide volver a Belén. Su nuera Rut se niega a dejarla: «tu pueblo será mi pueblo, y tu Dios mi Dios».","Rut 3":"Rut busca a Booz, pariente de Noemí, para pedirle que la redima. Booz la reconoce como una mujer virtuosa ante todo el pueblo.","1 Samuel 1":"Ana sufre por no tener hijos y ora con lágrimas en el templo. Dios le da a Samuel, y ella cumple su promesa de dedicarlo a Jehová.","1 Samuel 15":"El rey Saúl desobedece la orden de Dios y se justifica diciendo que guardó animales para sacrificar. Samuel le responde que obedecer es mejor que los sacrificios.","1 Samuel 16":"Dios envía a Samuel a ungir un nuevo rey entre los hijos de Isaí. No escoge al más alto ni al mayor, sino a David, el menor, porque Dios mira el corazón.","1 Samuel 18":"Después de que David vence a Goliat, Jonatán, hijo del rey Saúl, lo quiere como a sí mismo. Es el inicio de una de las amistades más famosas de la Biblia.","1 Reyes 2":"David, a punto de morir, da sus últimas instrucciones a su hijo Salomón: esfuérzate, sé hombre y guarda los caminos de Dios.","2 Crónicas 7":"Salomón dedica el templo y desciende fuego del cielo. Esa noche Dios le promete escuchar y sanar la tierra si su pueblo se humilla y ora.","Esdras 8":"Esdras va a guiar a un grupo de regreso a Jerusalén con muchos tesoros. Le da vergüenza pedir escolta al rey, así que ayuna y ora pidiendo protección a Dios.","Nehemías 8":"Ya reconstruidos los muros, el pueblo se reúne para escuchar a Esdras leer la ley. Lloran al entenderla, pero Nehemías les dice que no se entristezcan: el gozo de Jehová es su fuerza.","Job 12":"Job responde a sus amigos, que lo acusan de haber pecado. Les recuerda que la sabiduría y el poder pertenecen a Dios.","Job 23":"Job busca a Dios y no lo encuentra, pero confía en que Él conoce su camino y que saldrá de la prueba como oro.","Job 31":"La defensa final de Job ante sus amigos: repasa su integridad, incluyendo el pacto que hizo con sus ojos para no mirar con lujuria.","Salmos 1":"El salmo que abre todo el libro presenta dos caminos: el justo que medita en la ley de Dios es como un árbol junto a corrientes de agua.","Salmos 3":"David lo escribió huyendo de su propio hijo Absalón, que le quería quitar el trono. Aun así, puede acostarse y dormir porque Dios lo sostiene.","Salmos 4":"Una oración de la noche. En medio de gente que lo difama, David encuentra paz y se acuesta confiado en Dios.","Salmos 5":"Una oración de la mañana. David presenta su petición temprano y espera la respuesta de Dios.","Salmos 9":"David agradece a Dios por haber vencido a sus enemigos y lo celebra como refugio del pobre y del oprimido.","Salmos 15":"Un salmo que quizá se cantaba al entrar al templo. Pregunta quién puede estar en la presencia de Dios y responde: el que anda en integridad.","Salmos 16":"David expresa su confianza total en Dios. En Hechos 2, Pedro lo cita como profecía de la resurrección de Jesús.","Salmos 19":"David contempla el cielo y ve la gloria de Dios. Luego pasa de la creación a la Palabra: la ley de Jehová es perfecta.","Salmos 20":"Una oración del pueblo por su rey antes de la batalla, pidiendo que Dios le conceda los deseos de su corazón.","Salmos 22":"Empieza con «Dios mío, ¿por qué me has desamparado?», las palabras que Jesús gritó en la cruz. Describe un sufrimiento que termina en alabanza.","Salmos 24":"Probablemente se cantó cuando David subió el arca a Jerusalén. Proclama que la tierra es de Jehová y anuncia la entrada del Rey de gloria.","Salmos 25":"Una oración de David en tiempos de soledad y aflicción, pidiendo perdón, dirección y que Dios no lo abandone.","Salmos 28":"David clama a Dios en peligro y termina agradecido: Jehová es su fortaleza y su escudo.","Salmos 29":"David describe una tormenta como la voz de Dios sobre las aguas y termina con una bendición de paz para su pueblo.","Salmos 30":"Se compuso para la dedicación de la casa de David, después de que Dios lo sanó o lo libró de la muerte. El lloro dura una noche, pero la alegría llega en la mañana.","Salmos 33":"Un canto de alabanza al Dios creador. Declara bienaventurada a la nación cuyo Dios es Jehová.","Salmos 36":"David contrasta la maldad del impío con la misericordia de Dios, que llega hasta los cielos.","Salmos 40":"David esperó con paciencia y Dios lo sacó del pozo y del lodo, y le puso un cántico nuevo en la boca.","Salmos 41":"David, enfermo y traicionado por un amigo cercano, confía en que Dios sostiene al que cuida del pobre.","Salmos 55":"David lo escribe traicionado por un amigo íntimo y desea escapar como paloma. Su conclusión es echar su carga sobre Jehová.","Salmos 56":"David lo escribió cuando los filisteos lo capturaron en Gat. En el día que tiene miedo, decide confiar en Dios.","Salmos 57":"David lo compuso escondido en una cueva mientras el rey Saúl lo perseguía para matarlo. Aun ahí alaba a Dios.","Salmos 63":"David está en el desierto de Judá, quizá huyendo. Tiene sed de Dios como tierra seca y medita en Él aun en su cama.","Salmos 65":"Un canto de gratitud por la cosecha y la lluvia. Dios corona el año con sus bienes.","Salmos 68":"Un canto de victoria que celebra a Dios marchando con su pueblo. Lo llama padre de huérfanos y defensor de viudas.","Salmos 71":"La oración de alguien ya anciano que ha confiado en Dios desde su juventud y le pide no ser abandonado en la vejez.","Salmos 73":"Asaf casi pierde la fe al ver que los malvados prosperan. Cuando entra al santuario entiende su fin y declara que Dios es su porción.","Salmos 89":"Un salmo que celebra el pacto de Dios con David y canta su fidelidad, aunque termina lamentando la crisis de la monarquía.","Salmos 92":"Un cántico para el día de reposo. El justo florecerá como la palmera y dará fruto aun en la vejez.","Salmos 94":"El salmista clama a Dios contra los que oprimen a la viuda y al huérfano, y encuentra consuelo en medio de sus muchas preocupaciones.","Salmos 95":"Una invitación a adorar y arrodillarse ante Dios, con la advertencia de no endurecer el corazón como Israel en el desierto.","Salmos 100":"Un breve salmo de acción de gracias que probablemente se cantaba al entrar por las puertas del templo.","Salmos 107":"Un canto de los que Dios rescató: perdidos en el desierto, presos, enfermos y náufragos. Todos clamaron y Él los libró.","Salmos 112":"Describe la vida del hombre que teme a Dios: generoso, justo, firme y sin miedo a malas noticias.","Salmos 115":"Contrasta a los ídolos, que tienen boca pero no hablan, con el Dios vivo que hace todo lo que quiere.","Salmos 116":"Un hombre que estuvo al borde de la muerte agradece a Dios por haberlo escuchado y librado.","Salmos 118":"El último de los salmos que se cantaban en la Pascua; probablemente Jesús lo cantó en la última cena. Incluye «este es el día que hizo Jehová».","Salmos 128":"Un cántico de peregrinos que describe la bendición del hogar de quien teme a Dios: el trabajo, la esposa y los hijos alrededor de la mesa.","Salmos 133":"Un breve cántico de peregrinos al reunirse en Jerusalén, que celebra lo bueno que es vivir los hermanos en unidad.","Salmos 136":"Un canto que el pueblo respondía a coro: después de cada línea se repite «porque para siempre es su misericordia».","Salmos 138":"David agradece con todo su corazón y confía en que Dios terminará lo que comenzó en él.","Salmos 141":"Una oración de la tarde. David le pide a Dios que ponga guarda a su boca y no lo deje inclinarse al mal.","Salmos 143":"David, perseguido y abatido, pide escuchar la misericordia de Dios en la mañana y que le muestre el camino.","Salmos 145":"Un acróstico de alabanza de David sobre la grandeza, la bondad y la cercanía de Dios con los que le invocan.","Salmos 146":"Inicia la serie de «aleluyas» que cierra el libro. Invita a no confiar en príncipes humanos, sino en Dios, que guarda al huérfano y a la viuda.","Salmos 147":"Alabanza al Dios que reconstruye Jerusalén, sana a los quebrantados y cuenta las estrellas.","Salmos 150":"El último salmo y el gran final del libro: todo lo que respira alabe a Jehová, con todos los instrumentos.","Proverbios 1":"Salomón explica para qué escribió el libro: para dar sabiduría a los jóvenes. Empieza como un padre que aconseja a su hijo.","Proverbios 2":"El padre anima a su hijo a buscar la sabiduría como un tesoro escondido, porque Dios es quien la da.","Proverbios 3":"Consejos de un padre a su hijo: confiar en Dios de todo corazón, honrarlo con los bienes y no despreciar su corrección.","Proverbios 4":"El padre transmite lo que su propio padre le enseñó: adquirir sabiduría y cuidar el corazón por encima de todo.","Proverbios 5":"Una advertencia clara contra el adulterio y una invitación a disfrutar del amor de la propia esposa.","Proverbios 6":"Consejos prácticos: no salir de fiador a la ligera, aprender de la hormiga y huir de la inmoralidad.","Proverbios 9":"La sabiduría y la necedad se presentan como dos mujeres que invitan a su casa. El principio de la sabiduría es el temor de Jehová.","Proverbios 10":"Empiezan los dichos cortos de Salomón: cada versículo es un consejo independiente que compara al sabio con el necio y al justo con el malvado.","Proverbios 11":"Dichos de Salomón sobre la honestidad en los negocios, la humildad y la generosidad.","Proverbios 12":"Dichos de Salomón sobre el trabajo, las palabras y la verdad. Contrasta al que dice verdad con el mentiroso.","Proverbios 13":"Dichos de Salomón sobre el esfuerzo, el dinero bien ganado, las amistades y la disciplina de los hijos.","Proverbios 14":"Dichos de Salomón sobre la paz interior, el trabajo y la justicia que engrandece a una nación.","Proverbios 15":"Dichos de Salomón sobre cómo hablar: la respuesta suave calma el enojo. También habla de pedir consejo antes de hacer planes.","Proverbios 16":"Dichos de Salomón sobre los planes del hombre y el control de Dios, y sobre el orgullo que va antes de la caída.","Proverbios 17":"Dichos de Salomón sobre la amistad leal, el corazón alegre y la paz en el hogar.","Proverbios 18":"Dichos de Salomón sobre las palabras: la vida y la muerte están en poder de la lengua. También habla de la amistad y del matrimonio.","Proverbios 19":"Dichos de Salomón sobre la pereza, la paciencia y la generosidad con el pobre.","Proverbios 20":"Dichos de Salomón sobre el vino, la pereza, la integridad y los chismes.","Proverbios 21":"Dichos de Salomón que recuerdan que Dios dirige el corazón de los reyes y prefiere la justicia a los sacrificios.","Proverbios 22":"Dichos de Salomón sobre el buen nombre, la crianza de los hijos y el peligro de las deudas.","Proverbios 23":"Consejos de los sabios sobre no envidiar a los pecadores, honrar a los padres y la alegría que da un hijo justo.","Proverbios 24":"Más dichos de los sabios: no alegrarse de la caída del enemigo y no ser perezoso.","Proverbios 25":"Proverbios de Salomón que los escribas del rey Ezequías copiaron siglos después. Incluyen tratar bien al enemigo y el dominio propio.","Proverbios 26":"Dichos sobre el necio, el perezoso y el chismoso: sin leña se apaga el fuego.","Proverbios 27":"Dichos sobre la amistad sincera: las heridas del amigo son fieles y el hierro se afila con hierro. También aconseja cuidar los propios bienes.","Proverbios 28":"Dichos sobre la integridad, la justicia y el peligro de la avaricia.","Proverbios 29":"Dichos sobre la corrección de los hijos, el control del enojo y el liderazgo justo.","Proverbios 31":"Consejos que la madre del rey Lemuel le dio a su hijo. Termina con un poema acróstico sobre la mujer virtuosa.","Eclesiastés 5":"Salomón advierte sobre las promesas a la ligera ante Dios y observa que el que ama el dinero nunca se sacia.","Eclesiastés 7":"Reflexiones de Salomón sobre la sabiduría, el enojo y lo que se aprende en los días difíciles.","Eclesiastés 9":"Ante lo breve de la vida, Salomón invita a disfrutar con la persona amada y a hacer todo con todas las fuerzas.","Eclesiastés 11":"Salomón anima a ser generoso y a disfrutar la juventud, recordando que Dios pedirá cuentas.","Eclesiastés 12":"La conclusión del libro: acordarse de Dios en la juventud, antes de la vejez. El resumen de todo es temer a Dios y guardar sus mandamientos.","Cantares 2":"La esposa describe el amor de su amado en la primavera: «Mi amado es mío, y yo suya».","Cantares 8":"El clímax del poema: el amor es fuerte como la muerte y las muchas aguas no lo pueden apagar.","Isaías 7":"El rey Acaz tiene miedo de una alianza enemiga. Isaías le da una señal: una virgen concebirá y dará a luz un hijo llamado Emanuel. Mateo lo aplica al nacimiento de Jesús.","Isaías 9":"En tiempos oscuros de guerra con Asiria, Isaías anuncia que un niño nacerá: Admirable, Consejero, Dios fuerte, Padre eterno, Príncipe de paz.","Isaías 26":"Un cántico que Judá cantaría en el día de la restauración: Dios guarda en completa paz a quien confía en Él.","Isaías 30":"Judá busca ayuda militar en Egipto en lugar de confiar en Dios. Isaías les dice que su fuerza está en la quietud y la confianza.","Isaías 44":"Dios promete derramar su Espíritu sobre su pueblo y se burla de los ídolos fabricados por hombres.","Isaías 46":"Los ídolos de Babilonia tienen que ser cargados por animales, pero Dios carga a su pueblo desde el vientre hasta la vejez.","Isaías 48":"Dios le habla a Israel en el exilio y le explica que lo purificó en el horno de la aflicción.","Isaías 50":"El Siervo de Jehová habla: Dios le dio palabras para animar al cansado, y Él no se resistió al sufrimiento.","Isaías 54":"Después del Siervo sufriente del capítulo 53, Dios promete restaurar a su pueblo como un esposo a su esposa. Ninguna arma forjada contra ella prosperará.","Isaías 55":"Una invitación abierta: vengan a las aguas gratis. Los caminos y pensamientos de Dios son más altos que los nuestros.","Isaías 58":"El pueblo ayunaba y se quejaba de que Dios no lo veía. Dios responde que el ayuno que Él quiere es liberar al oprimido y compartir con el hambriento.","Isaías 59":"Isaías explica que no es que Dios no pueda salvar, sino que el pecado los ha separado de Él.","Isaías 61":"El Mesías anuncia su misión de dar buenas nuevas a los pobres y consolar a los enlutados. Jesús leyó este pasaje en la sinagoga de Nazaret.","Isaías 66":"El capítulo final de Isaías: Dios consolará a Jerusalén como una madre consuela a su hijo.","Jeremías 3":"Dios llama a Israel, que le fue infiel, a volver a Él, y promete darle pastores según su corazón.","Jeremías 17":"Contrasta al que confía en el hombre con el que confía en Dios, que es como árbol plantado junto a aguas. También advierte que el corazón es engañoso.","Jeremías 30":"Parte del «libro de la consolación» de Jeremías: después del exilio, Dios sanará las heridas de su pueblo.","Jeremías 31":"Dios promete un nuevo pacto escrito en el corazón y declara su amor eterno por su pueblo.","Jeremías 32":"Mientras Babilonia sitia Jerusalén, Dios le pide a Jeremías comprar un terreno como señal de esperanza. Jeremías ora: «no hay nada que sea difícil para ti».","Jeremías 33":"Jeremías sigue preso en el patio de la cárcel cuando Dios le dice: «Clama a mí, y yo te responderé».","Ezequiel 36":"A un pueblo en el exilio Dios le promete limpiarlo, devolverlo a su tierra y darle un corazón nuevo y su Espíritu.","Daniel 2":"El rey Nabucodonosor tiene un sueño que nadie puede explicar. Daniel ora con sus amigos, Dios le revela el sueño y él alaba al Dios que cambia los tiempos.","Joel 2":"Después de una plaga de langostas, Joel llama al pueblo a volver a Dios de corazón y promete restaurar lo perdido y derramar el Espíritu.","Amós 5":"Amós denuncia a un pueblo que hacía fiestas religiosas pero oprimía al pobre. Dios pide que corra el juicio como las aguas.","Miqueas 5":"Unos 700 años antes, Miqueas anuncia que el gobernante de Israel nacería en Belén, un pueblo pequeño.","Miqueas 7":"Miqueas lamenta la corrupción de su tiempo, pero termina con esperanza: Dios echará nuestros pecados en lo profundo del mar.","Habacuc 2":"Dios responde a la queja de Habacuc: la visión se cumplirá a su tiempo, aunque parezca tardar. El justo por su fe vivirá.","Habacuc 3":"La oración final de Habacuc: aunque la higuera no florezca y falte todo, él se alegrará en Dios.","Sofonías 3":"Después de anunciar juicio, Sofonías termina describiendo a un Dios que se alegra sobre su pueblo con cánticos.","Zacarías 8":"Dios promete que Jerusalén volverá a estar llena de ancianos y niños jugando, y pide que hablen verdad unos con otros.","Zacarías 13":"Dios promete limpiar a su pueblo y probarlo como se refina el oro en el fuego.","Malaquías 2":"Malaquías confronta a los hombres que abandonaban a la esposa de su juventud: Dios aborrece el divorcio.","Malaquías 3":"El pueblo robaba a Dios en los diezmos. Dios los reta: tráiganlo todo al alfolí y prueben si no abro las ventanas de los cielos.","Mateo 1":"La genealogía de Jesús y el anuncio a José, que pensaba dejar a María en secreto. Un ángel le dice que el niño viene del Espíritu Santo.","Mateo 2":"Unos magos de oriente siguen una estrella para adorar al rey que nació. Herodes, celoso, intenta matarlo y la familia huye a Egipto.","Mateo 3":"Juan el Bautista predica arrepentimiento en el Jordán. Jesús se bautiza y se oye la voz del Padre: «Este es mi Hijo amado».","Mateo 4":"Jesús ayuna 40 días en el desierto y vence las tentaciones del diablo citando las Escrituras. Luego empieza su ministerio en Galilea.","Mateo 8":"Después del Sermón del Monte, Jesús sana a un leproso, al siervo de un centurión y a muchos enfermos.","Mateo 12":"Los fariseos acusan a Jesús de violar el día de reposo y de echar demonios por el poder de Satanás. Jesús advierte que daremos cuenta de cada palabra.","Mateo 13":"Jesús enseña desde una barca con parábolas del reino: el sembrador, la semilla de mostaza, el tesoro escondido y la perla de gran precio.","Mateo 14":"Después de alimentar a cinco mil, Jesús camina sobre el mar en la noche. Pedro camina hacia Él, pero se hunde al dudar.","Mateo 15":"Los fariseos critican que los discípulos no se lavan las manos. Jesús enseña que lo que contamina sale del corazón.","Mateo 16":"En Cesarea de Filipo, Jesús pregunta quién dicen que es Él. Pedro responde: «Tú eres el Cristo, el Hijo del Dios viviente».","Mateo 17":"Después de la transfiguración, los discípulos no pueden sanar a un muchacho. Jesús les habla de la fe como un grano de mostaza.","Mateo 20":"La madre de Jacobo y Juan pide puestos importantes para sus hijos. Jesús enseña que el que quiera ser grande sea servidor.","Mateo 21":"Jesús entra a Jerusalén en un asno, aclamado con «Hosanna». Purifica el templo y los niños lo alaban.","Mateo 23":"Jesús confronta con dureza a los escribas y fariseos por su hipocresía: parecen limpios por fuera pero por dentro están llenos de maldad.","Mateo 24":"En el monte de los Olivos, los discípulos preguntan por el fin. Jesús habla de las señales de su venida y de estar preparados, porque nadie sabe el día.","Mateo 25":"Tres parábolas sobre estar listos para su regreso: las diez vírgenes, los talentos y el juicio, donde lo que se hizo al necesitado se le hizo a Él.","Marcos 1":"Marcos arranca directo: Juan el Bautista, el bautismo de Jesús y sus primeros milagros. Muy de madrugada, Jesús se aparta a orar.","Marcos 2":"Jesús perdona y sana a un paralítico, come con pecadores y enseña que el día de reposo fue hecho para el hombre.","Marcos 4":"Parábolas junto al mar y, al anochecer, una tempestad. Jesús duerme en la barca, se levanta y calma el viento con una palabra.","Marcos 6":"Los discípulos vuelven de su primera misión y Jesús los invita a descansar. Luego alimenta a cinco mil.","Marcos 9":"Un padre desesperado trae a su hijo endemoniado. Jesús le dice que al que cree todo es posible, y él responde: «Creo, ayuda mi incredulidad».","Marcos 11":"Jesús entra a Jerusalén y seca una higuera sin fruto. Usa ese momento para enseñar sobre la fe, la oración y el perdón.","Marcos 12":"En el templo, Jesús ve a una viuda pobre echar dos blancas en la ofrenda y dice que dio más que todos, porque dio todo lo que tenía.","Marcos 16":"Las mujeres encuentran la tumba vacía. Jesús resucitado se aparece y envía a sus discípulos a predicar el evangelio a toda criatura.","Lucas 1":"Un ángel anuncia el nacimiento de Juan el Bautista y luego visita a María. Su prima Elisabet la llama bienaventurada por creer.","Lucas 4":"Jesús vence la tentación y vuelve a Nazaret. En la sinagoga lee Isaías 61 y declara que esa profecía se cumple en Él.","Lucas 5":"Jesús llama a sus primeros discípulos después de una pesca milagrosa y sana a un leproso tocándolo.","Lucas 11":"Los discípulos piden: «Señor, enséñanos a orar». Jesús les da el Padre Nuestro y les enseña a pedir con insistencia.","Lucas 12":"Un hombre le pide a Jesús que reparta una herencia. Él responde con la parábola del rico insensato y enseña a no afanarse.","Lucas 14":"Jesús come en casa de un fariseo y enseña sobre la humildad, invitar a los pobres y calcular el costo de seguirlo.","Lucas 16":"La parábola del mayordomo infiel: el que es fiel en lo poco también lo es en lo mucho. No se puede servir a Dios y a las riquezas.","Lucas 17":"Jesús enseña a perdonar al hermano que se arrepiente, aunque sea siete veces al día, y sana a diez leprosos.","Lucas 18":"La parábola de la viuda insistente enseña a orar siempre y no desmayar.","Lucas 22":"La última cena: Jesús instituye la Santa Cena y luego ora en el monte de los Olivos: «no se haga mi voluntad, sino la tuya».","Lucas 24":"Unas mujeres encuentran la tumba vacía y los ángeles les preguntan: «¿Por qué buscáis entre los muertos al que vive?»","Juan 2":"En una boda en Caná se acaba el vino. Jesús convierte el agua en vino: su primera señal.","Juan 4":"Junto a un pozo, Jesús habla con una mujer samaritana. Los judíos evitaban a los samaritanos, pero Jesús le ofrece agua viva y le enseña a adorar en espíritu y verdad.","Juan 5":"Jesús sana a un hombre que llevaba 38 años paralítico, y enseña que quien cree en Él ya pasó de muerte a vida.","Juan 6":"Después de alimentar a cinco mil, la gente busca a Jesús por el pan. Él les dice: «Yo soy el pan de vida».","Juan 12":"Seis días antes de la Pascua, Jesús entra a Jerusalén y la multitud lo recibe con ramas de palma.","Juan 13":"En la última cena, Jesús lava los pies de sus discípulos, un trabajo de esclavos, y les da un mandamiento nuevo: ámense unos a otros.","Juan 17":"La oración de Jesús antes de ir a la cruz. Ora por sus discípulos y por todos los que creerían después, para que sean uno.","Juan 20":"La resurrección. Tomás no cree hasta ver las heridas, y Jesús le dice: «bienaventurados los que no vieron y creyeron».","Juan 21":"Junto al mar, Jesús resucitado le pregunta tres veces a Pedro, que lo había negado tres veces, «¿me amas?», y lo restaura.","Hechos 3":"Pedro y Juan sanan a un cojo en la puerta del templo. Pedro aprovecha para predicar y llamar al arrepentimiento.","Hechos 4":"Pedro y Juan son arrestados por predicar. Al soltarlos, la iglesia ora pidiendo valor y el lugar tiembla.","Hechos 5":"Los apóstoles son azotados por predicar y responden que es necesario obedecer a Dios antes que a los hombres. Salen gozosos.","Hechos 8":"Felipe le explica Isaías 53 a un funcionario etíope en un carruaje, y este pide ser bautizado ahí mismo.","Hechos 13":"La iglesia de Antioquía ayuna y ora, y el Espíritu Santo aparta a Bernabé y a Saulo para el primer viaje misionero.","Hechos 16":"Pablo y Silas están en la cárcel de Filipos y a medianoche cantan. Un terremoto abre las puertas y el carcelero se convierte con toda su casa.","Hechos 20":"Pablo se despide de los ancianos de Éfeso sabiendo que no lo volverán a ver. Les recuerda cuidar la iglesia y que más bienaventurado es dar que recibir.","Romanos 1":"Pablo se presenta, dice que no se avergüenza del evangelio y explica que la creación muestra el poder de Dios.","Romanos 2":"Pablo muestra que nadie puede juzgar a otros, porque todos, judíos y gentiles, estamos bajo pecado.","Romanos 3":"La conclusión de Pablo: todos pecaron, y todos pueden ser justificados gratuitamente por la gracia de Cristo.","Romanos 10":"Pablo explica qué hacer para ser salvo: confesar con la boca y creer en el corazón. Por eso se necesitan predicadores.","Romanos 11":"Pablo termina su explicación del plan de Dios con Israel y las naciones con una alabanza a la profundidad de la sabiduría de Dios.","Romanos 14":"En Roma, unos cristianos comían de todo y otros no; unos guardaban días especiales y otros no. Pablo pide no juzgarse en esas cosas.","Romanos 15":"Pablo pide aceptarse unos a otros como Cristo nos aceptó y bendice a la iglesia con esperanza.","1 Corintios 1":"La iglesia de Corinto estaba dividida en bandos («yo soy de Pablo», «yo de Apolos»). Pablo les pide unidad.","1 Corintios 2":"Pablo explica que no llegó con palabras impresionantes, sino con el mensaje de la cruz. Lo que Dios preparó, ojo no vio.","1 Corintios 9":"Pablo usa la imagen de los atletas de los juegos ístmicos, famosos en Corinto, para hablar de disciplina y dominio propio.","1 Corintios 11":"En Corinto, algunos comían y se emborrachaban en la cena del Señor mientras otros pasaban hambre. Pablo les recuerda cómo la instituyó Jesús.","1 Corintios 12":"Pablo explica los dones espirituales con la imagen del cuerpo: muchos miembros, cada uno con su función, en un solo cuerpo.","1 Corintios 16":"Pablo organiza una ofrenda para los pobres de Jerusalén y se despide: «Velad, estad firmes en la fe».","2 Corintios 1":"Pablo acaba de pasar por una prueba tan dura en Asia que pensó que moriría. Habla del Dios que consuela para que podamos consolar.","2 Corintios 2":"Pablo pide perdonar a alguien que había sido disciplinado y se arrepintió, y celebra que Dios nos lleva siempre en triunfo.","2 Corintios 3":"Pablo contrasta el antiguo pacto, escrito en piedra, con el nuevo, escrito en el corazón por el Espíritu. Donde está el Espíritu hay libertad.","2 Corintios 7":"Pablo se alegra de que su carta anterior llevó a los corintios a un arrepentimiento verdadero, con una tristeza que es según Dios.","2 Corintios 9":"Pablo anima a los corintios a completar su ofrenda para los pobres de Jerusalén: Dios ama al dador alegre.","2 Corintios 10":"Pablo responde a quienes lo criticaban. Explica que sus armas no son humanas y que lleva cautivo todo pensamiento a Cristo.","Gálatas 2":"Pablo cuenta cómo confrontó a Pedro por apartarse de los cristianos no judíos, y declara: «Con Cristo estoy juntamente crucificado».","Gálatas 3":"Pablo usa el ejemplo de Abraham, que fue justificado por creer, para mostrar que la salvación es por fe. En Cristo todos somos uno.","Gálatas 4":"Pablo explica que Cristo vino «cuando vino el cumplimiento del tiempo» para hacernos hijos de Dios y no esclavos.","Efesios 1":"Pablo abre con una larga alabanza por todas las bendiciones que tenemos en Cristo: elegidos, perdonados y sellados con el Espíritu.","Efesios 3":"Pablo, preso, ora para que los efesios comprendan la anchura y profundidad del amor de Cristo.","Filipenses 1":"Pablo escribe desde prisión sin saber si lo ejecutarán. Aun así dice que para él el vivir es Cristo y el morir es ganancia.","Colosenses 1":"Pablo presenta a Cristo como imagen del Dios invisible y creador de todo, frente a enseñanzas que lo hacían menos.","Colosenses 2":"Pablo advierte contra filosofías y reglas humanas, y anima a seguir arraigados en Cristo y abundando en gratitud.","Colosenses 4":"Saludos finales e instrucciones: perseverar en la oración y hablar siempre con gracia a los de afuera.","2 Tesalonicenses 3":"Algunos en Tesalónica dejaron de trabajar esperando el regreso de Cristo. Pablo es claro: el que no quiera trabajar, tampoco coma.","1 Timoteo 2":"Pablo pide a Timoteo que la iglesia ore por todos, incluyendo a los reyes y gobernantes, para vivir en paz.","1 Timoteo 4":"Timoteo era joven para pastorear y algunos lo menospreciaban. Pablo le dice que sea ejemplo en palabra, conducta, amor y fe.","1 Timoteo 5":"Pablo da instrucciones para cuidar a las viudas y a la propia familia, que es una responsabilidad de fe.","1 Timoteo 6":"Pablo advierte que el amor al dinero es raíz de todos los males y que la piedad con contentamiento es gran ganancia.","2 Timoteo 1":"Pablo, preso en Roma, anima a Timoteo a no avergonzarse y a avivar su don, porque Dios no nos dio espíritu de temor.","2 Timoteo 2":"Pablo anima a Timoteo a ser como un soldado, un atleta y un labrador fiel, y a huir de las pasiones juveniles.","2 Timoteo 4":"Las últimas palabras escritas de Pablo: predica la Palabra. Él ya terminó la carrera y espera la corona.","Tito 2":"Pablo explica cómo deben vivir ancianos, mujeres, jóvenes y trabajadores para que el evangelio sea bien visto en Creta.","Tito 3":"Pablo recuerda que Dios nos salvó por su misericordia y no por nuestras obras, y pide respetar a las autoridades.","Hebreos 1":"La carta abre mostrando que Jesús es superior a los profetas y a los ángeles: es el resplandor de la gloria de Dios.","Hebreos 2":"Jesús se hizo humano y sufrió la tentación para poder ayudar a los que son tentados y librarnos del temor a la muerte.","Hebreos 4":"La Palabra de Dios es viva y eficaz, y en Jesús tenemos un sumo sacerdote que se compadece de nuestras debilidades.","Hebreos 5":"El autor regaña a sus lectores porque deberían ser maestros y todavía necesitan leche espiritual en vez de alimento sólido.","Hebreos 6":"La esperanza en Cristo es como un ancla firme y segura del alma, y Dios no olvida el trabajo hecho por amor.","Hebreos 10":"Jesús fue el sacrificio perfecto una sola vez. Por eso podemos acercarnos a Dios con confianza y no dejar de congregarnos.","Santiago 2":"Santiago confronta el trato preferencial a los ricos en la iglesia y enseña que la fe sin obras está muerta.","Santiago 5":"Santiago advierte a los ricos opresores, pide paciencia hasta la venida del Señor y enseña a orar por los enfermos.","1 Pedro 1":"Pedro escribe a cristianos dispersos y perseguidos. Les recuerda su esperanza viva y los llama a ser santos.","1 Pedro 3":"Pedro da consejos a esposas y esposos, y pide estar siempre preparados para explicar la razón de nuestra esperanza.","1 Pedro 4":"Pedro prepara a los creyentes para la persecución que venía: no se sorprendan del fuego de la prueba y ámense con fervor.","2 Pedro 1":"Pedro, sabiendo que pronto moriría, anima a crecer añadiendo a la fe virtud, conocimiento, dominio propio y amor.","2 Pedro 2":"Una advertencia contra falsos maestros que prometen libertad, pero son esclavos de la corrupción.","2 Pedro 3":"Algunos se burlaban de que Jesús no regresaba. Pedro explica que Dios no tarda: es paciente porque quiere que todos se arrepientan.","1 Juan 3":"Juan se maravilla de que Dios nos llame hijos y enseña que el amor se demuestra con hechos y no solo con palabras.","1 Juan 5":"Juan termina su carta dando seguridad de salvación: quien tiene al Hijo tiene la vida, y nuestra fe vence al mundo.","3 Juan 1":"Una nota personal del anciano Juan a su amigo Gayo. Le desea salud y prosperidad, y se alegra de que ande en la verdad.","Judas 1":"Judas quería escribir sobre la salvación, pero tuvo que advertir contra falsos maestros. Termina alabando al que puede guardarnos sin caída.","Apocalipsis 1":"Juan, exiliado en la isla de Patmos por su fe, ve a Jesús glorificado y recibe la orden de escribir a siete iglesias.","Apocalipsis 14":"En medio de visiones del juicio, una voz del cielo declara bienaventurados a los que mueren en el Señor.","Apocalipsis 22":"El último capítulo de la Biblia: el río de agua de vida, el árbol de la vida y la promesa de Jesús: «vengo presto»."}};
