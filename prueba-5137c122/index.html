const TEMAS = [{"t":"La familia","c":"Familia y relaciones","k":"familia hogar casa parientes familiares jesus familia","d":"Lo que Jesús y las Escrituras enseñan sobre el hogar: Dios en el centro, amor entre sus miembros y responsabilidad unos por otros.","r":"Marcos 3:31-35; Mateo 19:4-6; Juan 19:26-27; Josué 24:15; Salmos 127:1; Efesios 6:1-4; 1 Timoteo 5:8; Hechos 16:31; Salmos 128:3-4"},{"t":"Matrimonio","c":"Familia y relaciones","k":"matrimonio esposo esposa pareja casados casarse marido mujer conyuge","d":"El matrimonio como pacto entre un hombre, una mujer y Dios: unidad, amor que se entrega y respeto mutuo.","r":"Génesis 2:24; Mateo 19:6; Efesios 5:22-33; Hebreos 13:4; Proverbios 18:22; Eclesiastés 4:9-12; 1 Corintios 7:3-5; Colosenses 3:18-19; 1 Pedro 3:7"},{"t":"Hijos y crianza","c":"Familia y relaciones","k":"hijos crianza educar niños criar disciplina hijo hija ninos","d":"Dios ve a los hijos como herencia. Estos pasajes guían a los padres a enseñar, corregir con amor y no provocar a enojo.","r":"Proverbios 22:6; Deuteronomio 6:6-7; Efesios 6:4; Salmos 127:3-5; Colosenses 3:21; Proverbios 29:17; Proverbios 13:24; Marcos 10:14-16; 3 Juan 1:4"},{"t":"Honrar a los padres","c":"Familia y relaciones","k":"padres papa mama madre padre honrar obedecer respeto","d":"El único mandamiento con promesa: honrar a padre y madre en todas las etapas de la vida.","r":"Éxodo 20:12; Efesios 6:1-3; Colosenses 3:20; Proverbios 1:8-9; Proverbios 23:22; Proverbios 23:24-25; Levítico 19:3"},{"t":"Amistad","c":"Familia y relaciones","k":"amigos amistad amigo compañeros companeros","d":"Un buen amigo ama en todo tiempo. La Biblia habla de la lealtad, la sinceridad y de elegir bien con quién andar.","r":"Proverbios 17:17; Proverbios 18:24; Juan 15:13-15; Eclesiastés 4:9-10; Proverbios 27:6; Proverbios 27:9; Proverbios 27:17; Proverbios 13:20; 1 Samuel 18:1"},{"t":"Amor al prójimo","c":"Familia y relaciones","k":"amor amar projimo amarse caridad demas otros","d":"Jesús resumió la ley en amar a Dios y al prójimo. Aquí está cómo se ve ese amor en la práctica.","r":"Mateo 22:37-40; 1 Corintios 13:4-7; Juan 13:34-35; Romanos 13:8-10; 1 Juan 4:7-8; 1 Juan 4:19-21; Gálatas 5:14; 1 Pedro 4:8"},{"t":"Perdonar a otros","c":"Familia y relaciones","k":"perdonar perdon rencor resentimiento ofensa me lastimaron herida","d":"Perdonar no es olvidar ni justificar el daño, es soltarlo en manos de Dios, como Él nos perdonó a nosotros.","r":"Mateo 6:14-15; Mateo 18:21-22; Efesios 4:32; Colosenses 3:13; Marcos 11:25; Lucas 6:37; Lucas 17:3-4; Romanos 12:19-21"},{"t":"Amar a los enemigos","c":"Familia y relaciones","k":"enemigos enemigo odio venganza vengarse","d":"Una de las enseñanzas más radicales de Jesús: bendecir a quien maldice y vencer el mal con el bien.","r":"Mateo 5:43-48; Lucas 6:27-28; Romanos 12:14; Romanos 12:20-21; Proverbios 25:21-22; Proverbios 24:17; Lucas 23:34"},{"t":"Conflictos y reconciliación","c":"Familia y relaciones","k":"conflicto pelea pleito discusion reconciliacion problemas peleas","d":"Cómo buscar la paz, hablar con calma y arreglar las cosas antes de que crezcan.","r":"Mateo 5:23-24; Mateo 18:15; Romanos 12:18; Proverbios 15:1; Proverbios 15:18; Santiago 4:1-2; Hebreos 12:14; Efesios 4:26; 2 Corintios 5:18"},{"t":"Unidad","c":"Familia y relaciones","k":"unidad unidos juntos comunidad hermanos armonia","d":"Qué bueno es que los hermanos habiten juntos en armonía. La unidad es una petición de Jesús mismo.","r":"Salmos 133:1; Juan 17:21; Efesios 4:1-3; 1 Corintios 1:10; Filipenses 2:1-2; Colosenses 3:14; Hechos 2:44-47"},{"t":"Viudas y huérfanos","c":"Familia y relaciones","k":"viuda viudas huerfano huerfanos desamparados abandonados","d":"Dios se presenta como padre de huérfanos y defensor de viudas, y pide a su pueblo cuidarlos.","r":"Santiago 1:27; Salmos 68:5; Salmos 146:9; Deuteronomio 10:18; Isaías 1:17; Juan 14:18; Éxodo 22:22"},{"t":"Vejez","c":"Familia y relaciones","k":"vejez ancianos abuelos abuela abuelo viejos mayores edad","d":"Dios promete sostener hasta las canas y dar fruto aun en la vejez.","r":"Isaías 46:4; Salmos 92:14; Salmos 71:9; Salmos 71:18; Proverbios 16:31; Levítico 19:32; Job 12:12; 2 Corintios 4:16"},{"t":"Jóvenes","c":"Familia y relaciones","k":"jovenes joven juventud adolescentes muchachos","d":"Palabras para quienes empiezan: ser ejemplo, guardar el camino y acordarse de Dios desde ahora.","r":"1 Timoteo 4:12; Eclesiastés 12:1; Salmos 119:9; 2 Timoteo 2:22; Proverbios 20:29; Lamentaciones 3:27; Jeremías 1:7; Eclesiastés 11:9"},{"t":"Soltería","c":"Familia y relaciones","k":"solteria soltero soltera sin pareja novio novia","d":"La soltería también es un don y una etapa con propósito, no una sala de espera.","r":"1 Corintios 7:7-8; 1 Corintios 7:32-35; Mateo 19:12; Isaías 54:5; Salmos 68:6; Filipenses 4:11"},{"t":"Pureza sexual","c":"Familia y relaciones","k":"pureza sexualidad sexo fornicacion lujuria adulterio pornografia","d":"El cuerpo es templo del Espíritu Santo. Pasajes sobre huir de la inmoralidad y honrar el matrimonio.","r":"1 Corintios 6:18-20; 1 Tesalonicenses 4:3-5; Hebreos 13:4; Mateo 5:27-28; Job 31:1; 2 Timoteo 2:22; Proverbios 5:18-19"},{"t":"Divorcio","c":"Familia y relaciones","k":"divorcio separacion separarse divorciarse","d":"Lo que enseñó Jesús sobre el divorcio y el valor que Dios da al pacto matrimonial.","r":"Malaquías 2:16; Mateo 19:3-9; Marcos 10:9; Mateo 5:31-32; 1 Corintios 7:10-11"},{"t":"Amor de pareja","c":"Familia y relaciones","k":"amor romantico enamorados novios pareja cantares","d":"El amor fuerte como la muerte del Cantar de los Cantares y el amor que se entrega de Efesios.","r":"Cantares 8:6-7; Cantares 2:16; 1 Corintios 13:4-8; Proverbios 5:18-19; Efesios 5:25; Eclesiastés 9:9; 1 Juan 4:18"},{"t":"Ansiedad y preocupación","c":"Emociones y luchas","k":"ansiedad preocupacion preocupado estres nervios angustia afan","d":"Dios invita a echar sobre Él toda ansiedad. Su paz guarda el corazón y la mente.","r":"Filipenses 4:6-7; 1 Pedro 5:7; Mateo 6:25-34; Salmos 55:22; Juan 14:27; Isaías 41:10; Salmos 94:19; Proverbios 12:25"},{"t":"Miedo","c":"Emociones y luchas","k":"miedo temor temer panico susto inseguridad","d":"«No temas» es de las frases que más se repiten en la Biblia. Dios está contigo.","r":"Isaías 41:10; Josué 1:9; Salmos 27:1; Salmos 23:4; 2 Timoteo 1:7; Salmos 56:3-4; Isaías 43:1-2; Salmos 46:1-3; Deuteronomio 31:6"},{"t":"Tristeza y depresión","c":"Emociones y luchas","k":"tristeza triste depresion deprimido llorar llanto desesperado","d":"Dios está cerca de los quebrantados de corazón. El llanto dura una noche, pero la alegría viene en la mañana.","r":"Salmos 34:18; Salmos 42:11; Salmos 147:3; Mateo 11:28-30; Salmos 30:5; Isaías 61:3; Salmos 40:1-3; 2 Corintios 4:8-9; Juan 16:33"},{"t":"Soledad","c":"Emociones y luchas","k":"soledad solo sola abandonado aislado nadie","d":"Aunque padre y madre te dejen, Dios no te deja. Él prometió estar contigo todos los días.","r":"Deuteronomio 31:8; Hebreos 13:5; Mateo 28:20; Salmos 27:10; Salmos 68:6; Juan 14:18; Salmos 25:16; Isaías 41:10"},{"t":"Consuelo","c":"Emociones y luchas","k":"consuelo consolar dolor animo","d":"El Dios de toda consolación nos consuela para que también podamos consolar a otros.","r":"2 Corintios 1:3-4; Salmos 23:4; Mateo 5:4; Isaías 66:13; Isaías 40:1; Salmos 119:50; Salmos 94:19; Juan 14:16-18"},{"t":"Duelo y pérdida de un ser querido","c":"Emociones y luchas","k":"duelo muerte murio fallecio perdida luto difunto velorio funeral","d":"Para los días de luto: la esperanza de la resurrección y la promesa de que Dios enjugará toda lágrima.","r":"Juan 11:25-26; 1 Tesalonicenses 4:13-14; Apocalipsis 21:4; Mateo 5:4; Juan 14:1-3; Salmos 34:18; Salmos 116:15; 2 Corintios 5:8"},{"t":"Enojo","c":"Emociones y luchas","k":"enojo ira coraje rabia molesto furia enojado","d":"Airarse no siempre es pecado, pero la Biblia enseña a ser lentos para la ira y a no dejar que se ponga el sol sobre el enojo.","r":"Efesios 4:26-27; Santiago 1:19-20; Proverbios 15:1; Proverbios 29:11; Proverbios 16:32; Eclesiastés 7:9; Colosenses 3:8; Efesios 4:31-32"},{"t":"Culpa y vergüenza","c":"Emociones y luchas","k":"culpa vergüenza verguenza culpable condenacion remordimiento","d":"Ninguna condenación hay para los que están en Cristo. Dios aleja nuestras rebeliones como el oriente del occidente.","r":"Romanos 8:1; 1 Juan 1:9; Salmos 103:12; Isaías 1:18; Salmos 32:5; Miqueas 7:18-19; Hebreos 10:22; 2 Corintios 5:17"},{"t":"Cansancio","c":"Emociones y luchas","k":"cansancio cansado agotado agotamiento fuerzas fatiga","d":"Jesús llama a los trabajados y cargados. Dios da fuerzas al cansado.","r":"Mateo 11:28-30; Isaías 40:29-31; Gálatas 6:9; Salmos 23:2-3; Éxodo 33:14; Jeremías 31:25; 2 Corintios 12:9; Salmos 127:2"},{"t":"Desánimo","c":"Emociones y luchas","k":"desanimo desanimado rendirse frustracion fracaso","d":"Cuando dan ganas de tirar la toalla: el que comenzó la buena obra la terminará.","r":"Josué 1:9; Gálatas 6:9; Salmos 42:5; 2 Corintios 4:16-18; Isaías 40:31; Filipenses 1:6; Salmos 73:26"},{"t":"Paz","c":"Emociones y luchas","k":"paz tranquilidad calma serenidad","d":"Una paz que el mundo no puede dar y que sobrepasa todo entendimiento.","r":"Juan 14:27; Filipenses 4:7; Isaías 26:3; Romanos 5:1; Colosenses 3:15; Salmos 4:8; Salmos 29:11; Números 6:24-26; Juan 16:33"},{"t":"Gozo y alegría","c":"Emociones y luchas","k":"gozo alegria feliz felicidad contento","d":"El gozo del Señor es nuestra fuerza, y no depende de las circunstancias.","r":"Nehemías 8:10; Filipenses 4:4; Salmos 16:11; Juan 15:11; Romanos 15:13; Salmos 118:24; Salmos 30:11; Santiago 1:2-3; 1 Tesalonicenses 5:16-18"},{"t":"Esperanza","c":"Emociones y luchas","k":"esperanza futuro esperar animo","d":"Dios tiene pensamientos de paz y no de mal para darte el fin que esperas.","r":"Jeremías 29:11; Romanos 15:13; Lamentaciones 3:22-24; Romanos 8:28; Hebreos 6:19; Romanos 5:3-5; Isaías 40:31; 1 Pedro 1:3; Salmos 42:11"},{"t":"Identidad y autoestima","c":"Emociones y luchas","k":"autoestima identidad valor quien soy inseguridad aceptacion","d":"Formidables y maravillosas son sus obras. Lo que Dios dice de ti cuando no te sientes suficiente.","r":"Salmos 139:13-14; Génesis 1:27; Efesios 2:10; 1 Pedro 2:9; Juan 1:12; 2 Corintios 5:17; Jeremías 1:5; Romanos 8:37; Gálatas 2:20"},{"t":"Envidia y celos","c":"Emociones y luchas","k":"envidia celos codicia comparacion","d":"La envidia es carcoma de los huesos. Cómo cuidar el corazón de compararse con otros.","r":"Proverbios 14:30; Santiago 3:14-16; Gálatas 5:26; 1 Corintios 13:4; Éxodo 20:17; Salmos 37:1-2; Proverbios 23:17"},{"t":"Tentación","c":"Emociones y luchas","k":"tentacion tentado caer pecar resistir","d":"Dios no deja que seas tentado más de lo que puedes resistir y siempre da la salida.","r":"1 Corintios 10:13; Santiago 1:12-15; Mateo 26:41; Hebreos 2:18; Hebreos 4:15-16; Santiago 4:7; Salmos 119:11; Mateo 6:13"},{"t":"Adicciones y vicios","c":"Libertad de las adicciones","k":"adiccion adicciones vicio vicios alcohol drogas borrachera cigarro esclavitud","d":"Si el Hijo te liberta, serás verdaderamente libre. Palabras de esperanza para romper cadenas.","r":"Juan 8:36; 1 Corintios 10:13; 1 Corintios 6:12; Romanos 6:12-14; Gálatas 5:1; Proverbios 20:1; Efesios 5:18; 2 Pedro 2:19; Tito 2:11-12"},{"t":"Orgullo y humildad","c":"Emociones y luchas","k":"orgullo humildad soberbia arrogancia humilde","d":"Dios resiste a los soberbios y da gracia a los humildes.","r":"Proverbios 16:18; Santiago 4:6; 1 Pedro 5:5-6; Filipenses 2:3-8; Miqueas 6:8; Proverbios 11:2; Mateo 23:12; Lucas 14:11"},{"t":"Sufrimiento","c":"Emociones y luchas","k":"sufrimiento sufrir dolor aflicciones problemas pruebas","d":"Las aflicciones del tiempo presente no se comparan con la gloria que vendrá.","r":"Romanos 8:18; 2 Corintios 4:17; Santiago 1:2-4; 1 Pedro 4:12-13; Romanos 5:3-5; Juan 16:33; Salmos 34:19; 1 Pedro 5:10; Romanos 8:28"},{"t":"Enfermedad y sanidad","c":"Emociones y luchas","k":"enfermedad enfermo sanidad salud sanar curacion hospital doctor","d":"Para orar por un enfermo o cuando la salud falla: Dios es el que sana.","r":"Jeremías 17:14; Santiago 5:14-16; Salmos 103:2-3; Isaías 53:5; Éxodo 15:26; Salmos 41:3; Salmos 147:3; Mateo 8:16-17; 3 Juan 1:2"},{"t":"Dudas","c":"Emociones y luchas","k":"dudas duda incredulidad creer no creo","d":"«Creo, ayuda mi incredulidad.» Dios no rechaza al que duda y busca.","r":"Marcos 9:23-24; Santiago 1:5-6; Juan 20:27-29; Mateo 14:31; Hebreos 11:6; Salmos 73:26"},{"t":"Decisiones y dirección","c":"Emociones y luchas","k":"decision decisiones direccion guia que hago confundido voluntad de dios camino","d":"Fíate de Jehová de todo tu corazón y Él enderezará tus veredas.","r":"Proverbios 3:5-6; Santiago 1:5; Salmos 32:8; Salmos 119:105; Isaías 30:21; Proverbios 16:9; Proverbios 11:14; Jeremías 33:3; Salmos 37:23"},{"t":"Paciencia y espera","c":"Emociones y luchas","k":"paciencia esperar espera tiempo de dios","d":"Todo tiene su tiempo. Los que esperan en Jehová tendrán nuevas fuerzas.","r":"Salmos 27:14; Isaías 40:31; Lamentaciones 3:25-26; Santiago 5:7-8; Romanos 12:12; Salmos 37:7; Eclesiastés 3:1; Habacuc 2:3"},{"t":"Mente y pensamientos","c":"Emociones y luchas","k":"mente pensamientos pensar renovar mente","d":"Todo lo verdadero, honesto y justo, en eso pensad. Cómo renovar la mente.","r":"Filipenses 4:8; Romanos 12:2; 2 Corintios 10:5; Isaías 26:3; Colosenses 3:2; Proverbios 4:23; Salmos 19:14"},{"t":"El corazón","c":"Emociones y luchas","k":"corazon sentimientos interior","d":"Sobre toda cosa guardada, guarda tu corazón. Dios mira el corazón.","r":"Proverbios 4:23; Salmos 51:10; Jeremías 17:9-10; Ezequiel 36:26; Mateo 5:8; 1 Samuel 16:7; Salmos 37:4; Mateo 15:18-19; Salmos 139:23-24"},{"t":"Restauración","c":"Emociones y luchas","k":"restauracion segunda oportunidad volver empezar de nuevo restaurar","d":"Dios restituye los años perdidos. Pasajes para volver a empezar.","r":"Joel 2:25; 1 Pedro 5:10; Jeremías 30:17; Salmos 23:3; Isaías 61:3; Salmos 51:12; Juan 21:15-17; Lamentaciones 3:22-23"},{"t":"Salvación","c":"Dios y salvación","k":"salvacion salvo salvarse como ser salvo evangelio","d":"Cómo ser salvo según la Biblia: por gracia, mediante la fe en Jesucristo.","r":"Juan 3:16; Romanos 3:23; Romanos 6:23; Romanos 5:8; Romanos 10:9-10; Efesios 2:8-9; Hechos 4:12; Juan 14:6; Tito 3:5; 1 Juan 5:11-13"},{"t":"El amor de Dios","c":"Dios y salvación","k":"amor de dios dios me ama amor","d":"Nada nos podrá separar del amor de Dios que es en Cristo Jesús.","r":"Juan 3:16; Romanos 5:8; Romanos 8:38-39; 1 Juan 4:9-10; 1 Juan 3:1; Jeremías 31:3; Sofonías 3:17; Efesios 3:17-19; Lamentaciones 3:22-23"},{"t":"El perdón de Dios","c":"Dios y salvación","k":"perdon de dios dios me perdona pecados perdonados","d":"Si confesamos nuestros pecados, Él es fiel y justo para perdonarnos.","r":"1 Juan 1:9; Salmos 103:10-12; Isaías 43:25; Efesios 1:7; Miqueas 7:18-19; Isaías 1:18; Hechos 3:19; Salmos 32:1-2; Colosenses 1:13-14"},{"t":"Gracia","c":"Dios y salvación","k":"gracia favor inmerecido","d":"Por gracia sois salvos. Su gracia nos basta en la debilidad.","r":"Efesios 2:8-9; 2 Corintios 12:9; Tito 2:11; Romanos 3:23-24; Juan 1:16-17; Hebreos 4:16; Romanos 5:20; 2 Timoteo 1:9"},{"t":"Arrepentimiento","c":"Dios y salvación","k":"arrepentimiento arrepentirse volver a dios convertirse","d":"Hay gozo en el cielo por un pecador que se arrepiente. El camino de regreso siempre está abierto.","r":"Hechos 3:19; 2 Crónicas 7:14; Lucas 15:7; Isaías 55:7; Salmos 51:10-12; 2 Corintios 7:10; Hechos 2:38; Lucas 15:18-24"},{"t":"Nuevo nacimiento","c":"Dios y salvación","k":"nacer de nuevo nueva criatura nuevo nacimiento conversion","d":"Lo que Jesús le explicó a Nicodemo: es necesario nacer de nuevo.","r":"Juan 3:3-7; 2 Corintios 5:17; Juan 1:12-13; Ezequiel 36:26; 1 Pedro 1:23; Tito 3:5; Romanos 6:4"},{"t":"Seguridad de la salvación","c":"Dios y salvación","k":"seguridad salvacion perder la salvacion estoy salvo certeza","d":"Para que sepáis que tenéis vida eterna. Nadie arrebata a las ovejas de la mano del Padre.","r":"Juan 10:28-29; 1 Juan 5:13; Romanos 8:38-39; Juan 5:24; Romanos 8:1; Filipenses 1:6; Efesios 1:13-14; Judas 1:24"},{"t":"El pecado","c":"Dios y salvación","k":"pecado pecar pecados maldad","d":"Todos pecaron, pero la paga del pecado tiene respuesta en el regalo de Dios.","r":"Romanos 3:23; Romanos 6:23; Isaías 59:2; 1 Juan 1:8-9; Santiago 4:17; Gálatas 6:7-8; Romanos 6:12-14; Salmos 51:1-4"},{"t":"Libertad en Cristo","c":"Dios y salvación","k":"libertad libre libres cadenas","d":"Conoceréis la verdad, y la verdad os hará libres.","r":"Juan 8:32; Juan 8:36; Gálatas 5:1; Gálatas 5:13; 2 Corintios 3:17; Romanos 8:2; Lucas 4:18"},{"t":"Vida eterna y el cielo","c":"Dios y salvación","k":"cielo vida eterna paraiso eternidad gloria","d":"En la casa del Padre muchas moradas hay. Lo que Dios ha preparado para los que le aman.","r":"Juan 14:2-3; Juan 3:16; Juan 10:27-28; Apocalipsis 21:1-4; 1 Corintios 2:9; Filipenses 3:20-21; 2 Corintios 5:1; Juan 11:25-26"},{"t":"Fidelidad de Dios","c":"Dios y salvación","k":"fidelidad dios fiel promesas cumple","d":"Si fuéremos infieles, Él permanece fiel. Nuevas son cada mañana sus misericordias.","r":"Lamentaciones 3:22-23; Deuteronomio 7:9; 2 Timoteo 2:13; 1 Corintios 1:9; Hebreos 10:23; 1 Tesalonicenses 5:24; Números 23:19; Salmos 36:5; Salmos 89:1"},{"t":"Poder de Dios","c":"Dios y salvación","k":"poder de dios todopoderoso imposible milagro grandeza","d":"Para Dios no hay nada imposible.","r":"Jeremías 32:17; Lucas 1:37; Mateo 19:26; Efesios 3:20; Salmos 147:5; Isaías 40:28; Salmos 145:3; Romanos 11:33"},{"t":"Dios tiene el control","c":"Dios y salvación","k":"control soberania plan de dios proposito todo obra para bien","d":"A los que aman a Dios, todas las cosas les ayudan a bien.","r":"Romanos 8:28; Proverbios 19:21; Isaías 55:8-9; Isaías 46:10; Proverbios 16:9; Daniel 2:21; Salmos 115:3; Efesios 1:11"},{"t":"Espíritu Santo","c":"Dios y salvación","k":"espiritu santo consolador llenura","d":"El Consolador que Jesús prometió: guía, enseña, da poder y ora por nosotros.","r":"Juan 14:16-17; Juan 14:26; Juan 16:13; Hechos 1:8; Hechos 2:38; Romanos 8:26; 1 Corintios 6:19; Efesios 1:13-14; Gálatas 5:22-23"},{"t":"La segunda venida","c":"Dios y salvación","k":"segunda venida regreso de cristo rapto fin del mundo arrebatamiento","d":"Este mismo Jesús vendrá otra vez. Del día y la hora nadie sabe.","r":"Juan 14:3; Hechos 1:11; 1 Tesalonicenses 4:16-17; Mateo 24:36; Mateo 24:44; Tito 2:13; 2 Pedro 3:9-10; Apocalipsis 1:7; Apocalipsis 22:12"},{"t":"La creación","c":"Dios y salvación","k":"creacion naturaleza creador mundo universo","d":"En el principio creó Dios. Los cielos cuentan su gloria.","r":"Génesis 1:1; Génesis 1:27; Salmos 19:1; Salmos 24:1; Juan 1:3; Colosenses 1:16; Romanos 1:20; Hebreos 11:3; Isaías 40:26"},{"t":"Ángeles","c":"Dios y salvación","k":"angeles angel guarda proteccion","d":"Lo que la Biblia dice de los ángeles: espíritus enviados para servicio.","r":"Salmos 91:11-12; Salmos 34:7; Hebreos 1:14; Hebreos 13:2; Mateo 18:10; Lucas 15:10; Éxodo 23:20"},{"t":"¿Quién es Jesús?","c":"Jesús","k":"jesus cristo quien es jesus hijo de dios mesias señor senor","d":"El Verbo hecho carne: lo que la Biblia dice de la identidad de Jesús.","r":"Juan 1:1; Juan 1:14; Mateo 16:15-16; Juan 14:6; Juan 10:30; Colosenses 1:15-17; Filipenses 2:6-11; Hebreos 1:3; Isaías 9:6"},{"t":"Los «Yo soy» de Jesús","c":"Jesús","k":"yo soy pan de vida luz del mundo buen pastor la vid","d":"Siete declaraciones de Jesús en el Evangelio de Juan sobre quién es Él.","r":"Juan 6:35; Juan 8:12; Juan 10:9; Juan 10:11; Juan 11:25; Juan 14:6; Juan 15:5; Juan 8:58"},{"t":"Nacimiento de Jesús","c":"Jesús","k":"nacimiento de jesus navidad belen virgen emmanuel","d":"Las profecías y el relato del nacimiento del Salvador.","r":"Isaías 7:14; Isaías 9:6; Miqueas 5:2; Mateo 1:21-23; Lucas 2:7; Lucas 2:10-11; Gálatas 4:4-5; Juan 1:14"},{"t":"La cruz","c":"Jesús","k":"cruz muerte de jesus crucifixion sacrificio sangre calvario","d":"Herido fue por nuestras rebeliones. El sentido de la muerte de Cristo.","r":"Isaías 53:5-6; Romanos 5:8; 1 Pedro 2:24; 2 Corintios 5:21; Marcos 10:45; Juan 10:11; 1 Corintios 15:3; Lucas 23:34; Juan 19:30"},{"t":"La resurrección","c":"Jesús","k":"resurreccion resucito tumba vacia pascua","d":"No está aquí, porque ha resucitado. La base de la fe cristiana.","r":"Mateo 28:5-6; Lucas 24:5-6; 1 Corintios 15:3-4; 1 Corintios 15:20-22; 1 Corintios 15:55-57; Romanos 6:9; Romanos 10:9; 1 Pedro 1:3; Juan 11:25"},{"t":"Las Bienaventuranzas","c":"Jesús","k":"bienaventuranzas bienaventurados sermon del monte","d":"El inicio del Sermón del Monte: quiénes son verdaderamente dichosos.","r":"Mateo 5:3-12; Lucas 6:20-23"},{"t":"Sermón del Monte","c":"Jesús","k":"sermon del monte ensenanzas de jesus regla de oro sal luz","d":"Algunas de las enseñanzas más conocidas de Jesús: sal, luz, tesoros y la regla de oro.","r":"Mateo 5:13-16; Mateo 5:44; Mateo 6:19-21; Mateo 6:33; Mateo 7:7-8; Mateo 7:12; Mateo 7:24-25"},{"t":"Parábolas de Jesús","c":"Jesús","k":"parabolas parabola hijo prodigo buen samaritano sembrador oveja perdida talentos","d":"Historias con las que Jesús enseñó sobre el reino: el hijo pródigo, el buen samaritano, el sembrador y más.","r":"Lucas 15:11-24; Lucas 10:30-37; Mateo 13:3-8; Lucas 15:4-7; Mateo 13:31-32; Mateo 13:44-46"},{"t":"Milagros de Jesús","c":"Jesús","k":"milagros milagro sanidades agua en vino lazaro tempestad","d":"Señales que mostraron quién era Jesús: agua en vino, la tempestad, Lázaro y más.","r":"Juan 2:7-11; Marcos 4:39-41; Juan 6:11-13; Mateo 14:25-27; Lucas 5:12-13; Marcos 10:51-52; Juan 11:43-44; Juan 20:30-31"},{"t":"Jesús y los niños","c":"Jesús","k":"jesus y los ninos dejad a los ninos ninos","d":"Dejad a los niños venir a mí. Lo que Jesús dijo de los pequeños.","r":"Mateo 19:14; Marcos 10:14-16; Mateo 18:3-4; Mateo 18:10; Mateo 18:6; Mateo 21:16"},{"t":"Jesús y la oración","c":"Jesús","k":"jesus oracion orar pedir","d":"Cómo enseñó Jesús a orar: en lo secreto, con fe y sin desmayar.","r":"Mateo 6:5-8; Mateo 7:7-11; Marcos 11:24; Juan 14:13-14; Juan 16:24; Mateo 18:19-20; Lucas 18:1; Mateo 26:41"},{"t":"Jesús y el dinero","c":"Jesús","k":"jesus dinero riquezas tesoros dos señores","d":"No podéis servir a Dios y a las riquezas. Lo que Jesús enseñó sobre el dinero.","r":"Mateo 6:19-21; Mateo 6:24; Lucas 12:15; Marcos 10:25; Lucas 16:10-11; Mateo 22:21; Marcos 12:41-44"},{"t":"Jesús y los necesitados","c":"Jesús","k":"pobres necesitados hambre ayudar jesus","d":"«A mí lo hicisteis.» El corazón de Jesús por los pobres y los que sufren.","r":"Mateo 25:35-40; Lucas 4:18; Lucas 14:13-14; Lucas 6:20; Mateo 11:5"},{"t":"Oración","c":"Vida cristiana","k":"oracion orar rezar pedir clamar","d":"Orad sin cesar. Dios escucha y responde a los que le buscan.","r":"Filipenses 4:6; 1 Tesalonicenses 5:17; Jeremías 33:3; Mateo 6:6; Santiago 5:16; 1 Juan 5:14-15; Romanos 12:12; Salmos 145:18"},{"t":"El Padre Nuestro","c":"Vida cristiana","k":"padre nuestro oracion del señor","d":"La oración que Jesús enseñó a sus discípulos.","r":"Mateo 6:9-13; Lucas 11:2-4"},{"t":"Fe","c":"Vida cristiana","k":"fe creer confiar confianza","d":"Es la fe la sustancia de las cosas que se esperan. Sin fe es imposible agradar a Dios.","r":"Hebreos 11:1; Hebreos 11:6; Romanos 10:17; Mateo 17:20; Marcos 11:22-24; 2 Corintios 5:7; Gálatas 2:20; Santiago 2:17"},{"t":"La Palabra de Dios","c":"Vida cristiana","k":"biblia palabra de dios escrituras leer la biblia","d":"Lámpara es a mis pies tu palabra. Lo que la Biblia dice de sí misma.","r":"2 Timoteo 3:16-17; Salmos 119:105; Hebreos 4:12; Josué 1:8; Isaías 40:8; Mateo 4:4; Salmos 119:11; Romanos 15:4; Juan 17:17"},{"t":"Alabanza y adoración","c":"Vida cristiana","k":"alabanza adoracion alabar adorar cantar musica","d":"Todo lo que respira alabe a Jehová. Adorar en espíritu y en verdad.","r":"Salmos 100:1-5; Salmos 150:6; Juan 4:23-24; Salmos 95:6; Salmos 34:1; Salmos 103:1-2; Hebreos 13:15; Colosenses 3:16; Romanos 12:1"},{"t":"Gratitud","c":"Vida cristiana","k":"gratitud gracias agradecer agradecido","d":"Dad gracias en todo, porque esta es la voluntad de Dios.","r":"1 Tesalonicenses 5:18; Salmos 107:1; Salmos 136:1; Salmos 100:4; Colosenses 3:17; Efesios 5:20; Filipenses 4:6; Colosenses 2:7"},{"t":"Obediencia","c":"Vida cristiana","k":"obediencia obedecer mandamientos","d":"Si me amáis, guardad mis mandamientos. Ser hacedores de la Palabra.","r":"Juan 14:15; Juan 14:21; Santiago 1:22; 1 Samuel 15:22; Lucas 11:28; 1 Juan 5:3; Deuteronomio 28:1-2; Hechos 5:29"},{"t":"Bautismo","c":"Vida cristiana","k":"bautismo bautizarse bautizar agua","d":"El mandato de Jesús y el significado del bautismo: morir y resucitar con Cristo.","r":"Mateo 28:19; Mateo 3:16-17; Hechos 2:38; Hechos 8:36-38; Romanos 6:3-4; Colosenses 2:12; Gálatas 3:27; Marcos 16:16"},{"t":"Santa Cena","c":"Vida cristiana","k":"santa cena comunion pan copa","d":"Haced esto en memoria de mí. La mesa del Señor.","r":"Lucas 22:19-20; Mateo 26:26-28; 1 Corintios 11:23-26; 1 Corintios 10:16"},{"t":"Ayuno","c":"Vida cristiana","k":"ayuno ayunar","d":"Cómo enseñó Jesús a ayunar y el ayuno que agrada a Dios.","r":"Mateo 6:16-18; Isaías 58:6-7; Joel 2:12; Mateo 4:2; Esdras 8:23; Hechos 13:2-3"},{"t":"Diezmos y ofrendas","c":"Vida cristiana","k":"diezmo diezmos ofrenda ofrendas dar","d":"Dios ama al dador alegre. Pasajes sobre dar con generosidad.","r":"Malaquías 3:10; Proverbios 3:9-10; 2 Corintios 9:6-7; Lucas 6:38; Levítico 27:30; Marcos 12:41-44; 1 Corintios 16:2; Hechos 20:35"},{"t":"Evangelismo","c":"Vida cristiana","k":"evangelismo evangelizar predicar gran comision compartir la fe misiones","d":"Id y haced discípulos. La misión que Jesús dejó a su iglesia.","r":"Mateo 28:19-20; Marcos 16:15; Hechos 1:8; Romanos 1:16; Romanos 10:14-15; 1 Pedro 3:15; 2 Timoteo 4:2; Mateo 5:16"},{ 19"},{"t":"Generosidad","c":"Vida cristiana","k":"generosidad generoso ayudar compartir dar a los pobres","d":"Más bienaventurado es dar que recibir. El que da al pobre, a Jehová presta.","r":"Hechos 20:35; Proverbios 19:17; Proverbios 11:25; Proverbios 22:9; Lucas 6:38; 2 Corintios 9:7; 1 Juan 3:17-18; Santiago 2:15-17"},{"t":"Ser luz y testimonio","c":"Vida cristiana","k":"testimonio luz ejemplo sal de la tierra","d":"Así alumbre vuestra luz delante de los hombres.","r":"Mateo 5:14-16; Filipenses 2:15; 1 Pedro 2:12; Colosenses 4:5-6; Tito 2:7-8; Hechos 1:8"},{"t":"Juzgar a otros","c":"Vida cristiana","k":"juzgar criticar juicio paja viga","d":"No juzguéis. Mirar primero la viga en el propio ojo.","r":"Mateo 7:1-5; Lucas 6:37; Romanos 14:10-13; Romanos 2:1; Santiago 4:11-12; Juan 8:7; 1 Samuel 16:7"},{"t":"Hipocresía","c":"Vida cristiana","k":"hipocresia hipocrita apariencias doble cara","d":"Jesús fue muy claro con los que aparentan por fuera lo que no son por dentro.","r":"Mateo 23:27-28; Mateo 6:1-4; Mateo 7:3-5; Santiago 1:26; Romanos 12:9; 1 Juan 4:20"},{"t":"Prueba de la fe","c":"Vida cristiana","k":"prueba pruebas fe probada fuego oro","d":"La prueba de la fe produce paciencia. Como oro probado en el fuego.","r":"Santiago 1:2-4; 1 Pedro 1:6-7; Romanos 5:3-5; Job 23:10; Isaías 48:10; Zacarías 13:9; 1 Corintios 10:13"},{"t":"Descanso","c":"Vida cristiana","k":"descanso reposo sabado dia de reposo descansar","d":"Venid a mí y yo os haré descansar. Estad quietos y conoced que yo soy Dios.","r":"Mateo 11:28-30; Éxodo 20:8-10; Marcos 2:27; Marcos 6:31; Hebreos 4:9-10; Salmos 46:10; Isaías 30:15"},{"t":"Líderes y pastores","c":"Vida cristiana","k":"lideres pastores pastor liderazgo ministros","d":"Apacentad la grey de Dios. Ánimo y exhortación para quienes sirven al frente.","r":"1 Pedro 5:2-4; Hechos 20:28; Jeremías 3:15; 1 Timoteo 4:12-16; 2 Timoteo 4:2; Gálatas 6:9; 1 Corintios 15:58"},{"t":"El cuerpo y la salud","c":"Vida cristiana","k":"cuerpo templo salud ejercicio comer","d":"Vuestro cuerpo es templo del Espíritu Santo. Glorificar a Dios en todo.","r":"1 Corintios 6:19-20; 1 Corintios 10:31; 3 Juan 1:2; 1 Timoteo 4:8; Proverbios 17:22; Proverbios 3:7-8"},{"t":"Sabiduría","c":"Carácter","k":"sabiduria sabio inteligencia entendimiento consejo","d":"El principio de la sabiduría es el temor de Jehová. Si alguno tiene falta, pídala a Dios.","r":"Santiago 1:5; Proverbios 9:10; Proverbios 2:6; Proverbios 3:13-14; Proverbios 4:7; Santiago 3:17; Eclesiastés 7:12; Salmos 90:12"},{"t":"Honestidad","c":"Carácter","k":"honestidad verdad mentira mentir sinceridad honesto","d":"Los labios mentirosos son abominación a Jehová. Hablad verdad cada uno con su prójimo.","r":"Proverbios 12:22; Efesios 4:25; Colosenses 3:9; Zacarías 8:16; Proverbios 11:3; Proverbios 10:9; Lucas 16:10; Juan 8:32"},{"t":"Las palabras","c":"Carácter","k":"palabras lengua hablar boca groserias decir","d":"La muerte y la vida están en poder de la lengua.","r":"Proverbios 18:21; Santiago 3:5-10; Efesios 4:29; Proverbios 15:1; Proverbios 16:24; Proverbios 21:23; Colosenses 4:6; Mateo 12:36-37; Salmos 141:3"},{"t":"Chisme","c":"Carácter","k":"chisme chismes murmuracion calumnia hablar mal","d":"Sin leña se apaga el fuego, y donde no hay chismoso, cesa la contienda.","r":"Proverbios 26:20; Proverbios 16:28; Proverbios 11:13; Proverbios 20:19; Éxodo 20:16; Levítico 19:16; Santiago 4:11"},{"t":"Dominio propio","c":"Carácter","k":"dominio propio templanza autocontrol disciplina","d":"Como ciudad derribada es el hombre sin rienda. Dios nos dio espíritu de dominio propio.","r":"Proverbios 25:28; Proverbios 16:32; 2 Timoteo 1:7; Gálatas 5:22-23; 1 Corintios 9:25-27; Tito 2:11-12; 2 Pedro 1:5-6"},{"t":"Valentía","c":"Carácter","k":"valentia valor esfuerzate valiente coraje animo","d":"Esfuérzate y sé valiente. El justo está confiado como un león.","r":"Josué 1:9; Deuteronomio 31:6; Salmos 27:14; 1 Corintios 16:13; Proverbios 28:1; Hechos 4:29; Isaías 41:10"},{"t":"Bondad y ,"c":"Trabajo y dinero","k":"dinero deudas deuda prestamo finanzas ahorro credito","d":"El que toma prestado es siervo del que presta. Principios bíblicos para las finanzas.","r":"Proverbios 22:7; Romanos 13:8; Salmos 37:21; Proverbios 21:5; Proverbios 13:11; Lucas 14:28; 1 Timoteo 6:10; Eclesiastés 5:10; Hebreos 13:5"},{"t":"Provisión de Dios","c":"Trabajo y dinero","k":"provision necesidad escasez dios provee sustento comida","d":"Mi Dios suplirá todo lo que os falta. Buscad primero el reino de Dios.","r":"Filipenses 4:19; Mateo 6:31-33; Salmos 23:1; Salmos 37:25; Salmos 34:10; Lucas 12:24; 2 Corintios 9:8; Mateo 7:11; Génesis 22:14"},{"t":"Negocios y planes","c":"Trabajo y dinero","k":"negocio negocios emprender emprendimiento planes proyectos empresa","d":"Encomienda a Jehová tus obras y tus pensamientos serán afirmados.","r":"Proverbios 16:3; Proverbios 21:5; Proverbios 15:22; Lucas 14:28-30; Santiago 4:13-15; Proverbios 16:9; Proverbios 27:23-24; Deuteronomio 8:18; Proverbios 22:29"},{"t":"Pereza","c":"Trabajo y dinero","k":"pereza flojera perezoso flojo","d":"Ve a la hormiga, oh perezoso. Lo que Proverbios dice de la flojera.","r":"Proverbios 6:6-11; Proverbios 13:4; Proverbios 10:4; Proverbios 20:13; Proverbios 19:15; Proverbios 26:14-15; 2 Tesalonicenses 3:10-12"},{"t":"Éxito y prosperidad","c":"Trabajo y dinero","k":"exito prosperidad prosperar triunfar bendicion","d":"El éxito según Dios: meditar en su Palabra y ser como árbol plantado junto a corrientes de agua.","r":"Josué 1:8; Salmos 1:1-3; Jeremías 17:7-8; Proverbios 16:3; Deuteronomio 8:18; 3 Juan 1:2; Mateo 16:26"},{"t":"Avaricia","c":"Trabajo y dinero","k":"avaricia codicia ambicion amor al dinero","d":"Mirad, y guardaos de toda avaricia: la vida no consiste en la abundancia de bienes.","r":"Lucas 12:15; 1 Timoteo 6:9-10; Hebreos 13:5; Eclesiastés 5:10; Proverbios 28:25; Colosenses 3:5; Mateo 6:24"},{"t":"Pérdida de empleo y crisis","c":"Trabajo y dinero","k":"desempleo sin trabajo despido crisis economica quiebra necesidad","d":"Aunque la higuera no florezca, con todo, yo me alegraré en Jehová.","r":"Habacuc 3:17-18; Filipenses 4:19; Mateo 6:31-34; Salmos 37:25; Salmos 55:22; Deuteronomio 31:8; Isaías 41:10; Romanos 8:28"},{"t":"Autoridades y gobierno","c":"Trabajo y dinero","k":"autoridades gobierno gobernantes leyes impuestos politica","d":"Orar por los que están en eminencia y dar al César lo que es del César.","r":"Romanos 13:1-7; 1 Timoteo 2:1-2; 1 Pedro 2:13-17; Tito 3:1; Mateo 22:21; Proverbios 21:1; Hechos 5:29"},{"t":"Por la nación","c":"Trabajo y dinero","k":"nacion pais mexico patria ciudad orar por el pais","d":"Si se humillare mi pueblo... yo sanaré su tierra.","r":"2 Crónicas 7:14; Salmos 33:12; Proverbios 14:34; Proverbios 29:2; Jeremías 29:7; 1 Timoteo 2:1-2"},{"t":"Protección","c":"Momentos de la vida","k":"proteccion cuidado peligro seguridad guardar salmo 91","d":"El que habita al abrigo del Altísimo. Jehová te guardará de todo mal.","r":"Salmos 91:1-16; Salmos 121:1-8; Proverbios 18:10; Salmos 46:1; Salmos 34:7; 2 Tesalonicenses 3:3; Isaías 54:17"},{"t":"Viajes","c":"Momentos de la vida","k":"viaje viajar carretera camino salida","d":"Jehová guardará tu salida y tu entrada desde ahora y para siempre.","r":"Salmos 121:7-8; Génesis 28:15; Josué 1:9; Éxodo 23:20; Salmos 139:9-10; Proverbios 3:23; Isaías 43:2"},{"t":"Para dormir","c":"Momentos de la vida","k":"dormir noche insomnio sueño descansar","d":"En paz me acostaré, y asimismo dormiré.","r":"Salmos 4:8; Proverbios 3:24; Salmos 3:5; Salmos 127:2; Salmos 121:3-4; Salmos 63:6; Mateo 11:28"},{"t":"Para empezar el día","c":"Momentos de la vida","k":"mañana manana amanecer nuevo dia buenos dias","d":"Este es el día que hizo Jehová. Nuevas son cada mañana sus misericordias.","r":"Salmos 118:24; Lamentaciones 3:22-23; Salmos 5:3; Salmos 143:8; Salmos 90:14; Isaías 50:4; Marcos 1:35"},{"t":"Cumpleaños y bendiciones","c":"Momentos de la vida","k":"cumpleaños cumpleanos bendicion felicitar aniversario","d":"Para bendecir a alguien en su día: Jehová te bendiga y te guarde.","r":"Números 6:24-26; Salmos 20:4; Jeremías 29:11; Salmos 139:16; Salmos 90:12; Proverbios 9:11; Salmos 118:24"},{"t":"Boda","c":"Momentos de la vida","k":"boda casamiento novios ceremonia anillos","d":"Pasajes para una ceremonia o para felicitar a los novios.","r":"Génesis 2:24; Rut 1:16-17; Eclesiastés 4:12; Cantares 8:6-7; 1 Corintios 13:4-8; Colosenses 3:14; Marcos 10:9; Proverbios 18:22"},{"t":"Nacimiento de un bebé","c":"Momentos de la vida","k":"bebe nacimiento embarazo embarazada recien nacido presentacion","d":"Tú formaste mis entrañas. Para celebrar una nueva vida.","r":"Salmos 139:13-16; Salmos 127:3; Jeremías 1:5; 1 Samuel 1:27-28; Salmos 22:9-10; Isaías 44:2"},{"t":"Nuevos comienzos","c":"Momentos de la vida","k":"nuevo comienzo graduacion cambio mudanza nueva etapa empezar","d":"He aquí que yo hago cosa nueva. Para una graduación, mudanza o nueva etapa.","r":"Isaías 43:18-19; 2 Corintios 5:17; Jeremías 29:11; Filipenses 3:13-14; Salmos 37:5; Proverbios 16:3; Eclesiastés 3:1"},{"t":"Año nuevo","c":"Momentos de la vida","k":"año nuevo ano nuevo propositos fin de año","d":"Tú coronas el año de tus bienes. Para cerrar un año y empezar otro.","r":"Salmos 65:11; Isaías 43:18-19; Lamentaciones 3:22-23; Filipenses 3:13-14; Salmos 90:12; Proverbios 16:3; Santiago 4:13-15"},{"t":"Navidad","c":"Momentos de la vida","k":"navidad nochebuena pastores angeles reyes magos","d":"Os ha nacido hoy un Salvador. El relato de la primera Navidad.","r":"Lucas 2:8-14; Isaías 9:6; Mateo 1:23; Mateo 2:1-2; Mateo 2:10-11; Juan 3:16"},{"t":"Semana Santa","c":"Momentos de la vida","k":"semana santa pascua viernes santo domingo de ramos","d":"De la entrada triunfal a la tumba vacía.","r":"Juan 12:12-13; Lucas 22:19-20; Lucas 22:42; Isaías 53:3-7; Juan 19:28-30; Lucas 23:46; Mateo 28:5-7"},{"t":"Injusticias","c":"Momentos de la vida","k":"injusticia maltrato abuso me trataron mal humillacion","d":"Mía es la venganza, dice el Señor. Lo que ustedes pensaron para mal, Dios lo encaminó a bien.","r":"Romanos 12:17-19; Salmos 37:1-7; Génesis 50:20; 1 Pedro 2:19-23; Salmos 9:9; Isaías 54:17; Mateo 5:10-12"},{"t":"Persecución","c":"Momentos de la vida","k":"persecucion perseguidos burlas por la fe rechazo","d":"Bienaventurados los que padecen persecución por causa de la justicia.","r":"Mateo 5:10-12; Juan 15:18-20; 2 Timoteo 3:12; 1 Pedro 4:12-14; Romanos 8:35-37; 2 Corintios 4:8-9; Hechos 5:41"},{"t":"Ante la muerte","c":"Momentos de la vida","k":"miedo a morir morir muerte enfermedad terminal","d":"Para mí el vivir es Cristo, y el morir es ganancia. ¿Dónde está, oh muerte, tu aguijón?","r":"Salmos 23:4; Filipenses 1:21; Juan 11:25-26; 1 Corintios 15:55-57; Hebreos 2:14-15; Romanos 14:8; 2 Corintios 5:8; Apocalipsis 14:13"},{"t":"Propósito y tiempos","c":"Momentos de la vida","k":"proposito tiempo para que estoy aqui sentido de la vida destino","d":"Todo tiene su tiempo debajo del cielo. Fuimos creados para buenas obras.","r":"Eclesiastés 3:1-8; Efesios 2:10; Jeremías 29:11; Salmos 138:8; Salmos 57:2; Proverbios 19:21; Efesios 5:15-16"},{"t":"Promesas de Dios","c":"Promesas","k":"promesas promesa dios promete","d":"Todas las promesas de Dios son en Él Sí, y en Él Amén.","r":"2 Corintios 1:20; Isaías 41:10; Jeremías 29:11; Filipenses 4:19; Josué 1:9; Romanos 8:28; Mateo 28:20; Juan 14:27; Isaías 40:31; Hebreos 13:5"},{"t":"Los versículos más conocidos","c":"Promesas","k":"favoritos conocidos famosos populares mejores versiculos","d":"Los pasajes que más memoriza y comparte la gente.","r":"Juan 3:16; Salmos 23:1-6; Filipenses 4:13; Jeremías 29:11; Proverbios 3:5-6; Romanos 8:28; Isaías 40:31; Mateo 11:28; Josué 1:9; Romanos 12:2"},{"t":"Dios contigo","c":"Promesas","k":"dios conmigo presencia de dios no estoy solo emmanuel","d":"He aquí, yo estoy con vosotros todos los días, hasta el fin del mundo.","r":"Mateo 28:20; Isaías 41:10; Josué 1:9; Salmos 139:7-10; Isaías 43:2; Sofonías 3:17; Deuteronomio 31:8; Salmos 46:1"},{"t":"Fortaleza","c":"Promesas","k":"fuerza fortaleza fuerte debil debilidad","d":"Todo lo puedo en Cristo que me fortalece. Mi poder se perfecciona en la debilidad.","r":"Filipenses 4:13; Isaías 40:29-31; 2 Corintios 12:9-10; Salmos 46:1; Nehemías 8:10; Salmos 28:7; Efesios 6:10; Isaías 41:10"},{"t":"Victoria","c":"Promesas","k":"victoria vencer ganar mas que vencedores triunfo","d":"Somos más que vencedores por medio de Aquel que nos amó.","r":"Romanos 8:37; 1 Corintios 15:57; 1 Juan 5:4; 2 Corintios 2:14; Deuteronomio 20:4; Juan 16:33; Proverbios 21:31"},{"t":"Bendición","c":"Promesas","k":"bendicion bendecir bendecido bendiciones","d":"Bienaventurado el varón que no anduvo en consejo de malos. La bendición de Dios.","r":"Números 6:24-26; Salmos 1:1-3; Proverbios 10:22; Jeremías 17:7-8; Efesios 1:3; Deuteronomio 28:2-6; Malaquías 3:10"},{"t":"El primer paso: pedir ayuda","k":"primer paso pedir ayuda reconocer admitir confesar","d":"Reconocer el problema no es debilidad, es el comienzo de la libertad. Dios no te pide que lo arregles solo: te invita a confesarlo y a buscar ayuda.","p":"Habla hoy con una persona de confianza y dile la verdad. Si necesitas orientación profesional, llama a una línea de ayuda.","r":"Salmos 32:3-5; Proverbios 28:13; Santiago 5:16; Salmos 34:4-6; Mateo 11:28; Eclesiastés 4:9-10; Salmos 121:1-2","c":"Libertad de las adicciones"},{"t":"Alcohol","k":"alcohol tomar beber borrachera cerveza alcoholismo","d":"La Biblia advierte con claridad contra la embriaguez, pero también recuerda que muchos fueron liberados: «y esto erais algunos; mas ya sois lavados».","p":"Identifica el momento del día en que más se te antoja y planea algo distinto para esa hora.","r":"Proverbios 20:1; Proverbios 23:29-35; Efesios 5:18; Romanos 13:13-14; 1 Corintios 6:11; 1 Pedro 5:8; Gálatas 5:1","c":"Libertad de las adicciones"},{"t":"Drogas","k":"drogas marihuana cocaina cristal sustancias consumo","d":"Tu cuerpo es templo del Espíritu Santo y Dios quiere verte libre. Ninguna cadena es más fuerte que su poder para hacerte nueva criatura.","p":"Aléjate hoy de un lugar, contacto o grupo que te acerque al consumo.","r":"1 Corintios 6:19-20; Juan 8:36; Romanos 12:1-2; 2 Corintios 5:17; 1 Corintios 10:13; Salmos 40:1-3; Tito 2:11-12","c":"Libertad de las adicciones"},{"t":"Pornografía","k":"pornografia lujuria pureza sexual mirar imagenes","d":"Job hizo un pacto con sus ojos. La pureza no es solo evitar algo, es llenar la mente de lo que es verdadero y limpio. En Cristo hay perdón y fuerza para empezar de nuevo.","p":"Pon un filtro o límite en tu celular hoy y busca a alguien que te pida cuentas.","r":"Job 31:1; Salmos 101:3; Salmos 119:9-11; 1 Tesalonicenses 4:3-5; 2 Timoteo 2:22; 1 Corintios 6:18; Filipenses 4:8; Hebreos 4:15-16","c":"Libertad de las adicciones"},{"t":"Apuestas y juegos de azar","k":"apuestas juego azar casino loteria dinero facil","d":"La promesa de dinero fácil esconde una trampa. La Biblia enseña que la riqueza ganada con trabajo crece, y que el amor al dinero trae muchos dolores.","p":"Borra hoy las apps de apuestas y entrega el control de tu dinero a alguien de confianza por un tiempo.","r":"1 Timoteo 6:9-10; Proverbios 13:11; Proverbios 28:20; Eclesiastés 5:10; Lucas 12:15; Hebreos 13:5; Filipenses 4:11-12","c":"Libertad de las adicciones"},{"t":"Celular y redes sociales","k":"celular redes sociales pantallas internet videojuegos tiempo","d":"Las pantallas pueden robarnos el tiempo, la paz y la presencia con quienes amamos. La Biblia nos invita a aprovechar bien el tiempo y a buscar el silencio con Dios.","p":"Deja hoy el celular fuera del cuarto una hora antes de dormir.","r":"Efesios 5:15-16; Salmos 90:12; 1 Corintios 6:12; Colosenses 3:2; Filipenses 4:8; Salmos 46:10; Proverbios 4:25","c":"Libertad de las adicciones"},{"t":"Cigarro y tabaco","k":"cigarro tabaco fumar vapeador vape nicotina","d":"Cuidar el cuerpo también es honrar a Dios. Dejar el cigarro cuesta, pero el Espíritu da dominio propio día a día.","p":"Cambia hoy el primer cigarro del día por un vaso de agua y una oración corta.","r":"1 Corintios 6:19-20; 1 Corintios 10:31; 3 Juan 1:2; Romanos 6:12-14; 2 Corintios 7:1; Gálatas 5:22-23","c":"Libertad de las adicciones"},{"t":"Cuando llega la tentación","k":"tentacion antojo ganas craving resistir momento","d":"La tentación llega, pero no tiene la última palabra. Dios promete una salida y Jesús entiende lo que sientes porque también fue tentado.","p":"Ten listo un plan para el momento del antojo: a quién llamar, a dónde ir y qué versículo leer.","r":"1 Corintios 10:13; Santiago 4:7-8; Mateo 26:41; Hebreos 2:18; Salmos 50:15; Proverbios 4:14-15; Romanos 13:14; Salmos 119:11","c":"Libertad de las adicciones"},{"t":"Recaídas: volver a levantarse","k":"recaida volvi a caer fracase otra vez levantarse","d":"Caer otra vez no borra tu camino. El justo cae siete veces y vuelve a levantarse. La misericordia de Dios es nueva cada mañana.","p":"No te escondas: cuéntale hoy a alguien de confianza y vuelve a empezar, un día a la vez.","r":"Proverbios 24:16; Miqueas 7:8; Lamentaciones 3:22-23; 1 Juan 1:9; Salmos 37:23-24; Romanos 8:1; Filipenses 3:13-14; Isaías 43:18-19","c":"Libertad de las adicciones"},{"t":"Para la familia del que sufre","k":"familia de un adicto hijo esposo padre ayudar ser querido","d":"Amar a alguien con una adicción duele. Estos pasajes son para padres, esposas, hijos y amigos que sostienen, esperan y oran sin perder la esperanza.","p":"Busca apoyo también para ti: un grupo, un consejero o tu iglesia. No tienes que cargarlo solo.","r":"Gálatas 6:2; Gálatas 6:9; 1 Corintios 13:7; Lucas 15:20; Salmos 55:22; Romanos 12:12; 1 Pedro 5:7; Santiago 5:16","c":"Libertad de las adicciones"},{"t":"Esperanza y nueva vida","k":"esperanza nueva vida libertad restauracion cambio","d":"Dios no solo quita cadenas: da un corazón nuevo y restituye los años perdidos. Tu historia no termina en tu adicción.","p":"Escribe una meta para los próximos 30 días de tu nueva vida y compártela con alguien.","r":"2 Corintios 5:17; Ezequiel 36:26; Joel 2:25; Isaías 61:1-3; Juan 10:10; Salmos 103:2-5; Filipenses 1:6; Jeremías 29:11","c":"Libertad de las adicciones"}];

const slug = s => norm(s).replace(/ñ/g,'n').replace(/ /g,'-');

  set(k,v){ try{ localStorage.setItem('lampara:'+k, JSON.stringify(v)); }catch(e){} }
};

const SUB={"40.3.31":"Vienen después sus hermanos y su madre, y estando fuera, enviaron a él llamándole.","40.3.32":"Y la gente estaba sentada alrededor de él, y le dijeron: He aquí, tu madre y tus hermanos te buscan fuera.","40.3.33":"Y él les respondió, diciendo: ¿Quién es mi madre y mis hermanos?","40.3.34":"Y mirando a los que estaban sentados alrededor de él, dijo: He aquí mi madre y hermanos.","40.3.35":"Porque cualquiera que haga la voluntad de Dios, éste es mi hermano, y mi hermana, y mi madre.","39.19.4":"Y él respondiendo, les dijo: ¿No habéis leído que el que los hizo al principio, macho y hembra los hizo,","39.19.5":"Y dijo: Por tanto, el hombre dejará padre y madre, y se unirá a su mujer, y serán dos en una carne?","39.19.6":"Así que, no son ya más dos, sino una carne: por tanto, lo que Dios juntó, no lo aparte el hombre.","42.19.26":"Y como vió Jesús a la madre, y al discípulo que él amaba, que estaba presente, dice a su madre: Mujer, he ahí tu hijo.","42.19.27":"Después dice al discípulo: He ahí tu madre. Y desde aquella hora el discípulo la recibió consigo.","5.24.15":"Y si mal os parece servir a Jehová, escogeos hoy a quién sirváis; si a los dioses a quienes sirvieron vuestros padres, cuando estuvieron de esotra parte del río, o a los dioses de los Amorrheos en cuya tierra habitáis: que yo y mi casa serviremos a Jehová.","18.127.1":"Si Jehová no edifica la casa, en vano trabajan los que la edifican: si Jehová no guarda la ciudad, en vano vela la guarda.","48.6.1":"Hijos, obedeced en el Señor a vuestros padres; porque esto es justo.","48.6.2":"Honra a tu padre y a tu madre, que es el primer mandamiento con promesa,","48.6.3":"Para que te vaya bien, y seas de larga vida sobre la tierra.","48.6.4":"Y vosotros, padres, no provoquéis a ira a vuestros hijos; sino criadlos en disciplina y amonestación del Señor.","53.5.8":"Y si alguno no tiene cuidado de los suyos, y mayormente de los de su casa, la fe negó, y es peor que un infiel.","43.16.31":"Y ellos dijeron: Cree en el Señor Jesucristo, y serás salvo tú, y tu casa.","18.128.3":"Tu mujer será como parra que lleva fruto a los lados de tu casa; tus hijos como plantas de olivas alrededor de tu mesa.","18.128.4":"He aquí que así será bendito el hombre que teme a Jehová.","0.2.24":"Por tanto, dejará el hombre a su padre y a su madre, y allegarse ha a su mujer, y serán una sola carne.","48.5.22":"Las casadas estén sujetas a sus propios maridos, como al Señor.","48.5.23":"Porque el marido es cabeza de la mujer, así como Cristo es cabeza de la iglesia; y él es el que da la salud al cuerpo.","48.5.24":"Así que, como la iglesia está sujeta a Cristo, así también las casadas lo estén a sus maridos en todo.","48.5.25":"Maridos, amad a vuestras mujeres, así como Cristo amó a la iglesia, y se entregó a sí mismo por ella,","48.5.26":"Para santificarla limpiándola en el lavacro del agua por la palabra,","48.5.27":"Para presentársela gloriosa para sí, una iglesia que no tuviese mancha ni arruga, ni cosa semejante; sino que fuese santa y sin mancha.","48.5.28":"Así también los maridos deben amar a sus mujeres como a sus mismos cuerpos. El que ama a su mujer, a sí mismo se ama.","48.5.29":"Porque ninguno aborreció jamás a su propia carne, antes la sustenta y regala, como también Cristo a la iglesia;","48.5.30":"Porque somos miembros de su cuerpo, de su carne y de sus huesos.","48.5.31":"Por esto dejará el hombre a su padre y a su madre, y se allegará a su mujer, y serán dos en una carne.","48.5.32":"Este misterio grande es: mas yo digo esto con respecto a Cristo y a la iglesia.","48.5.33":"Pero cada uno de vosotros de por sí, ame también a su mujer como a sí mismo; y la mujer reverencie a su marido.","57.13.4":"Honroso es en todos el matrimonio, y el lecho sin mancilla; mas a los fornicarios y a los adúlteros juzgará Dios.","19.18.22":"El que halló esposa halló el bien, y alcanzó la benevolencia de Jehová.","20.4.9":"Mejores son dos que uno; porque tienen mejor paga de su trabajo.","20.4.10":"Porque si caen, el uno levantará a su compañero: mas ¡ay del solo! que cuando caiga, no habrá segundo que lo levante.","20.4.11":"También si dos duermen juntos, se calentarán; mas ¿cómo se calentará uno solo?","20.4.12":"Y si alguno prevalece contra el uno, dos estarán contra él; y cordón de tres dobleces no presto se rompe.","45.7.3":"El marido pague a la mujer la debida benevolencia; y asimismo la mujer al marido.","45.7.4":"La mujer no tiene potestad de su propio cuerpo, sino el marido: e igualmente tampoco el marido tiene potestad de su propio cuerpo, sino la mujer.","45.7.5":"No os defraudéis el uno al otro, a no ser por algún tiempo de mutuo consentimiento, para ocuparos en la oración: y volved a juntaros en uno, porque no os tiente Satanás a causa de vuestra incontinencia.","50.3.18":"Casadas, estad sujetas a vuestros maridos, como conviene en el Señor.","50.3.19":"Maridos, amad a vuestras mujeres, y no seáis desapacibles con ellas.","59.3.7":"Vosotros maridos, semejantemente, habitad con ellas según ciencia, dando honor a la mujer como a vaso más frágil, y como a herederas juntamente de la gracia de la vida; para que vuestras oraciones no sean impedidas.","19.22.6":"Instruye al niño en su carrera: aun cuando sea viejo no se apartará de ella.","4.6.6":"Y estas palabras que yo te mando hoy, estarán sobre tu corazón:","4.6.7":"Y las repetirás a tus hijos, y hablarás de ellas estando en tu casa, y andando por el camino, y al acostarte, y cuando te levantes:","18.127.3":"He aquí, heredad de Jehová son los hijos: cosa de estima el fruto del vientre.","18.127.4":"Como saetas en mano del valiente, así son los hijos habidos en la juventud.","18.127.5":"Bienaventurado el hombre que hinchió su aljaba de ellos: no será avergonzado cuando hable con los enemigos en la puerta.","50.3.21":"Padres, no irritéis a vuestros hijos, porque no se hagan de poco ánimo.","19.29.17":"Corrige a tu hijo, y te dará descanso, y dará deleite a tu alma.","19.13.24":"El que detiene el castigo, a su hijo aborrece: mas el que lo ama, madruga a castigarlo.","40.10.14":"Y viéndolo Jesús, se enojó, y les dijo: Dejad los niños venir, y no se lo estorbéis; porque de los tales es el reino de Dios.","40.10.15":"De cierto os digo, que el que no reciba el reino de Dios como un niño, no entrará en él.","40.10.16":"Y tomándolos en los brazos, poniendo las manos sobre ellos, los bendecía.","63.1.4":"No tengo yo mayor gozo que éste, el oir que mis hijos andan en la verdad.","1.20.12":"Honra a tu padre y a tu madre, porque tus días se alarguen en la tierra que Jehová tu Dios te da.","50.3.20":"Hijos, obedeced a vuestros padres en todo; porque esto agrada al Señor.","19.1.8":"Oye, hijo mío, la doctrina de tu padre, y no desprecies la dirección de tu madre:","19.1.9":"Porque adorno de gracia serán a tu cabeza, y collares a tu cuello.","19.23.22":"Oye a tu padre, a aquel que te engendró; y cuando tu madre envejezca, no la menosprecies.","19.23.24":"Mucho se alegrará el padre del justo: y el que engendró sabio se gozará con él.","19.23.25":"Alégrense tu padre y tu madre, y gócese la que te engendró.","2.19.3":"Cada uno temerá a su madre y a su padre, y mis sábados guardaréis: Yo Jehová vuestro Dios.","19.17.17":"En todo tiempo ama el amigo; y el hermano para la angustia es nacido.","19.18.24":"El hombre que tiene amigos, ha de mostrarse amigo: y amigo hay más conjunto que el hermano.","42.15.13":"Nadie tiene mayor amor que este, que ponga alguno su vida por sus amigos.","42.15.14":"Vosotros sois mis amigos, si hacéis las cosas que yo os mando.","42.15.15":"Ya no os llamaré siervos, porque el siervo no sabe lo que hace su señor: mas os he llamado amigos, porque todas las cosas que oí de mi Padre, os he hecho notorias.","19.27.6":"Fieles son las heridas del que ama; pero importunos los besos del que aborrece.","19.27.9":"El ungüento y el perfume alegran el corazón: y el amigo al hombre con el cordial consejo.","19.27.17":"Hierro con hierro se aguza; y el hombre aguza el rostro de su amigo.","19.13.20":"El que anda con los sabios, sabio será; mas el que se allega a los necios, será quebrantado.","8.18.1":"Y así que él hubo acabado de hablar con Saúl, el alma de Jonathán fué ligada con la de David, y lo amó Jonathán como a su alma.","39.22.37":"Y Jesús le dijo: Amarás al Señor tu Dios de todo tu corazón, y de toda tu alma, y de toda tu mente.","39.22.38":"Este es el primero y el grande mandamiento.","39.22.39":"Y el segundo es semejante a éste: Amarás a tu prójimo como a ti mismo.","39.22.40":"De estos dos mandamientos depende toda la ley y los profetas.","45.13.4":"La caridad es sufrida, es benigna; la caridad no tiene envidia, la caridad no hace sinrazón, no se ensancha;","45.13.5":"No es injuriosa, no busca lo suyo, no se irrita, no piensa el mal;","45.13.6":"No se huelga de la injusticia, mas se huelga de la verdad;","45.13.7":"Todo lo sufre, todo lo cree, todo lo espera, todo lo soporta.","42.13.34":"Un mandamiento nuevo os doy: Que os améis unos a otros: como os he amado, que también os améis los unos a los otros.","42.13.35":"En esto conocerán todos que sois mis discípulos, si tenéis amor los unos con los otros.","44.13.8":"No debáis a nadie nada, sino amaros unos a otros; porque el que ama al prójimo, cumplió la ley.","44.13.9":"Porque: No adulterarás; no matarás; no hurtarás; no dirás falso testimonio; no codiciarás; y si hay algún otro mandamiento, en esta sentencia se comprende sumariamente: Amarás a tu prójimo como a ti mismo.","44.13.10":"La caridad no hace mal al prójimo: así que, el cumplimento de la ley es la caridad.","61.4.7":"Carísimos, amémonos unos a otros; porque el amor es de Dios. Cualquiera que ama, es nacido de Dios, y conoce a Dios.","61.4.8":"El que no ama, no conoce a Dios; porque Dios es amor.","61.4.19":"Nosotros le amamos a él, porque él nos amó primero.","61.4.20":"Si alguno dice, Yo amo a Dios, y aborrece a su hermano, es mentiroso. Porque el que no ama a su hermano al cual ha visto, ¿cómo puede amar a Dios a quien no ha visto?","61.4.21":"Y nosotros tenemos este mandamiento de él: Que el que ama a Dios, ame también a su hermano.","47.5.14":"Porque toda la ley en aquesta sola palabra se cumple: Amarás a tu prójimo como a ti mismo.","59.4.8":"Y sobre todo, tened entre vosotros ferviente caridad; porque la caridad cubrirá multitud de pecados.","39.6.14":"Porque si perdonáis a los hombres sus ofensas, os perdonará también a vosotros vuestro Padre celestial.","39.6.15":"Mas si no perdonáis a los hombres sus ofensas, tampoco vuestro Padre os perdonará vuestras ofensas.","39.18.21":"Entonces Pedro, llegándose a él, dijo: Señor, ¿cuántas veces perdonaré a mi hermano que peque contra mí? ¿hasta siete?","39.18.22":"Jesús le dice: No te digo hasta siete, mas aun hasta setenta veces siete.","48.4.32":"Antes sed los unos con los otros benignos, misericordiosos, perdonándoos los unos a los otros, como también Dios os perdonó en Cristo.","50.3.13":"Sufriéndoos los unos a los otros, y perdonándoos los unos a los otros si alguno tiene queja del otro: de la manera que Cristo os perdonó, así también hacedlo vosotros.","40.11.25":"Y cuando estéis orando, perdonad, si tenéis algo contra alguno, para que vuestro Padre que está en los cielos os perdone también a vosotros vuestras ofensas.","41.6.37":"No juzguéis, y no seréis juzgados: no condenéis, y no seréis condenados: perdonad, y seréis perdonados.","41.17.3":"Mirad por vosotros: si peca contra ti tu hermano, repréndele; y si se arrepintiere, perdónale.","41.17.4":"Y si siete veces al día peca contra ti, y siete veces al día se vuelve a ti, diciendo, pésame, perdónale.","44.12.19":"No os venguéis vosotros mismos, amados míos; antes dad lugar a la ira; porque escrito está: Mía es la venganza: yo pagaré, dice el Señor.","44.12.20":"Así que, si tu enemigo tiene hambre, dale de comer; si tiene sed, dale de beber: que haciendo esto, ascuas de fuego amontonas sobre su cabeza.","44.12.21":"No seas vencido de lo malo; mas vence con el bien el mal.","39.5.43":"Oísteis que fué dicho: Amarás a tu prójimo, y aborrecerás a tu enemigo.","39.5.44":"Mas yo os digo: Amad a vuestros enemigos, bendecid a los que os maldicen, haced bien a los que os aborrecen, y orad por los que os ultrajan y os persiguen;","39.5.45":"Para que seáis hijos de vuestro Padre que está en los cielos: que hace que su sol salga sobre malos y buenos, y llueve sobre justos e injustos.","39.5.46":"Porque si amáis a los que os aman, ¿qué recompensa tendréis? ¿no hacen también lo mismo los publicanos?","39.5.47":"Y si abrazáis a vuestros hermanos solamente, ¿qué hacéis de más? ¿no hacen también así los Gentiles?","39.5.48":"Sed, pues, vosotros perfectos, como vuestro Padre que está en los cielos es perfecto.","41.6.27":"Mas a vosotros los que oís, digo: Amad a vuestros enemigos, haced bien a los que os aborrecen;","41.6.28":"Bendecid a los que os maldicen, y orad por los que os calumnian.","44.12.14":"Bendecid a los que os persiguen: bendecid, y no maldigáis.","19.25.21":"Si el que te aborrece tenga hambre, dale de comer pan; y si tiene sed, dale de beber agua:","19.25.22":"Porque ascuas allegas sobre su cabeza, y Jehová te lo pagará.","19.24.17":"Cuando caiga tu enemigo, no te huelgues; y cuando tropiece, no se alegre tu corazón:","41.23.34":"Y Jesús decía: Padre, perdónalos, porque no saben lo que hacen. Y partiendo sus vestidos, echaron suertes.","39.5.23":"Por tanto, si traes tu presente al altar, y allí te acuerdas de que tu hermano tiene algo contra ti,","39.5.24":"Deja allí tu presente delante del altar, y vete, vuelve primero en amistad con tu hermano, y entonces ven y ofrece tu presente.","39.18.15":"Por tanto, si tu hermano peca contra ti, ve, y redargúyele entre ti y él solo: si te oye, has ganado a tu hermano.","44.12.18":"Si se puede hacer, cuanto está en vosotros, tened paz con todos los hombres.","19.15.1":"La blanda respuesta quita la ira: mas la palabra áspera hace subir el furor.","19.15.18":"El hombre iracundo mueve contiendas: mas el que tarde se enoja, apaciguará la rencilla.","58.4.1":"¿De dónde vienen las guerras y los pleitos entre vosotros? ¿No son de vuestras concupiscencias, las cuales combaten en vuestros miembros?","58.4.2":"Codiciáis, y no tenéis; matáis y ardéis de envidia, y no podéis alcanzar; combatís y guerreáis, y no tenéis lo que deseáis, porque no pedís.","57.12.14":"Seguid la paz con todos, y la santidad, sin la cual nadie verá al Señor:","48.4.26":"Airaos, y no pequéis; no se ponga el sol sobre vuestro enojo;","46.5.18":"Y todo esto es de Dios, el cual nos reconcilió a sí por Cristo; y nos dió el ministerio de la reconciliación.","18.133.1":"Mirad cuán bueno y cuán delicioso es habitar los hermanos igualmente en uno!","42.17.21":"Para que todos sean una cosa; como tú, oh Padre, en mí, y yo en ti, que también ellos sean en nosotros una cosa: para que el mundo crea que tú me enviaste.","48.4.1":"Yo pues, preso en el Señor, os ruego que andéis como es digno de la vocación con que sois llamados;","48.4.2":"Con toda humildad y mansedumbre, con paciencia soportando los unos a los otros en amor;","48.4.3":"Solícitos a guardar la unidad del Espíritu en el vínculo de la paz.","45.1.10":"Os ruego pues, hermanos, por el nombre de nuestro Señor Jesucristo, que habléis todos una misma cosa, y que no haya entre vosotros disensiones, antes seáis perfectamente unidos en una misma mente y en un mismo parecer.","49.2.1":"Por tanto, si hay alguna consolación en Cristo; si algún refrigerio de amor; si alguna comunión del Espíritu; si algunas entrañas y misericordias,","49.2.2":"Cumplid mi gozo; que sintáis lo mismo, teniendo el mismo amor, unánimes, sintiendo una misma cosa.","50.3.14":"Y sobre todas estas cosas vestíos de caridad, la cual es el vínculo de la perfección.","43.2.44":"Y todos los que creían estaban juntos; y tenían todas las cosas comunes;","43.2.45":"Y vendían las posesiones, y las haciendas, y repartíanlas a todos, como cada uno había menester.","43.2.46":"Y perseverando unánimes cada día en el templo, y partiendo el pan en las casas, comían juntos con alegría y con sencillez de corazón,","43.2.47":"Alabando a Dios, y teniendo gracia con todo el pueblo. Y el Señor añadía cada día a la iglesia los que habían de ser salvos.","58.1.27":"La religión pura y sin mácula delante de Dios y Padre es esta: Visitar los huérfanos y las viudas en sus tribulaciones, y guardarse sin mancha de este mundo.","18.68.5":"Padre de huérfanos y defensor de viudas, es Dios en la morada de su santuario:","18.146.9":"Jehová guarda a los extranjeros; al huérfano y a la viuda levanta; y el camino de los impíos trastorna.","4.10.18":"Que hace justicia al huérfano y a la viuda; que ama también al extranjero dándole pan y vestido.","22.1.17":"Aprended a hacer bien; buscad juicio, restituid al agraviado, oid en derecho al huérfano, amparad a la viuda.","42.14.18":"No os dejaré huérfanos: vendré a vosotros.","1.22.22":"A ninguna viuda ni huérfano afligiréis.","22.46.4":"Y hasta la vejez yo mismo, y hasta las canas os soportaré yo: yo hice, yo llevaré, yo soportaré y guardaré.","18.92.14":"Aun en la vejez fructificarán; estarán vigorosos y verdes;","18.71.9":"No me deseches en el tiempo de la vejez; cuando mi fuerza se acabe, no me desampares.","18.71.18":"Y aun hasta la vejez y las canas; oh Dios, no me desampares, hasta que denuncie tu brazo a la posteridad, tus valentías a todos los que han de venir.","19.16.31":"Corona de honra es la vejez, que se hallará en el camino de justicia.","2.19.32":"Delante de las canas te levantarás, y honrarás el rostro del anciano, y de tu Dios tendrás temor: Yo Jehová.","17.12.12":"En los viejos está la ciencia, y en la larga edad la inteligencia.","46.4.16":"Por tanto, no desmayamos: antes aunque este nuestro hombre exterior se va desgastando, pero el interior se renueva de día en día.","53.4.12":"Ninguno tenga en poco tu juventud; pero sé ejemplo de los fieles en palabra, en conversación, en caridad, en espíritu, en fe, en limpieza.","20.12.1":"Y acuérdate de tu Criador en los días de tu juventud, antes que vengan los malos días, y lleguen los años, de los cuales digas, No tengo en ellos contentamiento;","18.119.9":"Beth ¿Con qué limpiará el joven su camino? Con guardar tu palabra.","54.2.22":"Huye también los deseos juveniles; y sigue la justicia, la fe, la caridad, la paz, con los que invocan al Señor de puro corazón.","19.20.29":"La gloria de los jóvenes es su fortaleza, y la hermosura de los viejos la vejez.","24.3.27":"Bueno es al hombre, si lleva el yugo desde su mocedad.","23.1.7":"Y me dijo Jehová: No digas, soy niño; porque a todo lo que te enviaré irás tú, y dirás todo lo que te mandaré.","20.11.9":"Alégrate, mancebo, en tu mocedad, y tome placer tu corazón en los días de tu juventud; y anda en los caminos de tu corazón, y en la vista de tus ojos: mas sabe, que sobre todas estas cosas te traerá Dios a juicio.","45.7.7":"Quisiera más bien que todos los hombres fuesen como yo: pero cada uno tiene su propio don de Dios; uno a la verdad así, y otro así.","45.7.8":"Digo pues a los solteros y a las viudas, que bueno les es si se quedan como yo.","45.7.32":"Quisiera, pues, que estuvieseis sin congoja. El soltero tiene cuidado de las cosas que son del Señor, cómo ha de agradar al Señor:","45.7.33":"Pero el que se casó tiene cuidado de las cosas que son del mundo, cómo ha de agradar a su mujer.","45.7.34":"Hay asimismo diferencia entre la casada y la doncella: la doncella tiene cuidado de las cosas del Señor, para ser santa así en el cuerpo como en el espíritu: mas la casada tiene cuidado de las cosas del mundo, cómo ha de agradar a su marido.","45.7.35":"Pero Esto digo para vuestro provecho; no para echaros lazo, sino para lo honesto y decente, y para que sin impedimento os lleguéis al Señor.","39.19.12":"Porque hay eunucos que nacieron así del vientre de su madre; y hay eunucos, que son hechos eunucos por los hombres; y hay eunucos que se hicieron a sí mismos eunucos por causa del reino de los cielos; el que pueda ser capaz de eso, séalo.","22.54.5":"Porque tu marido es tu Hacedor; Jehová de los ejércitos es su nombre: y tu redentor, el Santo de Israel; Dios de toda la tierra será llamado.","18.68.6":"El Dios que hace habitar en familia los solos; que saca a los aprisionados con grillos: mas los rebeldes habitan en sequedad.","49.4.11":"No lo digo en razón de indigencia, pues he aprendido a contentarme con lo que tengo.","45.6.18":"Huid la fornicación. Cualquier otro pecado que el hombre haga, fuera del cuerpo es; mas el que fornica, contra su propio cuerpo peca.","45.6.19":"¿O ignoráis que vuestro cuerpo es templo del Espíritu Santo, el cual está en vosotros, el cual tenéis de Dios, y que no sois vuestros?","45.6.20":"Porque comprados sois por precio: glorificad pues a Dios en vuestro cuerpo y en vuestro espíritu, los cuales son de Dios.","51.4.3":"Porque la voluntad de Dios es vuestra santificación: que os apartéis de fornicación;","51.4.4":"Que cada uno de vosotros sepa tener su vaso en santificación y honor;","51.4.5":"No con afecto de concupiscencia, como los Gentiles que no conocen a Dios:","39.5.27":"Oísteis que fué dicho: No adulterarás:","39.5.28":"Mas yo os digo, que cualquiera que mira a una mujer para codiciarla, ya adulteró con ella en su corazón.","17.31.1":"Hice pacto con mis ojos: ¿cómo pues había yo de pensar en virgen?","19.5.18":"Sea bendito tu manantial; y alégrate con la mujer de tu mocedad.","19.5.19":"Como cierva amada y graciosa corza, sus pechos te satisfagan en todo tiempo; y en su amor recréate siempre.","38.2.16":"Porque Jehová Dios de Israel ha dicho que él aborrece que sea repudiada; y cubra la iniquidad con su vestido, dijo Jehová de los ejércitos. Guardaos pues en vuestros espíritus, y no seáis desleales.","39.19.3":"Entonces se llegaron a él los Fariseos, tentándole, y diciéndole: ¿Es lícito al hombre repudiar a su mujer por cualquiera causa?","39.19.7":"Le dicen: ¿Por qué, pues, Moisés mandó dar carta de divorcio, y repudiarla?","39.19.8":"Les dice: Por la dureza de vuestro corazón Moisés os permitió repudiar a vuestras mujeres: mas al principio no fué así.","39.19.9":"Y yo os digo que cualquiera que repudie a su mujer, si no es por causa de fornicación, y se casa con otra, adultera: y el que se case con la repudiada, adultera.","40.10.9":"Pues lo que Dios juntó, no lo aparte el hombre.","39.5.31":"También fué dicho: Cualquiera que repudie a su mujer, déle carta de divorcio:","39.5.32":"Mas yo os digo, que el que repudie a su mujer, fuera de causa de fornicación, hace que ella adultere; y el que se case con la repudiada, comete adulterio.","45.7.10":"Mas a los que están juntos en matrimonio, denuncio, no yo, sino el Señor: Que la mujer no se aparte del marido;","45.7.11":"Y si se aparta, que se quede sin casar, o reconcíliese con su marido; y que el marido no despida a su mujer.","21.8.6":"Ponme como un sello sobre tu corazón, como una marca sobre tu brazo: porque fuerte es como la muerte el amor; duro como el sepulcro el celo: sus brasas, brasas de fuego, fuerte llama.","21.8.7":"Las muchas aguas no podrán apagar el amor, ni lo ahogarán los ríos. Si diese el hombre toda la hacienda de su casa por este amor, de cierto lo menospreciaran.","21.2.16":"Mi amado es mío, y yo suya; él apacienta entre lirios.","45.13.8":"La caridad nunca deja de ser: mas las profecías se han de acabar, y cesarán las lenguas, y la ciencia ha de ser quitada;","20.9.9":"Goza de la vida con la mujer que amas, todos los días de la vida de tu vanidad, que te son dados debajo del sol, todos los días de tu vanidad; porque esta es tu parte en la vida, y en tu trabajo con que te afanas debajo del sol.","61.4.18":"En amor no hay temor; mas el perfecto amor echa fuera el temor: porque el temor tiene pena. De donde el que teme, no está perfecto en el amor.","49.4.6":"Por nada estéis afanosos; sino sean notorias vuestras peticiones delante de Dios en toda oración y ruego, con hacimiento de gracias.","49.4.7":"Y la paz de Dios, que sobrepuja todo entendimiento, guardará vuestros corazones y vuestros entendimientos en Cristo Jesús.","59.5.7":"Echando toda vuestra solicitud en él, porque él tiene cuidado de vosotros.","39.6.25":"Por tanto os digo: No os congojéis por vuestra vida, qué habéis de comer, o qué habéis de beber; ni por vuestro cuerpo, qué habéis de vestir: ¿no es la vida más que el alimento, y el cuerpo que el vestido?","39.6.26":"Mirad las aves del cielo, que no siembran, ni siegan, ni allegan en alfolíes; y vuestro Padre celestial las alimenta. ¿No sois vosotros mucho mejores que ellas?","39.6.27":"Mas ¿quién de vosotros podrá, congojándose, añadir a su estatura un codo?","39.6.28":"Y por el vestido ¿por qué os congojáis? Reparad los lirios del campo, cómo crecen; no trabajan ni hilan;","39.6.29":"Mas os digo, que ni aun Salomón con toda su gloria fué vestido así como uno de ellos.","39.6.30":"Y si la hierba del campo que hoy es, y mañana es echada en el horno, Dios la viste así, ¿no hará mucho más a vosotros, hombres de poca fe?","39.6.31":"No os congojéis pues, diciendo: ¿Qué comeremos, o qué beberemos, o con qué nos cubriremos?","39.6.32":"Porque los Gentiles buscan todas estas cosas: que vuestro Padre celestial sabe que de todas estas cosas habéis menester.","39.6.33":"Mas buscad primeramente el reino de Dios y su justicia, y todas estas cosas os serán añadidas.","39.6.34":"Así que, no os congojéis por el día de mañana; que el día de mañana traerá su fatiga: basta al día su afán.","18.55.22":"Echa sobre Jehová tu carga, y él te sustentará; no dejará para siempre caído al justo.","42.14.27":"La paz os dejo, mi paz os doy: no como el mundo la da, yo os la doy. No se turbe vuestro corazón, ni tenga miedo.","22.41.10":"No temas, que yo soy contigo; no desmayes, que yo soy tu Dios que te esfuerzo: siempre te ayudaré, siempre te sustentaré con la diestra de mi justicia.","18.94.19":"En la multitud de mis pensamientos dentro de mí, tus consolaciones alegraban mi alma.","19.12.25":"El cuidado congojoso en el corazón del hombre, lo abate; mas la buena palabra lo alegra.","5.1.9":"Mira que te mando que te esfuerces y seas valiente: no temas ni desmayes, porque Jehová tu Dios será contigo en donde quiera que vayas.","18.27.1":"Jehová es mi luz y mi salvación: ¿de quién temeré? Jehová es la fortaleza de mi vida: ¿de quién he de atemorizarme?","18.23.4":"Aunque ande en valle de sombra de muerte, no temeré mal alguno; porque tú estarás conmigo: tu vara y tu cayado me infundirán aliento.","54.1.7":"Porque no nos ha dado Dios el espíritu de temor, sino el de fortaleza, y de amor, y de templanza.","18.56.3":"En el día que temo, yo en ti confío.","18.56.4":"En Dios alabaré su palabra: en Dios he confiado, no temeré lo que la carne me haga.","22.43.1":"Y ahora, así dice Jehová Criador tuyo, oh Jacob, y Formador tuyo, oh Israel: No temas, porque yo te redimí; te puse nombre, mío eres tú.","22.43.2":"Cuando pasares por las aguas, yo seré contigo; y por los ríos, no te anegarán. Cuando pasares por el fuego, no te quemarás, ni la llama arderá en ti.","18.46.1":"Dios es nuestro amparo y fortaleza, nuestro pronto auxilio en las tribulaciones.","18.46.2":"Por tanto no temeremos aunque la tierra sea removida; aunque se traspasen los montes al corazón de la mar.","18.46.3":"Bramarán, se turbarán sus aguas; temblarán los montes a causa de su braveza. (Selah.)","4.31.6":"Esforzaos y cobrad ánimo; no temáis, ni tengáis miedo de ellos: que Jehová tu Dios es el que va contigo: no te dejará ni te desamparará.","18.34.18":"Cercano está Jehová a los quebrantados de corazón; y salvará a los contritos de espíritu.","18.42.11":"¿Por qué te abates, oh alma mía, y por qué te conturbas en mí? Espera a Dios; porque aun le tengo de alabar; es él salvamento delante de mí, y el Dios mío.","18.147.3":"El sana a los quebrantados de corazón, y liga sus heridas.","39.11.28":"Venid a mí todos los que estáis trabajados y cargados, que yo os haré descansar.","39.11.29":"Llevad mi yugo sobre vosotros, y aprended de mí, que soy manso y humilde de corazón; y hallaréis descanso para vuestras almas.","39.11.30":"Porque mi yugo es fácil, y ligera mi carga.","18.30.5":"Porque un momento será su furor; mas en su voluntad está la vida: por la tarde durará el lloro, y a la mañana vendrá la alegría.","22.61.3":"A ordenar a Sión a los enlutados, para darles gloria en lugar de ceniza, óleo de gozo en lugar del luto, manto de alegría en lugar del espíritu angustiado; y serán llamados árboles de justicia, plantío de Jehová, para gloria suya.","18.40.1":"Resignadamente esperé a Jehová, e se inclinó a mí, y oyó mi clamor.","18.40.2":"E me hizo sacar de un lago de miseria, del lodo cenagoso; y puso mis pies sobre peña, y enderezó mis pasos.","18.40.3":"Puso luego en mi boca canción nueva, alabanza a nuestro Dios. Verán esto muchos, y temerán, y esperarán en Jehová.","46.4.8":"Estando atribulados en todo, mas no angustiados; en apuros, mas no desesperamos;","46.4.9":"Perseguidos, mas no desamparados; abatidos, mas no perecemos;","42.16.33":"Estas cosas os he hablado, para que en mí tengáis paz. En el mundo tendréis aflicción: mas confiad, yo he vencido al mundo.","4.31.8":"Y Jehová es el que va delante de ti; él será contigo, no te dejará, ni te desamparará; no temas, ni te intimides.","57.13.5":"Sean las costumbres vuestras sin avaricia; contentos de lo presente; porque él dijo: No te desampararé, ni te dejaré.","39.28.20":"Enseñándoles que guarden todas las cosas que os he mandado: y he aquí, yo estoy con vosotros todos los días, hasta el fin del mundo. Amén.","18.27.10":"Aunque mi padre y mi madre me dejaran, Jehová con todo me recogerá.","18.25.16":"Mírame, y ten misericordia de mí; porque estoy solo y afligido.","46.1.3":"Bendito sea el Dios y Padre del Señor Jesucristo, el Padre de misericordias, y el Dios de toda consolación,","46.1.4":"El cual nos consuela en todas nuestras tribulaciones, para que podamos también nosotros consolar a los que están en cualquiera angustia, con la consolación con que nosotros somos consolados de Dios.","39.5.4":"Bienaventurados los que lloran: porque ellos recibirán consolación.","22.66.13":"Como aquel a quien consuela su madre, así os consolaré yo a vosotros, y en Jerusalem tomaréis consuelo.","22.40.1":"Consolaos, consolaos, pueblo mío, dice vuestro Dios.","18.119.50":"Esta es mi consuelo en mi aflicción: porque tu dicho me ha vivificado.","42.14.16":"Y yo rogaré al Padre, y os dará otro Consolador, para que esté con vosotros para siempre:","42.14.17":"Al Espíritu de verdad, al cual el mundo no puede recibir, porque no le ve, ni le conoce: mas vosotros le conocéis; porque está con vosotros, y será en vosotros.","42.11.25":"Le dice Jesús: Yo soy la resurrección y la vida: el que cree en mí, aunque esté muerto, vivirá.","42.11.26":"Y todo aquel que vive y cree en mí, no morirá eternamente. ¿Crees esto?","51.4.13":"Tampoco, hermanos, queremos que ignoréis acerca de los que duermen, que no os entristezcáis como los otros que no tienen esperanza.","51.4.14":"Porque si creemos que Jesús murió y resucitó, así también traerá Dios con él a los que durmieron en Jesús.","65.21.4":"Y limpiará Dios toda lágrima de los ojos de ellos; y la muerte no será más; y no habrá más llanto, ni clamor, ni dolor: porque las primeras cosas son pasadas.","42.14.1":"No se turbe vuestro corazón: creéis en Dios, creed también en mí.","42.14.2":"En la casa de mi Padre muchas moradas hay: de otra manera os lo hubiera dicho: voy, pues, a preparar lugar para vosotros.","42.14.3":"Y si me voy, y os apareja lugar, vendré otra vez, y os tomaré a mí mismo: para que donde yo estoy, vosotros también estéis.","18.116.15":"Estimada es en los ojos de Jehová la muerte de sus santos.","46.5.8":"Mas confiamos, y más quisiéramos partir del cuerpo, y estar presentes al Señor.","48.4.27":"Ni deis lugar al diablo.","58.1.19":"Por esto, mis amados hermanos, todo hombre sea pronto para oir, tardío para hablar, tardío para airarse:","58.1.20":"Porque la ira del hombre no obra la justicia de Dios.","19.29.11":"El necio da suelta a todo su espíritu; mas el sabio al fin le sosiega.","19.16.32":"Mejor es el que tarde se aira que el fuerte; y el que se enseñorea de su espíritu, que el que toma una ciudad.","20.7.9":"No te apresures en tu espíritu a enojarte: porque la ira en el seno de los necios reposa.","50.3.8":"Mas ahora, dejad también vosotros todas estas cosas: ira, enojo, malicia, maledicencia, torpes palabras de vuestra boca.","48.4.31":"Toda amargura, y enojo, e ira, y voces, y maledicencia sea quitada de vosotros, y toda malicia:","44.8.1":"Ahora pues, ninguna condenación hay para los que están en Cristo Jesús, los que no andan conforme a la carne, mas conforme al espíritu.","61.1.9":"Si confesamos nuestros pecados, él es fiel y justo para que nos perdone nuestros pecados, y nos limpie de toda maldad.","18.103.12":"Cuanto está lejos el oriente del occidente, hizo alejar de nosotros nuestras rebeliones.","22.1.18":"Venid luego, dirá Jehová, y estemos a cuenta: si vuestros pecados son como la grana, como la nieve serán emblanquecidos: si son rojos como el carmesí, vendrán a ser como blanca lana.","18.32.5":"Mi pecado te declaré, y no encubrí mi iniquidad. Confesaré, dije, contra mí mis rebeliones a Jehová; y tú perdonaste la maldad de mi pecado. (Selah.)","32.7.18":"¿Qué Dios como tú, que perdonas la maldad, y olvidas el pecado del resto de su heredad? No retuvo para siempre su enojo, porque es amador de misericordia.","32.7.19":"El tornará, él tendrá misericordia de nosotros; él sujetará nuestras iniquidades, y echará en los profundos de la mar todos nuestros pecados.","57.10.22":"Lleguémonos con corazón verdadero, en plena certidumbre de fe, purificados los corazones de mala conciencia, y lavados los cuerpos con agua limpia.","46.5.17":"De modo que si alguno está en Cristo, nueva criatura es: las cosas viejas pasaron; he aquí todas son hechas nuevas.","22.40.29":"El
