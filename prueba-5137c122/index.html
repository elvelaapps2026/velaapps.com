 da esfuerzo al cansado, y multiplica las fuerzas al que no tiene ningunas.","22.40.30":"Los mancebos se fatigan y se cansan, los mozos flaquean y caen:","22.40.31":"Mas los que esperan a Jehová tendrán nuevas fuerzas; levantarán las alas como águilas; correrán, y no se cansarán; caminarán, y no se fatigarán.","47.6.9":"No nos cansemos, pues, de hacer bien; que a su tiempo segaremos, si no hemos desmayado.","18.23.2":"En lugares de delicados pastos me hará yacer: junto a aguas de reposo me pastoreará.","18.23.3":"Confortará mi alma; me guiará por sendas de justicia por amor de su nombre.","1.33.14":"Y él dijo: Mi rostro irá contigo, y te haré descansar.","23.31.25":"Porque habré embriagado el alma cansada, y henchido toda alma entristecida.","46.12.9":"Y me ha dicho: Bástate mi gracia; porque mi potencia en la flaqueza se perfecciona. Por tanto, de buena gana me gloriaré más bien en mis flaquezas, porque habite en mí la potencia de Cristo.","18.127.2":"Por demás os es el madrugar a levantaros, el veniros tarde a reposar, el comer pan de dolores: pues que a su amado dará Dios el sueño.","18.42.5":"¿Por qué te abates, oh alma mía, y te conturbas en mí? Espera a Dios; porque aun le tengo de alabar por las saludes de su presencia.","46.4.17":"Porque lo que al presente es momentáneo y leve de nuestra tribulación, nos obra un sobremanera alto y eterno peso de gloria;","46.4.18":"No mirando nosotros a las cosas que se ven, sino a las que no se ven: porque las cosas que se ven son temporales, mas las que no se ven son eternas.","49.1.6":"Estando confiado de esto, que el que comenzó en vosotros la buena obra, la perfeccionará hasta el día de Jesucristo;","18.73.26":"Mi carne y mi corazón desfallecen: mas la roca de mi corazón y mi porción es Dios para siempre.","22.26.3":"Tú le guardarás en completa paz, cuyo pensamiento en ti persevera; porque en ti se ha confiado.","44.5.1":"Justificados pues por la fe, tenemos paz para con Dios por medio de nuestro Señor Jesucristo:","50.3.15":"Y la paz de Dios gobierne en vuestros corazones, a la cual asimismo sois llamados en un cuerpo; y sed agradecidos.","18.4.8":"En paz me acostaré, y asimismo dormiré; porque solo tú, Jehová, me harás estar confiado.","18.29.11":"Jehová dará fortaleza a su pueblo: Jehová bendecirá a su pueblo en paz.","3.6.24":"Jehová te bendiga, y te guarde:","3.6.25":"Haga resplandecer Jehová su rostro sobre ti, y haya de ti misericordia:","3.6.26":"Jehová alce a ti su rostro, y ponga en ti paz.","15.8.10":"Les dijo luego: Id, comed grosuras, y bebed vino dulce, y enviad porciones a los que no tienen prevenido; porque día santo es a nuestro Señor: y no os entristezcáis, porque el gozo de Jehová es vuestra fortaleza.","49.4.4":"Gozaos en el Señor siempre: otra vez digo: Que os gocéis.","18.16.11":"Me mostrarás la senda de la vida: hartura de alegrías hay con tu rostro; deleites en tu diestra para siempre.","42.15.11":"Estas cosas os he hablado, para que mi gozo esté en vosotros, y vuestro gozo sea cumplido.","44.15.13":"Y el Dios de esperanza os llene de todo gozo y paz creyendo, para que abundéis en esperanza por la virtud del Espíritu Santo.","18.118.24":"Este es el día que hizo Jehová: nos gozaremos y alegraremos en él.","18.30.11":"Has tornado mi endecha en baile; desataste mi saco, y ceñísteme de alegría.","58.1.2":"Hermanos míos, tened por sumo gozo cuando caigáis en diversas tentaciones;","58.1.3":"Sabiendo que la prueba de vuestra fe obra paciencia.","51.5.16":"Estad siempre gozosos.","51.5.17":"Orad sin cesar.","51.5.18":"Dad gracias en todo; porque esta es la voluntad de Dios para con vosotros en Cristo Jesús.","23.29.11":"Porque yo sé los pensamientos que tengo acerca de vosotros, dice Jehová, pensamientos de paz, y no de mal, para daros el fin que esperáis.","24.3.22":"Es por la misericordia de Jehová que no somos consumidos, porque nunca decayeron sus misericordias.","24.3.23":"Nuevas son cada mañana; grande es tu fidelidad.","24.3.24":"Mi parte es Jehová, dijo mi alma; por tanto en él esperaré.","44.8.28":"Y sabemos que a los que a Dios aman, todas las cosas les ayudan a bien, es a saber, a los que conforme al propósito son llamados.","57.6.19":"La cual tenemos como segura y firme ancla del alma, y que entra hasta dentro del velo;","44.5.3":"Y no sólo esto, mas aun nos gloriamos en las tribulaciones, sabiendo que la tribulación produce paciencia;","44.5.4":"Y la paciencia, prueba; y la prueba, esperanza;","44.5.5":"Y la esperanza no avergüenza; porque el amor de Dios está derramado en nuestros corazones por el Espíritu Santo que nos es dado.","59.1.3":"Bendito el Dios y Padre de nuestro Señor Jesucristo, que según su grande misericordia nos ha regenerado en esperanza viva, por la resurrección de Jesucristo de los muertos,","18.139.13":"Porque tú poseiste mis riñones; cubrísteme en el vientre de mi madre.","18.139.14":"Te alabaré; porque formidables, maravillosas son tus obras: estoy maravillado, y mi alma lo conoce mucho.","0.1.27":"Y crió Dios al hombre a su imagen, a imagen de Dios lo crió; varón y hembra los crió.","48.2.10":"Porque somos hechura suya, criados en Cristo Jesús para buenas obras, las cuales Dios preparó para que anduviésemos en ellas.","59.2.9":"Mas vosotros sois linaje escogido, real sacerdocio, gente santa, pueblo adquirido, para que anunciéis las virtudes de aquel que os ha llamado de las tinieblas a su luz admirable:","42.1.12":"Mas a todos los que le recibieron, les dió potestad de ser hechos hijos de Dios, a los que creen en su nombre:","23.1.5":"Antes que te formase en el vientre te conocí, y antes que salieses de la matriz te santifiqué, te dí por profeta a las gentes.","44.8.37":"Antes, en todas estas cosas hacemos más que vencer por medio de aquel que nos amó.","47.2.20":"Con Cristo estoy juntamente crucificado, y vivo, no ya yo, mas vive Cristo en mí: y lo que ahora vivo en la carne, lo vivo en la fe del Hijo de Dios, el cual me amó, y se entregó a sí mismo por mí.","19.14.30":"El corazón apacible es vida de las carnes: mas la envidia, pudrimiento de huesos.","58.3.14":"Pero si tenéis envidia amarga y contención en vuestros corazones, no os gloriéis, ni seáis mentirosos contra la verdad:","58.3.15":"Que esta sabiduría no es la que desciende de lo alto, sino terrena, animal, diabólica.","58.3.16":"Porque donde hay envidia y contención, allí hay perturbación y toda obra perversa.","47.5.26":"No seamos codiciosos de vana gloria, irritando los unos a los otros, envidiándose los unos a los otros.","1.20.17":"No codiciarás la casa de tu prójimo, no codiciarás la mujer de tu prójimo, ni su siervo, ni su criada, ni su buey, ni su asno, ni cosa alguna de tu prójimo.","18.37.1":"No te impacientes a causa de los malignos, ni tengas envidia de los que hacen iniquidad.","18.37.2":"Porque como hierba serán presto cortados, y decaerán como verdor de renuevo.","19.23.17":"No tenga tu corazón envidia de los pecadores, antes persevera en el temor de Jehová todo tiempo:","45.10.13":"No os ha tomado tentación, sino humana: mas fiel es Dios, que no os dejará ser tentados más de lo que podéis llevar; antes dará también juntamente con la tentación la salida, para que podáis aguantar.","58.1.12":"Bienaventurado el varón que sufre la tentación; porque cuando sea probado, recibirá la corona de vida, que Dios ha prometido a los que le aman.","58.1.13":"Cuando alguno es tentado, no diga que es tentado de Dios: porque Dios no puede ser tentado de los malos, ni él tienta a alguno:","58.1.14":"Sino que cada uno es tentado, cuando de su propia concupiscencia es atraído, y cebado.","58.1.15":"Y la concupiscencia, después que ha concebido, pare el pecado: y el pecado, siendo cumplido, engendra muerte.","39.26.41":"Velad y orad, para que no entréis en tentación: el espíritu a la verdad está presto, mas la carne enferma.","57.2.18":"Porque en cuanto él mismo padeció siendo tentado, es poderoso para socorrer a los que son tentados.","57.4.15":"Porque no tenemos un Pontífice que no se pueda compadecer de nuestras flaquezas; mas tentado en todo según nuestra semejanza, pero sin pecado.","57.4.16":"Lleguémonos pues confiadamente al trono de la gracia, para alcanzar misericordia, y hallar gracia para el oportuno socorro.","58.4.7":"Someteos pues a Dios; resistid al diablo, y de vosotros huirá.","18.119.11":"En mi corazón he guardado tus dichos, para no pecar contra ti.","39.6.13":"Y no nos metas en tentación, mas líbranos del mal: porque tuyo es el reino, y el poder, y la gloria, por todos los siglos. Amén.","42.8.36":"Así que, si el Hijo os liberta, seréis verdaderamente libres.","45.6.12":"Todas las cosas me son lícitas, mas no todas convienen: todas las cosas me son lícitas, mas yo no me meteré debajo de potestad de nada.","44.6.12":"No reine, pues, el pecado en vuestro cuerpo mortal, para que le obedezcáis en sus concupiscencias;","44.6.13":"Ni tampoco presentéis vuestros miembros al pecado por instrumentos de iniquidad; antes presentaos a Dios como vivos de los muertos, y vuestros miembros a Dios por instrumentos de justicia.","44.6.14":"Porque el pecado no se enseñoreará de vosotros; pues no estáis bajo la ley, sino bajo la gracia.","47.5.1":"Estad, pues, firmes en la libertad con que Cristo nos hizo libres, y no volváis otra vez a ser presos en el yugo de servidumbre.","19.20.1":"El vino es escarnecedor, la cerveza alborotadora; y cualquiera que por ello yerre, no será sabio.","48.5.18":"Y no os embriaguéis de vino, en lo cual hay disolución; mas sed llenos de Espíritu;","60.2.19":"Prometiéndoles libertad, siendo ellos mismos siervos de corrupción. Porque el que es de alguno vencido, es sujeto a la servidumbre del que lo venció.","55.2.11":"Porque la gracia de Dios que trae salvación a todos los hombres, se manifestó,","55.2.12":"Enseñándonos que, renunciando a la impiedad y a los deseos mundanos, vivamos en este siglo templada, y justa, y píamente,","19.16.18":"Antes del quebrantamiento es la soberbia; y antes de la caída la altivez de espíritu.","58.4.6":"Mas él da mayor gracia. Por esto dice: Dios resiste a los soberbios, y da gracia a los humildes.","59.5.5":"Igualmente, mancebos, sed sujetos a los ancianos; y todos sumisos unos a otros, revestíos de humildad; porque Dios resiste a los soberbios, y da gracia a los humildes.","59.5.6":"Humillaos pues bajo la poderosa mano de Dios, para que él os ensalce cuando sea tiempo;","49.2.3":"Nada hagáis por contienda o por vanagloria; antes bien en humildad, estimándoos inferiores los unos a los otros:","49.2.4":"No mirando cada uno a lo suyo propio, sino cada cual también a lo de los otros.","49.2.5":"Haya, pues, en vosotros este sentir que hubo también en Cristo Jesús:","49.2.6":"El cual, siendo en forma de Dios, no tuvo por usurpación ser igual a Dios:","49.2.7":"Sin embargo, se anonadó a sí mismo, tomando forma de siervo, hecho semejante a los hombres;","49.2.8":"Y hallado en la condición como hombre, se humilló a sí mismo, hecho obediente hasta la muerte, y muerte de cruz.","32.6.8":"Oh hombre, él te ha declarado qué sea lo bueno, y qué pida de ti Jehová: solamente hacer juicio, y amar misericordia, y humillarte para andar con tu Dios.","19.11.2":"Cuando viene la soberbia, viene también la deshonra: mas con los humildes es la sabiduría.","39.23.12":"Porque el que se ensalce, será humillado; y el que se humille, será ensalzado.","41.14.11":"Porque cualquiera que se ensalza, será humillado; y el que se humilla, será ensalzado.","44.8.18":"Porque tengo por cierto que lo que en este tiempo se padece, no es de comparar con la gloria venidera que en nosotros ha de ser manifestada.","58.1.4":"Mas tenga la paciencia perfecta su obra, para que seáis perfectos y cabales, sin faltar en alguna cosa.","59.4.12":"Carísimos, no os maravilléis cuando sois examinados por fuego, lo cual se hace para vuestra prueba, como si alguna cosa peregrina os aconteciese;","59.4.13":"Antes bien gozaos en que sois participantes de las aflicciones de Cristo; para que también en la revelación de su gloria os gocéis en triunfo.","18.34.19":"Muchos son los males del justo; mas de todos ellos lo librará Jehová.","59.5.10":"Mas el Dios de toda gracia, que nos ha llamado a su gloria eterna por Jesucristo, después que hayáis un poco de tiempo padecido, él mismo os perfeccione, confirme, corrobore y establezca.","23.17.14":"Sáname, oh Jehová, y seré sano; sálvame, y seré salvo: porque tú eres mi alabanza.","58.5.14":"¿Está alguno enfermo entre vosotros? llame a los ancianos de la iglesia, y oren por él, ungiéndole con aceite en el nombre del Señor.","58.5.15":"Y la oración de fe salvará al enfermo, y el Señor lo levantará; y si está en pecados, le serán perdonados.","58.5.16":"Confesaos vuestras faltas unos a otros, y rogad los unos por los otros, para que seáis sanos; la oración del justo, obrando eficazmente, puede mucho.","18.103.2":"Bendice, alma mía a Jehová, y no olvides ninguno de sus beneficios.","18.103.3":"El es quien perdona todas tus iniquidades, el que sana todas tus dolencias;","22.53.5":"Mas él herido fué por nuestras rebeliones, molido por nuestros pecados: el castigo de nuestra paz sobre él; y por su llaga fuimos nosotros curados.","1.15.26":"Y dijo: Si oyes atentamente la voz de Jehová tu Dios, e haces lo recto delante de sus ojos, y das oído a sus mandamientos, y guardas todos sus estatutos, ninguna enfermedad de las que envié a los Egipcios te enviaré a ti; porque yo soy Jehová tu Sanador.","18.41.3":"Jehová lo sustentará sobre el lecho del dolor: mullirás toda su cama en su enfermedad.","39.8.16":"Y como fué ya tarde, trajeron a él muchos endemoniados; y echó los demonios con la palabra, y sanó a todos los enfermos;","39.8.17":"Para que se cumpliese lo que fué dicho por el profeta Isaías, que dijo: El mismo tomó nuestras enfermedades, y llevó nuestras dolencias.","63.1.2":"Amado, yo deseo que tú seas prosperado en todas cosas, y que tengas salud, así como tu alma está en prosperidad.","40.9.23":"Y Jesús le dijo: Si puedes creer, al que cree todo es posible.","40.9.24":"Y luego el padre del muchacho dijo clamando: Creo, ayuda mi incredulidad.","58.1.5":"Y si alguno de vosotros tiene falta de sabiduría, demándela a Dios, el cual da a todos abundantemente, y no zahiere; y le será dada.","58.1.6":"Pero pida en fe, no dudando nada: porque el que duda es semejante a la onda de la mar, que es movida del viento, y echada de una parte a otra.","42.20.27":"Luego dice a Tomás: Mete tu dedo aquí, y ve mis manos: y alarga acá tu mano, y métela en mi costado: y no seas incrédulo, sino fiel.","42.20.28":"Entonces Tomás respondió, y le dijo: ¡Señor mío, y Dios mío!","42.20.29":"Le dice Jesús: Porque me has visto, Tomás, creiste: bienaventurados los que no vieron y creyeron.","39.14.31":"Y luego Jesús, extendiendo la mano, trabó de él, y le dice: Oh hombre de poca fe, ¿por qué dudaste?","57.11.6":"Pero sin fe es imposible agradar a Dios; porque es menester que el que a Dios se allega, crea que le hay, y que es galardonador de los que le buscan.","19.3.5":"Fíate de Jehová de todo tu corazón, y no estribes en tu prudencia.","19.3.6":"Reconócelo en todos tus caminos, y él enderezará tus veredas.","18.32.8":"Te haré entender, y te enseñaré el camino en que debes andar: sobre ti fijaré mis ojos.","18.119.105":"Nun. Lámpara es a mis pies tu palabra, y lumbrera a mi camino.","22.30.21":"Entonces tus oídos oirán a tus espaldas palabra que diga: Este es el camino, andad por él; y no echéis a la mano derecha, ni tampoco torzáis a la mano izquierda.","19.16.9":"El corazón del hombre piensa su camino: mas Jehová endereza sus pasos.","19.11.14":"Cuando falten las industrias, caerá el pueblo: mas en la multitud de consejeros hay salud.","23.33.3":"Clama a mí, y te responderé, y te enseñaré cosas grandes y dificultosas que tú no sabes.","18.37.23":"Por Jehová son ordenados los pasos del hombre, y aprueba su camino.","18.27.14":"Aguarda a Jehová; esfuérzate, y aliéntese tu corazón: sí, espera a Jehová.","24.3.25":"Bueno es Jehová a los que en él esperan, al alma que le busque.","24.3.26":"Bueno es esperar callando en la salud de Jehová.","58.5.7":"Pues, hermanos, tened paciencia hasta la venida del Señor. Mirad cómo el labrador espera el precioso fruto de la tierra, aguardando con paciencia, hasta que reciba la lluvia temprana y tardía.","58.5.8":"Tened también vosotros paciencia; confirmad vuestros corazones: porque la venida del Señor se acerca.","44.12.12":"Gozosos en la esperanza; sufridos en la tribulación; constantes en la oración;","18.37.7":"Calla a Jehová, y espera en él: no te alteres con motivo del que prospera en su camino, por el hombre que hace maldades.","20.3.1":"Para todas las cosas hay sazón, y todo lo que se quiere debajo del cielo, tiene su tiempo:","34.2.3":"Aunque la visión tardará aún por tiempo, mas al fin hablará, y no mentirá: aunque se tarde, espéralo, que sin duda vendrá; no tardará.","49.4.8":"Por lo demás, hermanos, todo lo que es verdadero, todo lo honesto, todo lo justo, todo lo puro, todo lo amable, todo lo que es de buen nombre; si hay virtud alguna, si alguna alabanza, en esto pensad.","44.12.2":"Y no os conforméis a este siglo; mas reformaos por la renovación de vuestro entendimiento, para que experimentéis cuál sea la buena voluntad de Dios, agradable y perfecta.","46.10.5":"Destruyendo consejos, y toda altura que se levanta contra la ciencia de Dios, y cautivando todo intento a la obediencia de Cristo;","50.3.2":"Poned la mira en las cosas de arriba, no en las de la tierra.","19.4.23":"Sobre toda cosa guardada guarda tu corazón; porque de él mana la vida.","18.19.14":"Sean gratos los dichos de mi boca y la meditación de mi corazón delante de ti, oh Jehová, roca mía, y redentor mío.","18.51.10":"Crea en mí, oh Dios, un corazón limpio; y renueva un espíritu recto dentro de mí.","23.17.9":"Engañoso es el corazón más que todas las cosas, y perverso; ¿quién lo conocerá?","23.17.10":"Yo Jehová, que escudriño el corazón, que pruebo los riñones, para dar a cada uno según su camino, según el fruto de sus obras.","25.36.26":"Y os daré corazón nuevo, y pondré espíritu nuevo dentro de vosotros; y quitaré de vuestra carne el corazón de piedra, y os daré corazón de carne.","39.5.8":"Bienaventurados los de limpio corazón: porque ellos verán a Dios.","8.16.7":"Y Jehová respondió a Samuel: No mires a su parecer, ni a lo grande de su estatura, porque yo lo desecho; porque Jehová mira no lo que el hombre mira; pues que el hombre mira lo que está delante de sus ojos, mas Jehová mira el corazón.","18.37.4":"Pon asimismo tu delicia en Jehová, y él te dará las peticiones de tu corazón.","39.15.18":"Mas lo que sale de la boca, del corazón sale; y esto contamina al hombre.","39.15.19":"Porque del corazón salen los malos pensamientos, muertes, adulterios, fornicaciones, hurtos, falsos testimonios, blasfemias.","18.139.23":"Examíname, oh Dios, y conoce mi corazón: pruébame y reconoce mis pensamientos:","18.139.24":"Y ve si hay en mí camino de perversidad, y guíame en el camino eterno.","28.2.25":"Y os restituiré los años que comió la oruga, la langosta, el pulgón, y el revoltón; mi grande ejército que envié contra vosotros.","23.30.17":"Mas yo haré venir sanidad para ti, y te sanaré de tus heridas, dice Jehová; porque Arrojada te llamaron, diciendo: Esta es Sión, a la que nadie busca.","18.51.12":"Vuélveme el gozo de tu salud; y el espíritu libre me sustente.","42.21.15":"Y cuando hubieron comido, Jesús dijo a Simón Pedro: Simón, hijo de Jonás, ¿me amas más que éstos? Le dice: Sí, Señor: tú sabes que te amo. Le dice: Apacienta mis corderos.","42.21.16":"Vuélvele a decir la segunda vez: Simón, hijo de Jonás, ¿me amas? Respóndele: Sí, Señor: tú sabes que te amo. Le dice: Apacienta mis ovejas.","42.21.17":"Le dice la tercera vez: Simón, hijo de Jonás, ¿me amas? Se entristeció Pedro de que le dijese la tercera vez: ¿Me amas? y le dice: Señor, tú sabes todas las cosas; tú sabes que te amo. Le dice Jesús: Apacienta mis ovejas.","42.3.16":"Porque de tal manera amó Dios al mundo, que ha dado a su Hijo unigénito, para que todo aquel que en él cree, no se pierda, mas tenga vida eterna.","44.3.23":"Por cuanto todos pecaron, y están destituídos de la gloria de Dios;","44.6.23":"Porque la paga del pecado es muerte: mas la dádiva de Dios es vida eterna en Cristo Jesús Señor nuestro.","44.5.8":"Mas Dios encarece su caridad para con nosotros, porque siendo aún pecadores, Cristo murió por nosotros.","44.10.9":"Que si confiesas con tu boca al Señor Jesús, y crees en tu corazón que Dios le levantó de los muertos, serás salvo.","44.10.10":"Porque con el corazón se cree para justicia; mas con la boca se hace confesión para salud.","48.2.8":"Porque por gracia sois salvos por la fe; y esto no de vosotros, pues es don de Dios:","48.2.9":"No por obras, para que nadie se gloríe.","43.4.12":"Y en ningún otro hay salud; porque no hay otro nombre debajo del cielo, dado a los hombres, en que podamos ser salvos.","42.14.6":"Jesús le dice: Yo soy el camino, y la verdad, y la vida: nadie viene al Padre, sino por mí.","55.3.5":"No por obras de justicia que nosotros habíamos hecho, mas por su misericordia nos salvó, por el lavacro de la regeneración, y de la renovación del Espíritu Santo;","61.5.11":"Y este es el testimonio: Que Dios nos ha dado vida eterna; y esta vida está en su Hijo.","61.5.12":"El que tiene al Hijo, tiene la vida: el que no tiene al Hijo de Dios, no tiene la vida.","61.5.13":"Estas cosas he escrito a vosotros que creéis en el nombre del Hijo de Dios, para que sepáis que tenéis vida eterna, y para que creáis en el nombre del Hijo de Dios.","44.8.38":"Por lo cual estoy cierto que ni la muerte, ni la vida, ni ángeles, ni principados, ni potestades, ni lo presente, ni lo por venir,","44.8.39":"Ni lo alto, ni lo bajo, ni ninguna criatura nos podrá apartar del amor de Dios, que es en Cristo Jesús Señor nuestro.","61.4.9":"En esto se mostró el amor de Dios para con nosotros, en que Dios envió a su Hijo unigénito al mundo, para que vivamos por él.","61.4.10":"En esto consiste el amor: no que nosotros hayamos amado a Dios, sino que él nos amó a nosotros, y ha enviado a su Hijo en propiciación por nuestros pecados.","61.3.1":"Mirad cuál amor nos ha dado el Padre, que seamos llamados hijos de Dios: por esto el mundo no nos conoce, porque no le conoce a él.","23.31.3":"Jehová se manifestó a mí ya mucho tiempo há, diciendo: Con amor eterno te he amado; por tanto te soporté con misericordia.","35.3.17":"Jehová en medio de ti, poderoso, él salvará; se gozará sobre ti con alegría, callará de amor, se regocijará sobre ti con cantar.","48.3.17":"Que habite Cristo por la fe en vuestros corazones; para que, arraigados y fundados en amor,","48.3.18":"Podáis bien comprender con todos los santos cuál sea la anchura y la longura y la profundidad y la altura,","48.3.19":"Y conocer el amor de Cristo, que excede a todo conocimiento, para que seáis llenos de toda la plenitud de Dios.","18.103.10":"No ha hecho con nosotros conforme a nuestras iniquidades; ni nos ha pagado conforme a nuestros pecados.","18.103.11":"Porque como la altura de los cielos sobre la tierra, engrandeció su misericordia sobre los que le temen.","22.43.25":"Yo, yo soy el que borro tus rebeliones por amor de mí; y no me acordaré de tus pecados.","48.1.7":"En el cual tenemos redención por su sangre, la remisión de pecados por las riquezas de su gracia,","43.3.19":"Así que, arrepentíos y convertíos, para que sean borrados vuestros pecados; pues que vendrán los tiempos del refrigerio de la presencia del Señor,","18.32.1":"Bienaventurado aquel cuyas iniquidades son perdonadas, y borrados sus pecados.","18.32.2":"Bienaventurado el hombre a quien no imputa Jehová la iniquidad, y en cuyo espíritu no hay superchería.","50.1.13":"Que nos ha librado de la potestad de las tinieblas, y trasladado al reino de su amado Hijo;","50.1.14":"En el cual tenemos redención por su sangre, la remisión de pecados:","44.3.24":"Siendo justificados gratuitamente por su gracia, por la redención que es en Cristo Jesús;","42.1.16":"Porque de su plenitud tomamos todos, y gracia por gracia.","42.1.17":"Porque la ley por Moisés fué dada: mas la gracia y la verdad por Jesucristo fué hecha.","44.5.20":"Pero La ley entró para que el pecado creciese; mas cuando el pecado creció, sobrepujó la gracia;","54.1.9":"Que nos salvó y llamó con vocación santa, no conforme a nuestras obras, mas según el intento suyo y gracia, la cual nos es dada en Cristo Jesús antes de los tiempos de los siglos,","13.7.14":"Si se humilla mi pueblo, sobre los cuales ni nombre es invocado, y oren, y busquen mi rostro, y se conviertan de sus malos caminos; entonces yo oiré desde los cielos, y perdonaré sus pecados, y sanaré su tierra.","41.15.7":"Os digo, que así habrá más gozo en el cielo de un pecador que se arrepiente, que de noventa y nueve justos, que no necesitan arrepentimiento.","22.55.7":"Deje el impío su camino, y el hombre inicuo sus pensamientos; y vuélvase a Jehová, el cual tendrá de él misericordia, y al Dios nuestro, el cual será amplio en perdonar.","18.51.11":"No me eches de delante de ti; y no quites de mí tu santo espíritu.","46.7.10":"Porque el dolor que es según Dios, obra arrepentimiento saludable, de que no hay que arrepentirse; mas el dolor del siglo obra muerte.","43.2.38":"Y Pedro les dice: Arrepentíos, y bautícese cada uno de vosotros en el nombre de Jesucristo para perdón de los pecados; y recibiréis el don del Espíritu Santo.","41.15.18":"Me levantaré, e iré a mi padre, y le diré: Padre, he pecado contra el cielo, y contra ti;","41.15.19":"Ya no soy digno de ser llamado tu hijo; hazme como a uno de tus jornaleros.","41.15.20":"Y levantándose, vino a su padre. Y como aun estuviese lejos, lo vió su padre, y fué movido a misericordia, y corrió, y se echó sobre su cuello, y le besó.","41.15.21":"Y el hijo le dijo: Padre, he pecado contra el cielo, y contra ti, y ya no soy digno de ser llamado tu hijo.","41.15.22":"Mas el padre dijo a sus siervos: Sacad el principal vestido, y vestidle; y poned un anillo en su mano, y zapatos en sus pies.","41.15.23":"Y traed el becerro grueso, y matadlo, y comamos, y hagamos fiesta:","41.15.24":"Porque este mi hijo muerto era, y ha revivido; se había perdido, y es hallado. Y comenzaron a regocijarse.","42.3.3":"Respondió Jesús, y le dijo: De cierto, de cierto te digo, que el que no nazca otra vez, no puede ver el reino de Dios.","42.3.4":"Le dice Nicodemo: ¿Cómo puede el hombre nacer siendo viejo? ¿puede entrar otra vez en el vientre de su madre, y nacer?","42.3.5":"Respondió Jesús: De cierto, de cierto te digo, que el que no nazca de agua y del Espíritu, no puede entrar en el reino de Dios.","42.3.6":"Lo que es nacido de la carne, carne es; y lo que es nacido del Espíritu, espíritu es.","42.3.7":"No te maravilles de que te dije: Os es necesario nacer otra vez.","42.1.13":"Los cuales no son engendrados de sangre, ni de voluntad de carne, ni de voluntad de varón, mas de Dios.","59.1.23":"Siendo renacidos, no de simiente corruptible, sino de incorruptible, por la palabra de Dios, que vive y permanece para siempre.","44.6.4":"Porque somos sepultados juntamente con él a muerte por el bautismo; para que como Cristo resucitó de los muertos por la gloria del Padre, así también nosotros andemos en novedad de vida.","42.10.28":"Y yo les doy vida eterna: y no perecerán para siempre, ni nadie las arrebatará de mi mano.","42.10.29":"Mi Padre que me las dió, mayor que todos es: y nadie las puede arrebatar de la mano de mi Padre.","42.5.24":"De cierto, de cierto os digo: El que oye mi palabra, y cree al que me ha enviado, tiene vida eterna; y no vendrá a condenación, mas pasó de muerte a vida.","48.1.13":"En el cual esperasteis también vosotros en oyendo la palabra de verdad, el evangelio de vuestra salud: en el cual también desde que creísteis, fuisteis sellados con el Espíritu Santo de la promesa,","48.1.14":"Que es las arras de nuestra herencia, para la redención de la posesión adquirida para alabanza de su gloria.","64.1.24":"A aquel, pues, que es poderoso para guardaros sin caída, y presentaros delante de su gloria irreprensibles, con grande alegría,","22.59.2":"Mas vuestras iniquidades han hecho división entre vosotros y vuestro Dios, y vuestros pecados han hecho ocultar su rostro de vosotros, para no oir.","61.1.8":"Si decimos que no tenemos pecado, nos engañamos a nosotros mismos, y no hay verdad en nosotros.","58.4.17":"El pecado, pues, está en aquel que sabe hacer lo bueno, y no lo hace.","47.6.7":"No os engañéis: Dios no puede ser burlado: que todo lo que el hombre siembre, eso también segará.","47.6.8":"Porque el que siembra para su carne, de la carne segará corrupción; mas el que siembra para el Espíritu, del Espíritu segará vida eterna.","18.51.1":"Ten piedad de mí, oh Dios, conforme a tu misericordia: conforme a la multitud de tus piedades borra mis rebeliones.","18.51.2":"Lávame más y más de mi maldad, y límpiame de mi pecado.","18.51.3":"Porque yo reconozco mis rebeliones; y mi pecado está siempre delante de mí.","18.51.4":"A ti, a ti solo he pecado, y he hecho lo malo delante de tus ojos: porque seas reconocido justo en tu palabra, y tenido por puro en tu juicio.","42.8.32":"Y conoceréis la verdad, y la verdad os libertará.","47.5.13":"Porque vosotros, hermanos, a libertad habéis sido llamados; solamente que no uséis la libertad como ocasión a la carne, sino servíos por amor los unos a los otros.","46.3.17":"Porque el Señor es el Espíritu; y donde hay el Espíritu del Señor, allí hay libertad.","44.8.2":"Porque la ley del Espíritu de vida en Cristo Jesús me ha librado de la ley del pecado y de la muerte.","41.4.18":"El Espíritu del Señor es sobre mí, por cuanto me ha ungido para dar buenas nuevas a los pobres: me ha enviado para sanar a los quebrantados de corazón; para pregonar a los cautivos libertad, y a los ciegos vista; para poner en libertad a los quebrantados:","42.10.27":"Mis ovejas oyen mi voz, y yo las conozco, y me siguen;","65.21.1":"Y vi un cielo nuevo, y una tierra nueva: porque el primer cielo y la primera tierra se fueron, y el mar ya no es.","65.21.2":"Y yo Juan vi la santa ciudad, Jerusalem nueva, que descendía del cielo, de Dios, dispuesta como una esposa ataviada para su marido.","65.21.3":"Y oí una gran voz del cielo que decía: He aquí el tabernáculo de Dios con los hombres, y morará con ellos; y ellos serán su pueblo, y el mismo Dios será su Dios con ellos.","45.2.9":"Antes, como está escrito: Cosas que ojo no vió, ni oreja oyó, ni han subido en corazón de hombre, son las que ha Dios preparado para aquellos que le aman.","49.3.20":"Mas nuestra vivienda es en los cielos; de donde también esperamos al Salvador, al Señor Jesucristo;","49.3.21":"El cual transformará el cuerpo de nuestra bajeza, para ser semejante al cuerpo de su gloria, por la operación con la cual puede también sujetar a sí todas las cosas.","46.5.1":"Porque sabemos, que si la casa terrestre de nuestra habitación se deshace, tenemos de Dios un edificio, una casa no hecha de manos, eterna en los cielos.","4.7.9":"Conoce, pues, que Jehová tu Dios es Dios, Dios fiel, que guarda el pacto y la misericordia a los que le aman y guardan sus mandamientos, hasta las mil generaciones;","54.2.13":"Si somos infieles, él permanece fiel: no se puede negar a sí mismo.","45.1.9":"Fiel es Dios, por el cual sois llamados a la participación de su Hijo Jesucristo nuestro Señor.","57.10.23":"Mantengamos firme la profesión de nuestra fe sin fluctuar; que fiel es el que prometió:","51.5.24":"Fiel es el que os ha llamado; el cual también lo hará.","3.23.19":"Dios no es hombre, para que mienta; ni hijo de hombre para que se arrepienta: el dijo, ¿y no hará?; habló, ¿y no lo ejecutará?","18.36.5":"Jehová, hasta los cielos es tu misericordia; tu verdad hasta las nubes.","18.89.1":"Las misericordias de Jehová cantaré perpetuamente: en generación y generación haré notoria tu verdad con mi boca.","23.32.17":"¡Oh Señor Jehová! he aquí que tú hiciste el cielo y la tierra con tu gran poder, y con tu brazo extendido, ni hay nada que sea difícil para ti:","41.1.37":"Porque ninguna cosa es imposible para Dios.","39.19.26":"Y mirándo los Jesús, les dijo: Para con los hombres imposible es esto; mas para con Dios todo es posible.","48.3.20":"Y a Aquel que es poderoso para hacer todas las cosas mucho más abundantemente de lo que pedimos o entendemos, por la potencia que obra en nosotros,","18.147.5":"Grande es el Señor nuestro, y de mucha potencia; y de su entendimiento no hay número.","22.40.28":"¿No has sabido, no has oído que el Dios del siglo es Jehová, el cual crió los términos de la tierra? No se trabaja, ni se fatiga con cansancio, y su entendimiento no hay quien lo alcance.","18.145.3":"Grande es Jehová y digno de suprema alabanza: y su grandeza es inescrutable.","44.11.33":"¡Oh profundidad de las riquezas de la sabiduría y de la ciencia de Dios! ¡Cuán incomprensibles son sus juicios, e inescrutables sus caminos!","19.19.21":"Muchos pensamientos hay en el corazón del hombre; mas el consejo de Jehová permanecerá.","22.55.8":"Porque mis pensamientos no son vuestros pensamientos, ni vuestros caminos mis caminos, dijo Jehová.","22.55.9":"Como son más altos los cielos que la tierra, así son mis caminos más altos que vuestros caminos, y mis pensamientos más que vuestros pensamientos.","22.46.10":"Que anuncio lo por venir desde el principio, y desde antiguo lo que aun no era hecho; que digo: Mi consejo permanecerá, y haré todo lo que quiera;","26.2.21":"Y él es el que muda los tiempos y las oportunidades: quita reyes, y pone reyes: da la sabiduría a los sabios, y la ciencia a los entendidos:","18.115.3":"Y nuestro Dios está en los cielos: todo lo que quiso ha hecho.","48.1.11":"En él digo, en quien asimismo tuvimos suerte, habiendo sido predestinados conforme al propósito del que hace todas las cosas según el consejo de su voluntad,","42.14.26":"Mas el Consolador, el Espíritu Santo, al cual el Padre enviará en mi nombre, él os enseñará todas las cosas, y os recordará todas las cosas que os he dicho.","42.16.13":"Pero cuando venga aquel Espíritu de verdad, él os guiará a toda verdad; porque no hablará de sí mismo, sino que hablará todo lo que oiga, y os hará saber las cosas que han de venir.","43.1.8":"Mas recibiréis la virtud del Espíritu Santo que vendrá sobre vosotros; y me sereís testigos en Jerusalem, y en toda Judea, y Samaria, y hasta lo último de la tierra.","44.8.26":"Y asimismo también el Espíritu ayuda nuestra flaqueza: porque qué hemos de pedir como conviene, no lo sabemos; sino que el mismo Espíritu pide por nosotros con gemidos indecibles.","47.5.22":"Mas el fruto del Espíritu es: caridad, gozo, paz, tolerancia, benignidad, bondad, fe,","47.5.23":"Mansedumbre, templanza: contra tales cosas no hay ley.","43.1.11":"Los cuales también les dijeron: Varones Galileos, ¿qué estáis mirando al cielo? este mismo Jesús que ha sido tomado desde vosotros arriba en el cielo, así vendrá como le habéis visto ir al cielo.","51.4.16":"Porque el mismo Señor con aclamación, con voz de arcángel, y con trompeta de Dios, descenderá del cielo; y los muertos en Cristo resucitarán primero:","51.4.17":"Luego nosotros, los que vivimos, los que quedamos, juntamente con ellos seremos arrebatados en las nubes a recibir al Señor en el aire, y así estaremos siempre con el Señor.","39.24.36":"Pero del día y hora nadie sabe, ni aun los ángeles de los cielos, sino mi Padre solo.","39.24.44":"Por tanto, también vosotros estad apercibidos; porque el Hijo del hombre ha de venir a la hora que no pensáis.","55.2.13":"Esperando aquella esperanza bienaventurada, y la manifestación gloriosa del gran Dios y Salvador nuestro Jesucristo,","60.3.9":"El Señor no tarda su promesa, como algunos la tienen por tardanza; sino que es paciente para con nosotros, no queriendo que ninguno perezca, sino que todos procedan al arrepentimiento.","60.3.10":"Mas el día del Señor vendrá como ladrón en la noche; en el cual los cielos pasarán con grande estruendo, y los elementos ardiendo serán deshechos, y la tierra y las obras que en ella están serán quemadas.","65.1.7":"He aquí que viene con las nubes, y todo ojo le verá, y los que le traspasaron; y todos los linajes de la tierra se lamentarán sobre él. Así sea. Amén.","65.22.12":"Y he aquí, yo vengo presto, y mi galardón conmigo, para recompensar a cada uno según sea su obra.","0.1.1":"En el principio crió Dios los cielos y la tierra.","18.19.1":"Los cielos cuentan la gloria de Dios, y la expansión denuncia la obra de sus manos.","18.24.1":"De Jehová es la tierra y su plenitud; el mundo, y los que en él habitan.","42.1.3":"Todas las cosas por él fueron hechas; y sin él nada de lo que es hecho, fué hecho.","50.1.16":"Porque por él fueron criadas todas las cosas que están en los cielos, y que están en la tierra, visibles e invisibles; sean tronos, sean dominios, sean principados, sean potestades; todo fué criado por él y para él.","44.1.20":"Porque las cosas invisibles de él, su eterna potencia y divinidad, se echan de ver desde la creación del mundo, siendo entendidas por las cosas que son hechas; de modo que son inexcusables:","57.11.3":"Por la fe entendemos haber sido compuestos los siglos por la palabra de Dios, siendo hecho lo que se ve, de lo que no se veía.","22.40.26":"Levantad en alto vuestros ojos, y mirad quién crió estas cosas: él saca por cuenta su ejército: a todas llama por sus nombres; ninguna faltará: tal es la grandeza de su fuerza, y su poder y virtud.","18.91.11":"Pues que a sus ángeles mandará acerca de ti, que te guarden en todos tus caminos.","18.91.12":"En las manos te llevarán, porque tu pie no tropiece en piedra.","18.34.7":"El ángel de Jehová acampa en derredor de los que le temen, y los defiende.","57.1.14":"¿No son todos espíritus administradores, enviados para servicio a favor de los que serán herederos de salud?","57.13.2":"No olvidéis la hospitalidad, porque por ésta algunos, sin saberlo, hospedaron ángeles.","39.18.10":"Mirad no tengáis en poco a alguno de estos pequeños; porque os digo que sus ángeles en los cielos ven siempre la faz de mi Padre que está en los cielos.","41.15.10":"Así os digo que hay gozo delante de los ángeles de Dios por un pecador que se arrepiente.","1.23.20":"He aquí yo envío el Angel delante de ti para que te guarde en el camino, y te introduzca en el lugar que yo he preparado.","42.1.1":"En el principio era el Verbo, y el Verbo era con Dios, y el Verbo era Dios.","42.1.14":"Y aquel Verbo fué hecho carne, y habitó entre nosotros (y vimos su gloria, gloria como del unigénito del Padre), lleno de gracia y de verdad.","39.16.15":"El les dice: Y vosotros, ¿quién decís que soy?","39.16.16":"Y respondiendo Simón Pedro, dijo: Tú eres el Cristo, el Hijo del Dios viviente.","42.10.30":"Yo y el Padre una cosa somos.","50.1.15":"El cual es la imagen del Dios invisible, el primogénito de toda criatura.","50.1.17":"Y él es antes de todas las cosas, y por él todas las cosas subsisten:","49.2.9":"Por lo cual Dios también le ensalzó a lo sumo, y le dió un nombre que es sobre todo nombre;","49.2.10":"Para que en el nombre de Jesús se doble toda rodilla de los que están en los cielos, y de los que en la tierra, y de los que debajo de la tierra;","49.2.11":"Y toda lengua confiese que Jesucristo es el Señor, a la gloria de Dios Padre.","57.1.3":"El cual siendo el resplandor de su gloria, y la misma imagen de su sustancia, y sustentando todas las cosas con la palabra de su potencia, habiendo hecho la purgación de nuestros pecados por sí mismo, se sentó a la diestra de la Majestad en las alturas,","22.9.6":"Porque un niño nos es nacido, hijo nos es dado; y el principado sobre su hombro: y se llamará su nombre Admirable, Consejero, Dios fuerte, Padre eterno, Príncipe de paz.","42.6.35":"Y Jesús les dijo: Yo soy el pan de vida: el que a mí viene, nunca tendrá hambre; y el que en mí cree, no tendrá sed jamás.","42.8.12":"Y les habló Jesús otra vez, diciendo: Yo soy la luz del mundo: el que me sigue, no andará en tinieblas, mas tendrá la lumbre de la vida.","42.10.9":"Yo soy la puerta: el que por mí entre, será salvo; y entrará, y saldrá, y hallará pastos.","42.10.11":"Yo soy el buen pastor: el buen pastor su vida da por las ovejas.","42.15.5":"Yo soy la vid, vosotros los pámpanos: el que está en mí, y yo en él, éste lleva mucho fruto; porque sin mí nada podéis hacer.","42.8.58":"Les dijo Jesús: De cierto, de cierto os digo: Antes que Abraham fuese, yo soy.","22.7.14":"Por tanto el mismo Señor os dará señal: He aquí que la virgen concebirá, y parirá hijo, y llamará su nombre Emmanuel.","32.5.2":"Mas tú, Beth-lehem Ephrata, pequeña para ser en los millares de Judá, de ti me saldrá el que será Señor en Israel; y sus salidas son desde el principio, desde los días del siglo.","39.1.21":"Y parirá un hijo, y llamarás su nombre Jesus, porque él salvará a su pueblo de sus pecados.","39.1.22":"Todo esto aconteció para que se cumpliese lo que fué dicho por el Señor, por el profeta que dijo:","39.1.23":"He aquí la virgen concebirá y parirá un hijo, y llamarás su nombre Emmanuel, que declarado, es: Con nosotros Dios.","41.2.7":"Y parió a su hijo primogénito, y le envolvió en pañales, y le acostó en un pesebre, porque no había lugar para ellos en el mesón.","41.2.10":"Mas el ángel les dijo: No temáis; porque he aquí os doy nuevas de gran gozo, que será para todo el pueblo:","41.2.11":"Que os ha nacido hoy, en la ciudad de David, un Salvador, que es Cristo el Señor.","47.4.4":"Mas venido el cumplimiento del tiempo, Dios envió su Hijo, hecho de mujer, hecho súbdito a la ley,","47.4.5":"Para que redimiese a los que estaban debajo de la ley, a fin de que recibiésemos la adopción de hijos.","22.53.6":"Todos nosotros nos descarriamos como ovejas, cada cual se apartó por su camino: mas Jehová cargó en él el pecado de todos nosotros.","59.2.24":"El cual mismo llevó nuestros pecados en su cuerpo sobre el madero, para que nosotros siendo muertos a los pecados, vivamos a la justicia: por la herida del cual habéis sido sanados.","46.5.21":"Al que no conoció pecado, hizo pecado por nosotros, para que nosotros fuésemos hechos justicia de Dios en él.","40.10.45":"Porque el Hijo del hombre tampoco vino para ser servido, mas para servir, y dar su vida en rescate por muchos.","45.15.3":"Porque primeramente os he enseñado lo que asimismo recibí: Que Cristo fué muerto por nuestros pecados, conforme a las Escrituras;","42.19.30":"Y como Jesús tomó el vinagre, dijo: Consumado es. Y habiendo inclinado la cabeza, dió el espíritu.","39.28.5":"Y respondiendo el ángel, dijo a las mujeres: No temáis vosotras; porque yo sé que buscáis a Jesús, que fué crucificado.","39.28.6":"No está aquí; porque ha resucitado, como dijo. Venid, ved el lugar donde fué puesto el Señor.","41.24.5":"Y como tuviesen ellas temor, y bajasen el rostro a tierra, les dijeron: ¿Por qué buscáis entre los muertos al que vive?","41.24.6":"No está aquí, mas ha resucitado: acordaos de lo que os habló, cuando aun estaba en Galilea,","45.15.4":"Y que fué sepultado, y que resucitó al tercer día, conforme a las Escrituras;","45.15.20":"Mas ahora Cristo ha resucitado de los muertos; primicias de los que durmieron es hecho.","45.15.21":"Porque por cuanto la muerte entró por un hombre, también por un hombre la resurrección de los muertos.","45.15.22":"Porque así como en Adam todos mueren, así también en Cristo todos serán vivificados.","45.15.55":"¿Dónde está, oh muerte, tu aguijón? ¿dónde, oh sepulcro, tu victoria?","45.15.56":"Ya que el aguijón de la muerte es el pecado, y la potencia del pecado, la ley.","45.15.57":"Mas a Dios gracias, que nos da la victoria por el Señor nuestro Jesucristo.","44.6.9":"Sabiendo que Cristo, habiendo resucitado de entre los muertos, ya no muere: la muerte no se enseñoreará más de él.","39.5.3":"Bienaventurados los pobres en espíritu: porque de ellos es el reino de los cielos.","39.5.5":"Bienaventurados los mansos: porque ellos recibirán la tierra por heredad.","39.5.6":"Bienaventurados los que tienen hambre y sed de justicia: porque ellos serán hartos.","39.5.7":"Bienaventurados los misericordiosos: porque ellos alcanzarán misericordia.","39.5.9":"Bienaventurados los pacificadores: porque ellos serán llamados hijos de Dios.","39.5.10":"Bienaventurados los que padecen persecución por causa de la justicia: porque de ellos es el reino de los cielos.","39.5.11":"Bienaventurados sois cuando os vituperen y os persigan, y digan de vosotros todo mal por mi causa, mintiendo.","39.5.12":"Gozaos y alegraos; porque vuestra merced es grande en los cielos: que así persiguieron a los profetas que fueron antes de vosotros.","41.6.20":"Y alzando él los ojos a sus discípulos, decía: Bienaventurados vosotros los pobres; porque vuestro es el reino de Dios.","41.6.21":"Bienaventurados los que ahora tenéis hambre; porque seréis saciados. Bienaventurados los que ahora lloráis, porque reiréis.","41.6.22":"Bienaventurados seréis, cuando los hombres os aborrezcan, y cuando os aparten de sí, y os denuesten, y desechen vuestro nombre como malo, por el Hijo del hombre.","41.6.23":"Gozaos en aquel día, y alegraos; porque he aquí vuestro galardón es grande en los cielos; porque así hacían sus padres a los profetas.","39.5.13":"Vosotros sois la sal de la tierra: y si la sal se desvanece ¿con qué será salada? no vale más para nada, sino para ser echada fuera y hollada de los hombres.","39.5.14":"Vosotros sois la luz del mundo: una ciudad asentada sobre un monte no se puede esconder.","39.5.15":"Ni se enciende una lámpara y se pone debajo de un almud, mas sobre el candelero, y alumbra a todos los que están en casa.","39.5.16":"Así alumbre vuestra luz delante de los hombres, para que vean vuestras obras buenas, y glorifiquen a vuestro Padre que está en los cielos.","39.6.19":"No os hagáis tesoros en la tierra, donde la polilla y el orín corrompe, y donde ladrones minan y hurtan;","39.6.20":"Mas haceos tesoros en el cielo, donde ni polilla ni orín corrompe, y donde ladrones no minan ni hurtan:","39.6.21":"Porque donde esté vuestro tesoro, allí estará vuestro corazón.","39.7.7":"Pedid, y se os dará; buscad, y hallaréis; llamad, y se os abrirá.","39.7.8":"Porque cualquiera que pide, recibe; y el que busca, halla; y al que llama, se abrirá.","39.7.12":"Así que, todas las cosas que quisierais que los hombres hiciesen con vosotros, así también haced vosotros con ellos; porque esta es la ley y los profetas.","39.7.24":"Cualquiera, pues, que me oye estas palabras, y las hace, le compararé a un hombre prudente, que edificó su casa sobre la peña;","39.7.25":"Y descendió lluvia, y vinieron ríos, y soplaron vientos, y combatieron aquella casa; y no cayó: porque estaba fundada sobre la peña.","41.15.11":"Y dijo: Un hombre tenía dos hijos;","41.15.12":"Y el menor de ellos dijo a su padre: Padre, dame la parte de la hacienda que me pertenece: y les repartió la hacienda.","41.15.13":"Y no muchos días después, juntándolo todo el hijo menor, partió lejos a una provincia apartada; y allí desperdició su hacienda viviendo perdidamente.","41.15.14":"Y cuando todo lo hubo malgastado, vino una grande hambre en aquella provincia, y le comenzó a faltar.","41.15.15":"Y fué y se llegó a uno de los ciudadanos de aquella tierra, el cual le envió a su hacienda para que apacentase los puercos.","41.15.16":"Y deseaba henchir su vientre de las algarrobas que comían los puercos; mas nadie se las daba.","41.15.17":"Y volviendo en sí, dijo: ¡Cuántos jornaleros en casa de mi padre tienen abundancia de pan, y yo aquí perezco de hambre!","41.10.30":"Y respondiendo Jesús, dijo: Un hombre descendía de Jerusalem a Jericó, y cayó en manos de ladrones, los cuales le despojaron; e hiriéndole, se fueron, dejándole medio muerto.","41.10.31":"Y aconteció, que descendió un sacerdote por aquel camino, y viéndole, se pasó de un lado.","41.10.32":"Y asimismo un Levita, llegando cerca de aquel lugar, y viéndole, se pasó de un lado.","41.10.33":"Mas un Samaritano que transitaba, viniendo cerca de él, y viéndole, fué movido a misericordia;","41.10.34":"Y llegándose, vendó sus heridas, echándo les aceite y vino; y poniéndole sobre su cabalgadura, le llevó al mesón, y cuidó de él.","41.10.35":"Y otro día al partir, sacó dos denarios, y los dió al huésped, y le dijo: Cuídamele; y todo lo que de más gastes, yo cuando vuelva te lo pagaré.","41.10.36":"¿Quién, pues, de estos tres te parece que fué el prójimo de aquél que cayó en manos de los ladrones?","41.10.37":"Y él dijo: El que usó con él de misericordia. Entonces Jesús le dijo: Ve, y haz tú lo mismo.","39.13.3":"Y les habló muchas cosas por parábolas, diciendo: He aquí el que sembraba salió a sembrar.","39.13.4":"Y sembrando, parte de la simiente cayó junto al camino; y vinieron las aves, y la comieron.","39.13.5":"Y parte cayó en pedregales, donde no tenía mucha tierra; y nació luego, porque no tenía profundidad de tierra:","39.13.6":"Mas en saliendo el sol, se quemó; y se secó, porque no tenía raíz.","39.13.7":"Y parte cayó en espinas; y las espinas crecieron, y la ahogaron.","39.13.8":"Y parte cayó en buena tierra, y dió fruto, cuál a ciento, cuál a sesenta, y cuál a treinta.","41.15.4":"¿Qué hombre de vosotros, teniendo cien ovejas, si pierde una de ellas, no deja las noventa y nueve en el desierto, y va a la que se perdió, hasta que la halle?","41.15.5":"Y hallada, la pone sobre sus hombros gozoso;","41.15.6":"Y viniendo a casa, junta a los amigos y a los vecinos, diciéndoles: Dadme el parabién, porque he hallado mi oveja que se había perdido.","39.13.31":"Otra parábola les propuso, diciendo: El reino de los cielos es semejante al grano de mostaza, que tomándolo alguno lo sembró en su campo:","39.13.32":"El cual a la verdad es la más pequeña de todas las simientes; mas cuando ha crecido, es la mayor de las hortalizas, y se hace árbol, que vienen las aves del cielo y hacen nidos en sus ramas.","39.13.44":"Además, el reino de los cielos es semejante al tesoro escondido en el campo; el cual hallado, el hombre lo encubre, y de gozo de ello va, y vende todo lo que tiene, y compra aquel campo.","39.13.45":"También el reino de los cielos es semejante al hombre tratante, que busca buenas perlas;","39.13.46":"Que hallando una preciosa perla, fué y vendió todo lo que tenía, y la compró.","42.2.7":"Les dice Jesús: Henchid estas tinajuelas de agua. E las hinchieron hasta arriba.","42.2.8":"Y les dice: Sacad ahora, y presentad al maestresala. Y presentáron le.","42.2.9":"Y como el maestresala gustó el agua hecha vino, que no sabía de dónde era (mas lo sabían los sirvientes que habían sacado el agua), el maestresala llama al esposo,","42.2.10":"Y le dice: Todo hombre pone primero el buen vino, y cuando están satisfechos, entonces lo que es peor; mas tú has guardado el buen vino hasta ahora.","42.2.11":"Este principio de señales hizo Jesús en Caná de Galilea, y manifestó su gloria; y sus discípulos creyeron en él.","40.4.39":"Y levantándose, increpó al viento, y dijo a la mar: Calla, enmudece. Y cesó el viento, y fué hecha grande bonanza.","40.4.40":"Y a ellos dijo: ¿Por qué estáis así amedrentados? ¿Cómo no tenéis fe?","40.4.41":"Y temieron con gran temor, y decían el uno al otro. ¿Quién es éste, que aun el viento y la mar le obedecen?","42.6.11":"Y tomó Jesús aquellos panes, y habiendo dado gracias, repartió a los discípulos, y los discípulos a los que estaban recostados: asimismo de los peces, cuanto querían.","42.6.12":"Y como fueron saciados, dijo a sus discípulos: Recoged los pedazos que han quedado, porque no se pierda nada.","42.6.13":"Cogieron pues, e hinchieron doce cestas de pedazos de los cinco panes de cebada, que sobraron a los que habían comido.","39.14.25":"Mas a la cuarta vela de la noche, Jesús fué a ellos andando sobre la mar.","39.14.26":"Y los discípulos, viéndole andar sobre la mar, se turbaron, diciendo: Fantasma es. Y dieron voces de miedo.","39.14.27":"Mas luego Jesús les habló, diciendo: Confiad, yo soy; no tengáis miedo.","41.5.12":"Y aconteció que estando en una ciudad, he aquí un hombre lleno de lepra, el cual viendo a Jesús, postrándose sobre el rostro, le rogó, diciendo: Señor, si quieres, puedes limpiarme.","41.5.13":"Entonces, extendiendo la mano, le tocó diciendo: Quiero: sé limpio. Y luego la lepra se fué de él.","40.10.51":"Y respondiendo Jesús, le dice: ¿Qué quieres que te haga? Y el ciego le dice: Maestro, que cobre la vista.","40.10.52":"Y Jesús le dijo: Ve, tu fe te ha salvado. Y luego cobró la vista, y seguía a Jesús en el camino.","42.11.43":"Y habiendo dicho estas cosas, clamó a gran voz: Lázaro, ven fuera.","42.11.44":"Y el que había estado muerto, salió, atadas las manos y los pies con vendas; y su rostro estaba envuelto en un sudario. Les dice Jesús: Desatadle, y dejadle ir.","42.20.30":"Y también hizo Jesús muchas otras señales en presencia de sus discípulos, que no están escritas en este libro.","42.20.31":"Pero estas son escritas, para que creáis que Jesús es el Cristo, el Hijo de Dios; y para que creyendo, tengáis vida en su nombre.","39.19.14":"Y Jesús dijo: Dejad a los niños, y no les impidáis de venir a mí; porque de los tales es el reino de los cielos.","39.18.3":"Y dijo: De cierto os digo, que si no os volvéis, y sois como niños, no entraréis en el reino de los cielos.","39.18.4":"Así que, cualquiera que se humille como este niño, éste es el mayor en el reino de los cielos.","39.18.6":"Y cualquiera que escandalice a alguno de estos pequeños que creen en mí, mejor le fuera que se le colgase al cuello una piedra de molino de asno, y que se le anegase en el profundo de la mar.","39.21.16":"Y le dijeron: ¿Oyes lo que éstos dicen? Y Jesús les dice: Sí: ¿nunca leísteis: De la boca de los niños y de los que maman perfeccionaste la alabanza?","39.6.5":"Y cuando oras, no seas como los hipócritas; porque ellos aman el orar en las sinagogas, y en los cantones de las calles en pie, para ser vistos de los hombres: de cierto os digo, que ya tienen su pago.","39.6.6":"Mas tú, cuando oras, éntrate en tu cámara, y cerrada tu puerta, ora a tu Padre que está en secreto; y tu Padre que ve en secreto, te recompensará en público.","39.6.7":"Y orando, no seáis prolijos, como los Gentiles; que piensan que por su parlería serán oídos.","39.6.8":"No os hagáis, pues, semejantes a ellos; porque vuestro Padre sabe de qué cosas tenéis necesidad, antes que vosotros le pidáis.","39.7.9":"¿Qué hombre hay de vosotros, a quien si su hijo pide pan, le dará una piedra?","39.7.10":"¿Y si le pide un pez, le dará una serpiente?","39.7.11":"Pues si vosotros, siendo malos, sabéis dar buenas dádivas a vuestros hijos, ¿cuánto más vuestro Padre que está en los cielos, dará buenas cosas a los que le piden?","40.11.24":"Por tanto, os digo que todo lo que orando pidáis, creed que lo recibiréis, y os vendrá.","42.14.13":"Y todo lo que pidáis al Padre en mi nombre, esto haré, para que el Padre sea glorificado en el Hijo.","42.14.14":"Si algo pedís en mi nombre, yo lo haré.","42.16.24":"Hasta ahora nada habéis pedido en mi nombre: pedid, y recibiréis, para que vuestro gozo sea cumplido.","39.18.19":"Otra vez os digo, que si dos de vosotros se convienen en la tierra, de toda cosa que pidan, les será hecho por mi Padre que está en los cielos.","39.18.20":"Porque donde están dos o tres congregados en mi nombre, allí estoy en medio de ellos.","41.18.1":"Y les propuso también una parábola sobre que es necesario orar siempre, y no desmayar,","39.6.24":"Ninguno puede servir a dos señores; porque o aborrecerá al uno y amará al otro, o se llegará al uno y menospreciará al otro: no podéis servir a Dios y a Mammón.","41.12.15":"Y les dijo: Mirad, y guardaos de toda avaricia; porque la vida del hombre no consiste en la abundancia de los bienes que posee.","40.10.25":"Más fácil es pasar un camello por el ojo de una aguja, que el rico entrar en el reino de Dios.","41.16.10":"El que es fiel en lo muy poco, también en lo más es fiel: y el que en lo muy poco es injusto, también en lo más es injusto.","41.16.11":"Pues si en las malas riquezas no fuisteis fieles, ¿quién os confiará lo verdadero?","39.22.21":"Le dicen: De César. Y les dice: Pagad pues a César lo que es de César, y a Dios lo que es de Dios.","40.12.41":"Y estando sentado Jesús delante del arca de la ofrenda, miraba cómo el pueblo echaba dinero en el arca: y muchos ricos echaban mucho.","40.12.42":"Y como vino una viuda pobre, echó dos blancas, que son un maravedí.","40.12.43":"Entonces llamando a sus discípulos, les dice: De cierto os digo que esta viuda pobre echó más que todos los que han echado en el arca:","40.12.44":"Porque todos han echado de lo que les sobra; mas ésta, de su pobreza echó todo lo que tenía, todo su alimento.","39.25.35":"Porque tuve hambre, y me disteis de comer; tuve sed, y me disteis de beber; fuí huésped, y me recogisteis;","39.25.36":"Desnudo, y me cubristeis; enfermo, y me visitasteis; estuve en la cárcel, y vinisteis a mí.","39.25.37":"Entonces los justos le responderán, diciendo: Señor, ¿cuándo te vimos hambriento, y te sustentamos? ¿o sediento, y te dimos de beber?","39.25.38":"¿Y cuándo te vimos huésped, y te recogimos? ¿o desnudo, y te cubrimos?","39.25.39":"¿O cuándo te vimos enfermo, o en la cárcel, y vinimos a ti?","39.25.40":"Y respondiendo el Rey, les dirá: De cierto os digo que en cuanto lo hicisteis a uno de estos mis hermanos pequeñitos, a mí lo hicisteis.","41.14.13":"Mas cuando haces banquete, llama a los pobres, los mancos, los cojos, los ciegos;","41.14.14":"Y serás bienaventurado; porque no te pueden retribuir; mas te será recompensado en la resurrección de los justos.","39.11.5":"Los ciegos ven, y los cojos andan; los leprosos son limpiados, y los sordos oyen; los muertos son resucitados, y a los pobres es anunciado el evangelio.","61.5.14":"Y esta es la confianza que tenemos en él, que si demandamos alguna cosa conforme a su voluntad, él nos oye.","61.5.15":"Y si sabemos que él nos oye en cualquiera cosa que demandemos, sabemos que tenemos las peticiones que le hayamos demandado.","18.145.18":"Cercano está Jehová a todos los que le invocan, a todos los que le invocan de veras.","39.6.9":"Vosotros pues, oraréis así: Padre nuestro que estás en los cielos, santificado sea tu nombre.","39.6.10":"Venga tu reino. Sea hecha tu voluntad, como en el cielo, así también en la tierra.","39.6.11":"Danos hoy nuestro pan cotidiano.","39.6.12":"Y perdónanos nuestras deudas, como también nosotros perdonamos a nuestros deudores.","41.11.2":"Y les dijo: Cuando oréis, decid: Padre nuestro que estás en los cielos; sea tu nombre santificado. Venga tu reino. Sea hecha tu voluntad, como en el cielo, así también en la tierra.","41.11.3":"El pan nuestro de cada día, dános lo hoy.","41.11.4":"Y perdónanos nuestros pecados, porque también nosotros perdonamos a todos los que nos deben. Y no nos metas en tentación, mas líbranos del malo.","57.11.1":"Es pues la fe la sustancia de las cosas que se esperan, la demostración de las cosas que no se ven.","44.10.17":"Luego la fe es por el oir; y el oir por la palabra de Dios.","39.17.20":"Y Jesús les dijo: Por vuestra incredulidad; porque de cierto os digo, que si tenéis fe como un grano de mostaza, diréis a este monte: Pásate de aquí allá: y se pasará: y nada os será imposible.","40.11.22":"Y respondiendo Jesús, les dice: Tened fe en Dios.","40.11.23":"Porque de cierto os digo que cualquiera que diga a este monte: Quítate, y échate en la mar, y no dude en su corazón, mas crea que será hecho lo que dice, lo que diga le será hecho.","46.5.7":"(Porque por fe andamos, no por vista;)","58.2.17":"Así también la fe, si no tiene obras, es muerta en sí misma.","54.3.16":"Toda Escritura es inspirada divinamente y útil para enseñar, para redargüir, para corregir, para instituir en justicia,","54.3.17":"Para que el hombre de Dios sea perfecto, enteramente instruído para toda buena obra.","57.4.12":"Porque la palabra de Dios es viva y eficaz, y más penetrante que toda espada de dos filos: y que alcanza hasta partir el alma, y aun el espíritu, y las coyunturas y tuétanos, y discierne los pensamientos y las intenciones del corazón.","5.1.8":"El libro de aquesta ley nunca se apartará de tu boca: antes de día y de noche meditarás en él, para que guardes y hagas conforme a todo lo que en él está escrito: porque entonces harás prosperar tu camino, y todo te saldrá bien.","22.40.8":"Se seca la hierba, se cae la flor: mas la palabra del Dios nuestro permanece para siempre.","39.4.4":"Mas él respondiendo, dijo: Escrito está: No con solo el pan vivirá el hombre, mas con toda palabra que sale de la boca de Dios.","44.15.4":"Porque las cosas que antes fueron escritas, para nuestra enseñanza fueron escritas; para que por la paciencia, y por la consolación de las Escrituras, tengamos esperanza.","42.17.17":"Santifícalos en tu verdad: tu palabra es verdad.","18.100.1":"Cantad alegres a Dios, habitantes de toda la tierra.","18.100.2":"Servid a Jehová con alegría: venid ante su acatamiento con regocijo.","18.100.3":"Reconoced que Jehová él es Dios: él nos hizo, y no nosotros a nosotros mismos; pueblo suyo somos, y ovejas de su prado.","18.100.4":"Entrad por sus puertas con reconocimiento, por sus atrios con alabanza: alabadle, bendecid su nombre.","18.100.5":"Porque Jehová es bueno: para siempre es su misericordia, y su verdad por todas las generaciones.","18.150.6":"Todo lo que respira alabe a Jah. Aleluya.","42.4.23":"Mas la hora viene, y ahora es, cuando los verdaderos adoradores adorarán al Padre en espíritu y en verdad; porque también el Padre tales adoradores busca que le adoren.","42.4.24":"Dios es Espíritu; y los que le adoran, en espíritu y en verdad es necesario que adoren.","18.95.6":"Venid, adoremos y postrémonos; arrodillémonos delante de Jehová nuestro hacedor.","18.34.1":"Bendeciré a Jehová en todo tiempo; su alabanza será siempre en mi boca.","18.103.1":"Bendice, alma mía, a Jehová; y bendigan todas mis entrañas su santo nombre.","57.13.15":"Así que, ofrezcamos por medio de él a Dios siempre sacrificio de alabanza, es a saber, fruto de labios que confiesen a su nombre.","50.3.16":"La palabra de Cristo habite en vosotros en abundancia en toda sabiduría, enseñándoos y exhortándoos los unos a los otros con salmos e himnos y canciones espirituales, con gracia cantando en vuestros corazones al Señor.","44.12.1":"Así que, hermanos, os ruego por las misericordias de Dios, que presentéis vuestros cuerpos en sacrificio vivo, santo, agradable a Dios, que es vuestro racional culto.","18.107.1":"Alabad a Jehová, porque es bueno; porque para siempre es su misericordia.","18.136.1":"Alabad a Jehová, porque es bueno; porque para siempre es su misericordia.","50.3.17":"Y todo lo que hacéis, sea de palabra, o de hecho, hacedlo todo en el nombre del Señor Jesús, dando gracias a Dios Padre por él.","48.5.20":"Dando gracias siempre de todo al Dios y Padre en el nombre de nuestro Señor Jesucristo:","50.2.7":"Arraigados y sobreedificados en él, y confirmados en la fe, así como habéis aprendido, creciendo en ella con hacimiento de gracias.","42.14.15":"Si me amáis, guardad mis mandamientos;","42.14.21":"El que tiene mis mandamientos, y los guarda, aquél es el que me ama; y el que me ama, será amado de mi Padre, y yo le amaré, y me manifestaré a él.","58.1.22":"Mas sed hacedores de la palabra, y no tan solamente oidores, engañándoos a vosotros mismos.","8.15.22":"Y Samuel dijo: ¿Tiene Jehová tanto contentamiento con los holocaustos y víctimas, como en obedecer a las palabras de Jehová? Ciertamente el obedecer es mejor que los sacrificios; y el prestar atención que el sebo de los carneros:","41.11.28":"Y él dijo: Antes bienaventurados los que oyen la palabra de Dios, y la guardan.","61.5.3":"Porque este es el amor de Dios, que guardemos sus mandamientos; y sus mandamientos no son penosos.","4.28.1":"Y será que, si oyes diligente la voz de Jehová tu Dios, para guardar, para poner por obra todos sus mandamientos que yo te prescribo hoy, también Jehová tu Dios te pondrá alto sobre todas las gentes de la tierra;","4.28.2":"Y vendrán sobre ti todas estas bendiciones, y te alcanzarán, cuando oigas la voz de Jehová tu Dios.","43.5.29":"Y respondiendo Pedro y los apóstoles, dijeron: Es menester obedecer a Dios antes que a los hombres.","39.28.19":"Por tanto, id, y doctrinad a todos los Gentiles, bautizándolos en el nombre del Padre, y del Hijo, y del Espíritu Santo:","39.3.16":"Y Jesús, después que fué bautizado, subió luego del agua; y he aquí los cielos le fueron abiertos, y vió al Espíritu de Dios que descendía como paloma, y venía sobre él.","39.3.17":"Y he aquí una voz de los cielos que decía: Este es mi Hijo amado, en el cual tengo contentamiento.","43.8.36":"Y yendo por el camino, llegaron a cierta agua; y dijo el eunuco: He aquí agua; ¿qué impide que yo sea bautizado?","43.8.37":"Y Felipe dijo: Si crees de todo corazón, bien puedes. Y respondiendo, dijo: Creo que Jesucristo es el Hijo de Dios.","43.8.38":"Y mandó parar el carro: y descendieron ambos al agua, Felipe y el eunuco; y le bautizó.","44.6.3":"¿O no sabéis que todos los que somos bautizados en Cristo Jesús, somos bautizados en su muerte?","50.2.12":"Sepultados juntamente con él en el bautismo, en el cual también resucitasteis con él, por la fe de la operación de Dios que le levantó de los muertos.","47.3.27":"Porque todos los que habéis sido bautizados en Cristo, de Cristo estáis vestidos.","40.16.16":"El que crea y sea bautizado, será salvo; mas el que no crea, será condenado.","41.22.19":"Y tomando el pan, habiendo dado gracias, partió, y les dió, diciendo: Esto es mi cuerpo, que por vosotros es dado: haced esto en memoria de mí.","41.22.20":"Asimismo también el vaso, después que hubo cenado, diciendo: Este vaso es el nuevo pacto en mi sangre, que por vosotros se derrama.","39.26.26":"Y comiendo ellos, tomó Jesús el pan, y bendijo, y lo partió, y dió a sus discípulos, y dijo: Tomad, comed: esto es mi cuerpo.","39.26.27":"Y tomando el vaso, y hechas gracias, les dió, diciendo: Bebed de él todos;","39.26.28":"Porque esto es mi sangre del nuevo pacto, la cual es derramada por muchos para remisión de los pecados.","45.11.23":"Porque yo recibí del Señor lo que también os he enseñado: Que el Señor Jesús, la noche que fué entregado, tomó pan;","45.11.24":"Y habiendo dado gracias, lo partió, y dijo: Tomad, comed: esto es mi cuerpo que por vosotros es partido: haced esto en memoria de mí.","45.11.25":"Asimismo tomó también la copa, después de haber cenado, diciendo: Esta copa es el nuevo pacto en mi sangre: haced esto todas las veces que bebáis, en memoria de mí.","45.11.26":"Porque todas las veces que comáis este pan, y bebáis esta copa, la muerte del Señor anunciáis hasta que venga.","45.10.16":"La copa de bendición que bendecimos, ¿no es la comunión de la sangre de Cristo? El pan que partimos, ¿no es la comunión del cuerpo de Cristo?","39.6.16":"Y cuando ayunáis, no seáis como los hipócritas, austeros; porque ellos demudan sus rostros para parecer a los hombres que ayunan: de cierto os digo, que ya tienen su pago.","39.6.17":"Mas tú, cuando ayunas, unge tu cabeza y lava tu rostro;","39.6.18":"Para no parecer a los hombres que ayunas, sino a tu Padre que está en secreto: y tu Padre que ve en secreto, te recompensará en público.","22.58.6":"¿No es antes el ayuno que yo escogí, desatar las ligaduras de impiedad, deshacer los haces de opresión, y dejar ir libres a los quebrantados, y que rompáis todo yugo?","22.58.7":"¿No es que partas tu pan con el hambriento, y a los pobres errantes metas en casa; que cuando veas al desnudo, lo cubras, y no te escondas de tu carne?","28.2.12":"Por eso pues ahora, dice Jehová, convertíos a mí con todo vuestro corazón, con ayuno y lloro y llanto.","39.4.2":"Y habiendo ayunado cuarenta días y cuarenta noches, después tuvo hambre.","14.8.23":"Ayunamos pues, y pedimos a nuestro Dios sobre esto, y él nos fué propicio.","43.13.2":"Ministrando pues éstos al Señor, y ayunando, dijo el Espíritu Santo: Apartadme a Bernabé y a Saulo para la obra para la cual los he llamado.","43.13.3":"Entonces habiendo ayunado y orado, y puesto las manos encima de ellos, los despidieron.","38.3.10":"Traed todos los diezmos al alfolí, y haya alimento en mi casa; y probadme ahora en esto, dice Jehová de los ejércitos, si no os abriré las ventanas de los cielos, y vaciaré sobre vosotros bendición hasta que sobreabunde.","19.3.9":"Honra a Jehová de tu sustancia, y de las primicias de todos tus frutos;","19.3.10":"Y serán llenas tus trojes con abundancia, y tus lagares rebosarán de mosto.","46.9.6":"Pero Esto digo: El que siembra escasamente, también segará escasamente; y el que siembra en bendiciones, en bendiciones también segará.","46.9.7":"Cada uno dé como propuso en su corazón: no con tristeza, o por necesidad; porque Dios ama el dador alegre.","41.6.38":"Dad, y se os dará; medida buena, apretada, remecida, y rebosando darán en vuestro seno: porque con la misma medida que midáis, os será vuelto a medir.","2.27.30":"Y todas las décimas de la tierra, así de la simiente de la tierra como del fruto de los árboles, de Jehová son: es cosa consagrada a Jehová.","45.16.2":"Cada primer día de la semana cada uno de vosotros aparte en su casa, guardando lo que por la bondad de Dios pueda; para que cuando yo llegue, no se hagan entonces colectas.","43.20.35":"En todo os he enseñado que, trabajando así, es necesario sobrellevar a los enfermos, y tener presente las palabras del Señor Jesús, el cual dijo: Más bienaventurada cosa es dar que recibir.","40.16.15":"Y les dijo: Id por todo el mundo; predicad el evangelio a toda criatura.","44.1.16":"Porque no me avergüenzo del evangelio: porque es potencia de Dios para salud a todo aquel que cree; al Judío primeramente y también al Griego.","44.10.14":"¿Cómo, pues invocarán a aquel en el cual no han creído? ¿y cómo creerán a aquel de quien no han oído? ¿y cómo oirán sin haber quien les predique?","44.10.15":"¿Y cómo predicarán si no son enviados? Como está escrito: ¡Cuán hermosos son los pies de los que anuncian el evangelio de la paz, de los que anuncian el evangelio de los bienes!","59.3.15":"Sino santificad al Señor Dios en vuestros corazones, y estad siempre aparejados para responder con mansedumbre y reverencia a cada uno que os demande razón de la esperanza que hay en vosotros:","54.4.2":"Que prediques la palabra; que instes a tiempo y fuera de tiempo; redarguye, reprende, exhorta con toda paciencia y doctrina.","39.20.26":"Mas entre vosotros no será así; sino el que quiera entre vosotros hacerse grande, será vuestro servidor;","39.20.27":"Y el que quiera entre vosotros ser el primero, será vuestro siervo:","39.20.28":"Como el Hijo del hombre no vino para ser servido, sino para servir, y para dar su vida en rescate por muchos.","42.13.14":"Pues si yo, el Señor y el Maestro, he lavado vuestros pies, vosotros también debéis lavar los pies los unos a los otros.","42.13.15":"Porque ejemplo os he dado, para que como yo os he hecho, vosotros también hagáis.","59.4.10":"Cada uno según el don que ha recibido, adminístrelo a los otros, como buenos dispensadores de las diferentes gracias de Dios.","50.3.23":"Y todo lo que hagáis, hacedlo de ánimo, como al Señor, y no a los hombres;","50.3.24":"Sabiendo que del Señor recibiréis la compensación de la herencia: porque al Señor Cristo servís.","57.6.10":"Porque Dios no es injusto para olvidar vuestra obra y el trabajo de amor que habéis mostrado a su nombre, habiendo asistido y asistiendo aún a los santos.","57.10.24":"Y considerémonos los unos a los otros para provocarnos al amor y a las buenas obras;","57.10.25":"No dejando nuestra congregación, como algunos tienen por costumbre, mas exhortándonos; y tanto más, cuanto veis que aquel día se acerca.","43.2.42":"Y perseveraban en la doctrina de los apóstoles, y en la comunión, y en el partimiento del pan, y en las oraciones.","39.16.18":"Mas yo también te digo, que tú eres Pedro, y sobre esta piedra edificaré mi iglesia; y las puertas del infierno no prevalecerán contra ella.","45.12.12":"Porque de la manera que el cuerpo es uno, y tiene muchos miembros, pero todos los miembros del cuerpo, siendo muchos, son un cuerpo, así también Cristo.","45.12.27":"Pues vosotros sois el cuerpo de Cristo, y miembros en parte.","48.4.11":"Y él mismo dió unos, ciertamente apóstoles; y otros, profetas; y otros, evangelistas; y otros, pastores y doctores;","48.4.12":"Para perfección de los santos, para la obra del ministerio, para edificación del cuerpo de Cristo;","50.1.18":"Y él es la cabeza del cuerpo que es la iglesia; él que es el principio, el primogénito de los muertos, para que en todo tenga el primado.","45.12.4":"Pero hay repartimiento de dones; mas el mismo Espíritu es.","45.12.5":"Y hay repartimiento de ministerios; mas el mismo Señor es.","45.12.6":"Y hay repartimiento de operaciones; mas el mismo Dios es el que obra todas las cosas en todos.","45.12.7":"Pero a cada uno le es dada manifestación del Espíritu para provecho.","45.12.8":"Porque a la verdad, a éste es dada por el Espíritu palabra de sabiduría; a otro, palabra de ciencia según el mismo Espíritu;","45.12.9":"A otro, fe por el mismo Espíritu; y a otro, dones de sanidades por el mismo Espíritu;","45.12.10":"A otro, operaciones de milagros; y a otro, profecía; y a otro, discreción de espíritus; y a otro, géneros de lenguas; y a otro, interpretación de lenguas.","45.12.11":"Mas todas estas cosas obra uno y el mismo Espíritu, repartiendo particularmente a cada uno como quiere.","44.12.6":"De manera que, teniendo diferentes dones según la gracia que nos es dada, si el de profecía, úsese conforme a la medida de la fe;","44.12.7":"O si ministerio, en servir; o el que enseña, en doctrina;","44.12.8":"El que exhorta, en exhortar; el que reparte, hágalo en simplicidad; el que preside, con solicitud; el que hace misericordia, con alegría.","59.4.11":"Si alguno habla, hable conforme a las palabras de Dios; si alguno ministra, ministre conforme a la virtud que Dios suministra: para que en todas cosas sea Dios glorificado por Jesucristo, al cual es gloria e imperio para siempre jamás. Amén.","54.1.6":"Por lo cual te aconsejo que despiertes el don de Dios, que está en ti por la imposición de mis manos.","42.15.8":"En esto es glorificado mi Padre, en que llevéis mucho fruto, y seáis así mis discípulos.","39.7.16":"Por sus frutos los conoceréis. ¿Se cogen uvas de los espinos, o higos de los abrojos?","39.7.17":"Así, todo buen árbol lleva buenos frutos; mas el árbol maleado lleva malos frutos.","39.7.18":"No puede el buen árbol llevar malos frutos, ni el árbol maleado llevar frutos buenos.","39.7.19":"Todo árbol que no lleva buen fruto, se corta y se echa en el fuego.","39.7.20":"Así que, por sus frutos los conoceréis.","50.1.10":"Para que andéis como es digno del Señor, agradándo le en todo, fructificando en toda buena obra, y creciendo en el conocimiento de Dios:","49.1.11":"Llenos de frutos de justicia, que son por Jesucristo, a gloria y loor de Dios.","59.1.15":"Sino como aquel que os ha llamado es santo, sed también vosotros santos en toda conversación:","59.1.16":"Porque escrito está: Sed santos, porque yo soy santo.","46.7.1":"Así que, amados, pues tenemos tales promesas, limpiémonos de toda inmundicia de carne y de espíritu, perfeccionando la santificación en temor de Dios.","51.4.7":"Porque no nos ha llamado Dios a inmundicia, sino a santificación.","2.20.7":"Santificaos, pues, y sed santos, porque yo Jehová soy vuestro Dios.","48.1.4":"Según nos escogió en él antes de la fundación del mundo, para que fuésemos santos y sin mancha delante de él en amor;","60.3.18":"Mas creced en la gracia y conocimiento de nuestro Señor y Salvador Jesucristo. A él sea gloria ahora y hasta el día de la eternidad. Amén.","59.2.2":"Desead, como niños recién nacidos, la leche espiritual, sin engaño, para que por ella crezcáis en salud:","50.2.6":"Por tanto, de la manera que habéis recibido al Señor Jesucristo, andad en él:","49.3.13":"Hermanos, yo mismo no hago cuenta de haber lo ya alcanzado; pero una cosa hago: olvidando ciertamente lo que queda atrás, y extendiéndome a lo que está delante,","49.3.14":"Prosigo al blanco, al premio de la soberana vocación de Dios en Cristo Jesús.","57.5.13":"Que cualquiera que participa de la leche, es inhábil para la palabra de la justicia, porque es niño;","57.5.14":"Mas la vianda firme es para los perfectos, para los que por la costumbre tienen los sentidos ejercitados en el discernimiento del bien y del mal.","48.4.15":"Antes siguiendo la verdad en amor, crezcamos en todas cosas en aquel que es la cabeza, a saber, Cristo;","60.1.5":"Vosotros también, poniendo toda diligencia por esto mismo, mostrad en vuestra fe virtud, y en la virtud ciencia;","60.1.6":"Y en la ciencia templanza, y en la templanza paciencia, y en la paciencia temor de Dios;","60.1.7":"Y en el temor de Dios, amor fraternal, y en el amor fraternal caridad.","60.1.8":"Porque si en vosotros hay estas cosas, y abundan, no os dejarán estar ociosos, ni estériles en el conocimiento de nuestro Señor Jesucristo.","48.6.10":"Por lo demás, hermanos míos, confortaos en el Señor, y en la potencia de su fortaleza.","48.6.11":"Vestíos de toda la armadura de Dios, para que podáis estar firmes contra las asechanzas del diablo.","48.6.12":"Porque no tenemos lucha contra sangre y carne; sino contra principados, contra potestades, contra señores del mundo, gobernadores de estas tinieblas, contra malicias espirituales en los aires.","48.6.13":"Por tanto, tomad toda la armadura de Dios, para que podáis resistir en el día malo, y estar firmes, habiendo acabado todo.","48.6.14":"Estad pues firmes, ceñidos vuestros lomos de verdad, y vestidos de la cota de justicia,","48.6.15":"Y calzados los pies con el apresto del evangelio de paz;","48.6.16":"Sobre todo, tomando el escudo de la fe, con que podáis apagar todos los dardos de fuego del maligno.","48.6.17":"Y tomad el yelmo de salud, y la espada del Espíritu; que es la palabra de Dios;","48.6.18":"Orando en todo tiempo con toda deprecación y súplica en el Espíritu, y velando en ello con toda instancia y suplicación por todos los santos,","59.5.8":"Sed templados, y velad; porque vuestro adversario el diablo, cual león rugiente, anda alrededor buscando a quien devore:","59.5.9":"Al cual resistid firmes en la fe, sabiendo que las mismas aflicciones han de ser cumplidas en la compañía de vuestros hermanos que están en el mundo.","46.10.4":"(Porque las armas de nuestra milicia no son carnales, sino poderosas en Dios para la destrucción de fortalezas;)","61.4.4":"Hijitos, vosotros sois de Dios, y los habéis vencido; porque el que en vosotros está, es mayor que el que está en el mundo.","41.10.19":"He aquí os doy potestad de hollar sobre las serpientes y sobre los escorpiones, y sobre toda fuerza del enemigo, y nada os dañará.","19.19.17":"A Jehová empresta el que da al pobre, y él le dará su paga.","19.11.25":"El alma liberal será engordada: y el que sacie, él también será saciado.","19.22.9":"El ojo misericordioso será bendito, porque dió de su pan al indigente.","61.3.17":"Mas el que tenga bienes de este mundo, y vea a su hermano tener necesidad, y le cierre sus entrañas, ¿cómo está el amor de Dios en él?","61.3.18":"Hijitos míos, no amemos de palabra ni de lengua, sino de obra y en verdad.","58.2.15":"Y si el hermano o la hermana están desnudos, y tienen necesidad del mantenimiento de cada día,","58.2.16":"Y alguno de vosotros les dice: Id en paz, calentaos y hartaos; pero no les deis las cosas que son necesarias para el cuerpo: ¿qué aprovechará?","49.2.15":"Para que seáis irreprensibles y sencillos, hijos de Dios sin culpa en medio de la nación maligna y perversa, entre los cuales resplandecéis como luminares en el mundo;","59.2.12":"Teniendo vuestra conversación honesta entre los Gentiles; para que, en lo que ellos murmuran de vosotros como de malhechores, glo
