    U.l.forEach((L,l)=>{
      const d=isDone(u,l), cur=n&&n[0]===u&&n[1]===l, st=d?'done':cur?'cur':'lock';
      html+=`<div class="node-wrap" style="transform:translateX(${offs[(u*5+l)%8]}px)"><button class="node ${st}" style="--uc:${U.c}" data-les="${u}-${l}" aria-label="${esc(L.t)}">${d?'✓':cur?'★':'🔒'}</button><div class="nlabel">${esc(L.t)}</div>${cur?'<div class="bubble">'+T('Empezar','Start')+'</div>':''}</div>`;
    });
    html+=`</div>`;
  });
  html+=`<p class="foot">${L('Cada lección: un devocional y 5 preguntas.<br>Completa una al día para mantener tu racha 🔥','Each lesson: a devotional and 5 questions.<br>Complete one a day to keep your streak 🔥')}</p>`;
  $('#app').innerHTML=`<h1 class="title" style="margin-top:18px">${L('Camino','Path')}</h1>`+html;
  const nb=$('#c-new'); if(nb) nb.onclick=()=>{ PRG.placed=true; saveP(); viewCamino(); };
  const cc=document.querySelector('.camc.on'); if(cc) cc.scrollIntoView({inline:'center',block:'nearest'});
  if(n){ const el=document.querySelector('.node.cur'); if(el && n[0]%UPC>0) setTimeout(()=>el.scrollIntoView({block:'center'}),50); }
}

function viewLeccion(u,l){
  const U=CAM[u], L=U&&U.l[l]; if(!L) return viewCamino();
  if(!unlocked(u,l)){ toast(T('Primero completa la lección anterior','First complete the previous lesson')); return viewCamino(); }
  const p=parseRef(L.v);
  if(!ready(p)){ $('#app').innerHTML='<div class="loading"><div class="spin"></div>'+T('Preparando tu devocional…','Preparing your devotional…')+'</div>'; const h=CUR; loadBook(p.b).then(()=>{ if(CUR===h) viewLeccion(u,l); }).catch(()=>{ $('#app').innerHTML='<div class="empty">'+T('Sin conexión.','No connection.')+'</div>'; }); return; }
  $('#app').innerHTML=`<div class="backrow"><a class="back" href="#camino">${ICON.left} ${T('Camino','Path')}</a><span></span></div>
  <div class="lesshead" style="--uc:${U.c}">${T('Camino','Path')} ${camOf(u)+1} · ${T('Unidad','Unit')} ${u%UPC+1} · ${T('Lección','Lesson')} ${l+1}</div>
  <h1 class="title">${esc(L.t)}</h1>
  <div class="vod" style="background:linear-gradient(150deg,${U.c} 0%,#2b241f 140%)"><div class="lbl">${T('Lee','Read')}</div><div class="tx">${esc(plain(p))}</div><div class="rf">${esc(refLabel(p))}</div></div>
  <h2 class="sec">${T('Reflexiona','Reflect')}</h2><p class="refl">${esc(L.r)}</p>
  <div class="ctx" style="border-left-color:${U.c}"><div class="lbl" style="color:${U.c}">${T('Para hoy','For today')}</div><p>${esc(L.h)}</p></div>
  <button class="btn pri big" style="width:100%;margin-top:18px;background:${U.c};border-color:${U.c}" id="go-q">${T('Empezar práctica · 5 preguntas','Start practice · 5 questions')}</button>
  <p class="hint" style="text-align:center;margin-top:10px">${isDone(u,l)?T('Ya completaste esta lección. Puedes repasarla.','You already completed this lesson. You can review it.'):T('Gana ⭐ 10 puntos (+5 si no fallas)','Earn ⭐ 10 points (+5 with no mistakes)')}</p>`;
  $('#go-q').onclick=()=>startQuiz(u,l);
}

function ask(msg,okLabel,cb){
  const d=document.createElement('div'); d.className='askbg';
  d.innerHTML=`<div class="askbox" role="dialog" aria-modal="true"><p>${esc(msg)}</p><div class="row"><button class="no">${L('Cancelar','Cancel')}</button><button class="yes">${esc(okLabel)}</button></div></div>`;
  document.body.appendChild(d);
  const close=()=>d.remove();
  d.querySelector('.no').onclick=close; d.onclick=e=>{ if(e.target===d) close(); };
  d.querySelector('.yes').onclick=()=>{ close(); cb(); };
}
let QZ=null;
function buildItems(u,l){
  const L=CAM[u].l[l], p=parseRef(L.v), text=plain(p);
  const it=L.q.map(q=>({k:'mc',p:q[0],a:q[1],o:shuffle(q.slice(1))}));
  const wre=w=>new RegExp('(^|[^\\wáéíóúñÁÉÍÓÚÑ])('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')(?![\\wáéíóúñ])','gi');
  const blank=esc(text).replace(wre(L.w),'$1<span class="blank">______</span>');
  const pool=ALLW.filter(w=>!wre(w).test(text));
  it.push({k:'fill',p:T('Completa el versículo','Complete the verse'),x:blank,ref:refLabel(p),a:L.w,o:shuffle([L.w,...pick3(pool,L.w)])});
  it.push({k:'ref',p:T('¿Dónde dice esto?','Where does it say this?'),x:esc(text),a:refLabel(p),o:shuffle([refLabel(p),...pick3(ALLV.map(v=>refLabel(parseRef(v))),refLabel(p))])});
  return shuffle(it);
}
function startQuiz(u,l){ QZ={mode:'les',u,l,items:buildItems(u,l),i:0,miss:0,first:true}; QZ.total=QZ.items.length; renderQ(); }
function startPlacement(){
  const items=[];
  CAM.slice(0,5).forEach((U,u)=>[0,3].forEach(l=>{ const q=U.l[l].q[0]; items.push({k:'mc',p:q[0],a:q[1],o:shuffle(q.slice(1)),u}); }));
  QZ={mode:'place',items,i:0,miss:0,wrongU:new Set(),total:items.length}; renderQ();
}
function renderQ(){
  document.body.classList.add('quiz');
  const it=QZ.items[QZ.i], pct=Math.round(QZ.i/QZ.items.length*100);
  const uc = QZ.mode==='les' ? CAM[QZ.u].c : 'var(--accent)';
  $('#app').innerHTML=`<div class="qtop"><button class="qx" id="qx" aria-label="${L('Salir','Exit')}">✕</button><div class="bar"><i style="width:${pct}%;background:${uc}"></i></div></div>
  ${QZ.mode==='place'?'<div class="lesshead">'+L('Prueba de nivel','Placement test')+'</div>':''}
  <h2 class="qp">${esc(it.p)}</h2>
  ${it.x?`<div class="qx-text">${it.x}${it.k==='fill'?`<div class="qref">${esc(it.ref)}</div>`:''}</div>`:''}

function answer(btn,it,uc){
  if(document.querySelector('.opt.sel')) return;
  const ok = btn.dataset.o===it.a;
  btn.classList.add('sel', ok?'ok':'bad');
  if(!ok){ document.querySelectorAll('.opt').forEach(b=>{ if(b.dataset.o===it.a) b.classList.add('ok'); }); QZ.miss++;
    if(QZ.mode==='les') QZ.items.push({...it,o:shuffle(it.o)}); else QZ.wrongU.add(it.u); }
  const msgs=L(['¡Muy bien!','¡Correcto!','¡Excelente!','¡Así es!','¡Bien hecho!'],['Great job!','Correct!','Excellent!','That\'s right!','Well done!']);
  $('#fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><b>${ok?msgs[Math.floor(Math.random()*msgs.length)]:L('Respuesta correcta:','Correct answer:')}</b>${ok?'':`<span>${esc(it.a)}</span>`}<button class="btn pri" id="qn">${L('Continuar','Continue')}</button></div>`;
  $('#qn').onclick=()=>{ QZ.i++; if(QZ.i<QZ.items.length) renderQ(); else finishQ(); };
}
function finishQ(){
  document.body.classList.remove('quiz');
  if(QZ.mode==='place'){
    let start=5; for(let u=0;u<5;u++) if(QZ.wrongU.has(u)){ start=u; break; }
    for(let u=0;u<start;u++) CAM[u].l.forEach((_,l)=>{ if(!isDone(u,l)) PRG.done[lk(u,l)]={d:Date.now(),p:true,skip:true}; });
    PRG.placed=true; saveP();
    $('#app').innerHTML=`<div class="done-screen"><div class="big-emoji">🎯</div><h1 class="title">${L('¡Listo!','All set!')}</h1><p class="intro">${L(`Acertaste ${QZ.total-QZ.miss} de ${QZ.total}. Empiezas en la <b>Unidad ${start+1}: ${esc(CAM[start].u)}</b>.<br>Puedes repasar las unidades anteriores cuando quieras.`,`You got ${QZ.total-QZ.miss} of ${QZ.total}. You start at <b>Unit ${start+1}: ${esc(CAM[start].u)}</b>.<br>You can review earlier units anytime.`)}</p><a class="btn pri big" href="#camino" style="width:100%">${L('Ver mi camino','See my path')}</a></div>`;
    QZ=null; return;
  }
  const {u,l,miss}=QZ; const perfect=miss===0; const wasCam=camDone(camOf(u)); const xp=award(u,l,perfect);
  if(!wasCam && camDone(camOf(u))){ ACHQ.unshift(['cam',camOf(u)]); store.set('cam',Math.min(camOf(u)+1,CAMS.length-1)); }
  const s=streakNow(); const n=nextLesson();

  <p class="intro">${perfect?L('Sin errores. ¡Excelente!','No mistakes. Excellent!'):L(`Tuviste ${miss} error${miss>1?'es':''}, pero lo repasaste hasta lograrlo.`,`You had ${miss} mistake${miss>1?'s':''}, but you kept practicing until you got it.`)}</p>
  <div class="camhead"><div><b>+${xp} ⭐</b><span>${L('puntos','points')}</span></div><div><b>🔥 ${s}</b><span>${L(`día${s===1?'':'s'} seguidos`,`day${s===1?'':'s'} in a row`)}</span></div><div><b>${doneCount()}/${totalL}</b><span>${L('lecciones','lessons')}</span></div></div>
  <div class="ctx" style="margin-top:16px"><div class="lbl">${L('Para hoy','For today')}</div><p>${esc(CAM[u].l[l].h)}</p></div>
  <a class="btn pri big" href="#camino" style="width:100%;margin-top:16px">${L('Seguir el camino','Continue the path')}</a>
  ${n?`<p class="hint" style="text-align:center;margin-top:10px">${L('Siguiente','Next')}: ${esc(CAM[n[0]].l[n[1]].t)}</p>`:''}</div>`;

}

/* ---- 7. Rompecabezas ---- */
function gPuzzle(){
  const [id,title,,ico,grad]=G('puzzle');
  const p=shuffle(JG.pj)[0]; const url=pimg(p[4]||p[0]);
  $('#app').innerHTML=gameFrame(title,grad,`<p class="ghint">${L('Arma la imagen de un personaje. Toca dos piezas para intercambiarlas.','Put together a picture of a Bible character. Tap two pieces to swap them.')}</p>
    <div class="pzprev" style="background-image:url('${url}')"><span>?</span></div>
    <div class="acts2" style="margin-top:16px"><button class="btn big" data-n="3">${L('Fácil','Easy')} · 3×3</button><button class="btn big pri" data-n="4" style="background:${grad};border:0">${L('Difícil','Hard')} · 4×4</button></div>`,'');
  document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>play(+b.dataset.n));
  function play(n){
    let order=[...Array(n*n).keys()]; do{ order=shuffle(order); }while(order.every((v,i)=>v===i));
    let sel=null, moves=0;
    const draw=()=>{
      $('#app').innerHTML=gameFrame(title,grad,`<p class="ghint">${L('¿Quién será? Toca dos piezas para cambiarlas de lugar.','Who could it be? Tap two pieces to swap them.')}</p>
        <div class="pz" style="grid-template-columns:repeat(${n},1fr)">${order.map((v,i)=>`<button class="pt ${sel===i?'sel':''} ${v===i?'okp':''}" data-i="${i}" style="background-image:url('${url}');background-size:${n*100}% ${n*100}%;background-position:${(v%n)/(n-1)*100}% ${Math.floor(v/n)/(n-1)*100}%"></button>`).join('')}</div>
        <button class="btn" id="peek" style="width:100%;margin-top:12px">👁️ ${L('Ver la imagen completa (mantén presionado)','See the full picture (press and hold)')}</button>
        <div class="pzfull" id="pzfull" style="background-image:url('${url}')"></div>`,`${L('Movimientos','Moves')}: ${moves}`);
      document.querySelectorAll('.pt').forEach(b=>b.onclick=()=>{
        const i=+b.dataset.i; if(sel===null){ sel=i; draw(); return; }
        if(sel!==i){ [order[sel],order[i]]=[order[i],order[sel]]; moves++; }
        sel=null;
        if(order.every((v,k)=>v===k)) return win(); draw();
      });
      const pk=$('#peek'), full=$('#pzfull');
      const on=()=>full.classList.add('show'), off=()=>full.classList.remove('show');
      pk.onpointerdown=on; pk.onpointerup=off; pk.onpointerleave=off; pk.oncontextmenu=e=>e.preventDefault();
    };
    const win=()=>{
      PRG.g.puz=(PRG.g.puz||0)+1;
      const xp=Math.max(n===3?4:8,(n===3?14:24)-Math.floor(moves/(n===3?2:3)));
      $('#app').innerHTML=gameFrame(title,grad,`<div class="pzwin" style="background-image:url('${url}')"></div><h2 class="qp" style="text-align:center;margin-top:14px">${L('¡Es','It\'s')} ${esc(p[0])}!</h2><p class="intro" style="text-align:center">${esc(p[2])} · ${moves} ${L('movimientos','moves')}</p><button class="btn pri big" id="pzok" style="width:100%;background:${grad};border:0">${L('Continuar','Continue')}</button>`,L('¡Completado!','Done!'));
      $('#pzok').onclick=()=>gameEnd(id,title,grad,'🖼️',L(`¡Armaste a ${p[0]}!`,`You put together ${p[0]}!`),xp);
    };
    draw();
  }
}

  const achs=keep('ach',ACH.map(a=>[a[2],a[3]])); ACH.forEach((a,i)=>{ const e=en&&ACHEN[a[0]]; a[2]=e?e[0]:achs[i][0]; a[3]=e?e[1]:achs[i][1]; });
  const gms=keep('games',GAMES.map(g=>[g[1],g[2]])); GAMES.forEach((g,i)=>{ const e=en&&GAMEN[g[0]]; g[1]=e?e[0]:gms[i][0]; g[2]=e?e[1]:gms[i][1]; });
  const trs=keep('trk',TRACKS.map(t=>[t[1],t[2]])); TRACKS.forEach((t,i)=>{ const e=en&&TRKEN[t[0]]; t[1]=e?e[0]:trs[i][0]; t[2]=e?e[1]:trs[i][1]; });
  const tabs=en?['Search','Path','Topics','Bible','Saved']:['Buscar','Camino','Temas','Biblia','Guardados'];
  document.querySelectorAll('nav.tabs a').forEach((a,i)=>{ a.lastChild.textContent=tabs[i]; });
  $('#mus').setAttribute('aria-label',en?'Music':'Música'); $('#fsm').setAttribute('aria-label',en?'Smaller text':'Letra más chica'); $('#fsp').setAttribute('aria-label',en?'Larger text':'Letra más grande');
}

/* ---------- router ---------- */
let NAVS=[], CUR='#inicio';
function go(h){
  if(h===CUR) { route(h); return; }
  if(!/^#(inicio|temas|biblia|favoritos)$/.test(h)) NAVS.push(CUR); else NAVS=[];
  CUR=h; try{ history.pushState(null,'',h); }catch(e){}
  route(h);
}
function route(force){
  const h=(force||location.hash||'#inicio').slice(1); CUR='#'+h;
  document.body.classList.remove('quiz');
  let tab='inicio', m;
  if(h==='temas') {tab='temas'; viewTemas();}
  else if(m=h.match(/^cat-(.+)$/)) {tab='temas'; viewTemas(CATS.find(c=>slug(c)===m[1]));}
  else if(m=h.match(/^t-(.+)$/)) {tab='temas'; viewTema(m[1]);}
  else if(h==='biblia') {tab='biblia'; viewBiblia();}
  else if(m=h.match(/^libro-(\d+)$/)) {tab='biblia'; viewLibro(+m[1]);}
  else if(m=h.match(/^lee-(\d+)-(\d+)(?:-(\d+))?$/)) {tab='biblia'; viewLee(+m[1],+m[2],m[3]?+m[3]:null); }
  else if(h==='favoritos') {tab='favoritos'; viewFav();}
  else if(h==='camino') {tab='camino'; viewCamino();}
  else if(h==='juegos') {tab='camino'; viewJuegos();}
  else if(h==='logros') {tab='camino'; viewLogros();}
  else if(m=h.match(/^juego-(\w+)$/)) {tab='camino'; viewJuego(m[1]);}
  else if(h==='nivel') {tab='camino'; startPlacement();}
  else if(m=h.match(/^leccion-(\d+)-(\d+)$/)) {tab='camino'; viewLeccion(+m[1],+m[2]);}
  else viewInicio();
  if(!/^lee-/.test(h)) window.scrollTo(0,0);
  document.querySelectorAll('nav.tabs a').forEach(a=>a.classList.toggle('on',a.dataset.tab===tab));
}

/* ---------- eventos globales ---------- */
document.addEventListener('click',e=>{
  const f=e.target.closest('[data-fav]'); if(f){ toggleFav(f.dataset.fav); const on=isFav(f.dataset.fav); f.classList.toggle('on',on); f.innerHTML=(on?ICON.heartf:ICON.heart)+(f.closest('.vod')?' ':'')+(on?L('Guardado','Saved'):L('Guardar','Save')); if(CUR==='#favoritos') viewFav(); return; }
  const c=e.target.closest('[data-copy]'); if(c){ copy(c.dataset.copy); return; }
  const nb=e.target.closest('[data-note]'); if(nb){ openNote(nb.dataset.note); return; }
  const ft=e.target.closest('[data-favtab]'); if(ft){ store.set('favtab',ft.dataset.favtab); viewFav(); return; }
  const q=e.target.closest('[data-q]'); if(q){ $('#q').value=q.dataset.q; runSearch(q.dataset.q); return; }
  const s=e.target.closest('[data-seg]'); if(s){ store.set('seg',s.dataset.seg); viewBiblia(); return; }
});
let FS=store.get('fs',19);
function applyFs(){ document.documentElement.style.setProperty('--fs',FS+'px'); store.set('fs',FS); }
$('#mus').onclick=openMusic;
$('#lng').onclick=()=>{ LANG=LANG==='en'?'es':'en'; store.set('lang',LANG); applyLang(); route(CUR); toast(L('Español','English')); };
$('#fsm').onclick=()=>{FS=Math.max(15,FS-1);applyFs();};
$('#fsp').onclick=()=>{FS=Math.min(28,FS+1);applyFs();};
applyFs();
window.addEventListener('hashchange',()=>route());
window.addEventListener('popstate',()=>{ NAVS.pop(); route(); });
document.addEventListener('click',e=>{
  const bk=e.target.closest('[data-back]'); if(bk){ e.preventDefault(); const p=NAVS.pop()||'#inicio'; CUR=p; try{ history.pushState(null,'',p); }catch(_){} route(p); return; }
  const a=e.target.closest('a[href^="#"]'); if(!a) return;
  e.preventDefault(); go(a.getAttribute('href'));
},true);

applyLang();
route();
</script>
